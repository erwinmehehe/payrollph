name: WFM Square Sandbox Aggregate Adapter QA

on:
  pull_request:
    paths:
      - "src/lib/workforce-square-sandbox.ts"
      - "src/app/api/workforce/demand-observations/square-sandbox/**"
      - "src/components/workspace/workforce-square-sandbox-panel.tsx"
      - "src/components/workspace/workforce-coverage-panel.tsx"
      - "tests/workforce-square-sandbox.test.ts"
      - "tests/fixtures/wfm-square-sandbox-browser.jsx"
      - "scripts/wfm-square-sandbox-browser.mjs"
      - ".github/workflows/wfm-square-sandbox-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aggregate-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      TZ: Asia/Manila
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Lint baseline
        run: npm run lint
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Provider pagination, corrections and privacy (fictional data only)
        run: npx tsx --test tests/workforce-square-sandbox.test.ts
      - name: Source size gate
        run: npm run source:size:check
      - name: Next build
        run: npm run build
      - run: npm install --no-save --ignore-scripts playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: 375px fictional worksite and incomplete-source browser acceptance
        run: node scripts/wfm-square-sandbox-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wfm-square-sandbox-qa
          path: qa-artifacts/
          retention-days: 7
