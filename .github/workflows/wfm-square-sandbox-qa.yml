name: WFM Square Sandbox Aggregate Adapter QA

on:
  pull_request:
    paths:
      - "src/lib/workforce-square-sandbox.ts"
      - "src/app/api/workforce/demand-observations/square-sandbox/**"
      - "src/components/workspace/workforce-square-sandbox-panel.tsx"
      - "src/components/workspace/workforce-coverage-panel.tsx"
      - "tests/workforce-square-sandbox.test.ts"
      - "tests/workforce-square-sandbox-db.test.ts"
      - "tests/fixtures/wfm-square-sandbox-browser.jsx"
      - "scripts/wfm-square-sandbox-browser.mjs"
      - ".github/workflows/wfm-square-sandbox-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aggregate-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      TZ: Asia/Manila
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Lint baseline
        run: npm run lint
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Synthetic-only encryption key
        shell: bash
        run: |
          bank_key=$(openssl rand -hex 32)
          pii_key=$(openssl rand -hex 32)
          echo "::add-mask::$bank_key"
          echo "::add-mask::$pii_key"
          echo "BANK_DATA_ENCRYPTION_KEY=$bank_key" >> "$GITHUB_ENV"
          echo "PII_ENCRYPTION_KEY=$pii_key" >> "$GITHUB_ENV"
      - name: Initialize disposable PostgreSQL 16
        run: npm run db:push
      - name: Apply the cutover baseline objects (0109 audit chain + reviewed supplement); request code only verifies schema
        run: node scripts/qa/apply-isolated-baseline.mjs
      - name: Square pagination, corrections and isolated source-history privacy QA
        run: npx tsx --test --test-concurrency=1 tests/workforce-square-sandbox.test.ts tests/workforce-square-sandbox-db.test.ts
      - name: Source size gate
        run: npm run source:size:check
      - name: Next build
        run: npm run build
      - run: npm install --no-save --ignore-scripts playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: 375px fictional worksite and incomplete-source browser acceptance
        run: node scripts/wfm-square-sandbox-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wfm-square-sandbox-qa
          path: qa-artifacts/
          retention-days: 7
