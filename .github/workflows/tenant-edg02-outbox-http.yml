name: EDG-02 outbox tenant isolation (fictional PostgreSQL 16 + SMTP)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - '.github/workflows/tenant-edg02-outbox-http.yml'
      - 'scripts/qa/tenant-edg02-outbox-http.mjs'
      - 'tests/tenant-edg02-outbox-contract.test.mjs'
      - 'src/lib/mailer.ts'
      - 'src/app/api/outbox/**'
      - 'scripts/qa/tenant-invitations-post-boundary.mjs'
      - 'scripts/qa/tenant-table-http.mjs'
      - 'scripts/qa/tenant-table-env.mjs'
      - 'src/db/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  edg02-outbox:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Export fictional localhost-only environment
        shell: bash
        run: |
          set -euo pipefail
          node scripts/qa/tenant-table-env.mjs default >> "$GITHUB_ENV"
          {
            echo 'SMTP_URL=smtp://127.0.0.1:2525'
            echo 'MAIL_FROM=PayrollPH QA <no-reply@example.invalid>'
            echo 'WORKER_ENABLED=false'
            echo 'CENTRAL_SCHEDULER_ENABLED=false'
            echo 'XENDIT_BILLING_ENABLED=false'
          } >> "$GITHUB_ENV"
      - name: Reject unsafe environments, provider credentials and missing SQL guards
        run: node --test tests/tenant-edg02-outbox-contract.test.mjs
      - name: Generate throwaway encryption and localhost webhook keys
        shell: bash
        run: |
          set -euo pipefail
          for name in PII_ENCRYPTION_KEY BANK_DATA_ENCRYPTION_KEY; do
            key=$(openssl rand -hex 32)
            echo "::add-mask::$key"
            echo "$name=$key" >> "$GITHUB_ENV"
          done
          secret="whsec_$(openssl rand -base64 32 | tr -d '\n')"
          echo "::add-mask::$secret"
          echo "RESEND_WEBHOOK_SECRET=$secret" >> "$GITHUB_ENV"
      - name: Create fresh disposable PostgreSQL schema
        run: npm run db:push
      - name: Apply reviewed isolated schema baseline
        run: node scripts/qa/apply-isolated-baseline.mjs
      - name: Typecheck changed application source
        run: npm run typecheck
      - name: Build production-mode Next on localhost-only flags
        run: npm run build
      - name: Prove foreign denials, real own retries and unchanged victim records
        run: node --import tsx scripts/qa/tenant-edg02-outbox-http.mjs
