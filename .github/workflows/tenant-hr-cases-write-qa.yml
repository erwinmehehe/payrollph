name: Tenant HR Cases POST-PATCH Writes (Fictional PG16 Only)

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/tenant-hr-cases-write-qa.yml"
      - "docs/qa/tenant-hr-cases-write-isolation.md"
      - "scripts/qa/tenant-hr-cases-write-contract.mjs"
      - "scripts/qa/tenant-hr-cases-write-http.mjs"
      - "tests/tenant-hr-cases-write-contract.test.mjs"
      - "scripts/qa/tenant-hr-cases-page-contract.mjs"
      - "scripts/qa/tenant-hr-cases-page-http.mjs"
      - "scripts/qa/tenant-table-http.mjs"
      - "scripts/qa/apply-isolated-baseline.mjs"
      - "src/app/api/hr-cases/route.ts"
      - "src/app/hcm/hr-cases/page.tsx"
      - "src/components/employee-hr-case-staff-queue.tsx"
      - "src/lib/hr-case-activation.ts"
      - "src/lib/hr-case-policy.ts"
      - "src/lib/hr-case-tenant-scope.ts"
      - "src/lib/hr-case-queue-read.ts"
      - "src/lib/access.ts"
      - "src/lib/auth.ts"
      - "src/lib/security-request.ts"
      - "src/lib/rate-limit.ts"
      - "src/lib/critical-release-flags.ts"
      - "src/lib/multi-entity-server.ts"
      - "src/lib/document-object-storage.ts"
      - "src/db/index.ts"
      - "src/db/schema.ts"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tenant-hr-case-write:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: "true"
      GITHUB_ACTIONS: "true"
      TZ: Asia/Manila
      NEXT_TELEMETRY_DISABLED: "1"
      TENANT_HR_CASE_PAGE_PROOF: fictional-pg16-only
      TENANT_HR_CASE_WRITE_PROOF: fictional-pg16-post-patch-only
      BUILD_BLOCK_ACCEPTANCE_MODE: synthetic-postgres-only
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
      APP_BASE_URL: http://127.0.0.1:3000
      SECURITY_SMOKE_URL: http://127.0.0.1:3000
      TRUSTED_APP_ORIGINS: http://127.0.0.1:3000
      EMPLOYEE_HR_CASES_ENABLED: "true"
      MULTI_ENTITY_ENABLED: "false"
      EMPLOYEE_DOCUMENT_VAULT_ENABLED: "false"
      DEMO_MODE: "false"
      REQUIRE_PRIVILEGED_MFA: "true"
      WORKER_ENABLED: "false"
      CENTRAL_SCHEDULER_ENABLED: "false"
      PAYMONGO_DISBURSEMENTS_ENABLED: "false"
      XENDIT_PAYOUTS_ENABLED: "false"
      XENDIT_BILLING_ENABLED: "false"
      FINAL_PAY_SIGNED_REVIEW_ENABLED: "false"
      EXACT_THIRTEENTH_CENTAVOS_ENABLED: "false"
      PAYROLL_CALCULATION_HISTORY_ENABLED: "false"
      OPENAI_API_KEY: ""
      WORKER_TOKEN: ""
      CRON_SECRET: ""
      SMTP_PASSWORD: ""
      SMTP_URL: ""
      RESEND_API_KEY: ""
      POSTMARK_SERVER_TOKEN: ""
      PAYMONGO_SECRET_KEY: ""
      XENDIT_SECRET_KEY: ""
      XENDIT_PAYOUT_SECRET_KEY: ""
      STRIPE_SECRET_KEY: ""
      S3_ACCESS_KEY_ID: ""
      S3_SECRET_ACCESS_KEY: ""
      R2_ACCESS_KEY_ID: ""
      R2_SECRET_ACCESS_KEY: ""
      AWS_ACCESS_KEY_ID: ""
      AWS_SECRET_ACCESS_KEY: ""
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact checked-out PR head
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Refuse unsafe environment, source drift and fabricated evidence
        run: |
          node --check scripts/qa/tenant-hr-cases-write-contract.mjs
          node --check scripts/qa/tenant-hr-cases-write-http.mjs
          node --test tests/tenant-hr-cases-write-contract.test.mjs
      - name: Generate ephemeral fictional encryption keys
        shell: bash
        run: |
          for key in BANK_DATA_ENCRYPTION_KEY PII_ENCRYPTION_KEY TOTP_ENCRYPTION_KEY; do
            value=$(openssl rand -hex 32)
            echo "::add-mask::$value"
            echo "$key=$value" >> "$GITHUB_ENV"
          done
      - name: Create disposable PostgreSQL 16 schema
        run: npm run db:push
      - name: Apply isolated test-only baseline
        run: node scripts/qa/apply-isolated-baseline.mjs
      - name: Build feature-ON production-mode localhost app
        run: npm run build
      - name: Start restricted localhost Next server
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/tenant-hr-write.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:3000/login > /dev/null; then exit 0; fi
            sleep 2
          done
          tail -n 80 /tmp/tenant-hr-write.log
          exit 1
      - name: Prove real owned POST PATCH writes and foreign/revoked SQL invariants
        env:
          NODE_ENV: production
        run: node --import tsx scripts/qa/tenant-hr-cases-write-http.mjs
      - name: Show bounded synthetic server log on failure
        if: failure()
        run: tail -n 80 /tmp/tenant-hr-write.log || true
