name: Tenant MWE decision PATCH isolation (fictional PG16 HTTP)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - "src/app/api/employees/[id]/mwe-classifications/[classificationId]/route.ts"
      - "src/lib/mwe-classification.ts"
      - "scripts/qa/tenant-mwe-decision-*.mjs"
      - "tests/tenant-mwe-decision-contract.test.mjs"
      - "scripts/qa/tenant-isolation-coverage-manifest.json"
      - ".github/workflows/tenant-mwe-decision-http.yml"

permissions:
  contents: read

concurrency:
  group: tenant-mwe-decision-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  mwe-decision:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: "true"
      GITHUB_ACTIONS: "true"
      TENANT_MWE_DECISION_MODE: isolated-ci-only
      PAYMONGO_SECRET_KEY: ""
      XENDIT_SECRET_KEY: ""
      OPENAI_API_KEY: ""
      RESEND_API_KEY: ""
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Strict isolated PostgreSQL profile and multi-entity test-only activation
        shell: bash
        run: |
          set -euo pipefail
          node scripts/qa/tenant-table-env.mjs compliance-posts >> "$GITHUB_ENV"
          echo 'MULTI_ENTITY_ENABLED=true' >> "$GITHUB_ENV"
          echo 'REQUIRE_PRIVILEGED_MFA=true' >> "$GITHUB_ENV"
      - name: Source and environment negative controls
        run: |
          node --check scripts/qa/tenant-mwe-decision-contract.mjs
          node --check scripts/qa/tenant-mwe-decision-http.mjs
          node --test tests/tenant-mwe-decision-contract.test.mjs
      - name: Ephemeral test-only encryption keys
        shell: bash
        run: |
          set -euo pipefail
          for name in PII_ENCRYPTION_KEY BANK_DATA_ENCRYPTION_KEY TOTP_ENCRYPTION_KEY; do
            key=$(openssl rand -hex 32)
            echo "::add-mask::$key"
            echo "$name=$key" >> "$GITHUB_ENV"
          done
      - name: Create disposable PG16 schema
        run: npm run db:push
      - name: Apply strictly reviewed CI-only baseline after schema push
        run: node scripts/qa/apply-isolated-baseline.mjs
      - name: Production Next.js build against isolated CI database only
        run: npm run build
      - name: Real signed-in two-attacker and higher-ID victim HTTP/SQL proof
        shell: bash
        run: |
          set -euo pipefail
          npm start -- -H 127.0.0.1 > /tmp/tenant-mwe-decision-ci.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:3000/login" >/dev/null; then ready=true; break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then break; fi
            sleep 2
          done
          if [ "$ready" != "true" ]; then
            tail -n 40 /tmp/tenant-mwe-decision-ci.log
            exit 1
          fi
          node --import tsx scripts/qa/tenant-mwe-decision-http.mjs
      - name: Bounded synthetic-only logs on failure
        if: failure()
        run: |
          if test -f /tmp/tenant-mwe-decision-ci.log; then
            grep -Ei 'Error:|cause:|failed|code:' /tmp/tenant-mwe-decision-ci.log | tail -n 25 | cut -c 1-200 || true
          fi
