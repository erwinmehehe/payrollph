name: A-7 New Release-Flag Registration Guard

on:
  pull_request:
    paths:
      - "src/**"
      - "scripts/qa/release-flag-new-usage-guard.mjs"
      - "tests/release-flag-new-usage-guard.test.mjs"
      - ".github/workflows/release-flag-new-usage-guard.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/qa/release-flag-new-usage-guard.mjs"
      - "tests/release-flag-new-usage-guard.test.mjs"
      - ".github/workflows/release-flag-new-usage-guard.yml"

# Supersede only older PR attempts; main/manual runs retain independent groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify-new-flags:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout with complete source ancestry, without stored credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Exercise offline regression cases
        run: node --test tests/release-flag-new-usage-guard.test.mjs
      - name: Reject new unregistered direct release toggles
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/qa/release-flag-new-usage-guard.mjs
