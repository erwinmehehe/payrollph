name: Issue 910 - 0121 Review-only Source Integrity
on:
  pull_request:
    paths:
      - "docs/sql/issue-910-review-only-0121-*.sql"
      - "docs/engineering/issue-910-0121-readiness.md"
      - "docs/sql/issue-910-review-only-post-0121-tenant-integrity.sql"
      - "tests/issue-910-0121-review.test.mjs"
      - "tests/issue-910-0121-postgres.test.mjs"
      - "tests/issue-910-forward-predecessor-postgres.test.mjs"
      - "docs/sql/issue-910-review-only-forward-predecessor.sql"
      - "docs/sql/issue-910-review-only-post-0121-tenant-integrity.sql"
      - "drizzle/0121_multi_entity_v2_scope_transfer.sql"
      - ".github/workflows/issue-910-0121-review.yml"
  push:
    branches: [main]
    paths:
      - "docs/sql/issue-910-review-only-0121-*.sql"
      - "tests/issue-910-0121-review.test.mjs"
      - "tests/issue-910-0121-postgres.test.mjs"
      - "tests/issue-910-forward-predecessor-postgres.test.mjs"
      - "docs/sql/issue-910-review-only-forward-predecessor.sql"
      - "docs/sql/issue-910-review-only-post-0121-tenant-integrity.sql"
      - "drizzle/0121_multi_entity_v2_scope_transfer.sql"
permissions:
  contents: read
jobs:
  review-source-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout with no credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Verify SQL source integrity (NO database connection)
        run: node --test tests/issue-910-0121-review.test.mjs

  rehearsal-pg:
    name: Synthetic 0121 isolation and rollback PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        postgres: ["16", "18"]
    env:
      CI: "true"
      GITHUB_ACTIONS: "true"
      ISSUE_910_REHEARSAL: isolated-ci-only
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout exact PR source without saving credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Push synthetic fixture schema to localhost only
        run: npm run db:push
      - name: Rehearse 0121, deny foreign employers, verify retry and rollback
        run: |
          node --check tests/issue-910-0121-postgres.test.mjs
          node --test tests/issue-910-0121-postgres.test.mjs
          node --check tests/issue-910-forward-predecessor-postgres.test.mjs
          node --test tests/issue-910-forward-predecessor-postgres.test.mjs
