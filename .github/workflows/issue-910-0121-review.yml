name: Issue 910 - 0121 Review-only Source Integrity
on:
  pull_request:
    paths:
      - "docs/sql/issue-910-review-only-0121-*.sql"
      - "docs/engineering/issue-910-0121-readiness.md"
      - "docs/engineering/issue-910-provenance-live-catalog-20261013.md"
      - "scripts/issue-910-source-manifest.mjs"
      - "scripts/issue-910-build-forward-schema.mjs"
      - "tests/issue-910-forward-schema-assembly.test.mjs"
      - "tests/issue-910-forward-schema-postgres.test.mjs"
      - "tests/issue-910-source-manifest.test.mjs"
      - "docs/sql/issue-910-review-only-post-0121-tenant-integrity.sql"
      - "tests/issue-910-0121-review.test.mjs"
      - "tests/issue-910-0121-postgres.test.mjs"
      - "tests/issue-910-forward-predecessor-postgres.test.mjs"
      - "docs/sql/issue-910-review-only-forward-predecessor.sql"
      - "docs/sql/issue-910-read-only-catalog-probe.sql"
      - "tests/issue-910-readonly-catalog-probe.test.mjs"

      - "drizzle/0022_job_architecture_positions.sql"
      - "drizzle/0050_hcm_core_worker_history.sql"
      - "drizzle/0051_hcm_org_job_architecture.sql"
      - "drizzle/0052_hcm_effective_dated_changes.sql"
      - "drizzle/0110_provider_events_inbox.sql"
      - "drizzle/0112_wfm_operational_demand_observations.sql"
      - "drizzle/0113_wfm_issued_demand_forecasts.sql"
      - "drizzle/0114_wfm_demand_staffing_policies.sql"
      - "drizzle/0121_multi_entity_v2_scope_transfer.sql"
      - ".github/workflows/issue-910-0121-review.yml"
  push:
    branches: [main]
    paths:
      - "docs/engineering/issue-910-provenance-live-catalog-20261013.md"
      - "scripts/issue-910-source-manifest.mjs"
      - "scripts/issue-910-build-forward-schema.mjs"
      - "tests/issue-910-forward-schema-assembly.test.mjs"
      - "tests/issue-910-forward-schema-postgres.test.mjs"
      - "tests/issue-910-source-manifest.test.mjs"
      - "docs/sql/issue-910-review-only-0121-*.sql"
      - "tests/issue-910-0121-review.test.mjs"
      - "tests/issue-910-0121-postgres.test.mjs"
      - "tests/issue-910-forward-predecessor-postgres.test.mjs"
      - "docs/sql/issue-910-review-only-forward-predecessor.sql"
      - "docs/sql/issue-910-read-only-catalog-probe.sql"
      - "tests/issue-910-readonly-catalog-probe.test.mjs"
      - "docs/sql/issue-910-review-only-post-0121-tenant-integrity.sql"
      - "drizzle/0022_job_architecture_positions.sql"
      - "drizzle/0050_hcm_core_worker_history.sql"
      - "drizzle/0051_hcm_org_job_architecture.sql"
      - "drizzle/0052_hcm_effective_dated_changes.sql"
      - "drizzle/0110_provider_events_inbox.sql"
      - "drizzle/0112_wfm_operational_demand_observations.sql"
      - "drizzle/0113_wfm_issued_demand_forecasts.sql"
      - "drizzle/0114_wfm_demand_staffing_policies.sql"
      - "drizzle/0121_multi_entity_v2_scope_transfer.sql"
# Supersede only older PR attempts; main/manual runs retain independent groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  review-source-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout with no credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Verify SQL source integrity (NO database connection)
        run: |
          node --test tests/issue-910-0121-review.test.mjs
          node --test tests/issue-910-source-manifest.test.mjs
          node --test tests/issue-910-readonly-catalog-probe.test.mjs
          node --check scripts/issue-910-build-forward-schema.mjs
          node --test tests/issue-910-forward-schema-assembly.test.mjs
          node scripts/issue-910-source-manifest.mjs --json > issue-910-source-only-sha256.json
          node scripts/issue-910-build-forward-schema.mjs --write-review-artifacts
      - name: Retain source-only SHA-256 manifest (NOT an applied migration receipt)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: issue-910-source-only-sha256
          path: issue-910-source-only-sha256.json
          retention-days: 14
          if-no-files-found: error
      - name: Retain generated UNNUMBERED schema candidate and checksums (NOT release SQL)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: issue-910-review-only-schema-candidate
          path: |
            qa-artifacts/issue-910/review-only-forward-schema.sql
            qa-artifacts/issue-910/review-only-forward-schema-manifest.json
          retention-days: 14
          if-no-files-found: error

  rehearsal-pg:
    name: Synthetic 0121 and predecessor rollback PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        postgres: ["16", "18"]
    env:
      CI: "true"
      GITHUB_ACTIONS: "true"
      ISSUE_910_REHEARSAL: isolated-ci-only
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout exact PR source without saving credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Push synthetic fixture schema to localhost only
        run: npm run db:push
      - name: Rehearse predecessors and 0121 with isolated synthetic employer records
        run: |
          node --check tests/issue-910-0121-postgres.test.mjs
          node --test tests/issue-910-0121-postgres.test.mjs
          node --check tests/issue-910-forward-predecessor-postgres.test.mjs
          node --test tests/issue-910-forward-predecessor-postgres.test.mjs
          node --check tests/issue-910-forward-schema-postgres.test.mjs
          node --test tests/issue-910-forward-schema-postgres.test.mjs
