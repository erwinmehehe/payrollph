name: MKT-01 marketing operator report privacy (fictional PG16 HTTP; no credit)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - '.github/workflows/tenant-mkt01-marketing-report-http.yml'
      - 'scripts/qa/tenant-mkt01-marketing-report-*.mjs'
      - 'tests/tenant-mkt01-marketing-report.test.mjs'
      - 'docs/qa/tenant-mkt01-marketing-report.md'
      - 'src/app/api/marketing/leads/route.ts'
      - 'src/lib/marketing-report.ts'
      - 'src/lib/auth.ts'
      - 'src/lib/security-request.ts'
      - 'src/db/**'
      - 'scripts/qa/apply-isolated-baseline.mjs'
      - 'scripts/qa/tenant-table-env.mjs'

permissions:
  contents: read

jobs:
  fictional-marketing-operator-read:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TENANT_MKT01_MODE: fictional-pg16-http
      MARKETING_REPORT_EMAILS: mkt01.operator@example.test,mkt01.stale@example.test
      PAYMONGO_DISBURSEMENTS_ENABLED: 'false'
      XENDIT_PAYOUTS_ENABLED: 'false'
      XENDIT_BILLING_ENABLED: 'false'
      WORKER_ENABLED: 'false'
      CENTRAL_SCHEDULER_ENABLED: 'false'
      PAYMONGO_SECRET_KEY: ''
      XENDIT_SECRET_KEY: ''
      XENDIT_PAYOUT_SECRET_KEY: ''
      RESEND_API_KEY: ''
      POSTMARK_SERVER_TOKEN: ''
      SMTP_URL: ''
      STRIPE_SECRET_KEY: ''
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Export isolated production-mode PostgreSQL16 settings
        shell: bash
        run: |
          set -euo pipefail
          node scripts/qa/tenant-table-env.mjs compliance-posts >> "$GITHUB_ENV"
          {
            echo 'TENANT_MKT01_MODE=fictional-pg16-http'
            echo 'MARKETING_REPORT_EMAILS=mkt01.operator@example.test,mkt01.stale@example.test'
            echo 'PAYMONGO_DISBURSEMENTS_ENABLED=false'
            echo 'XENDIT_PAYOUTS_ENABLED=false'
            echo 'XENDIT_BILLING_ENABLED=false'
            echo 'WORKER_ENABLED=false'
            echo 'CENTRAL_SCHEDULER_ENABLED=false'
            echo 'PAYMONGO_SECRET_KEY='
            echo 'XENDIT_SECRET_KEY='
            echo 'XENDIT_PAYOUT_SECRET_KEY='
            echo 'RESEND_API_KEY='
            echo 'POSTMARK_SERVER_TOKEN='
            echo 'SMTP_URL='
            echo 'STRIPE_SECRET_KEY='
          } >> "$GITHUB_ENV"
      - name: Reject external credentials and unearned report credit
        run: |
          node --check scripts/qa/tenant-mkt01-marketing-report-contract.mjs
          node --check scripts/qa/tenant-mkt01-marketing-report-http.mjs
          node --check tests/tenant-mkt01-marketing-report.test.mjs
          node --test tests/tenant-mkt01-marketing-report.test.mjs
      - name: Generate disposable independent at-rest keys
        shell: bash
        run: |
          set -euo pipefail
          for name in PII_ENCRYPTION_KEY BANK_DATA_ENCRYPTION_KEY; do
            key=$(openssl rand -hex 32)
            echo "::add-mask::$key"
            echo "$name=$key" >> "$GITHUB_ENV"
          done
      - name: Build disposable PostgreSQL schema
        run: npm run db:push
      - name: Apply reviewed disposable baseline
        run: node scripts/qa/apply-isolated-baseline.mjs
      - name: Build production-mode application
        run: npm run build
      - name: Start localhost Next server only
        shell: bash
        run: |
          set -euo pipefail
          nohup npm start -- -H 127.0.0.1 -p 3000 > /tmp/tenant-mkt01-next.log 2>&1 &
          server=$!
          for attempt in $(seq 1 60); do
            if curl --silent --fail "$SECURITY_SMOKE_URL/login" > /dev/null; then
              exit 0
            fi
            if ! kill -0 "$server" 2>/dev/null; then
              cat /tmp/tenant-mkt01-next.log
              exit 1
            fi
            sleep 2
          done
          cat /tmp/tenant-mkt01-next.log
          exit 1
      - name: Prove real HTTP allowlist, MFA, anonymity, aggregates, no PII and session revocation
        run: node --import tsx scripts/qa/tenant-mkt01-marketing-report-http.mjs
      - name: Show sanitized server diagnostics on failure
        if: failure()
        run: grep -E 'Error:|Failed|ECONNREFUSED' /tmp/tenant-mkt01-next.log | tail -n 25 || true
