name: Issue 1031 - IT schema-only review rehearsal (disposable PG)
on:
  pull_request:
    paths:
      - "docs/sql/issue-1031-schema-only-it-assets-review.sql"
      - "tests/issue-1031-schema-only-it-assets.test.mjs"
      - "tests/issue-1031-schema-only-it-assets-postgres.test.ts"
      - "docs/engineering/issue-1031-schema-only-it-assets-review.md"
      - ".github/workflows/issue-1031-schema-only-it-assets-rehearsal.yml"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  disposable-postgres:
    name: Compare source/final shape on disposable PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        postgres: ["16", "18"]
    env:
      CI: "true"
      GITHUB_ACTIONS: "true"
      ISSUE_1031_IT_REHEARSAL: "isolated-ci-only"
      SCHEDULER_REHEARSAL_MODE: "isolated-ci-only"
      OFFLINE_CLAIM_PG_ACCEPTANCE_REQUIRED: "true"
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
      PAYMONGO_DISBURSEMENTS_ENABLED: "false"
      XENDIT_PAYOUTS_ENABLED: "false"
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 12
    steps:
      - name: Checkout PR source only (no stored repository credentials)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Overlay matched Drizzle v1 RC for isolated schema rehearsal ONLY
        # Existing main already proves this exact paired CLI/ORM in #1077.
        # No application manifest or lockfile writes; normal app stays stable.
        run: npm install --no-save --package-lock=false drizzle-kit@1.0.0-rc.4 drizzle-orm@1.0.0-rc.4
      - name: Fail if isolated toolchain versions are not the reviewed matching pair
        run: |
          node -e 'const fs=require("node:fs");for(const n of ["drizzle-kit","drizzle-orm"]){if(JSON.parse(fs.readFileSync("node_modules/"+n+"/package.json","utf8")).version!=="1.0.0-rc.4")process.exit(1)}'
      - name: Provision disposable test-only encryption keys
        shell: bash
        run: |
          bank_key=$(openssl rand -hex 32)
          pii_key=$(openssl rand -hex 32)
          echo "::add-mask::$bank_key"
          echo "::add-mask::$pii_key"
          echo "BANK_DATA_ENCRYPTION_KEY=$bank_key" >> "$GITHUB_ENV"
          echo "PII_ENCRYPTION_KEY=$pii_key" >> "$GITHUB_ENV"
      - name: Validate source-only candidate and guard
        run: node --test tests/issue-1031-schema-only-it-assets.test.mjs
      - name: Build FULL current Drizzle schema into disposable localhost PG
        run: npm run db:push
      - name: Drop ONLY four IT target tables, test corrupt type, restore, catalog/FK/index match and retry guard
        run: ./node_modules/.bin/tsx --test tests/issue-1031-schema-only-it-assets-postgres.test.ts
      - name: Prove the second full-schema drizzle-kit push is an unchanged no-op
        shell: bash
        run: |
          set -euo pipefail
          output="$(npm run db:push)"
          printf '%s\n' "$output"
          if ! grep -Fq "No changes detected" <<< "$output"; then
            echo "::error::Second full-schema push was not a proven no-op"
            exit 1
          fi
          echo "POST_REPAIR_FULL_SCHEMA_PUSH_NO_OP=PASS"

  baseline-noop-diagnostic:
    name: Independent full-schema second-push baseline (disposable PG16)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      GITHUB_ACTIONS: "true"
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: First full-schema push before ANY candidate SQL
        run: npm run db:push
      - name: Attribute pinned stable repeat-push failure without waiving the guard
        # This is diagnostic ONLY: the matched RC matrix separately proves a
        # real second-push no-op, and stable remains UNSAFE for repeated pushes.
        shell: bash
        run: |
          set -euo pipefail
          set +e
          result="$(npm run db:push 2>&1)"
          code=$?
          set -e
          if [ "$code" -ne 0 ] && grep -Fxq "STRICT_DB_PUSH_REPORTED_ERROR" <<< "$result"; then
            echo "PINNED_STABLE_SECOND_PUSH_KNOWN_2BP01=REPRODUCED_NOT_APPROVED"
          elif [ "$code" -eq 0 ] && grep -Fq "No changes detected" <<< "$result"; then
            echo "PINNED_STABLE_SECOND_PUSH_NO_OP=PASS"
          else
            echo "::error::Unclassified second-push result; no waiver"
            exit 1
          fi

  complete-npm-test:
    name: Full npm test on disposable PG16 (source-only IT test path)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      GITHUB_ACTIONS: "true"
      SCHEDULER_REHEARSAL_MODE: "isolated-ci-only"
      OFFLINE_CLAIM_PG_ACCEPTANCE_REQUIRED: "true"
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Provision ephemeral fictitious test keys
        shell: bash
        run: |
          bank_key=$(openssl rand -hex 32)
          pii_key=$(openssl rand -hex 32)
          echo "::add-mask::$bank_key"
          echo "::add-mask::$pii_key"
          echo "BANK_DATA_ENCRYPTION_KEY=$bank_key" >> "$GITHUB_ENV"
          echo "PII_ENCRYPTION_KEY=$pii_key" >> "$GITHUB_ENV"
      - run: npm run db:push
      - name: Run actual complete npm test (no Neon/production access)
        run: npm test
