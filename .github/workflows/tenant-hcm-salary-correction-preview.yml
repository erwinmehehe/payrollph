name: Salary preview legal-employer isolation (disposable PG16 HTTP)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - '.github/workflows/tenant-hcm-salary-correction-preview.yml'
      - 'src/app/api/hcm/salary-corrections/preview/**'
      - 'src/proxy.ts'
      - 'src/lib/multi-entity-hcm-hold.ts'
      - 'tests/multi-entity-hcm-hold.test.ts'
      - 'src/lib/multi-entity-server.ts'
      - 'src/lib/multi-entity-policy.ts'
      - 'src/lib/multi-entity-selector-boundary.ts'
      - 'scripts/qa/tenant-hcm-salary-correction-preview-http.mjs'
      - 'tests/tenant-hcm-salary-correction-preview-contract.test.mjs'
      - 'tests/hcm-salary-correction-entity-tenant.test.ts'
      - 'scripts/qa/tenant-isolation-coverage-manifest.json'
      - 'tests/tenant-isolation-coverage-inventory.test.mjs'
      - 'tests/env-secrets-documented.test.mjs'
      - 'docs/qa/hcm-salary-correction-entity-tenant.md'

permissions:
  contents: read

concurrency:
  group: salary-preview-entity-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  salary-entity-isolation:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Lock proof to disposable database and feature-ON legal employer mode
        shell: bash
        run: |
          set -euo pipefail
          node scripts/qa/tenant-table-env.mjs default >> "$GITHUB_ENV"
          {
            echo 'MULTI_ENTITY_ENABLED=true'
            echo 'HCM_SALARY_CORRECTION_PREVIEW_ENABLED=true'
            echo 'XENDIT_BILLING_ENABLED=false'
            echo 'WORKER_ENABLED=false'
            echo 'CENTRAL_SCHEDULER_ENABLED=false'
            echo 'PAYMONGO_SECRET_KEY='
            echo 'XENDIT_SECRET_KEY='
          } >> "$GITHUB_ENV"
      - name: Enforce runner and source negative controls without DB
        run: |
          node --check scripts/qa/tenant-hcm-salary-correction-preview-http.mjs
          node --check tests/tenant-hcm-salary-correction-preview-contract.test.mjs
          node --test tests/tenant-hcm-salary-correction-preview-contract.test.mjs
          npx tsx --test tests/hcm-salary-correction-entity-tenant.test.ts
          npx tsx --test tests/multi-entity-hcm-hold.test.ts
          node --test tests/env-secrets-documented.test.mjs
      - name: Disposable encryption material and webhook fixture
        shell: bash
        run: |
          set -euo pipefail
          for name in PII_ENCRYPTION_KEY BANK_DATA_ENCRYPTION_KEY; do
            key=$(openssl rand -hex 32)
            echo "::add-mask::$key"
            echo "$name=$key" >> "$GITHUB_ENV"
          done
          secret="whsec_$(openssl rand -base64 32 | tr -d '\n')"
          echo "::add-mask::$secret"
          echo "RESEND_WEBHOOK_SECRET=$secret" >> "$GITHUB_ENV"
      - run: npm run db:push
      - name: Apply isolated baseline (no production schema)
        run: node scripts/qa/apply-isolated-baseline.mjs
      - run: npm run build
      - name: Real signed-in salary preview, sibling entity denial and unchanged PG16 evidence
        run: npx tsx scripts/qa/tenant-hcm-salary-correction-preview-http.mjs
