name: WFM 3-method tenant isolation candidate (fictional PG16, no credit)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - ".github/workflows/tenant-wfm-three-method-http.yml"
      - "scripts/qa/tenant-wfm-three-method-*.mjs"
      - "tests/tenant-wfm-three-method-*.test.mjs"
      - "docs/qa/tenant-wfm-three-method-batch.md"
      - "scripts/qa/tenant-wrk01-greedy-roster-*.mjs"
      - "scripts/qa/tenant-demand-approved-policy-get-*.mjs"
      - "scripts/qa/tenant-table-allowlist-bootstrap.mjs"
      - "src/app/api/workforce/demand-staffing/policies/**"
      - "src/app/api/workforce/greedy-roster/**"
      - "src/app/api/workforce/roster-rules/preview/**"
      - "src/lib/workforce-roster-rules*"
      - "src/lib/workforce-demand-staffing-policy*"
      - "src/lib/workforce-greedy-roster*"
      - "src/lib/access.ts"
      - "src/lib/auth.ts"
      - "src/db/**"

permissions:
  contents: read

concurrency:
  group: tenant-wfm-three-method-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  greedy-roster-and-roster-preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WORKER_ENABLED: "false"
      CENTRAL_SCHEDULER_ENABLED: "false"
      XENDIT_BILLING_ENABLED: "false"
      HCM_OVERPAYMENT_PREVIEW_ENABLED: "false"
      PAYROLL_OVERPAYMENT_REVIEW_ENABLED: "false"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install locked source only
        run: npm ci
      - name: Export synthetic flagged-reads profile (never on hosted app)
        shell: bash
        run: |
          set -euo pipefail
          node scripts/qa/tenant-table-env.mjs flagged-reads >> "$GITHUB_ENV"
          {
            echo "TENANT_GREEDY_ROSTER_MODE=fictional-only"
            echo "TENANT_WFM_THREE_METHOD_MODE=fictional-only"
            echo "WFM_GREEDY_ROSTER_ENABLED=true"
            echo "WFM_ROSTER_SCALE_RULES_ENABLED=true"
            echo "WORKER_ENABLED=false"
            echo "CENTRAL_SCHEDULER_ENABLED=false"
            echo "XENDIT_BILLING_ENABLED=false"
            echo "HCM_OVERPAYMENT_PREVIEW_ENABLED=false"
            echo "PAYROLL_OVERPAYMENT_REVIEW_ENABLED=false"
            echo "PAYMONGO_SECRET_KEY="
            echo "XENDIT_SECRET_KEY="
            echo "XENDIT_PAYOUT_SECRET_KEY="
            echo "RESEND_API_KEY="
            echo "POSTMARK_SERVER_TOKEN="
            echo "SMTP_URL="
            echo "STRIPE_SECRET_KEY="
          } >> "$GITHUB_ENV"
      - name: Reject false proofs and incorrect source or CI guard
        run: |
          node --check scripts/qa/tenant-wfm-three-method-contract.mjs
          node --check scripts/qa/tenant-wfm-three-method-post-http.mjs
          node --check tests/tenant-wfm-three-method-contract.test.mjs
          node --test tests/tenant-wfm-three-method-contract.test.mjs
          node --test tests/tenant-wrk01-greedy-roster-contract.test.mjs
      - name: Generate one-time fictional-only encryption material
        shell: bash
        run: |
          set -euo pipefail
          for name in PII_ENCRYPTION_KEY BANK_DATA_ENCRYPTION_KEY; do
            key=$(openssl rand -hex 32)
            echo "::add-mask::$key"
            echo "$name=$key" >> "$GITHUB_ENV"
          done
          key="whsec_$(openssl rand -base64 32 | tr -d '\n')"
          echo "::add-mask::$key"
          echo "RESEND_WEBHOOK_SECRET=$key" >> "$GITHUB_ENV"
      - name: Push isolated PostgreSQL 16 schema (fictional only)
        run: npm run db:push
      - name: Apply reviewed isolated baseline and fixture after schema push
        run: |
          node scripts/qa/apply-isolated-baseline.mjs
          node scripts/qa/prepare-hcm-work-item-fixture.mjs
      - name: Build real production-mode Next on fictional local DB
        run: npm run build
      - name: Start localhost Next or fail closed
        shell: bash
        run: |
          set -euo pipefail
          nohup npm start -- -H 127.0.0.1 > /tmp/tenant-wfm-three-roster.log 2>&1 &
          server=$!
          for attempt in $(seq 1 60); do
            if curl --silent --fail "$SECURITY_SMOKE_URL/login" > /dev/null; then
              exit 0
            fi
            if ! kill -0 "$server" 2>/dev/null; then
              tail -n 80 /tmp/tenant-wfm-three-roster.log
              exit 1
            fi
            sleep 2
          done
          echo "::error::Fictional localhost server not ready"
          tail -n 80 /tmp/tenant-wfm-three-roster.log
          exit 1
      - name: Run existing genuine greedy GET before other fixtures (fresh DB required)
        run: node --import tsx scripts/qa/tenant-wrk01-greedy-roster-http.mjs
      - name: Run new authenticated real roster rules POST positive and denial proof
        run: node --import tsx scripts/qa/tenant-wfm-three-method-post-http.mjs
      - name: Show only isolated server diagnostic on failure
        if: failure()
        run: tail -n 80 /tmp/tenant-wfm-three-roster.log || true

  approved-staffing-policy-get:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WORKER_ENABLED: "false"
      CENTRAL_SCHEDULER_ENABLED: "false"
      XENDIT_BILLING_ENABLED: "false"
      HCM_OVERPAYMENT_PREVIEW_ENABLED: "false"
      PAYROLL_OVERPAYMENT_REVIEW_ENABLED: "false"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install locked source only
        run: npm ci
      - name: Export isolated allowlisted-reads profile
        shell: bash
        run: |
          set -euo pipefail
          node scripts/qa/tenant-table-env.mjs allowlisted-reads >> "$GITHUB_ENV"
          {
            echo "WORKER_ENABLED=false"
            echo "CENTRAL_SCHEDULER_ENABLED=false"
            echo "XENDIT_BILLING_ENABLED=false"
            echo "HCM_OVERPAYMENT_PREVIEW_ENABLED=false"
            echo "PAYROLL_OVERPAYMENT_REVIEW_ENABLED=false"
            echo "PAYMONGO_SECRET_KEY="
            echo "XENDIT_SECRET_KEY="
            echo "XENDIT_PAYOUT_SECRET_KEY="
            echo "RESEND_API_KEY="
            echo "POSTMARK_SERVER_TOKEN="
            echo "SMTP_URL="
            echo "STRIPE_SECRET_KEY="
          } >> "$GITHUB_ENV"
      - name: Verify existing approved-policy GET guard and contract
        run: |
          node --check scripts/qa/tenant-demand-approved-policy-get-contract.mjs
          node --check scripts/qa/tenant-demand-approved-policy-get-http.mjs
          node --test tests/tenant-demand-approved-policy-get-contract.test.mjs
      - name: Generate one-time fictional-only encryption material
        shell: bash
        run: |
          set -euo pipefail
          for name in PII_ENCRYPTION_KEY BANK_DATA_ENCRYPTION_KEY; do
            key=$(openssl rand -hex 32)
            echo "::add-mask::$key"
            echo "$name=$key" >> "$GITHUB_ENV"
          done
          key="whsec_$(openssl rand -base64 32 | tr -d '\n')"
          echo "::add-mask::$key"
          echo "RESEND_WEBHOOK_SECRET=$key" >> "$GITHUB_ENV"
      - name: Push empty disposable PostgreSQL 16 schema
        run: npm run db:push
      - name: Apply reviewed isolated baseline and fixture after schema push
        run: |
          node scripts/qa/apply-isolated-baseline.mjs
          node scripts/qa/prepare-hcm-work-item-fixture.mjs
      - name: Preseed two actual fake employers, higher-ID victim and excluded fourth employer
        run: node --import tsx scripts/qa/tenant-table-allowlist-bootstrap.mjs
      - name: Build production-mode Next on local DB with restricted fictional allowlists
        run: npm run build
      - name: Start localhost Next or fail closed
        shell: bash
        run: |
          set -euo pipefail
          nohup npm start -- -H 127.0.0.1 > /tmp/tenant-wfm-three-policy.log 2>&1 &
          server=$!
          for attempt in $(seq 1 60); do
            if curl --silent --fail "$SECURITY_SMOKE_URL/login" > /dev/null; then
              exit 0
            fi
            if ! kill -0 "$server" 2>/dev/null; then
              tail -n 80 /tmp/tenant-wfm-three-policy.log
              exit 1
            fi
            sleep 2
          done
          echo "::error::Fictional localhost server not ready"
          tail -n 80 /tmp/tenant-wfm-three-policy.log
          exit 1
      - name: Run real independently approved policy GET for both employers and victim
        run: node --import tsx scripts/qa/tenant-demand-approved-policy-get-http.mjs
      - name: Show only isolated server diagnostic on failure
        if: failure()
        run: tail -n 80 /tmp/tenant-wfm-three-policy.log || true
