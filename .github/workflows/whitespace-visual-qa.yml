name: Whitespace visual QA

on:
  push:
    branches:
      - design/monday-whitespace-pass

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
      DEMO_MODE: "false"
      APP_BASE_URL: http://127.0.0.1:3000
      PG_POOL_MAX: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Apply baseline schema
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const { Client } = require("pg");
          (async () => {
            const client = new Client({ connectionString: process.env.DATABASE_URL });
            await client.connect();
            await client.query(fs.readFileSync("drizzle/baseline.sql", "utf8"));
            await client.end();
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
      - name: Seed repo-owned pricing data
        env:
          DEMO_MODE: "true"
        run: |
          npx tsx -e 'import("./src/db/seed").then(async (m) => { await m.ensureSeedData(); process.exit(0); }).catch((e) => { console.error(e); process.exit(1); })'
      - run: npx tsc --noEmit
      - run: npx eslint src tests
      - run: npx tsx --test tests/marketing.test.ts
      - run: npm run build
      - name: Start server
        run: |
          npm start > /tmp/linaw-next.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/linaw-next.log
          exit 1
      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Browser QA
        run: |
          mkdir -p whitespace-artifacts
          node <<'NODE'
          const { chromium } = require("playwright");
          (async () => {
            const browser = await chromium.launch({ headless: true });

            async function noOverflow(page, width) {
              const dims = await page.evaluate(() => ({
                body: document.body.scrollWidth,
                html: document.documentElement.scrollWidth,
                viewport: innerWidth,
              }));
              if (Math.max(dims.body, dims.html) > dims.viewport + 2) {
                throw new Error(`Overflow at ${width}: ${JSON.stringify(dims)}`);
              }
            }

            const desktop = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            await desktop.goto("http://127.0.0.1:3000/", { waitUntil: "networkidle" });
            await noOverflow(desktop, 1440);

            const preview = desktop.locator("#preview");
            await preview.getByRole("button", { name: "Payroll", exact: true }).click();
            if (!(await preview.getByText("Register", { exact: true }).isVisible())) throw new Error("Preview tab failed");

            const payroll = desktop.locator("#payroll");
            const salary = payroll.locator("#lab-salary");
            const output = payroll.locator('output[for="lab-salary"]');
            const before = await output.textContent();
            await salary.fill("50000");
            const after = await output.textContent();
            if (!before?.includes("38,500") || !after?.includes("50,000")) throw new Error("Calculator changed unexpectedly");

            await desktop.addStyleTag({content: `
              @supports (animation-timeline: view()) {
                .software-home * { animation: none !important; opacity: 1 !important; transform: none !important; }
              }
              .software-home .site-nav { position: static !important; }
            `});
            await desktop.screenshot({ path: "whitespace-artifacts/home-1440.png", fullPage: true });

            for (const width of [1280, 1024, 768]) {
              const p = await browser.newPage({ viewport: { width, height: 900 } });
              await p.goto("http://127.0.0.1:3000/", { waitUntil: "networkidle" });
              await noOverflow(p, width);
              await p.close();
            }

            const mobile = await browser.newPage({ viewport: { width: 390, height: 844 } });
            await mobile.goto("http://127.0.0.1:3000/", { waitUntil: "networkidle" });
            await noOverflow(mobile, 390);
            await mobile.addStyleTag({content: `
              @supports (animation-timeline: view()) {
                .software-home * { animation: none !important; opacity: 1 !important; transform: none !important; }
              }
              .software-home .site-nav { position: static !important; }
            `});
            await mobile.screenshot({ path: "whitespace-artifacts/home-390.png", fullPage: true });

            console.log(JSON.stringify({before, after}, null, 2));
            await browser.close();
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: whitespace-visuals
          path: whitespace-artifacts/
          retention-days: 1
