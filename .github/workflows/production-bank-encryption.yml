name: Production Bank Encryption

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Dry-run only, or apply encryption after all guards pass
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply

permissions:
  contents: read

concurrency:
  group: payrollph-production-bank-encryption
  cancel-in-progress: false

jobs:
  encrypt-bank-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.ref == 'refs/heads/main' }}
    environment: production
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      BANK_DATA_ENCRYPTION_KEY: ${{ secrets.PRODUCTION_BANK_DATA_ENCRYPTION_KEY }}
      TOTP_ENCRYPTION_KEY: ${{ secrets.PRODUCTION_TOTP_ENCRYPTION_KEY }}
      PRODUCTION_BASE_URL: https://erwinmehehe-payrollph.vercel.app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Validate required production secrets
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "Missing dedicated PRODUCTION_DATABASE_URL secret."
            exit 1
          fi
          if [ -z "${BANK_DATA_ENCRYPTION_KEY:-}" ] && [ -z "${TOTP_ENCRYPTION_KEY:-}" ]; then
            echo "Missing production bank encryption key material."
            exit 1
          fi
          echo "Required database and encryption secret material is present."

      - name: Prove runner key matches live production
        id: key_match
        shell: bash
        run: |
          set -euo pipefail
          local_fp=$(npx tsx -e 'import { bankEncryptionKeyFingerprint } from "./src/lib/bank-account-crypto"; const fp = bankEncryptionKeyFingerprint(); if (!fp) process.exit(2); console.log(fp);')
          body=$(curl --fail --silent --show-error --max-time 20 "${PRODUCTION_BASE_URL%/}/api/readiness/pilot-status")
          live_fp=$(printf '%s' "$body" | jq -r '.bankEncryptionFingerprint // empty')

          if [ -z "$live_fp" ]; then
            echo "Live production does not report a bank-encryption fingerprint."
            echo "Configure the production encryption key first and wait for that deployment to become live."
            exit 1
          fi

          if [ "$local_fp" != "$live_fp" ]; then
            echo "Encryption-key fingerprint mismatch. Refusing to touch bank data."
            exit 1
          fi

          echo "Live production and this runner use the same bank-encryption key fingerprint."

      - name: Prepare bank-account column safely
        if: ${{ inputs.mode == 'apply' }}
        run: npx tsx scripts/prepare-bank-encryption.ts

      - name: Dry-run legacy plaintext scan
        shell: bash
        run: |
          set -euo pipefail
          npx tsx scripts/encrypt-bank-accounts.ts | tee /tmp/bank-encryption-dry-run.txt

      - name: Encrypt legacy bank data
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        run: |
          set -euo pipefail
          npx tsx scripts/encrypt-bank-accounts.ts --apply

      - name: Verify zero plaintext bank data remains
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        run: |
          set -euo pipefail
          npx tsx scripts/encrypt-bank-accounts.ts | tee /tmp/bank-encryption-verify.txt
          grep -Eq '^[0-9]+ employee\(s\) have a bank account\. [0-9]+ already encrypted, 0 to encrypt\.$' /tmp/bank-encryption-verify.txt
          grep -Eq '^0 payroll payment snapshot\(s\) also hold a plaintext account number\.$' /tmp/bank-encryption-verify.txt
          grep -Fqx '0 legal entity disbursement account(s) hold plaintext.' /tmp/bank-encryption-verify.txt
          grep -Fqx '0 payout change request(s) hold plaintext.' /tmp/bank-encryption-verify.txt
          echo "Legacy employee, payroll snapshot, legal-entity, and payout-change bank accounts are encrypted."

      # A forged enc:v1: prefix, corrupt GCM tag or previous-key-only envelope
      # must never satisfy the production backfill completion gate.
      - name: Authenticate every bank envelope with the current key
        if: ${{ inputs.mode == 'apply' }}
        run: npx tsx scripts/verify-bank-account-envelopes.ts

      - name: Verify live readiness sees encrypted bank data
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        run: |
          set -euo pipefail
          body=$(curl --fail --silent --show-error --max-time 20 "${PRODUCTION_BASE_URL%/}/api/readiness/pilot-status")
          local_fp=$(npx tsx -e 'import { bankEncryptionKeyFingerprint } from "./src/lib/bank-account-crypto"; const fp = bankEncryptionKeyFingerprint(); if (!fp) process.exit(2); console.log(fp);')
          if ! printf '%s' "$body" | jq -se --arg fp "$local_fp" '
            length == 1 and (.[0] |
              type == "object" and
              (.bankEncryptionFingerprint | type == "string" and length > 0) and
              .bankEncryptionFingerprint == $fp and
              (.criticalBlockers | type == "array") and
              (.criticalBlockers | all(type == "string")) and
              (.criticalBlockers | index("bank-data-encryption") == null))
          ' >/dev/null; then
            echo "Production bank-encryption readiness is missing, malformed, blocked or uses a different key."
            exit 1
          fi
          printf '%s' "$body" | jq '{status, criticalBlockers, launchBlockers, deploymentSha}'
          echo "Production bank-data encryption readiness is green."
