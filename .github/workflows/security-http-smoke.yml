name: Security HTTP Smoke

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      # Enforce full payroll release checks on dependent PR #688.
      - feat/payroll-connected-impact-review-20261009
  workflow_dispatch:

concurrency:
  # A newer push to a pull request supersedes its older run. Runs for main and
  # manual dispatch are keyed by commit and never cancelled, so a quick follow-up
  # merge cannot leave a main commit with a cancelled (or missing) result.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  change-scope:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.detect.outputs.docs_only }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Classify exact PR changes (fail closed)
        id: detect
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci/change-scope.mjs

  security-http-acceptance:
    needs: change-scope
    if: ${{ needs.change-scope.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Exercise the strict opt-in gate only against disposable CI fixtures.
      PAYROLL_PRE_RUN_READINESS_ENABLED: "true"
      LOCAL_LOGIN_AUDIT_ENABLED: "true"
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
      APP_BASE_URL: http://127.0.0.1:3000
      DEMO_MODE: "false"
      WORKER_TOKEN: ci-worker-token-00000000000000000000000000000000
      READINESS_TOKEN: ci-readiness-token-0000000000000000000000000000
      SETUP_TOKEN: ci-setup-token-0000000000000000000000000000000
      TOTP_ENCRYPTION_KEY: "1111111111111111111111111111111111111111111111111111111111111111"
      MALWARE_SCAN_URL: https://scanner.invalid/scan
      MALWARE_SCAN_TOKEN: ci-malware-token-0000000000000000000000000000
      REQUIRE_PRIVILEGED_MFA: "true"
      SECURITY_SMOKE_URL: http://127.0.0.1:3000
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - name: Reject committed webhook secrets and unreviewed tenant routes
        run: node --test tests/tenant-second-pass-inventory.test.mjs tests/tenant-isolation-coverage-inventory.test.mjs tests/tenant-pii01-identifiers-source.test.mjs
      - name: Pin first high-risk 16-method HTTP proof contract
        run: |
          node --check scripts/qa/tenant-high-risk-01-http.mjs
          node --test tests/tenant-high-risk-batch-01.test.mjs
      - name: Guard provisional DL-01 employee-vault PG16 real-HTTP proof
        run: |
          node --check scripts/qa/tenant-dl01-vault-http.mjs
          node --test tests/tenant-dl01-vault-source.test.mjs
      - name: Trace 34 client-ID routes; guard all 489 methods; pin 20 pages
        run: |
          node --check scripts/qa/tenant-delegated-trace.mjs
          node --check scripts/qa/tenant-manifest-driven-http.mjs
          node --check scripts/qa/tenant-scoped-page-probes.mjs
          node --test tests/tenant-structural-access-guard.test.mjs tests/tenant-manifest-driven-http.test.mjs tests/tenant-scoped-pages.test.mjs
      - name: Guard uncredited HCM employment-decision POST tenant candidate
        run: |
          node --check scripts/qa/tenant-hcm-employment-decision-contract.mjs
          node --check scripts/qa/tenant-hcm-employment-decision-post.mjs
          node --check scripts/qa/tenant-hcm-employment-decision-runner.mjs
          node --test tests/tenant-hcm-employment-decision-post.test.mjs
      - name: Provision dedicated ephemeral PII key (disposable HTTP QA only)
        run: |
          pii_key=$(openssl rand -hex 32)
          echo "::add-mask::$pii_key"
          echo "PII_ENCRYPTION_KEY=$pii_key" >> "$GITHUB_ENV"
      - name: Validate production security configuration contract
        env:
          APP_BASE_URL: https://payroll.example.test
          MALWARE_SCAN_URL: https://scanner.example.test/scan
        run: npm run security:preflight
      - name: Validate scanner service syntax
        run: node --check services/malware-scanner/server.mjs
      - run: npm run db:push
      - name: Apply the cutover baseline objects (0109 audit chain + reviewed supplement); request code only verifies schema
        run: node scripts/qa/apply-isolated-baseline.mjs
      - run: npm run build

      - name: Start production server
        # ONLY this isolated localhost CI process exercises normally default-OFF API
        # extension/provider signature branches. Does not change any deployed flag.
        env:
          PUBLIC_API_V1_EXTENDED_ENABLED: "true"
          API_V1_EXTENDED_READS_ENABLED: "true"
          EMPLOYEE_HR_CASES_ENABLED: "true"
          # Exercise A-5 only on this disposable localhost three-employer server.
          # Never enable or change the corresponding Vercel production flag.
          EMPLOYEE_DOCUMENT_VAULT_ENABLED: "true"
          OWNER_PRACTICE_PAYROLL_ENABLED: "true"
          # F-04 read authorization verified only on this disposable PG16 server.
          # Production remains explicitly default-OFF until 0137 is approved.
          PAYROLL_CALCULATION_HISTORY_ENABLED: "true"
          # Only the disposable localhost three-employer HTTP fixture; never deployed.
          HCM_GOVERNANCE_READINESS_ENABLED: "true"
          BIR_1604C_DAT_CANDIDATE_ENABLED: "true"
          PAYMONGO_WEBHOOK_SECRET: "ci-fake-paymongo-webhook-signing-secret"
          XENDIT_PAYOUT_CALLBACK_TOKEN: "ci-fake-xendit-payout-callback"
          XENDIT_CALLBACK_TOKEN: "ci-fake-xendit-subscription-callback"
          XENDIT_BUSINESS_ID: "ci-fictional-merchant"
          XENDIT_BILLING_ENABLED: "true"
        shell: bash
        run: |
          set -euo pipefail
          # Only the disposable PG16 QA server may accept synthetic fixture uploads.
          # This is NOT malware-scanner acceptance and never changes deployed settings.
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout /tmp/tenant-ci-scanner.key -out /tmp/tenant-ci-scanner.crt \
            -subj '/CN=127.0.0.1' -addext 'subjectAltName=IP:127.0.0.1' >/dev/null 2>&1
          export TENANT_SYNTHETIC_SCAN_MODE=isolated-pg16-only
          export MALWARE_SCAN_URL=https://127.0.0.1:8443/scan
          export MALWARE_SCAN_TOKEN=ci-tenant-proof-scanner-only
          export NODE_EXTRA_CA_CERTS=/tmp/tenant-ci-scanner.crt
          nohup node scripts/qa/tenant-ci-synthetic-proof-scanner.mjs > /tmp/tenant-ci-scanner.log 2>&1 &
          for attempt in {1..15}; do
            if curl --silent --fail --cacert /tmp/tenant-ci-scanner.crt https://127.0.0.1:8443/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --silent --fail --cacert /tmp/tenant-ci-scanner.crt https://127.0.0.1:8443/health
          # Generate a fresh signing key only for this localhost CI server.
          # A real-looking whsec value must never be committed as source text.
          resend_webhook_secret="whsec_$(openssl rand -base64 32 | tr -d '\n')"
          echo "::add-mask::$resend_webhook_secret"
          export RESEND_WEBHOOK_SECRET="$resend_webhook_secret"
          nohup npm start -- -H 127.0.0.1 > /tmp/payrollph-security.log 2>&1 &
          echo $! > /tmp/payrollph-security.pid
          for attempt in {1..40}; do
            if curl -fsS "$SECURITY_SMOKE_URL" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/payrollph-security.log
          exit 1

      - name: Run adversarial HTTP and two-employer Workforce/BI acceptance
        env:
          CI: "true"
          WORKFORCE_BI_HTTP_ACCEPTANCE_MODE: isolated-ci-only
        run: npx tsx scripts/security-http-smoke.ts

      - name: Real-HTTP second-pass tenant isolation (victim + two attacker organizations)
        env:
          CI: "true"
          TENANT_SECOND_PASS_MODE: isolated-ci-only
          # Match the isolated server flag for positive seeded F-04 SQL evidence.
          PAYROLL_CALCULATION_HISTORY_ENABLED: "true"
          TENANT_DL01_VAULT_PROOF: isolated-ci-only
          EMPLOYEE_DOCUMENT_VAULT_ENABLED: "true"
        run: npx tsx scripts/qa/tenant-second-pass-http.mjs

      # Run uncredited HCM POST acceptance as a distinct GitHub Actions step.
      # Do not modify the historical tenant-second-pass-http runner: other
      # methods are pinned to its reviewed byte hash and source line receipts.
      - name: HCM decision POST own and cross-tenant real HTTP (fictional PG16, zero credit)
        env:
          CI: "true"
          TENANT_SECOND_PASS_MODE: isolated-ci-only
          NODE_ENV: "production"
          DEMO_MODE: "false"
          WORKER_ENABLED: "false"
          CENTRAL_SCHEDULER_ENABLED: "false"
          PAYMONGO_DISBURSEMENTS_ENABLED: "false"
          XENDIT_PAYOUTS_ENABLED: "false"
          XENDIT_BILLING_ENABLED: "false"
        run: npx tsx scripts/qa/tenant-hcm-employment-decision-runner.mjs

      # Fresh independent PII approval-path proof. The existing second-pass
      # rejection runner is historical source-pinned evidence and is unchanged.
      # This candidate awards zero new method credits or production acceptance.
      - name: Guard PII identifier approval PG16 source-only contract
        run: |
          node --check scripts/qa/tenant-pii01-approval-contract.mjs
          node --check scripts/qa/tenant-pii01-approval-http.mjs
          node --test tests/tenant-pii01-approval-http.test.mjs

      - name: PII identifier approval PG16 HTTP (fictional records, zero credit)
        env:
          CI: "true"
          TENANT_SECOND_PASS_MODE: isolated-ci-only
          NODE_ENV: "production"
          DEMO_MODE: "false"
          WORKER_ENABLED: "false"
          CENTRAL_SCHEDULER_ENABLED: "false"
          PAYMONGO_DISBURSEMENTS_ENABLED: "false"
          XENDIT_PAYOUTS_ENABLED: "false"
          XENDIT_BILLING_ENABLED: "false"
        run: npx tsx scripts/qa/tenant-pii01-approval-http.mjs

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/payrollph-security.log || true

  security-http-smoke:
    # Preserve the exact required branch ruleset status context.
    name: security-http-smoke
    if: ${{ always() }}
    needs: [change-scope, security-http-acceptance]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce HTTP smoke result or proven Markdown-only exception
        shell: bash
        env:
          SCOPE_RESULT: ${{ needs.change-scope.result }}
          DOCS_ONLY: ${{ needs.change-scope.outputs.docs_only }}
          ACCEPTANCE_RESULT: ${{ needs.security-http-acceptance.result }}
        run: |
          set -euo pipefail
          if [ "$SCOPE_RESULT" != "success" ]; then
            echo "::error::Change-scope detection failed; cannot bypass security checks."
            exit 1
          fi
          if [ "$DOCS_ONLY" = "true" ]; then
            if [ "$ACCEPTANCE_RESULT" != "skipped" ]; then
              echo "::error::Unexpected security acceptance result for Markdown-only PR."
              exit 1
            fi
            echo "PASS: Markdown-only PR; no executable security paths changed."
            exit 0
          fi
          if [ "$ACCEPTANCE_RESULT" != "success" ]; then
            echo "::error::Full adversarial HTTP acceptance failed, skipped or cancelled."
            exit 1
          fi
          echo "PASS: full adversarial HTTP and tenant isolation acceptance."
