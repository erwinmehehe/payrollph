name: WFM 14-Scenario Synthetic Evidence Matrix
on:
  # Re-run on the actual merged main SHA; an old PR success is not current-main proof.
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "scripts/wfm-pilot-synthetic-evidence.mjs"
      - "scripts/lib/wfm-tap-summary.mjs"
      - "tests/wfm-pilot-synthetic-evidence.test.mjs"
      - "scripts/first-payroll-mobile-synthetic-*"
      - "scripts/pilot-payroll-qa.ts"
      - "src/app/api/workforce/**"
      - "src/app/api/web-bundy/**"
      - "src/app/api/attendance/**"
      - "src/lib/workforce-*.ts"
      - "src/lib/wfm-*.ts"
      - "src/lib/payroll-*.ts"
      - "src/lib/web-bundy-*.ts"
      - "src/lib/attendance-*.ts"
      - "src/components/workforce-*.tsx"
      - "src/components/web-bundy-modal.tsx"
      - "src/components/workspace/workforce-*.tsx"
      - "tests/workforce-*.test.ts"
      - "tests/wfm-*.test.ts"
      - "tests/web-bundy-*.test.ts"
      - ".github/workflows/wfm-pilot-synthetic-evidence.yml"
  workflow_dispatch:
concurrency:
  # A newer push to a pull request supersedes its older run. Runs for main and
  # manual dispatch are keyed by commit and never cancelled, so a quick follow-up
  # merge cannot leave a main commit with a cancelled (or missing) result.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  synthetic-wfm-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      TZ: Asia/Manila
      PAYMONGO_DISBURSEMENTS_ENABLED: "false"
      XENDIT_PAYOUTS_ENABLED: "false"
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
          POSTGRES_INITDB_ARGS: "--encoding=UTF8"
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Ephemeral bank key for isolated fictional tests
        shell: bash
        run: echo "BANK_DATA_ENCRYPTION_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - run: npm run db:push
      - name: Apply audit 0109 on isolated real PG16 before acceptance
        run: node scripts/qa/apply-audit-0109-isolated.mjs
      - name: Apply reviewed cutover baseline supplement before WFM payroll tests
        run: node scripts/qa/apply-isolated-baseline.mjs
      - name: Reject empty or skipped TAP evidence
        run: node --test tests/wfm-pilot-synthetic-evidence.test.mjs
      - name: Run automated portions of all fourteen WFM scenarios
        run: node scripts/wfm-pilot-synthetic-evidence.mjs
      - name: Upload sanitized scenario evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wfm-14-scenario-synthetic-evidence
          path: qa-artifacts/wfm-pilot-synthetic-scenario-matrix.json
          retention-days: 14
