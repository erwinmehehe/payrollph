name: Payroll employer setup browser (Synthetic Only)
on:
  pull_request:
    paths:
      - 'src/components/workspace/panels.tsx'
      - 'src/components/workspace/employer-setup-help.tsx'
      - 'src/components/linaw-workspace.tsx'
      - 'src/lib/payroll-employer-options.ts'
      - 'scripts/qa/payroll-employer-setup-browser.mjs'
      - '.github/workflows/payroll-employer-setup-browser.yml'
permissions:
  contents: read
concurrency:
  group: employer-setup-browser-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  component-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Manila
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: node scripts/qa/payroll-employer-setup-browser.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: payroll-employer-setup-browser
          path: qa-artifacts/payroll-employer-setup/
