      - "scripts/qa/connected-year-end-mapping.ts"
      - "tests/connected-year-end-mapping.test.ts"
      - "scripts/qa/connected-year-end-artifact.ts"
      - "tests/connected-year-end-artifact.test.ts"
      - "scripts/qa/bir-1604c-validation-corpus.ts"
      - "scripts/build-bir-validation-corpus.ts"
      - "tests/bir-validation-corpus.test.ts"
      - "src/lib/bir-1604c-dat-candidate.ts"
      - "tests/governed-hire-853-evidence.test.mjs"
      - "scripts/qa/isolated-month-end-clock.cjs"
      - "scripts/qa/synthetic-month-end.cjs"
      - "scripts/qa/synthetic-session-clock.cjs"
      - "tests/qa-synthetic-month-end.test.mjs"
      - "tests/qa-synthetic-session-clock.test.ts"
      - "scripts/qa/nine-stage-mobile-browser.mjs"
      - "scripts/qa/fresh-pg18-development-schema.mjs"
      - "scripts/qa/verified-pg18-bootstrap.mjs"
      - "tests/fresh-pg18-development-schema.test.mjs"
      - "tests/verified-pg18-bootstrap.test.mjs"
      - "drizzle.config.ts"
      - "src/db/schema.ts"
      # Migration recovery PRs must re-prove the complete two-employer no-money journey.
      - "drizzle/0134_wfm_demand_missing_foundation_forward.sql"
      - "src/lib/ess-profile-schema.ts"
      - "src/lib/saas-billing-schema.ts"
      - "src/lib/workforce-schedule-receipt-schema.ts"
      - "tests/nine-stage-connected-evidence.test.mjs"
      - "scripts/qa/issue-853-evidence-ledger.mjs"
      - "scripts/qa/issue-853-synthetic-coverage.mjs"
      - "tests/issue-853-evidence-ledger.test.mjs"
      - "tests/issue-853-synthetic-coverage.test.mjs"
