  pull_request:
    branches: [main]
    paths:
      # Authoritative nine-stage source inputs; retain both PR and main coverage.
      - "src/app/api/employees/**"
      - "src/app/api/recruitment/**"
      - "src/app/api/provisioning/**"
      - "src/app/api/first-payroll/**"
      - "src/app/api/legal-entities/**"
      - "src/app/api/approvals/**"
      - "src/app/api/workforce/**"
      - "src/app/api/web-bundy/**"
      - "src/app/api/payroll/**"
      - "src/app/api/payroll-runs/**"
      - "src/app/api/bir/**"
      - "src/app/api/year-end/**"
      - "src/app/api/payroll-earnings/**"
      - "src/app/api/compliance/data-requests/**"
      - "src/lib/year-end*.ts"
      - "src/lib/bir-2316*.ts"
      - "src/lib/thirteenth-month-centavos.ts"
      - "src/app/api/exports/**"
      - "src/lib/first-payroll-*.ts"
      - "src/lib/hris-onboarding-checklist.ts"
      - "src/lib/hcm-hire-business-process.ts"
      - "src/lib/workforce-*.ts"
      - "src/lib/attendance-*.ts"
      - "src/lib/payroll-engine.ts"
      - "src/lib/payroll-calendar.ts"
      - "src/lib/payroll-period-integrity.ts"
      - "src/lib/payroll-release-segregation.ts"
      - "src/lib/filing-evidence*.ts"
      - "src/components/hris-onboarding-checklist.tsx"
      - "src/components/workspace/first-payroll-readiness.tsx"
      - "src/components/workspace/first-payroll-inline-panel.tsx"
      - "src/components/new-hire-modal.tsx"
      - "src/app/dashboard-design.css"
      - "src/app/globals.css"
      - "src/components/workspace/shell.tsx"
      - "src/components/workspace/types.ts"
      - "src/lib/dashboard-data.ts"
      - "src/lib/critical-release-flags.ts"
      - "tests/compact-mobile-header.test.ts"
      - "tests/private-parallel-operator-contract.test.ts"
      - "scripts/qa/nine-stage-connected-acceptance.ts"
      - "scripts/qa/two-period-multiworker-connected.ts"
      - "scripts/qa/governed-hire-853-bridge.ts"
      - "scripts/qa/connected-governed-hire.ts"
      - "scripts/qa/connected-year-end-journey.ts"
      - "scripts/qa/connected-year-end-mapping.ts"
      - "tests/connected-year-end-mapping.test.ts"
      - "scripts/qa/connected-year-end-artifact.ts"
      - "tests/connected-year-end-artifact.test.ts"
      - "scripts/qa/bir-1604c-validation-corpus.ts"
      - "scripts/build-bir-validation-corpus.ts"
      - "tests/bir-validation-corpus.test.ts"
      - "src/lib/bir-1604c-dat-candidate.ts"
      - "tests/governed-hire-853-evidence.test.mjs"
      - "scripts/qa/isolated-month-end-clock.cjs"
      - "scripts/qa/synthetic-month-end.cjs"
      - "scripts/qa/synthetic-session-clock.cjs"
      - "tests/qa-synthetic-month-end.test.mjs"
      - "tests/qa-synthetic-session-clock.test.ts"
      - "scripts/qa/nine-stage-mobile-browser.mjs"
      - "scripts/qa/fresh-pg18-development-schema.mjs"
      - "scripts/qa/verified-pg18-bootstrap.mjs"
      - "tests/fresh-pg18-development-schema.test.mjs"
      - "tests/verified-pg18-bootstrap.test.mjs"
      - "drizzle.config.ts"
      - "src/db/schema.ts"
      - "src/lib/ess-profile-schema.ts"
      - "src/lib/saas-billing-schema.ts"
      - "src/lib/workforce-schedule-receipt-schema.ts"
      - "tests/nine-stage-connected-evidence.test.mjs"
      - "scripts/qa/issue-853-evidence-ledger.mjs"
      - "scripts/qa/issue-853-synthetic-coverage.mjs"
      - "tests/issue-853-evidence-ledger.test.mjs"
      - "tests/issue-853-synthetic-coverage.test.mjs"
      - "fixtures/issue-853-fictional-tenants.json"
      - "docs/qa/issue-853-acceptance-pack.md"
      - "docs/qa/issue-853-two-employer-operator-acceptance.md"
      - "docs/qa/nine-stage-connected-acceptance.md"
      - ".github/workflows/nine-stage-connected-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to a pull request supersedes its older run. Runs for main and
  # manual dispatch are keyed by commit and never cancelled, so a quick follow-up
  # merge cannot leave a main commit with a cancelled (or missing) result.
  group: nine-stage-source-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  connected-payroll:
    strategy:
      fail-fast: false
      matrix:
        # Direct PR/main runs preserve all four modes. The clean-PG18 caller
        # runs exactly one separate, fresh guarded PG18 employer A/B journey.
        include: ${{ fromJSON(inputs.pg18_only && '[{"hire-mode":"governed","postgres":"18"}]' || '[{"hire-mode":"direct","postgres":"16"},{"hire-mode":"governed","postgres":"16"},{"hire-mode":"governed","postgres":"18"},{"hire-mode":"governed","postgres":"16","cutoff":"year-end"}]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NINE_STAGE_HIRE_MODE: ${{ matrix.hire-mode }}
      NINE_STAGE_PG_MAJOR: ${{ matrix.postgres }}
      NINE_STAGE_CUTOFF_MODE: ${{ matrix.cutoff || 'month' }}
      FIRST_PAYROLL_CONNECTED_ENABLED: ${{ matrix.hire-mode == 'direct' && 'true' || 'false' }}
      FIRST_PAYROLL_INLINE_ENABLED: ${{ matrix.hire-mode == 'direct' && 'true' || 'false' }}
      YEAR_END_PRIOR_EVIDENCE_ENABLED: ${{ matrix.cutoff == 'year-end' && 'true' || 'false' }}
      EXACT_THIRTEENTH_CENTAVOS_ENABLED: ${{ matrix.cutoff == 'year-end' && 'true' || 'false' }}
      FINAL_PAY_SIGNED_REVIEW_ENABLED: ${{ matrix.cutoff == 'year-end' && 'true' || 'false' }}
      BIR_2316_CERTIFICATE_DRAFT_ENABLED: ${{ matrix.cutoff == 'year-end' && 'true' || 'false' }}
      BIR_2316_WITHHOLDING_EVIDENCE_ENABLED: ${{ matrix.cutoff == 'year-end' && 'true' || 'false' }}
      BIR_2316_RECONCILIATION_ENABLED: ${{ matrix.cutoff == 'year-end' && 'true' || 'false' }}
      FRESH_PG18_DEV_REHEARSAL: ${{ matrix.postgres == '18' && 'disposable-ci-only' || 'off' }}
      CI: "true"
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      TZ: Asia/Manila
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
      QA_URL: http://127.0.0.1:3000
      APP_BASE_URL: http://127.0.0.1:3000
      TRUSTED_APP_ORIGINS: http://127.0.0.1:3000
      DEMO_MODE: "false"
      REQUIRE_PRIVILEGED_MFA: "false"
      COMPACT_MOBILE_HEADER_ENABLED: "true"
      PAYMONGO_DISBURSEMENTS_ENABLED: "false"
      XENDIT_PAYOUTS_ENABLED: "false"
      XENDIT_PAYOUTS_LIVE_APPROVED: "false"
      WFM_GEOFENCE_PILOT_ENABLED: "false"
      WFM_PUNCH_EVIDENCE_ENABLED: "false"
      FINAL_PAY_MANUAL_RELEASE_ENABLED: "false"
      OPENAI_API_KEY: ""
      PAYMONGO_SECRET_KEY: ""
      XENDIT_SECRET_KEY: ""
      SETUP_TOKEN: nine-stage-disposable-setup-token-000000000000
      READINESS_TOKEN: nine-stage-disposable-readiness-token-000000000
      WORKER_TOKEN: nine-stage-disposable-worker-token-000000000000
      TOTP_ENCRYPTION_KEY: "1111111111111111111111111111111111111111111111111111111111111111"
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
          POSTGRES_INITDB_ARGS: "--encoding=UTF8"
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Generate isolated fixture encryption keys
        shell: bash
        run: |
          bank_key=$(openssl rand -hex 32)
          pii_key=$(openssl rand -hex 32)
          echo "::add-mask::$bank_key"
          echo "::add-mask::$pii_key"
          echo "BANK_DATA_ENCRYPTION_KEY=$bank_key" >> "$GITHUB_ENV"
          echo "PII_ENCRYPTION_KEY=$pii_key" >> "$GITHUB_ENV"
          if [ "${{ matrix.hire-mode }}" = direct ]; then
            invite=$(openssl rand -hex 32)
            echo "::add-mask::$invite"
            echo "PRIVATE_PILOT_QA_INVITE_CODE=$invite" >> "$GITHUB_ENV"
            echo "PRIVATE_PILOT_INVITE_CODE_SHA256=$(printf %s "$invite" | sha256sum | cut -d' ' -f1)" >> "$GITHUB_ENV"
            echo "PRIVATE_PILOT_INVITE_EMAIL_SHA256=$(printf %s owner.nine@linaw.test | sha256sum | cut -d' ' -f1)" >> "$GITHUB_ENV"
            echo "PRIVATE_PILOT_INVITE_ENABLED=true" >> "$GITHUB_ENV"
            echo "PRIVATE_PILOT_INVITE_EXPIRES_AT=2030-01-01T00:00:00Z" >> "$GITHUB_ENV"
            echo "PUBLIC_SIGNUP_MODE=pilot" >> "$GITHUB_ENV"
            # Production signup requires an HTTPS canonical URL. The actual
            # test server and every HTTP client remain on the same loopback port.
            echo "APP_BASE_URL=https://127.0.0.1:3000" >> "$GITHUB_ENV"
          fi
          # Pick the current Manila month-end once for this disposable run so
          # authenticated browser cookies are not expired in real wall time.
          echo "NINE_STAGE_SYNTHETIC_CLOCK=$(node scripts/qa/synthetic-month-end.cjs)" >> "$GITHUB_ENV"
          # The localhost server and synthetic Chromium use one shared anchor.
          echo "NINE_STAGE_SYNTHETIC_REAL_ANCHOR=$(date +%s%3N)" >> "$GITHUB_ENV"
      - name: PG18 only — prove completely empty disposable database and guarded source before schema push
        if: matrix.postgres == '18'
        run: |
          node --test tests/fresh-pg18-development-schema.test.mjs tests/verified-pg18-bootstrap.test.mjs
          node scripts/qa/fresh-pg18-development-schema.mjs preflight
      - name: Provision fresh disposable PostgreSQL 16 from current Drizzle schema
        if: matrix.postgres == '16'
        run: npm run db:push
      - name: PG18 only — strictly validate the FIRST schema push to an empty disposable database
        if: matrix.postgres == '18'
        run: node scripts/qa/verified-pg18-bootstrap.mjs
      - name: PG18 only — check original COE tenant FK and fingerprint the bootstrapped schema
        if: matrix.postgres == '18'
        run: node scripts/qa/fresh-pg18-development-schema.mjs capture
      - name: Apply isolated audit controls and synthetic session clock
        run: |
          node scripts/qa/apply-audit-0109-isolated.mjs
          node scripts/qa/synthetic-session-clock.cjs
      - name: Validate guarded synthetic Manila month-end helper
        run: node --test tests/qa-synthetic-month-end.test.mjs
      - name: Run focused payroll/WFM safety regressions (separate from connected evidence)
        run: |
          npx tsx --test \
            tests/connected-year-end-mapping.test.ts \
            tests/connected-year-end-artifact.test.ts \
            tests/qa-synthetic-session-clock.test.ts \
            tests/web-bundy-overnight-anchor.test.ts \
            tests/payroll-night-differential.test.ts \
            tests/payroll-holiday-overtime.test.ts \
            tests/payroll-rest-day.test.ts \
            tests/workforce-overtime-payroll-trace.test.ts \
            tests/workforce-attendance-correction.test.ts \
            tests/workforce-attendance-locks.test.ts \
            tests/workforce-timesheet.test.ts \
            tests/filing-remittance-crosscheck.test.ts
      - name: Verify synthetic 10-worker two-month private parallel reconciliation contract
        run: npx tsx --test tests/private-parallel-operator-contract.test.ts
      - name: Generate byte-bound fictional official-validator handoff (not certification)
        run: |
          npx tsx --test tests/bir-validation-corpus.test.ts tests/bir-1604c-dat-candidate.test.ts tests/bir-1604c-pre-export.test.ts
          npx tsx scripts/build-bir-validation-corpus.ts
      - name: Build exact PR commit
        run: npm run build
      - name: Start localhost application
        shell: bash
        run: |
          nohup env NODE_OPTIONS="--require=$(pwd)/scripts/qa/isolated-month-end-clock.cjs" npm start -- -H 127.0.0.1 > /tmp/nine-stage-app.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 5 http://127.0.0.1:3000/login >/dev/null; then exit 0; fi
            sleep 2
          done
          echo "Isolated localhost server unavailable"
          exit 1
      - name: Run SAME-source nine-stage connected workflow
        run: NODE_OPTIONS="--require=$(pwd)/scripts/qa/isolated-month-end-clock.cjs" npx tsx scripts/qa/nine-stage-connected-acceptance.ts
      - name: Start default-off comparison app on localhost
        shell: bash
        run: |
          nohup env COMPACT_MOBILE_HEADER_ENABLED=false TRUSTED_APP_ORIGINS=http://127.0.0.1:3000,http://127.0.0.1:3001 NODE_OPTIONS="--require=$(pwd)/scripts/qa/isolated-month-end-clock.cjs" npm start -- -H 127.0.0.1 -p 3001 > /tmp/nine-stage-off-app.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 5 http://127.0.0.1:3001/login >/dev/null; then exit 0; fi
            sleep 2
          done
          echo "Default-off localhost comparison unavailable"
          exit 1
      - name: Install pinned Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Exercise synthetic 375px/390px role and employer switching
        if: success()
        run: node scripts/qa/nine-stage-mobile-browser.mjs
      - name: Verify explicit two-employer synthetic scope without claiming human UAT
        if: success()
        run: |
          node --test tests/issue-853-evidence-ledger.test.mjs tests/issue-853-synthetic-coverage.test.mjs
          node scripts/qa/issue-853-synthetic-coverage.mjs
      - name: Exercise governed candidate-to-worker Hire BP (separate no-money sidecar)
        if: always()
        run: NODE_OPTIONS="--require=$(pwd)/scripts/qa/isolated-month-end-clock.cjs" npx tsx scripts/qa/governed-hire-853-bridge.ts
      - name: Validate governed Hire receipt without claiming nine-stage payroll lineage
        if: always()
        env:
          NINE_STAGE_GOVERNED_HIRE_REQUIRED: "true"
        run: node --test tests/governed-hire-853-evidence.test.mjs
      - name: Validate sanitized source and evidence contract
        if: always()
        env:
          NINE_STAGE_EVIDENCE_REQUIRED: "true"
        run: node --test tests/nine-stage-connected-evidence.test.mjs
      - name: Rehearse ten fictional workers through two real HTTP payroll cutoffs (PG16 direct only)
        if: ${{ success() && matrix.postgres == '16' && matrix.hire-mode == 'direct' && matrix.cutoff != 'year-end' }}
        run: NODE_OPTIONS="--require=$(pwd)/scripts/qa/isolated-month-end-clock.cjs" npx tsx scripts/qa/two-period-multiworker-connected.ts
      - name: Show bounded server errors on failure
        if: failure()
        shell: bash
        run: |
          grep -E 'Error:|code:|failed|Error \[' /tmp/nine-stage-app.log | tail -n 25 | cut -c1-180 || true
      - name: Delete synthetic login handoff
        if: always()
        run: rm -f qa-artifacts/.nine-stage-browser-auth.json
      - name: Upload sanitized machine-readable results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nine-stage-source-connected-no-money-pg${{ matrix.postgres }}-${{ matrix.hire-mode }}${{ matrix.cutoff == 'year-end' && '-year-end' || '' }}
          path: |
            qa-artifacts/nine-stage-connected-report.json
            qa-artifacts/fresh-pg18-dev-schema.json
            qa-artifacts/nine-stage-mobile-report.json
            qa-artifacts/issue-853-synthetic-two-tenant-scope.json
            qa-artifacts/ten-worker-two-period-report.json
            qa-artifacts/governed-hire-853-report.json
            qa-artifacts/bir-validation-corpus/**
            qa-artifacts/connected-year-end-unsigned.pdf
            qa-artifacts/connected-year-end-review.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload fictional desktop and phone layout screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nine-stage-role-layout-screenshots-pg${{ matrix.postgres }}-${{ matrix.hire-mode }}${{ matrix.cutoff == 'year-end' && '-year-end' || '' }}
          path: |
            qa-artifacts/nine-stage-layout-*.png
            qa-artifacts/first-payroll-authenticated-resume-*.png
          if-no-files-found: warn
          retention-days: 14

# 2026-10-17 QA: retrigger existing PG16/PG18 fictional two-employer source journey; no behavior changed.
