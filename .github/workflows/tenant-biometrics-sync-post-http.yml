name: Biometric sync POST tenant isolation (fictional PG16; zero credits)
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - '.github/workflows/tenant-biometrics-sync-post-http.yml'
      - 'scripts/qa/tenant-biometrics-sync-post-http.mjs'
      - 'src/app/api/biometrics/sync/route.ts'
      - 'src/lib/biometric-auth.ts'
      - 'src/lib/workforce-attendance-lock.ts'
      - 'src/lib/workforce-attendance-exception-events.ts'
      - 'src/lib/workforce-timesheet-server.ts'
      - 'src/db/**'
      - 'scripts/qa/tenant-table-http.mjs'
      - 'scripts/qa/tenant-table-env.mjs'
      - 'scripts/qa/apply-isolated-baseline.mjs'
permissions:
  contents: read
concurrency:
  group: tenant-biometrics-post-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  fictional-biometric-post-http:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Export fictional PG16 loopback and disabled providers/workers
        shell: bash
        run: |
          set -euo pipefail
          node scripts/qa/tenant-table-env.mjs compliance-posts >> "$GITHUB_ENV"
          {
            echo 'TENANT_BIOMETRIC_SYNC_MODE=fictional-pg16'
            echo 'BIOMETRIC_INGEST_SECRET=fictional-ci-only-biometric-device-master-00000000000000000000'
            echo 'WORKER_ENABLED=false'
            echo 'CENTRAL_SCHEDULER_ENABLED=false'
            echo 'PAYMONGO_DISBURSEMENTS_ENABLED=false'
            echo 'XENDIT_PAYOUTS_ENABLED=false'
            echo 'XENDIT_BILLING_ENABLED=false'
            echo 'PAYMONGO_SECRET_KEY='
            echo 'XENDIT_SECRET_KEY='
            echo 'XENDIT_PAYOUT_SECRET_KEY='
          } >> "$GITHUB_ENV"
      - name: Check executable proof syntax
        run: node --check scripts/qa/tenant-biometrics-sync-post-http.mjs
      - name: Ephemeral encryption keys
        shell: bash
        run: |
          set -euo pipefail
          for name in PII_ENCRYPTION_KEY BANK_DATA_ENCRYPTION_KEY; do
            key=$(openssl rand -hex 32)
            echo "::add-mask::$key"
            echo "$name=$key" >> "$GITHUB_ENV"
          done
      - name: Initialize disposable PG16
        run: npm run db:push
      - name: Apply fictional baseline only
        run: node scripts/qa/apply-isolated-baseline.mjs
      - name: Build production-mode application
        run: npm run build
      - name: Start loopback production-mode HTTP
        shell: bash
        run: |
          set -euo pipefail
          nohup npm start -- -H 127.0.0.1 > /tmp/tenant-biometrics-sync-next.log 2>&1 &
          server=$!
          for attempt in $(seq 1 60); do
            if curl --silent --fail "$SECURITY_SMOKE_URL/login" > /dev/null; then
              exit 0
            fi
            if ! kill -0 "$server" 2>/dev/null; then
              cat /tmp/tenant-biometrics-sync-next.log
              exit 1
            fi
            sleep 2
          done
          cat /tmp/tenant-biometrics-sync-next.log
          exit 1
      - name: Prove own writes and cross-employer session/device denials in real SQL
        run: node --import tsx scripts/qa/tenant-biometrics-sync-post-http.mjs
      - name: Local diagnostics on failure
        if: failure()
        run: cat /tmp/tenant-biometrics-sync-next.log || true
