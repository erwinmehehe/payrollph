name: Web Bundy deterministic Manila midnight (fictional PG16 real HTTP)
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/tenant-clock-midnight-real-http.yml'
      - 'scripts/qa/tenant-clock-midnight-http.mjs'
      - 'tests/tenant-clock-midnight-source.test.mjs'
      - 'src/app/api/web-bundy/**'
      - 'src/lib/web-bundy-overnight-anchor.ts'
permissions:
  contents: read
concurrency:
  group: tenant-clock-midnight-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  midnight-real-http:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/qa/tenant-clock-env.mjs >> "$GITHUB_ENV"
      - name: Disposable keys only
        shell: bash
        run: |
          set -euo pipefail
          for name in PII_ENCRYPTION_KEY BANK_DATA_ENCRYPTION_KEY PUNCH_DEVICE_HASH_KEY; do
            key=$(openssl rand -hex 32)
            echo "::add-mask::$key"
            echo "$name=$key" >> "$GITHUB_ENV"
          done
      - run: node --test tests/tenant-clock-midnight-source.test.mjs
      - run: npm run db:push
      - run: node scripts/qa/apply-isolated-baseline.mjs
      - run: node scripts/qa/prepare-hcm-work-item-fixture.mjs
      - name: Seed separate fictional employers, reviewer sessions and enhanced allowlist
        run: env -u NODE_ENV node --import tsx scripts/qa/tenant-clock-seed.mjs
      - run: cat outputs/clock-allowlist.env >> "$GITHUB_ENV"
      - run: npm run build
      - name: Start localhost-only production Next
        shell: bash
        run: |
          set -euo pipefail
          nohup npm start -- -H 127.0.0.1 > /tmp/clock-midnight-server.log 2>&1 &
          for attempt in {1..40}; do
            if curl -fsS "$SECURITY_SMOKE_URL" >/dev/null; then exit 0; fi
            sleep 2
          done
          tail -n 30 /tmp/clock-midnight-server.log || true
          exit 1
      - name: Real after-midnight break and clock-out remain on previous Manila work date
        run: env -u NODE_ENV node --import tsx scripts/qa/tenant-clock-midnight-http.mjs
