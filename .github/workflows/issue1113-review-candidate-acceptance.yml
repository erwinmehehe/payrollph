name: Issue1113 review-only candidate acceptance
on:
  pull_request:
    paths:
      - "docs/sql/issue1113-*.sql"
      - "tests/issue1113-review-candidates-postgres.test.mjs"
      - ".github/workflows/issue1113-review-candidate-acceptance.yml"
permissions:
  contents: read
concurrency:
  group: issue1113-candidate-acceptance-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  privileges:
    name: review-candidates (PG${{ matrix.postgres }})
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        postgres: [16, 18]
    env:
      CI: "true"
      TZ: Asia/Manila
      ISSUE1113_ACCEPTANCE_MODE: isolated-ci-only
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/neondb
      PAYMONGO_DISBURSEMENTS_ENABLED: "false"
      XENDIT_PAYOUTS_ENABLED: "false"
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: neondb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d neondb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node --test tests/issue1113-review-candidates-postgres.test.mjs
