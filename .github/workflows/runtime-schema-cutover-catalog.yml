name: Runtime Schema Cutover Catalog (Isolated CI)

on:
  pull_request:
    paths:
      - "src/lib/*schema*"
      - "src/lib/request-schema-readonly.ts"
      - "src/lib/core-schema-readonly.ts"
      - "src/lib/core-schema-compat.ts"
      - "tests/request-schema-readonly*.test.ts"
      - "tests/core-schema-readonly.test.ts"
      - ".github/workflows/runtime-schema-cutover-catalog.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  isolated-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CI: "true"
      TZ: Asia/Manila
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout without persisting credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Configure disposable CI bank key
        shell: bash
        run: echo "BANK_DATA_ENCRYPTION_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Push repo schema only to isolated PostgreSQL 16
        run: npm run db:push
      - name: Exercise fail-closed mock and real catalog checks
        run: >
          npx tsx --test --test-concurrency=1
          tests/core-schema-readonly.test.ts
          tests/request-schema-readonly.test.ts
          tests/request-schema-readonly-postgres.test.ts
      - name: Check exact-head TypeScript types
        run: npx tsc --noEmit
