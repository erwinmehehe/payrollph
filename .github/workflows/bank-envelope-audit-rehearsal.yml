name: P0-2 Bank Envelope Audit Rehearsal (Synthetic PostgreSQL 16)

on:
  pull_request:
    paths:
      - "scripts/lib/bank-envelope-audit.mjs"
      - "scripts/audit-bank-envelopes-readonly.mjs"
      - "tests/bank-envelope-audit*.test.mjs"
      - ".github/workflows/production-bank-encryption.yml"
      - ".github/workflows/bank-envelope-audit-rehearsal.yml"
  push:
    branches: [main]
    paths:
      - "scripts/lib/bank-envelope-audit.mjs"
      - "scripts/audit-bank-envelopes-readonly.mjs"
      - "tests/bank-envelope-audit*.test.mjs"
      - ".github/workflows/production-bank-encryption.yml"
      - ".github/workflows/bank-envelope-audit-rehearsal.yml"

# Supersede only older PR attempts; main/manual runs retain independent groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  synthetic-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CI: "true"
      TZ: Asia/Manila
      BANK_AUDIT_TEST_MODE: isolated-ci-only
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout unprivileged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Check audit-only JavaScript syntax
        run: |
          node --check scripts/lib/bank-envelope-audit.mjs
          node --check scripts/audit-bank-envelopes-readonly.mjs
          node --check tests/bank-envelope-audit.test.mjs
          node --check tests/bank-envelope-audit-postgres.test.mjs
      - name: Exercise four-store audit, SELECT-only role and fail-closed PostgreSQL 16 behavior
        run: node --test tests/bank-envelope-audit.test.mjs tests/bank-envelope-audit-postgres.test.mjs
