name: Worker 360 legal-employer history isolation (fictional PG16 HTTP)
on:
  pull_request:
    branches: [main]
    paths:
      - "src/app/api/hcm/worker-360/route.ts"
      - "src/app/hcm/worker-360/page.tsx"
      - "src/lib/hcm-worker-360-server.ts"
      - "src/components/hcm-worker-360*.tsx"
      - "scripts/qa/tenant-hcm-worker360-entity-*.mjs"
      - "tests/tenant-hcm-worker360-entity-contract.test.mjs"
      - ".github/workflows/tenant-hcm-worker360-entity-http.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  legal-employer-worker-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: "true"
      GITHUB_ACTIONS: "true"
      TZ: Asia/Manila
      NEXT_TELEMETRY_DISABLED: "1"
      TENANT_WORKER360_ENTITY_PROOF: fictional-pg16-only
      BUILD_BLOCK_ACCEPTANCE_MODE: synthetic-postgres-only
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
      APP_BASE_URL: http://127.0.0.1:3000
      SECURITY_SMOKE_URL: http://127.0.0.1:3000
      TRUSTED_APP_ORIGINS: http://127.0.0.1:3000
      HCM_WORKER_360_ENABLED: "true"
      HCM_ENTERPRISE_PLAN_GATE_ENABLED: "false"
      MULTI_ENTITY_ENABLED: "true"
      EMPLOYEE_DOCUMENT_VAULT_ENABLED: "false"
      DEMO_MODE: "false"
      REQUIRE_PRIVILEGED_MFA: "true"
      WORKER_ENABLED: "false"
      CENTRAL_SCHEDULER_ENABLED: "false"
      PAYMONGO_DISBURSEMENTS_ENABLED: "false"
      XENDIT_PAYOUTS_ENABLED: "false"
      XENDIT_BILLING_ENABLED: "false"
      FINAL_PAY_SIGNED_REVIEW_ENABLED: "false"
      OPENAI_API_KEY: ""
      SMTP_PASSWORD: ""
      RESEND_API_KEY: ""
      CRON_SECRET: ""
      WORKER_TOKEN: ""
      PAYMONGO_SECRET_KEY: ""
      XENDIT_SECRET_KEY: ""
      S3_ACCESS_KEY_ID: ""
      S3_SECRET_ACCESS_KEY: ""
      R2_ACCESS_KEY_ID: ""
      R2_SECRET_ACCESS_KEY: ""
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Require exact checked-out PR head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies from lockfile
        run: npm ci
      - name: Guardrail negative controls and syntax
        run: |
          node --check scripts/qa/tenant-hcm-worker360-entity-contract.mjs
          node --check scripts/qa/tenant-hcm-worker360-entity-http.mjs
          node --check scripts/qa/tenant-hcm-worker360-entity-build-hold.mjs
          node --test tests/tenant-hcm-worker360-entity-contract.test.mjs
      - name: Generate disposable encryption keys
        shell: bash
        run: |
          set -euo pipefail
          for key in BANK_DATA_ENCRYPTION_KEY PII_ENCRYPTION_KEY TOTP_ENCRYPTION_KEY; do
            value=$(openssl rand -hex 32)
            echo "::add-mask::$value"
            echo "$key=$value" >> "$GITHUB_ENV"
          done
      - name: Apply fresh disposable PG16 schema
        run: npm run db:push
      - name: Apply reviewed isolated database baseline
        run: node scripts/qa/apply-isolated-baseline.mjs
      - name: Build isolated Worker 360 path and restore HCM embargo byte-for-byte
        shell: bash
        env:
          NODE_ENV: production
        run: |
          set -euo pipefail
          trap 'node scripts/qa/tenant-hcm-worker360-entity-build-hold.mjs restore' EXIT
          node scripts/qa/tenant-hcm-worker360-entity-build-hold.mjs apply
          npm run build
      - name: Verify original production HCM embargo was not changed
        env:
          NODE_ENV: production
        run: |
          node scripts/qa/tenant-hcm-worker360-entity-build-hold.mjs verify
          git diff --exit-code -- src/lib/multi-entity-hcm-hold.ts
      - name: Start localhost Next
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/worker360-entity.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:3000/login >/dev/null; then exit 0; fi
            sleep 2
          done
          tail -n 70 /tmp/worker360-entity.log
          exit 1
      - name: Real legal-employer GET and SSR, forged selectors, revocation, unchanged SQL
        env:
          NODE_ENV: production
        run: node --import tsx scripts/qa/tenant-hcm-worker360-entity-http.mjs
      - name: Bounded localhost diagnostics if failing
        if: failure()
        run: tail -n 70 /tmp/worker360-entity.log || true
