name: Pricing reference preview

on:
  push:
    branches:
      - design/pricing-reference-match

jobs:
  preview:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
      DEMO_MODE: "false"
      APP_BASE_URL: http://127.0.0.1:3000
      PG_POOL_MAX: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Apply baseline schema
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const { Client } = require("pg");
          (async () => {
            const client = new Client({ connectionString: process.env.DATABASE_URL });
            await client.connect();
            await client.query(fs.readFileSync("drizzle/baseline.sql", "utf8"));
            await client.end();
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
      - name: Seed repo pricing
        env:
          DEMO_MODE: "true"
        run: npx tsx -e 'import("./src/db/seed").then(async (m) => { await m.ensureSeedData(); process.exit(0); }).catch((e) => { console.error(e); process.exit(1); })'
      - run: npx tsc --noEmit
      - run: npx eslint src tests
      - run: npm run build
      - name: Start app
        run: |
          npm start > /tmp/linaw-next.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/linaw-next.log
          exit 1
      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Capture pricing preview and verify controls
        run: |
          mkdir -p pricing-preview
          node <<'NODE'
          const { chromium } = require("playwright");
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1207, height: 766 }, deviceScaleFactor: 1 });
            await page.goto("http://127.0.0.1:3000/", { waitUntil: "networkidle" });
            await page.addStyleTag({ content: `
              @supports (animation-timeline: view()) {
                .software-home * { animation: none !important; opacity: 1 !important; transform: none !important; }
              }
              .software-home .site-nav { position: static !important; }
            `});
            const pricing = page.locator("#pricing");
            await pricing.scrollIntoViewIfNeeded();
            const before = await pricing.locator(".price strong").allTextContents();
            const input = pricing.getByLabel("Employee headcount");
            await input.fill("445");
            const after = await pricing.locator(".price strong").allTextContents();
            if ((await input.inputValue()) !== "445") throw new Error("Headcount input did not update");
            if (JSON.stringify(before) === JSON.stringify(after)) throw new Error("Plan prices did not recalculate");
            const section = await pricing.boundingBox();
            if (!section) throw new Error("Pricing section missing");
            const bodyWidth = await page.evaluate(() => Math.max(document.body.scrollWidth, document.documentElement.scrollWidth));
            if (bodyWidth > 1209) throw new Error(`Desktop overflow: ${bodyWidth}`);
            await pricing.screenshot({ path: "pricing-preview/pricing-1207.png" });

            const mobile = await browser.newPage({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 1 });
            await mobile.goto("http://127.0.0.1:3000/", { waitUntil: "networkidle" });
            await mobile.locator("#pricing").scrollIntoViewIfNeeded();
            const mobileWidth = await mobile.evaluate(() => Math.max(document.body.scrollWidth, document.documentElement.scrollWidth));
            if (mobileWidth > 392) throw new Error(`Mobile overflow: ${mobileWidth}`);
            await mobile.locator("#pricing").screenshot({ path: "pricing-preview/pricing-390.png" });
            console.log(JSON.stringify({ before, after, bodyWidth, mobileWidth }, null, 2));
            await browser.close();
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pricing-reference-preview
          path: pricing-preview/
          retention-days: 1
