name: Tenant ESS Schedule Receipts HTTP (Fictional PG16 Only)

on:
  pull_request:
    branches: [main]
    paths:
      - "src/app/api/self/schedule-receipts/**"
      - "src/lib/workforce-schedule-receipt*.ts"
      - "src/lib/workforce-schedule-window.ts"
      - "scripts/qa/tenant-self-schedule-receipts-*.mjs"
      - "tests/tenant-self-schedule-receipts-*.mjs"
      - ".github/workflows/tenant-self-schedule-receipts-http.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  schedule-receipt-tenant-http:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      TZ: Asia/Manila
      TENANT_SECOND_PASS_MODE: isolated-ci-only
      TENANT_RECEIPT_MODE: fictional-only
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
      SECURITY_SMOKE_URL: http://127.0.0.1:3000
      APP_BASE_URL: http://127.0.0.1:3000
      TRUSTED_APP_ORIGINS: http://127.0.0.1:3000
      DEMO_MODE: "false"
      WORKER_ENABLED: "false"
      CENTRAL_SCHEDULER_ENABLED: "false"
      PAYMONGO_DISBURSEMENTS_ENABLED: "false"
      XENDIT_PAYOUTS_ENABLED: "false"
      XENDIT_BILLING_ENABLED: "false"
      HCM_OVERPAYMENT_PREVIEW_ENABLED: "false"
      PAYROLL_OVERPAYMENT_REVIEW_ENABLED: "false"
      WFM_SCHEDULE_RECEIPTS_ENABLED: "true"
      WFM_SCHEDULE_RECEIPTS_ALLOWED_ORGANIZATION_IDS: "1,2,3"
      REQUIRE_PRIVILEGED_MFA: "false"
      WORKER_TOKEN: ci-worker-token-fictional-receipt
      TOTP_ENCRYPTION_KEY: "4444444444444444444444444444444444444444444444444444444444444444"
      NEXT_TELEMETRY_DISABLED: "1"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Guard exact two-method source proof and reject false-positive tests
        run: |
          node --check scripts/qa/tenant-self-schedule-receipts-contract.mjs
          node --check scripts/qa/tenant-self-schedule-receipts-http.mjs
          node --test tests/tenant-self-schedule-receipts-contract.test.mjs
      - name: Generate isolated encryption keys
        shell: bash
        run: |
          bank_key=$(openssl rand -hex 32)
          pii_key=$(openssl rand -hex 32)
          echo "::add-mask::$bank_key"
          echo "::add-mask::$pii_key"
          echo "BANK_DATA_ENCRYPTION_KEY=$bank_key" >> "$GITHUB_ENV"
          echo "PII_ENCRYPTION_KEY=$pii_key" >> "$GITHUB_ENV"
      - name: Create disposable PG16 schema
        run: npm run db:push
      - name: Apply reviewed cutover baseline to disposable app_db only
        run: node scripts/qa/apply-isolated-baseline.mjs
      - name: Build production-mode local app (never deploy)
        run: npm run build
      - name: Start localhost-only app
        shell: bash
        run: |
          set -euo pipefail
          nohup npm start -- -H 127.0.0.1 > /tmp/tenant-self-schedule-receipts.log 2>&1 &
          for attempt in {1..40}; do
            if curl -fsS "http://127.0.0.1:3000/login" >/dev/null; then exit 0; fi
            sleep 2
          done
          echo "::error::Local app did not start"
          tail -n 100 /tmp/tenant-self-schedule-receipts.log
          exit 1
      - name: Verify own, peer, forged, victim and revoked-member GET/POST
        env:
          NODE_ENV: production
        run: node --import tsx scripts/qa/tenant-self-schedule-receipts-http.mjs
