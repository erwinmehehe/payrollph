name: Public API v1 catalog is tenant-independent (fictional PG16 HTTP)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - '.github/workflows/tenant-v1-public-http.yml'
      - 'scripts/qa/tenant-v1-public-*.mjs'
      - 'tests/tenant-v1-public-catalog.test.mjs'
      - 'scripts/qa/tenant-isolation-coverage-manifest.json'
      - 'src/app/api/v1/route.ts'
      - 'src/lib/critical-release-flags.ts'
      - 'scripts/qa/tenant-table-http.mjs'
      - 'scripts/qa/tenant-table-env.mjs'

permissions:
  contents: read

concurrency:
  group: tenant-v1-public-catalog-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  public-catalog:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TENANT_V1_PUBLIC_MODE: isolated-ci-only
      XENDIT_BILLING_ENABLED: 'false'
      PAYMONGO_DISBURSEMENTS_ENABLED: 'false'
      XENDIT_PAYOUTS_ENABLED: 'false'
      WORKER_ENABLED: 'false'
      CENTRAL_SCHEDULER_ENABLED: 'false'
      PAYMONGO_SECRET_KEY: ''
      XENDIT_SECRET_KEY: ''
      RESEND_API_KEY: ''
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Export fail-closed localhost-only profile
        shell: bash
        run: |
          set -euo pipefail
          node scripts/qa/tenant-table-env.mjs compliance-posts >> "$GITHUB_ENV"
          echo 'TENANT_V1_PUBLIC_MODE=isolated-ci-only' >> "$GITHUB_ENV"
      - name: Check pure negative controls and source identity
        run: |
          node --check scripts/qa/tenant-v1-public-contract.mjs
          node --check scripts/qa/tenant-v1-public-http.mjs
          node --test tests/tenant-v1-public-catalog.test.mjs
      - name: Generate ephemeral encryption and webhook keys
        shell: bash
        run: |
          set -euo pipefail
          for name in PII_ENCRYPTION_KEY BANK_DATA_ENCRYPTION_KEY; do
            key=$(openssl rand -hex 32)
            echo "::add-mask::$key"
            echo "$name=$key" >> "$GITHUB_ENV"
          done
          secret="whsec_$(openssl rand -base64 32 | tr -d '\n')"
          echo "::add-mask::$secret"
          echo "RESEND_WEBHOOK_SECRET=$secret" >> "$GITHUB_ENV"
      - name: Initialize fictional PostgreSQL 16
        run: npm run db:push
      - name: Apply reviewed isolated baseline only
        run: node scripts/qa/apply-isolated-baseline.mjs
      - name: Build production-mode app only against localhost
        run: npm run build
      - name: Start Next on loopback only
        shell: bash
        run: |
          set -euo pipefail
          nohup npm start -- -H 127.0.0.1 > /tmp/tenant-v1-public-next.log 2>&1 &
          server=$!
          for attempt in $(seq 1 60); do
            if curl -fsS "$SECURITY_SMOKE_URL/login" >/dev/null; then exit 0; fi
            if ! kill -0 "$server" 2>/dev/null; then
              cat /tmp/tenant-v1-public-next.log
              exit 1
            fi
            sleep 2
          done
          cat /tmp/tenant-v1-public-next.log
          exit 1
      - name: Verify public 200, three real sessions, forged selectors and unchanged tenant SQL
        run: node --import tsx scripts/qa/tenant-v1-public-http.mjs
      - name: Print localhost-only diagnostics on failure
        if: failure()
        run: cat /tmp/tenant-v1-public-next.log || true
