name: Homepage visual verification

on:
  push:
    branches:
      - feat/homepage-visual-redesign

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
      DEMO_MODE: "false"
      APP_BASE_URL: http://127.0.0.1:3000
      PG_POOL_MAX: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Apply baseline schema
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const { Client } = require("pg");
          (async () => {
            const client = new Client({ connectionString: process.env.DATABASE_URL });
            await client.connect();
            await client.query(fs.readFileSync("drizzle/baseline.sql", "utf8"));
            await client.end();
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
      - run: npx tsc --noEmit
      - run: npx eslint src tests
      - run: npx tsx --test tests/marketing.test.ts
      - run: npm run build
      - name: Start production server
        run: |
          npm start > /tmp/linaw-next.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/linaw-next.log
          exit 1
      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Render and exercise homepage
        run: |
          mkdir -p visual-artifacts
          node <<'NODE'
          const { chromium } = require("playwright");
          (async () => {
            const browser = await chromium.launch({ headless: true });

            const desktop = await browser.newPage({ viewport: { width: 1440, height: 1000 }, deviceScaleFactor: 1 });
            await desktop.goto("http://127.0.0.1:3000/", { waitUntil: "networkidle" });
            if (!(await desktop.getByRole("heading", { name: /Philippine payroll software without the guesswork/i }).isVisible())) {
              throw new Error("Homepage H1 not visible");
            }
            await desktop.screenshot({ path: "visual-artifacts/home-desktop.png", fullPage: true });

            const payroll = desktop.locator("#payroll");
            const output = payroll.locator('output[for="lab-salary"]');
            const before = await output.textContent();
            await payroll.locator("#lab-salary").fill("50000");
            const after = await output.textContent();
            if (!before || !after || before === after || !after.includes("50,000")) throw new Error("Statutory slider broke");

            const preview = desktop.locator("#preview");
            await preview.getByRole("button", { name: "Payroll", exact: true }).click();
            if (!(await preview.getByText("Register", { exact: true }).isVisible())) throw new Error("Interactive preview broke");

            const mobile = await browser.newPage({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 1 });
            await mobile.goto("http://127.0.0.1:3000/", { waitUntil: "networkidle" });
            const bodyWidth = await mobile.evaluate(() => document.body.scrollWidth);
            const viewportWidth = await mobile.evaluate(() => window.innerWidth);
            if (bodyWidth > viewportWidth + 2) throw new Error(`Mobile overflow: body=${bodyWidth}, viewport=${viewportWidth}`);
            await mobile.screenshot({ path: "visual-artifacts/home-mobile.png", fullPage: true });

            console.log(JSON.stringify({ before, after, bodyWidth, viewportWidth }, null, 2));
            await browser.close();
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homepage-visuals
          path: visual-artifacts/
          retention-days: 1
