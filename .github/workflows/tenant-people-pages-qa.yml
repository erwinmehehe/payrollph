name: Tenant People Pages (Fictional PG16 Only)

on:
  pull_request:
    branches: [main]
    paths:
      - "src/app/app/engagement/page.tsx"
      - "src/lib/multi-entity-hcm-hold.ts"
      - "src/app/app/goals-reviews/page.tsx"
      - "src/lib/tenant-people-page-employer.ts"
      - "scripts/qa/tenant-people-pages-*.mjs"
      - "tests/tenant-people-page*.test.*"
      - "tests/tenant-people-ssr-multi-entity-hold.test.ts"
      - "docs/qa/tenant-people-pages-boundary.md"
      - ".github/workflows/tenant-people-pages-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tenant-people-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: "true"
      TZ: Asia/Manila
      BUILD_BLOCK_ACCEPTANCE_MODE: synthetic-postgres-only
      TENANT_PEOPLE_PAGES_PROOF: fictional-only
      ENGAGEMENT_SURVEY_ENABLED: "true"
      GOALS_REVIEW_CYCLE_ENABLED: "true"
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
      APP_BASE_URL: http://127.0.0.1:3000
      TRUSTED_APP_ORIGINS: http://127.0.0.1:3000
      DEMO_MODE: "false"
      REQUIRE_PRIVILEGED_MFA: "true"
      WORKER_ENABLED: "false"
      CENTRAL_SCHEDULER_ENABLED: "false"
      PAYMONGO_DISBURSEMENTS_ENABLED: "false"
      XENDIT_PAYOUTS_ENABLED: "false"
      XENDIT_BILLING_ENABLED: "false"
      FINAL_PAY_SIGNED_REVIEW_ENABLED: "false"
      EXACT_THIRTEENTH_CENTAVOS_ENABLED: "false"
      PAYROLL_CALCULATION_HISTORY_ENABLED: "false"
      OPENAI_API_KEY: ""
      NEXT_TELEMETRY_DISABLED: "1"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact PR head
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Test malicious selector and fake-proof rejections before any database import
        run: |
          node --check scripts/qa/tenant-people-pages-contract.mjs
          node --check scripts/qa/tenant-people-pages-http.mjs
          node --test tests/tenant-people-pages-contract.test.mjs
          node --import tsx --test tests/tenant-people-page-employer.test.ts
          node --import tsx --test tests/tenant-people-ssr-multi-entity-hold.test.ts
      - name: Generate fictional-only encryption secrets
        shell: bash
        run: |
          for key in BANK_DATA_ENCRYPTION_KEY PII_ENCRYPTION_KEY TOTP_ENCRYPTION_KEY; do
            value=$(openssl rand -hex 32)
            echo "::add-mask::$value"
            echo "$key=$value" >> "$GITHUB_ENV"
          done
      - name: Create disposable PG16 schema
        run: npm run db:push
      - name: Apply reviewed synthetic isolated baseline
        run: node scripts/qa/apply-isolated-baseline.mjs
      - name: Build exact-head feature-ON local Next application
        run: npm run build
      - name: Start localhost-only Next application
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/tenant-people-pages.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:3000/login > /dev/null; then exit 0; fi
            sleep 2
          done
          tail -n 80 /tmp/tenant-people-pages.log
          exit 1
      - name: Prove own, foreign, forged, unit-only and revoked tenant page boundaries
        env:
          NODE_ENV: production
        run: node --import tsx scripts/qa/tenant-people-pages-http.mjs
      - name: Show bounded loopback log on failure
        if: failure()
        run: tail -n 80 /tmp/tenant-people-pages.log || true

  tenant-people-pages-multi-entity-hold:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: "true"
      TZ: Asia/Manila
      BUILD_BLOCK_ACCEPTANCE_MODE: synthetic-postgres-only
      TENANT_PEOPLE_PAGES_PROOF: fictional-only
      MULTI_ENTITY_ENABLED: "true"
      ENGAGEMENT_SURVEY_ENABLED: "true"
      GOALS_REVIEW_CYCLE_ENABLED: "true"
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
      APP_BASE_URL: http://127.0.0.1:3000
      SECURITY_SMOKE_URL: http://127.0.0.1:3000
      TRUSTED_APP_ORIGINS: http://127.0.0.1:3000
      DEMO_MODE: "false"
      REQUIRE_PRIVILEGED_MFA: "true"
      WORKER_ENABLED: "false"
      CENTRAL_SCHEDULER_ENABLED: "false"
      PAYMONGO_DISBURSEMENTS_ENABLED: "false"
      XENDIT_PAYOUTS_ENABLED: "false"
      XENDIT_BILLING_ENABLED: "false"
      FINAL_PAY_SIGNED_REVIEW_ENABLED: "false"
      EXACT_THIRTEENTH_CENTAVOS_ENABLED: "false"
      PAYROLL_CALCULATION_HISTORY_ENABLED: "false"
      OPENAI_API_KEY: ""
      NEXT_TELEMETRY_DISABLED: "1"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact PR head
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Validate early SSR rollout hold before any DB work
        run: |
          node --check scripts/qa/tenant-people-pages-multi-entity-http.mjs
          node --import tsx --test tests/tenant-people-ssr-multi-entity-hold.test.ts
      - name: Generate fictional-only encryption secrets
        shell: bash
        run: |
          for key in BANK_DATA_ENCRYPTION_KEY PII_ENCRYPTION_KEY TOTP_ENCRYPTION_KEY; do
            value=$(openssl rand -hex 32)
            echo "::add-mask::$value"
            echo "$key=$value" >> "$GITHUB_ENV"
          done
      - name: Create disposable PG16 schema
        run: npm run db:push
      - name: Apply reviewed synthetic isolated baseline
        run: node scripts/qa/apply-isolated-baseline.mjs
      - name: Build exact-head feature-ON, multi-entity-ON local Next app
        run: npm run build
      - name: Start localhost-only Next application
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/tenant-people-pages-hold.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:3000/login > /dev/null; then exit 0; fi
            sleep 2
          done
          tail -n 80 /tmp/tenant-people-pages-hold.log
          exit 1
      - name: Verify feature-ON 404 denial for own, foreign and prefetch pages; immutable SQL
        env:
          NODE_ENV: production
        run: node --import tsx scripts/qa/tenant-people-pages-multi-entity-http.mjs
      - name: Show bounded loopback log on failure
        if: failure()
        run: tail -n 80 /tmp/tenant-people-pages-hold.log || true
