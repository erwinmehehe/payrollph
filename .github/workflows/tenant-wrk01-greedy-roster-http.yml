name: Tenant WRK-01 Greedy Roster GET (Fictional PG16 Only)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - ".github/workflows/tenant-wrk01-greedy-roster-http.yml"
      - "scripts/qa/tenant-wrk01-greedy-roster-*.mjs"
      - "tests/tenant-wrk01-greedy-roster-contract.test.mjs"
      - "src/app/api/workforce/greedy-roster/**"
      - "src/lib/workforce-greedy-roster*"
      - "src/lib/hcm-worksite-eligibility*"
      - "src/lib/workforce-roster-rules*"
      - "src/lib/access.ts"
      - "src/lib/auth.ts"
      - "src/db/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  greedy-roster-get-tenant-http:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      WORKER_ENABLED: "false"
      CENTRAL_SCHEDULER_ENABLED: "false"
      XENDIT_BILLING_ENABLED: "false"
      HCM_OVERPAYMENT_PREVIEW_ENABLED: "false"
      PAYROLL_OVERPAYMENT_REVIEW_ENABLED: "false"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install exact locked source dependencies
        run: npm ci
      - name: Export existing fictional, flag-on PG16 proof profile
        shell: bash
        run: |
          set -euo pipefail
          node scripts/qa/tenant-table-env.mjs flagged-reads >> "$GITHUB_ENV"
          {
            echo "TENANT_GREEDY_ROSTER_MODE=fictional-only"
            echo "WFM_GREEDY_ROSTER_ENABLED=true"
            echo "WFM_ROSTER_SCALE_RULES_ENABLED=true"
            echo "WORKER_ENABLED=false"
            echo "CENTRAL_SCHEDULER_ENABLED=false"
            echo "XENDIT_BILLING_ENABLED=false"
            echo "HCM_OVERPAYMENT_PREVIEW_ENABLED=false"
            echo "PAYROLL_OVERPAYMENT_REVIEW_ENABLED=false"
            echo "PAYMONGO_SECRET_KEY="
            echo "XENDIT_SECRET_KEY="
            echo "XENDIT_PAYOUT_SECRET_KEY="
            echo "RESEND_API_KEY="
            echo "POSTMARK_SERVER_TOKEN="
            echo "SMTP_URL="
            echo "STRIPE_SECRET_KEY="
          } >> "$GITHUB_ENV"
      - name: Reject unsafe environments, false positives and changed authorization source
        run: |
          node --check scripts/qa/tenant-wrk01-greedy-roster-contract.mjs
          node --check scripts/qa/tenant-wrk01-greedy-roster-http.mjs
          node --check tests/tenant-wrk01-greedy-roster-contract.test.mjs
          node --test tests/tenant-wrk01-greedy-roster-contract.test.mjs
      - name: Generate new fictional encryption and webhook values, never call a provider
        shell: bash
        run: |
          set -euo pipefail
          for name in PII_ENCRYPTION_KEY BANK_DATA_ENCRYPTION_KEY; do
            key=$(openssl rand -hex 32)
            echo "::add-mask::$key"
            echo "$name=$key" >> "$GITHUB_ENV"
          done
          secret="whsec_$(openssl rand -base64 32 | tr -d '\n')"
          echo "::add-mask::$secret"
          echo "RESEND_WEBHOOK_SECRET=$secret" >> "$GITHUB_ENV"
      - name: Create disposable PostgreSQL 16 schema
        run: npm run db:push
      - name: Apply reviewed isolated baseline to local app_db only
        run: node scripts/qa/apply-isolated-baseline.mjs
      - name: Prepare existing HCM fixture on local PG16 only
        run: node scripts/qa/prepare-hcm-work-item-fixture.mjs
      - name: Build production-mode localhost app, never deploy
        run: npm run build
      - name: Start localhost Next and fail if boot fails
        shell: bash
        run: |
          set -euo pipefail
          nohup npm start -- -H 127.0.0.1 > /tmp/tenant-wrk01-greedy-roster-next.log 2>&1 &
          server=$!
          for attempt in $(seq 1 60); do
            if curl --silent --fail "$SECURITY_SMOKE_URL/login" > /dev/null; then
              exit 0
            fi
            if ! kill -0 "$server" 2>/dev/null; then
              tail -n 100 /tmp/tenant-wrk01-greedy-roster-next.log
              exit 1
            fi
            sleep 2
          done
          echo "::error::Synthetic localhost server did not start"
          tail -n 100 /tmp/tenant-wrk01-greedy-roster-next.log
          exit 1
      - name: Exercise own populated GET, foreign victims, forged selectors and revoked membership
        run: node --import tsx scripts/qa/tenant-wrk01-greedy-roster-http.mjs
      - name: Show only local synthetic test server tail when something fails
        if: failure()
        run: tail -n 100 /tmp/tenant-wrk01-greedy-roster-next.log || true
