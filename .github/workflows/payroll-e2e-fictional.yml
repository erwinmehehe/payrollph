name: Fictional payroll E2E centavo and tenant acceptance (no money)
on:
  pull_request:
    branches: [main]
    paths:
      - "tests/payroll-e2e-fictional-*.test.ts"
      - "docs/qa/payroll-e2e-*.md"
      - "src/lib/payroll-engine.ts"
      - "src/lib/payroll-journal-export.ts"
      - ".github/workflows/payroll-e2e-fictional.yml"
permissions:
  contents: read
jobs:
  fictional-payroll:
    name: Disposable PG${{ matrix.postgres }} fictional payroll
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        postgres: [16, 18]
    env:
      TZ: Asia/Manila
      CI: "true"
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
      PAYMONGO_DISBURSEMENTS_ENABLED: "false"
      XENDIT_PAYOUTS_ENABLED: "false"
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Exact dependency install
        run: npm ci
      - name: Ephemeral fictional-test-only encryption keys (not provider keys)
        shell: bash
        run: |
          bank_key=$(openssl rand -hex 32)
          pii_key=$(openssl rand -hex 32)
          totp_key=$(openssl rand -hex 32)
          echo "::add-mask::$bank_key"
          echo "::add-mask::$pii_key"
          echo "::add-mask::$totp_key"
          echo "BANK_DATA_ENCRYPTION_KEY=$bank_key" >> "$GITHUB_ENV"
          echo "PII_ENCRYPTION_KEY=$pii_key" >> "$GITHUB_ENV"
          echo "TOTP_ENCRYPTION_KEY=$totp_key" >> "$GITHUB_ENV"
      - name: Create only disposable PG schema (NO repository migration)
        run: npm run db:push
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Targeted pure engine AND real PG integration acceptance
        run: npx tsx --test --test-concurrency=1 tests/payroll-e2e-fictional-pure.test.ts tests/payroll-e2e-fictional-postgres.test.ts
      - name: Exact full npm test inventory (PG16 only, one isolated service)
        if: matrix.postgres == 16
        run: npm test
