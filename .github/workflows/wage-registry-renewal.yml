      - name: Ephemeral encryption key for disposable CI only
        shell: bash
        run: |
          key=$(openssl rand -hex 32)
          echo "::add-mask::$key"
          echo "PII_ENCRYPTION_KEY=$key" >> "$GITHUB_ENV"
      - run: npm run db:push
      - name: Apply the cutover baseline objects (0109 audit chain + reviewed supplement); request code only verifies schema
        run: node scripts/qa/apply-isolated-baseline.mjs
      - run: npm run build
      - name: Start isolated production-mode localhost server
        shell: bash
        env:
          REPORT_BUILDER_UI_ENABLED: 'true'
