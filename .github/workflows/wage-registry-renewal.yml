  table__table:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        profile:
          - default
          - multi-entity
          - flagged-reads
          - allowlisted-reads
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - '5432:5432'
        options: '--health-cmd "pg_isready -U postgres -d app_db" --health-interval 5s --health-timeout 5s --health-retries 10'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact proposed renewal source
        env:
          WAGE_RENEWAL_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$WAGE_RENEWAL_EXPECTED_HEAD"
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validate offline-claim response contracts and negative controls
        if: matrix.profile == 'flagged-reads'
        run: |
          node --check scripts/qa/tenant-offline-claims-contract.mjs
          node --check scripts/qa/tenant-offline-claims-http.mjs
          node --check scripts/qa/tenant-offline-claims-standalone.mjs
          node --test tests/tenant-offline-claims-contract.test.mjs
      - name: Export the disposable profile environment (single source shared with the local runner)
        run: node scripts/qa/tenant-table-env.mjs "${{ matrix.profile }}" >> "$GITHUB_ENV"
      - name: Ephemeral encryption keys for disposable CI only
        shell: bash
        run: |
          for name in PII_ENCRYPTION_KEY BANK_DATA_ENCRYPTION_KEY; do
            key=$(openssl rand -hex 32)
            echo "::add-mask::$key"
            echo "$name=$key" >> "$GITHUB_ENV"
          done
          secret="whsec_$(openssl rand -base64 32 | tr -d '\n')"
          echo "::add-mask::$secret"
          echo "RESEND_WEBHOOK_SECRET=$secret" >> "$GITHUB_ENV"
      - run: npm run db:push
      - name: Apply the cutover baseline objects (0109 audit chain + reviewed supplement)
        run: node scripts/qa/apply-isolated-baseline.mjs
      - name: Prepare existing SQL-only HCM work-item events in the empty disposable database
        run: node scripts/qa/prepare-hcm-work-item-fixture.mjs
      - name: Preseed two attackers, the higher-ID victim and an excluded employer before server startup
        if: matrix.profile == 'allowlisted-reads'
        run: npx tsx scripts/qa/tenant-table-allowlist-bootstrap.mjs
      - name: Validate allowlist source contracts without database or service requests
        if: matrix.profile == 'allowlisted-reads'
        run: node --test tests/tenant-allowlist-reads.test.mjs
      - run: npm run build
      - name: Start isolated production-mode localhost server
        shell: bash
        run: |
          set -euo pipefail
          nohup npm start -- -H 127.0.0.1 > /tmp/tenant-table-server.log 2>&1 &
          for attempt in {1..40}; do
            if curl --silent --fail "$SECURITY_SMOKE_URL" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/tenant-table-server.log
          exit 1
      - name: Prove a real signed-in non-allowlisted fourth employer receives only 404
        if: matrix.profile == 'allowlisted-reads'
        run: npx tsx scripts/qa/tenant-table-allowlist-negative.mjs
      - name: Every table row, two attacker employers, own data proven and victim denied
        run: npx tsx scripts/qa/tenant-table-http.mjs
      - name: Every write row, two attacker employers, own write read back and victim denied
        env:
          TENANT_WRITE_TABLE_ALLOW_EMPTY_PROFILE: '1'
        run: npx tsx scripts/qa/tenant-write-table-http.mjs
      - name: Prove independent employee and owner offline-claim POST/PATCH tenant isolation
        if: matrix.profile == 'flagged-reads'
        run: npx tsx scripts/qa/tenant-offline-claims-standalone.mjs
      - name: Correction rollback, source binding and concurrent approval regressions
        if: matrix.profile == 'default'
        env:
          HCM_CORRECTION_PG: '1'
        run: npx tsx --test tests/hcm-effective-corrections-pg.test.mjs
      - name: Complete performance core actions with two attackers and immutable victim evidence
        if: matrix.profile == 'default'
        env:
          TENANT_PERFORMANCE_CORE_MODE: fictional-disposable-only
          WORKER_ENABLED: 'false'
          CENTRAL_SCHEDULER_ENABLED: 'false'
        run: env -u NODE_ENV npx tsx scripts/qa/tenant-performance-core-http.mjs
      - uses: actions/upload-artifact@v7
        if: always() && matrix.profile == 'default'
        with:
          name: tenant-performance-core-pg16
          path: outputs/performance-core-run.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Show isolated server log on failure
        if: failure()
        run: cat /tmp/tenant-table-server.log || true
    name: Wage renewal / table / table
