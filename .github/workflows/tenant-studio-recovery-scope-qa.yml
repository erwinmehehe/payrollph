name: Studio stored recovery scope (fictional PG16, no providers)
'on':
  pull_request:
    branches:
      - main
    paths:
      - 'src/lib/automation-recovery-scope.ts'
      - 'src/lib/automation-execution-recovery.ts'
      - 'scripts/qa/tenant-table-http.mjs'
      - 'scripts/qa/tenant-studio-source-resolution-proof.mjs'
      - .github/workflows/tenant-studio-recovery-scope-qa.yml
      - scripts/qa/tenant-studio-recovery-scope-*.mjs
      - tests/tenant-studio-recovery-scope-contract.test.mjs
      - docs/qa/tenant-studio-recovery-scope-proof.md
      - src/app/api/automation-studio/route.ts
      - src/lib/automation*.ts
      - src/lib/access.ts
      - src/lib/auth.ts
      - src/lib/security-request.ts
      - src/db/**
permissions:
  contents: read
concurrency:
  group: studio-recovery-scope-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  stored-recovery-scope:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: 'true'
      GITHUB_ACTIONS: 'true'
      TZ: Asia/Manila
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: '1'
      BUILD_BLOCK_ACCEPTANCE_MODE: synthetic-postgres-only
      TENANT_STUDIO_TRIAGE_PROOF: fictional-only
      TENANT_STUDIO_DRAFT_PROOF: fictional-pg16-only
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
      APP_BASE_URL: http://127.0.0.1:3000
      TRUSTED_APP_ORIGINS: http://127.0.0.1:3000
      SECURITY_SMOKE_URL: http://127.0.0.1:3000
      DEMO_MODE: 'false'
      REQUIRE_PRIVILEGED_MFA: 'true'
      WORKER_ENABLED: 'false'
      CENTRAL_SCHEDULER_ENABLED: 'false'
      PAYMONGO_DISBURSEMENTS_ENABLED: 'false'
      XENDIT_PAYOUTS_ENABLED: 'false'
      XENDIT_BILLING_ENABLED: 'false'
      FINAL_PAY_SIGNED_REVIEW_ENABLED: 'false'
      EXACT_THIRTEENTH_CENTAVOS_ENABLED: 'false'
      PAYROLL_CALCULATION_HISTORY_ENABLED: 'false'
      PAYMONGO_SECRET_KEY: ''
      PAYMONGO_WEBHOOK_SECRET: ''
      XENDIT_SECRET_KEY: ''
      XENDIT_PAYOUT_SECRET_KEY: ''
      XENDIT_CALLBACK_TOKEN: ''
      STRIPE_SECRET_KEY: ''
      RESEND_API_KEY: ''
      POSTMARK_SERVER_TOKEN: ''
      SMTP_PASSWORD: ''
      SMTP_URL: ''
      OPENAI_API_KEY: ''
      CRON_SECRET: ''
      WORKER_TOKEN: ''
      NEXT_CSP_ENABLED: 'false'
      TENANT_STUDIO_LANGUAGE_PROOF: fictional-disposable-only
      TENANT_STUDIO_RECOVERY_SCOPE_PROOF: fictional-pg16-only
      AUTOMATION_LANGUAGE_STUDIO_ENABLED: 'false'
      OPENAI_AUTOMATION_DRAFT_ENABLED: 'false'
      OPENAI_AUTOMATION_DPA_CONFIRMED: 'false'
      OPENAI_AUTOMATION_ZERO_RETENTION_CONFIRMED: 'false'
      OPENAI_AUTOMATION_NOTICE_CONFIRMED: 'false'
      OPENAI_AUTOMATION_APPROVED_ORG_IDS: ''
      MULTI_ENTITY_ENABLED: 'false'
      MALWARE_SCAN_URL: ''
      MALWARE_SCAN_TOKEN: ''
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - '5432:5432'
        options: '--health-cmd "pg_isready -U postgres -d app_db" --health-interval 5s --health-timeout 5s --health-retries 10'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Confirm exact PR head
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Install exact locked dependencies
        run: npm ci --include=dev
      - name: Fail-closed language proof preflight and negative controls
        run: |-
          node scripts/qa/tenant-studio-recovery-scope-http.mjs --preflight
          node --test tests/tenant-studio-recovery-scope-contract.test.mjs
      - name: Generate synthetic temporary encryption keys
        shell: bash
        run: |
          for key in BANK_DATA_ENCRYPTION_KEY PII_ENCRYPTION_KEY TOTP_ENCRYPTION_KEY; do
            value=$(openssl rand -hex 32)
            echo "::add-mask::$value"
            echo "$key=$value" >> "$GITHUB_ENV"
          done
      - name: Initialize disposable PostgreSQL 16 schema
        run: npm run db:push
      - name: Apply isolated baseline without production migration
        run: node scripts/qa/apply-isolated-baseline.mjs
      - name: Compile Next in production mode with all providers and workers off
        run: npm run build
      - name: Start localhost-only Next server
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/studio-draft-next.log 2>&1 &
          server=$!
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:3000/login > /dev/null; then exit 0; fi
            if ! kill -0 "$server" 2>/dev/null; then break; fi
            sleep 2
          done
          tail -n 100 /tmp/studio-draft-next.log
          exit 1
      - name: Prove all four safe actions, real linked sessions and foreign stored-reference refusals
        run: node --import tsx scripts/qa/tenant-studio-recovery-scope-http.mjs
      - name: Display bounded localhost diagnostics on failure
        if: failure()
        run: tail -n 120 /tmp/studio-draft-next.log || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tenant-studio-recovery-scope-receipt
          path: qa-artifacts/tenant-studio-recovery-scope.json
          if-no-files-found: error
          retention-days: 7
