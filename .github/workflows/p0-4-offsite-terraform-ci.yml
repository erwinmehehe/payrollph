name: P0-4 Offsite Recovery Terraform Validation (No AWS Access)

on:
  pull_request:
    paths:
      - "infra/p0-4-offsite/**"
      - ".github/workflows/p0-4-offsite-terraform-ci.yml"
  push:
    branches: [main]
    paths:
      - "infra/p0-4-offsite/**"
      - ".github/workflows/p0-4-offsite-terraform-ci.yml"

# Supersede only older PR attempts; main/manual runs retain independent groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  terraform-syntax-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/p0-4-offsite
    steps:
      - name: Checkout exactly submitted source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned Terraform CLI, never AWS keys
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.2
          terraform_wrapper: false
      - name: Initialize providers with no remote state or credentials
        run: terraform init -backend=false -input=false -no-color
      - name: Validate only, never plan or apply
        run: terraform validate -no-color
      - name: Check local operator script shell syntax
        run: bash -n ./*.sh

# No AWS actions/credentials, sensitive data, Terraform plan or production writes.
