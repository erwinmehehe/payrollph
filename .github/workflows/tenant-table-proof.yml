name: Tenant table proof (fictional PostgreSQL, real HTTP, no money)

# One shared job for every table-credited organization-scoped read. Rows live in
# scripts/qa/tenant-table-http.mjs; server flags per profile live in scripts/qa/tenant-table-env.mjs,
# which the local runner reads too, so a row is proven under the same flags wherever it is credited.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
    branches: [main]
    paths:
      - '.github/workflows/tenant-table-proof.yml'
      - 'scripts/qa/tenant-table-http.mjs'
      - 'scripts/qa/tenant-read-recovery-*.mjs'
      - 'tests/tenant-read-gap-recovery.test.mjs'
      - 'scripts/qa/tenant-write-table-http.mjs'
      - 'scripts/qa/tenant-performance-development-actions.mjs'
      - 'tests/tenant-performance-development.test.mjs'
      - 'scripts/qa/tenant-table-env.mjs'
      - 'scripts/qa/tenant-table-allowlist-bootstrap.mjs'
      - 'scripts/qa/tenant-table-allowlist-negative.mjs'
      - 'scripts/qa/tenant-table-invariants.mjs'
      - 'scripts/qa/tenant-table-loader.mjs'
      - 'scripts/qa/tenant-table-catalog.mjs'
      - 'scripts/qa/tenant-table-rows/**'
      - 'scripts/qa/prepare-hcm-work-item-fixture.mjs'
      - 'drizzle/0104_hcm_work_item_sla.sql'
      - 'tests/tenant-table-families.test.mjs'
      - 'tests/tenant-table-invariants.test.mjs'
      - 'tests/tenant-allowlist-reads.test.mjs'
      - 'tests/hcm-effective-correction*'
      - 'scripts/qa/tenant-isolation-coverage-manifest.json'
      - 'src/app/api/**'
      - 'src/lib/**'
      - 'src/db/**'

permissions:
  contents: read

concurrency:
  group: tenant-table-proof-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  table:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        profile: [default, multi-entity, flagged-reads, allowlisted-reads]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Export the disposable profile environment (single source shared with the local runner)
        run: node scripts/qa/tenant-table-env.mjs "${{ matrix.profile }}" >> "$GITHUB_ENV"
      - name: Ephemeral encryption keys for disposable CI only
        shell: bash
        run: |
          for name in PII_ENCRYPTION_KEY BANK_DATA_ENCRYPTION_KEY; do
            key=$(openssl rand -hex 32)
            echo "::add-mask::$key"
            echo "$name=$key" >> "$GITHUB_ENV"
          done
          secret="whsec_$(openssl rand -base64 32 | tr -d '\n')"
          echo "::add-mask::$secret"
          echo "RESEND_WEBHOOK_SECRET=$secret" >> "$GITHUB_ENV"
      - run: npm run db:push
      - name: Apply the cutover baseline objects (0109 audit chain + reviewed supplement)
        run: node scripts/qa/apply-isolated-baseline.mjs
      - name: Prepare existing SQL-only HCM work-item events in the empty disposable database
        run: node scripts/qa/prepare-hcm-work-item-fixture.mjs
      - name: Preseed two attackers, the higher-ID victim and an excluded employer before server startup
        if: matrix.profile == 'allowlisted-reads'
        run: npx tsx scripts/qa/tenant-table-allowlist-bootstrap.mjs
      - name: Validate allowlist source contracts without database or service requests
        if: matrix.profile == 'allowlisted-reads'
        run: node --test tests/tenant-allowlist-reads.test.mjs
      - run: npm run build
      - name: Start isolated production-mode localhost server
        shell: bash
        run: |
          set -euo pipefail
          nohup npm start -- -H 127.0.0.1 > /tmp/tenant-table-server.log 2>&1 &
          for attempt in {1..40}; do
            if curl --silent --fail "$SECURITY_SMOKE_URL" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/tenant-table-server.log
          exit 1
      - name: Prove a real signed-in non-allowlisted fourth employer receives only 404
        if: matrix.profile == 'allowlisted-reads'
        run: npx tsx scripts/qa/tenant-table-allowlist-negative.mjs
      - name: Every table row, two attacker employers, own data proven and victim denied
        run: npx tsx scripts/qa/tenant-table-http.mjs
      - name: Every write row, two attacker employers, own write read back and victim denied
        env:
          TENANT_WRITE_TABLE_ALLOW_EMPTY_PROFILE: "1"
        run: npx tsx scripts/qa/tenant-write-table-http.mjs
      - name: Correction rollback, source binding and concurrent approval regressions
        if: matrix.profile == 'default'
        env:
          HCM_CORRECTION_PG: "1"
        run: npx tsx --test tests/hcm-effective-corrections-pg.test.mjs
      - name: Show isolated server log on failure
        if: failure()
        run: cat /tmp/tenant-table-server.log || true
