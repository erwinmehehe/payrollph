name: Workspace avatar element QA

on:
  push:
    branches:
      - fix/workspace-avatar-element

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
      DEMO_MODE: "false"
      APP_BASE_URL: http://127.0.0.1:3000
      PG_POOL_MAX: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Apply schema
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const { Client } = require("pg");
          (async () => {
            const client = new Client({ connectionString: process.env.DATABASE_URL });
            await client.connect();
            await client.query(fs.readFileSync("drizzle/baseline.sql", "utf8"));
            await client.end();
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
      - run: npx tsc --noEmit
      - run: npx eslint src tests
      - run: npm run build
      - name: Start app
        run: |
          npm start > /tmp/linaw-next.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/linaw-next.log
          exit 1
      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify full initials and dedicated avatar element
        run: |
          mkdir -p avatar-element-qa
          node <<'NODE'
          const { chromium } = require("playwright");
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1270, height: 830 } });
            await page.goto("http://127.0.0.1:3000/", { waitUntil: "networkidle" });

            const preview = page.locator("#preview");
            await preview.getByRole("button", { name: "Time", exact: true }).click();

            const avatars = preview.locator(".person-cell > .avatar");
            const texts = await avatars.allTextContents();
            const expected = ["TD","MS","JR","AV","TD","KD"];
            if (JSON.stringify(texts) !== JSON.stringify(expected)) {
              throw new Error(`Avatar initials mismatch: ${JSON.stringify(texts)}`);
            }

            for (let i = 0; i < expected.length; i++) {
              const result = await avatars.nth(i).evaluate((el) => {
                const rect = el.getBoundingClientRect();
                const s = getComputedStyle(el);
                return {
                  tag: el.tagName,
                  text: el.textContent,
                  width: rect.width,
                  height: rect.height,
                  display: s.display,
                  placeItems: s.placeItems,
                  overflow: s.overflow,
                };
              });
              if (result.tag !== "DIV") throw new Error(`Avatar is still a generic span: ${JSON.stringify(result)}`);
              if (result.width < 29 || result.height < 29) throw new Error(`Avatar too small: ${JSON.stringify(result)}`);
              if (result.display !== "grid") throw new Error(`Avatar not grid-centered: ${JSON.stringify(result)}`);
              if (result.overflow === "hidden") throw new Error(`Avatar still clipped: ${JSON.stringify(result)}`);
            }

            await preview.screenshot({ path: "avatar-element-qa/time.png" });
            await browser.close();
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-avatar-element-qa
          path: avatar-element-qa/
          retention-days: 1
