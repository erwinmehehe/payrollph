name: Overpayment preview tenant HTTP (fictional PG16, no deductions)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - '.github/workflows/tenant-overpayment-preview-http.yml'
      - 'scripts/qa/tenant-overpayment-preview-*.mjs'
      - 'tests/tenant-overpayment-preview-contract.test.mjs'
      - 'src/app/api/payroll-overpayment-preview/**'
      - 'src/lib/payroll-overpayment-preview*.ts'
      - 'src/lib/access.ts'
      - 'src/lib/auth.ts'
      - 'src/lib/security-request.ts'
      - 'src/db/**'
      - 'scripts/qa/tenant-table-http.mjs'
      - 'scripts/qa/tenant-table-invariants.mjs'
      - 'scripts/qa/tenant-table-env.mjs'
      - 'scripts/qa/apply-isolated-baseline.mjs'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  overpayment-tenant:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      WORKER_ENABLED: "false"
      CENTRAL_SCHEDULER_ENABLED: "false"
      # The real route is default-off everywhere else; only ephemeral PG16
      # CI enables this synthetic read-only review flag.
      HCM_OVERPAYMENT_PREVIEW_ENABLED: "true"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Export disposable-only production-mode localhost configuration
        run: node scripts/qa/tenant-table-env.mjs default >> "$GITHUB_ENV"
      - name: Validate pure centavo/tenant contract and exact source identity
        run: |
          node --check scripts/qa/tenant-overpayment-preview-contract.mjs
          node --check scripts/qa/tenant-overpayment-preview-http.mjs
          node --check tests/tenant-overpayment-preview-contract.test.mjs
          node --test tests/tenant-overpayment-preview-contract.test.mjs
      - name: Generate disposable crypto inputs without live-provider access
        shell: bash
        run: |
          set -euo pipefail
          for name in PII_ENCRYPTION_KEY BANK_DATA_ENCRYPTION_KEY; do
            key=$(openssl rand -hex 32)
            echo "::add-mask::$key"
            echo "$name=$key" >> "$GITHUB_ENV"
          done
          secret="whsec_$(openssl rand -base64 32 | tr -d '\n')"
          echo "::add-mask::$secret"
          echo "RESEND_WEBHOOK_SECRET=$secret" >> "$GITHUB_ENV"
      - name: Create completely disposable PostgreSQL 16 schema
        run: npm run db:push
      - name: Install approved isolated SQL baseline only
        run: node scripts/qa/apply-isolated-baseline.mjs
      - name: Build actual production-mode Next server for localhost only
        run: npm run build
      - name: Start isolated Next on localhost
        shell: bash
        run: |
          set -euo pipefail
          nohup npm start -- -H 127.0.0.1 > /tmp/overpayment-tenant-next.log 2>&1 &
          for attempt in {1..50}; do
            if curl --silent --fail "$SECURITY_SMOKE_URL" > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/overpayment-tenant-next.log
          exit 1
      - name: Prove two real attacker sources, higher-ID victim, foreign IDs and unchanged payroll
        run: node --import tsx scripts/qa/tenant-overpayment-preview-http.mjs
      - name: Show isolated server output only on failure
        if: failure()
        run: cat /tmp/overpayment-tenant-next.log || true
