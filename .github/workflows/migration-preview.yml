name: Migration preview screenshot

on:
  push:
    branches:
      - feat/migration-center-competitors-sep29
    paths:
      - ".github/workflows/migration-preview.yml"
      - "scripts/capture-migration-preview.mjs"
      - "src/components/migration-center.tsx"
      - "src/components/linaw-workspace.tsx"
      - "src/components/workspace/nav.ts"
      - "src/lib/migration-import.ts"
      - "src/app/api/migrations/route.ts"
      - "src/db/schema.ts"
      - "src/lib/year-end.ts"

jobs:
  screenshot:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
      DEMO_MODE: "true"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run db:push
      - name: Start app
        run: |
          npm run dev -- --hostname 127.0.0.1 > /tmp/payrollph-next.log 2>&1 &
          echo $! > /tmp/payrollph-next.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/login >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/payrollph-next.log
          exit 1
      - name: Create owner demo session
        run: |
          curl -fsS -c /tmp/payrollph-cookies.txt \
            -H 'Content-Type: application/json' \
            -d '{"role":"owner"}' \
            http://127.0.0.1:3000/api/auth/demo-switch > /tmp/demo-session.json
          cat /tmp/demo-session.json
          TOKEN="$(awk '$6 == "linaw_session" { print $7 }' /tmp/payrollph-cookies.txt | tail -n 1)"
          test -n "$TOKEN"
          echo "LINAW_SESSION=$TOKEN" >> "$GITHUB_ENV"
      - name: Start headless Chrome
        run: |
          google-chrome \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --remote-debugging-address=127.0.0.1 \
            --remote-debugging-port=9222 \
            --user-data-dir=/tmp/payrollph-chrome \
            about:blank > /tmp/payrollph-chrome.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:9222/json/version >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/payrollph-chrome.log
          exit 1
      - name: Capture latest Migration Center
        run: node scripts/capture-migration-preview.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: migration-center-preview
          path: migration-center-preview.png
          retention-days: 3
