name: Security PR repair candidate
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ['.github/workflows/repair-security-pr-candidate.yml', 'scripts/qa/repair-security-pr-candidate.mjs']
permissions:
  contents: read
jobs:
  inspect:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.number == 1303 && github.head_ref == 'fix/fail-closed-compliance-reads-20261020'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Package pinned source and installed dependencies without credentials
        run: |
          mkdir -p /tmp/security-repair-source
          git -c credential.helper= fetch --quiet --depth=1 https://github.com/erwinmehehe/payrollph.git acd76b7e0ae546e8519d4084ccf926d87373fb61 72a74254d78c5fb57f9a1a451a97f4c5cebb6679
          git archive acd76b7e0ae546e8519d4084ccf926d87373fb61 | gzip > /tmp/security-repair-source/pr1302.tar.gz
          git archive 72a74254d78c5fb57f9a1a451a97f4c5cebb6679 | gzip > /tmp/security-repair-source/pr1303.tar.gz
          tar czf /tmp/security-repair-source/node_modules.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: security-repair-pinned-sources
          path: /tmp/security-repair-source/*.tar.gz
          retention-days: 1
          if-no-files-found: error
