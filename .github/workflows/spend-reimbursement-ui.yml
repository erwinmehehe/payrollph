name: Reimbursement Component Acceptance (No Money)
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/spend*'
      - 'tests/fixtures/spend-reimbursement-browser.jsx'
      - 'scripts/qa/spend*'
      - '.github/workflows/spend-reimbursement-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: spend-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  component-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Manila
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
      SPEND_PAYROLL_REIMBURSEMENTS_ENABLED: 'false'
      EMPLOYEE_DOCUMENT_VAULT_ENABLED: 'false'
      DOCUMENT_UPLOADS_ENABLED: 'false'
      DEMO_MODE: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/qa/spend-flag-off-parity.mjs
      - run: npm install --no-save --ignore-scripts --package-lock=false playwright@1.62.1
      - run: timeout 240s npx playwright install --only-shell chromium
      - run: node scripts/qa/spend-browser.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: spend-component-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            qa-artifacts/spend-*.png
            qa-artifacts/spend-browser-report.json
            qa-artifacts/spend-off-parity.json
          retention-days: 14
