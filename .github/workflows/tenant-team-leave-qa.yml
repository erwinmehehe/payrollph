name: Tenant HCM Team Leave Calendar (Fictional PG16, Read Only)

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/tenant-team-leave-qa.yml"
      - "scripts/qa/tenant-team-leave-contract.mjs"
      - "scripts/qa/tenant-team-leave-http.mjs"
      - "tests/tenant-team-leave-contract.test.mjs"
      - "docs/qa/tenant-team-leave-batch.md"
      - "src/app/hcm/team-leave-calendar/page.tsx"
      - "src/app/api/hcm/team-leave-calendar/route.ts"
      - "src/lib/hcm-team-leave-calendar-server.ts"
      - "src/lib/hcm-team-leave-calendar-contract.ts"
      - "src/components/hcm-team-leave-calendar.tsx"
      - "src/lib/hcm-scoped-read-validation.ts"
      - "src/lib/hcm-scoped-read-failure.ts"
      - "src/lib/hcm-read-scope-validation.ts"
      - "src/lib/access.ts"
      - "src/lib/auth.ts"
      - "src/lib/permissions.ts"
      - "src/lib/organization-auth-policy.ts"
      - "src/db/schema.ts"
      - "scripts/qa/tenant-table-http.mjs"
      - "src/lib/critical-release-flags.ts"
      - "tests/tenant-hcm-page-api-ci-coverage.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tenant-team-leave:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: "true"
      GITHUB_ACTIONS: "true"
      TZ: Asia/Manila
      NEXT_TELEMETRY_DISABLED: "1"
      BUILD_BLOCK_ACCEPTANCE_MODE: synthetic-postgres-only
      TENANT_TEAM_LEAVE_PROOF: fictional-pg16-only
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
      APP_BASE_URL: http://127.0.0.1:3000
      SECURITY_SMOKE_URL: http://127.0.0.1:3000
      TRUSTED_APP_ORIGINS: http://127.0.0.1:3000
      DEMO_MODE: "false"
      REQUIRE_PRIVILEGED_MFA: "true"
      WORKER_ENABLED: "false"
      CENTRAL_SCHEDULER_ENABLED: "false"
      HCM_TEAM_LEAVE_CALENDAR_ENABLED: "true"
      HCM_TEAM_LEAVE_CALENDAR_ORG_IDS: "1,2,3"
      PAYMONGO_DISBURSEMENTS_ENABLED: "false"
      XENDIT_PAYOUTS_ENABLED: "false"
      XENDIT_BILLING_ENABLED: "false"
      FINAL_PAY_SIGNED_REVIEW_ENABLED: "false"
      EXACT_THIRTEENTH_CENTAVOS_ENABLED: "false"
      PAYROLL_CALCULATION_HISTORY_ENABLED: "false"
      OPENAI_API_KEY: ""
      CRON_SECRET: ""
      WORKER_TOKEN: ""
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Require exact PR head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Fail-closed environment, source pins and negative-control tests
        run: |
          node --check scripts/qa/tenant-team-leave-contract.mjs
          node --check scripts/qa/tenant-team-leave-http.mjs
          node --test tests/tenant-team-leave-contract.test.mjs
          node --test tests/tenant-hcm-page-api-ci-coverage.test.mjs
      - name: Create ephemeral encryption keys for fictional schema only
        shell: bash
        run: |
          for key in BANK_DATA_ENCRYPTION_KEY PII_ENCRYPTION_KEY TOTP_ENCRYPTION_KEY; do
            value=$(openssl rand -hex 32)
            echo "::add-mask::$value"
            echo "$key=$value" >> "$GITHUB_ENV"
          done
      - name: Provision disposable PostgreSQL 16 schema
        run: npm run db:push
      - name: Apply reviewed local-only schema baseline
        run: node scripts/qa/apply-isolated-baseline.mjs
      - name: Build production-mode app with feature enabled for three disposable tenants only
        run: npm run build
      - name: Start localhost-only Next server
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/tenant-team-leave.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:3000/login > /dev/null; then exit 0; fi
            sleep 2
          done
          tail -n 80 /tmp/tenant-team-leave.log
          exit 1
      - name: Execute own, foreign, manager-unit and SQL-immutability proof
        env:
          NODE_ENV: production
        run: node --import tsx scripts/qa/tenant-team-leave-http.mjs
      - name: Show bounded local application logs on failure
        if: failure()
        run: tail -n 80 /tmp/tenant-team-leave.log || true
