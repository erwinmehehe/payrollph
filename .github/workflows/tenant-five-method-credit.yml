name: Tenant five-method source-pin and repin (no DB)
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/qa/tenant-isolation-coverage-manifest.json
      - scripts/qa/tenant-five-method-credit-verify.mjs
      - tests/tenant-five-method-credit-verify.test.mjs
      - docs/engineering/tenant-isolation-closure-plan.md
      - docs/engineering/tenant-isolation-coverage-inventory.md
      - .github/workflows/tenant-five-method-credit.yml

permissions:
  contents: read

# Supersede only outdated PR heads, not main or manual audit runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  solo-pg16-credit-reconciliation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WORKER_ENABLED: "false"
      CENTRAL_SCHEDULER_ENABLED: "false"
      MULTI_ENTITY_TRANSFERS_ENABLED: "false"
      XENDIT_PAYOUTS_ENABLED: "false"
      XENDIT_BILLING_ENABLED: "false"
      NEXT_CSP_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Re-fetch origin/main for source-ledger comparison
        run: git fetch --no-tags origin main
      - name: Verify current route/proof/workflow Git blobs, anchored evidence, and counts
        run: node --test tests/tenant-five-method-credit-verify.test.mjs
      - name: Run manifest repin tooling, refuse uncited drift
        run: |
          node scripts/qa/tenant-manifest-repin.mjs --base origin/main --write
          git diff --exit-code -- scripts/qa/tenant-isolation-coverage-manifest.json docs/engineering/tenant-isolation-coverage-inventory.md
          node scripts/qa/tenant-manifest-repin.mjs --base origin/main
      - name: Check three immutable method credits, historic Worker 360 and all new page receipts
        shell: bash
        run: |
          set -euo pipefail
          if node -e 'const m=require("./scripts/qa/tenant-isolation-coverage-manifest.json"); if(m.scopedPages.filter(p=>p.status==="COVERED").length!==10) process.exit(1)'; then
            node scripts/qa/tenant-five-scoped-page-credit.mjs --check
            node scripts/qa/tenant-five-scoped-page-credit.mjs --verify-historical-worker360
          else
            # A six-page candidate ledger is NOT the historical Worker360
            # ledger. Verify all six exact source/HTTP anchors first, then
            # reconstruct the reviewed 10/11 and 5/16 historical views for
            # the original immutable three-method source-credit verifier.
            node scripts/qa/tenant-six-scoped-page-credit.mjs --check
            node --input-type=module -e '
              import assert from "node:assert/strict";
              import { readFileSync } from "node:fs";
              import { verifySixPageCredits, historicSixPageView, selectedTargets } from "./scripts/qa/tenant-six-scoped-page-credit.mjs";
              import { historicWorker360ProofView } from "./scripts/qa/tenant-five-scoped-page-credit.mjs";
              import { verifyFiveMethodCredits } from "./scripts/qa/tenant-five-method-credit-verify.mjs";
              const manifest = JSON.parse(readFileSync("scripts/qa/tenant-isolation-coverage-manifest.json", "utf8"));
              assert.equal(verifySixPageCredits(manifest), selectedTargets().length);
              const historical = historicWorker360ProofView(historicSixPageView(manifest));
              const verified = verifyFiveMethodCredits(historical);
              assert.equal(verified.pageActionGaps, 16);
              assert.equal(verified.independentlyAccepted, false);
              assert.equal(verified.productionTested, false);
              console.log("Historic three-method and Worker 360 receipts remain intact; six new pages are provisional only.");
            '
          fi
