name: Tenant five-method source-pin and repin (no DB)
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/qa/tenant-isolation-coverage-manifest.json
      - scripts/qa/tenant-five-method-credit-verify.mjs
      - tests/tenant-five-method-credit-verify.test.mjs
      - docs/engineering/tenant-isolation-closure-plan.md
      - docs/engineering/tenant-isolation-coverage-inventory.md
      - .github/workflows/tenant-five-method-credit.yml

permissions:
  contents: read

# Supersede only outdated PR heads, not main or manual audit runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  solo-pg16-credit-reconciliation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WORKER_ENABLED: "false"
      CENTRAL_SCHEDULER_ENABLED: "false"
      MULTI_ENTITY_TRANSFERS_ENABLED: "false"
      XENDIT_PAYOUTS_ENABLED: "false"
      XENDIT_BILLING_ENABLED: "false"
      NEXT_CSP_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Re-fetch origin/main for source-ledger comparison
        run: git fetch --no-tags origin main
      - name: Verify current route/proof/workflow Git blobs, anchored evidence, and counts
        run: node --test tests/tenant-five-method-credit-verify.test.mjs
      - name: Run manifest repin tooling, refuse uncited drift
        run: |
          node scripts/qa/tenant-manifest-repin.mjs --base origin/main --write
          git diff --exit-code -- scripts/qa/tenant-isolation-coverage-manifest.json docs/engineering/tenant-isolation-coverage-inventory.md
          node scripts/qa/tenant-manifest-repin.mjs --base origin/main
      - name: Check three credits, two explicit GAPs and no production acceptance
        run: node scripts/qa/tenant-five-method-credit-verify.mjs
