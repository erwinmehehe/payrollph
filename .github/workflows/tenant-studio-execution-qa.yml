name: Tenant Studio Execution Recovery (fictional PG16 HTTP; zero credits)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - ".github/workflows/tenant-studio-execution-qa.yml"
      - "scripts/qa/tenant-studio-execution-contract.mjs"
      - "scripts/qa/tenant-studio-execution-http.mjs"
      - "tests/tenant-studio-execution-contract.test.mjs"
      - "docs/qa/tenant-studio-execution-proof-20261110.md"
      - "src/app/api/automation-studio/route.ts"
      - "src/lib/automation.ts"
      - "src/lib/automation-operational-cases.ts"
      - "src/lib/automation-language-release.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tenant-studio-execution-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  studio-execution:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      GITHUB_ACTIONS: "true"
      TZ: Asia/Manila
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      BUILD_BLOCK_ACCEPTANCE_MODE: synthetic-postgres-only
      TENANT_STUDIO_TRIAGE_PROOF: fictional-only
      TENANT_STUDIO_DRAFT_PROOF: fictional-pg16-only
      TENANT_STUDIO_EXECUTION_PROOF: fictional-pg16-only
      AUTOMATION_LANGUAGE_STUDIO_ENABLED: "false"
      OPENAI_AUTOMATION_DRAFT_ENABLED: "false"
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
      APP_BASE_URL: http://127.0.0.1:3000
      TRUSTED_APP_ORIGINS: http://127.0.0.1:3000
      SECURITY_SMOKE_URL: http://127.0.0.1:3000
      DEMO_MODE: "false"
      REQUIRE_PRIVILEGED_MFA: "true"
      WORKER_ENABLED: "false"
      CENTRAL_SCHEDULER_ENABLED: "false"
      PAYMONGO_DISBURSEMENTS_ENABLED: "false"
      XENDIT_PAYOUTS_ENABLED: "false"
      XENDIT_BILLING_ENABLED: "false"
      FINAL_PAY_SIGNED_REVIEW_ENABLED: "false"
      EXACT_THIRTEENTH_CENTAVOS_ENABLED: "false"
      PAYROLL_CALCULATION_HISTORY_ENABLED: "false"
      PAYMONGO_SECRET_KEY: ""
      PAYMONGO_WEBHOOK_SECRET: ""
      XENDIT_SECRET_KEY: ""
      XENDIT_PAYOUT_SECRET_KEY: ""
      XENDIT_CALLBACK_TOKEN: ""
      STRIPE_SECRET_KEY: ""
      RESEND_API_KEY: ""
      POSTMARK_SERVER_TOKEN: ""
      SMTP_PASSWORD: ""
      SMTP_URL: ""
      OPENAI_API_KEY: ""
      CRON_SECRET: ""
      WORKER_TOKEN: ""
      NEXT_CSP_ENABLED: "false"

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Confirm exact pull request head
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install pinned application and test dependencies
        run: npm ci --include=dev
      - name: Reject unsafe targets and run denial/positive contracts
        run: |
          node --check scripts/qa/tenant-studio-execution-contract.mjs
          node --check scripts/qa/tenant-studio-execution-http.mjs
          node --test tests/tenant-studio-execution-contract.test.mjs
      - name: Generate ephemeral fictional encryption keys
        shell: bash
        run: |
          for key in BANK_DATA_ENCRYPTION_KEY PII_ENCRYPTION_KEY TOTP_ENCRYPTION_KEY; do
            value=$(openssl rand -hex 32)
            echo "::add-mask::$value"
            echo "$key=$value" >> "$GITHUB_ENV"
          done
      - name: Create fresh disposable PostgreSQL 16 schema
        run: npm run db:push
      - name: Apply reviewed fictional test baseline
        run: node scripts/qa/apply-isolated-baseline.mjs
      - name: Build production-mode localhost Next application
        run: npm run build
      - name: Start isolated localhost server
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/studio-execution-next.log 2>&1 &
          server=$!
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:3000/login > /dev/null; then exit 0; fi
            if ! kill -0 "$server" 2>/dev/null; then break; fi
            sleep 2
          done
          tail -n 100 /tmp/studio-execution-next.log
          exit 1
      - name: Prove quarantine, review transitions, safe retry/replay and immutable foreign tenants
        run: node --import tsx scripts/qa/tenant-studio-execution-http.mjs
      - name: Display bounded localhost diagnostics on failure
        if: failure()
        run: tail -n 100 /tmp/studio-execution-next.log || true
