name: WFM Historical Demand Outlook QA

on:
  push:
    branches:
      - feat/wfm-historical-staffing-outlook-backtest-20261011
  pull_request:
    paths:
      - "src/lib/workforce-demand-outlook.ts"
      - "src/lib/workforce-demand-outlook-scope.ts"
      - "src/app/api/workforce/demand-outlook/route.ts"
      - "src/components/workspace/workforce-demand-outlook-panel.tsx"
      - "src/components/workspace/workforce-coverage-panel.tsx"
      - "tests/workforce-demand-outlook.test.ts"
      - ".github/workflows/wfm-historical-demand-outlook-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forecasting-source-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: Asia/Manila
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Lint and baseline warning budget
        run: npm run lint
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Historical staffing regression evidence
        run: npx tsx --test --test-concurrency=1 tests/workforce-demand-outlook.test.ts tests/workforce-calibration-rest-optimization.test.ts
      - name: Source size policy
        run: npm run source:size:check
      - name: Next production build
        run: npm run build
