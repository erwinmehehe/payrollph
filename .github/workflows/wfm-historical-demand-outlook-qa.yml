name: WFM Historical Demand Outlook QA

on:
  push:
    branches:
      - feat/wfm-historical-staffing-outlook-backtest-20261011
  pull_request:
    paths:
      - "src/lib/workforce-demand-outlook.ts"
      - "src/lib/workforce-demand-outlook-scope.ts"
      - "src/app/api/workforce/demand-outlook/route.ts"
      - "src/components/workspace/workforce-demand-outlook-panel.tsx"
      - "src/components/workspace/workforce-coverage-panel.tsx"
      - "tests/workforce-demand-outlook.test.ts"
      - ".github/workflows/wfm-historical-demand-outlook-qa.yml"
  workflow_dispatch:

# Supersede only older PR attempts; main/manual runs retain independent groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  forecasting-source-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: Asia/Manila
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Ephemeral encryption key for isolated synthetic tests
        shell: bash
        run: |
          bank_key=$(openssl rand -hex 32)
          pii_key=$(openssl rand -hex 32)
          echo "::add-mask::$bank_key"
          echo "::add-mask::$pii_key"
          echo "BANK_DATA_ENCRYPTION_KEY=$bank_key" >> "$GITHUB_ENV"
          echo "PII_ENCRYPTION_KEY=$pii_key" >> "$GITHUB_ENV"
      - name: Initialize disposable PostgreSQL schema
        run: npm run db:push
      - name: Lint and baseline warning budget
        run: npm run lint
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Historical staffing regression evidence
        run: npx tsx --test --test-concurrency=1 tests/workforce-demand-outlook.test.ts tests/workforce-calibration-rest-optimization.test.ts
      - name: Source size policy
        run: npm run source:size:check
      - name: Next production build
        run: npm run build
