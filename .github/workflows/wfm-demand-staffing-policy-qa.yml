name: WFM Staffing Policy Governance QA
on:
  pull_request:
    paths:
      - "src/lib/workforce-demand-staffing-policy*.ts"
      - "src/app/api/workforce/demand-staffing/policies/**"
      - "src/components/workspace/workforce-demand-staffing*.tsx"
      - "src/components/workspace/workforce-coverage-panel.tsx"
      - "src/db/schema.ts"
      - "drizzle/0114_wfm_demand_staffing_policies.sql"
      - "tests/workforce-demand-staffing-policy*.test.ts"
      - "tests/fixtures/wfm-staffing-policy-browser.jsx"
      - "scripts/wfm-staffing-policy-browser.mjs"
      - ".github/workflows/wfm-demand-staffing-policy-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TZ: Asia/Manila
      CI: "true"
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Pinned ESLint baseline
        run: npm run lint
      - name: TypeScript exact head
        run: npx tsc --noEmit
      - name: Synthetic-only encryption key
        shell: bash
        run: |
          bank_key=$(openssl rand -hex 32)
          pii_key=$(openssl rand -hex 32)
          echo "::add-mask::$bank_key"
          echo "::add-mask::$pii_key"
          echo "BANK_DATA_ENCRYPTION_KEY=$bank_key" >> "$GITHUB_ENV"
          echo "PII_ENCRYPTION_KEY=$pii_key" >> "$GITHUB_ENV"
      - name: Create disposable Postgres schema
        run: npm run db:push
      - name: Apply the cutover baseline objects (0109 audit chain + reviewed supplement); request code only verifies schema
        run: node scripts/qa/apply-isolated-baseline.mjs
      - name: Pure rules and independent database policy lifecycle
        run: npx tsx --test --test-concurrency=1 tests/workforce-demand-staffing-policy.test.ts tests/workforce-demand-staffing-policy-db.test.ts
      - name: Source size policy
        run: npm run source:size:check
      - name: Production build
        run: npm run build
      - name: Install isolated browser dependencies
        run: npm install --no-save --ignore-scripts playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Synthetic manager and policy admin browser acceptance
        run: node scripts/wfm-staffing-policy-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wfm-staffing-policy-qa
          path: qa-artifacts/
          retention-days: 7
