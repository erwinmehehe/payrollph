name: Tenant Report Builder POST JSON and CSV (Fictional PG16, Zero Credit)

on:
  pull_request:
    branches: [main]
    paths:
      - "src/app/api/reports/builder/**"
      - "src/lib/tenant-report-builder*.ts"
      - "src/lib/access.ts"
      - "src/lib/auth.ts"
      - "src/lib/permissions.ts"
      - "src/lib/organization-auth-policy.ts"
      - "src/lib/security-request.ts"
      - "src/lib/bi-exports.ts"
      - "src/lib/csv.ts"
      - "src/lib/audit.ts"
      - "src/lib/rate-limit.ts"
      - "src/db/index.ts"
      - "src/lib/pg-tls-policy.ts"
      - "scripts/qa/apply-isolated-baseline.mjs"
      - "scripts/qa/tenant-isolation-coverage-manifest.json"
      - "package.json"
      - "package-lock.json"
      - "src/lib/critical-release-flags.ts"
      - "src/db/schema.ts"
      - "scripts/qa/tenant-table-http.mjs"
      - "scripts/qa/tenant-report-builder-export-*.mjs"
      - "tests/tenant-report-builder-export-contract.test.mjs"
      - ".github/workflows/tenant-report-builder-export-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  report-builder-export-http:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: "true"
      TZ: Asia/Manila
      BUILD_BLOCK_ACCEPTANCE_MODE: synthetic-postgres-only
      TENANT_REPORT_EXPORT_PROOF: fictional-pg16-only
      TENANT_REPORT_BUILDER_ENABLED: "true"
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
      APP_BASE_URL: http://127.0.0.1:3000
      TRUSTED_APP_ORIGINS: http://127.0.0.1:3000
      DEMO_MODE: "false"
      REQUIRE_PRIVILEGED_MFA: "true"
      WORKER_ENABLED: "false"
      CENTRAL_SCHEDULER_ENABLED: "false"
      PAYMONGO_DISBURSEMENTS_ENABLED: "false"
      XENDIT_PAYOUTS_ENABLED: "false"
      XENDIT_BILLING_ENABLED: "false"
      OPENAI_API_KEY: ""
      NEXT_TELEMETRY_DISABLED: "1"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact PR head
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Fail closed on unsafe destinations and fabricated positives
        run: |
          node --check scripts/qa/tenant-report-builder-export-contract.mjs
          node --check scripts/qa/tenant-report-builder-export-http.mjs
          node --test tests/tenant-report-builder-export-contract.test.mjs
      - name: Create ephemeral fictional encryption keys
        shell: bash
        run: |
          for key in BANK_DATA_ENCRYPTION_KEY PII_ENCRYPTION_KEY TOTP_ENCRYPTION_KEY; do
            value=$(openssl rand -hex 32)
            echo "::add-mask::$value"
            echo "$key=$value" >> "$GITHUB_ENV"
          done
      - name: Create disposable PostgreSQL 16 schema
        run: npm run db:push
      - name: Apply isolated baseline, never production
        run: node scripts/qa/apply-isolated-baseline.mjs
      - name: Build feature-ON synthetic Next
        run: npm run build
      - name: Start localhost server
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/tenant-report-export.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:3000/login > /dev/null; then exit 0; fi
            sleep 2
          done
          tail -n 80 /tmp/tenant-report-export.log
          exit 1
      - name: Assert own real JSON and CSV, foreign, malformed, unit and revoked denials
        env:
          NODE_ENV: production
        run: node --import tsx scripts/qa/tenant-report-builder-export-http.mjs
      - name: Bounded server log on failure
        if: failure()
        run: tail -n 80 /tmp/tenant-report-export.log || true
