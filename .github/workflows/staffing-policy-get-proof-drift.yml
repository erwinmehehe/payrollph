name: Staffing Policy GET Proof Source Drift Guard

on:
  pull_request:
    branches: [main]
    paths:
      - "src/lib/auth.ts"
      - "src/lib/access.ts"
      - "src/lib/workforce-operational-demand-scope.ts"
      - "src/lib/workforce-demand-staffing-policy-server.ts"
      - "src/lib/workforce-demand-staffing-policy.ts"
      - "src/lib/workforce-issued-demand-validation.ts"
      - "src/lib/workforce-schedule-receipt.ts"
      - "src/lib/workforce-issued-demand-evidence.ts"
      - "src/lib/payroll-period-ui.ts"
      - "src/db/index.ts"
      - "src/db/schema.ts"
      - "src/app/api/workforce/demand-staffing/policies/**"
      - "scripts/qa/tenant-staffing-policy-get-credit.mjs"
      - "scripts/qa/tenant-isolation-coverage-manifest.json"
      - "tests/tenant-staffing-policy-get-credit.test.mjs"
      - ".github/workflows/staffing-policy-get-proof-drift.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-drift:
    name: Fail closed on stale staffing GET proof
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Require exact PR head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Validate evidence hashes and adversarial helper-drift tests
        run: node --test tests/tenant-staffing-policy-get-credit.test.mjs
