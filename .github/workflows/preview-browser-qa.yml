            if (persona.dashboardRole) {
              const dashboard = page.locator(`[data-role-dashboard="${persona.dashboardRole}"]`);
              check((await dashboard.count()) === 1, `${persona.label}: role-specific dashboard did not render`);
              check((await dashboard.locator(".dashboard-alert-banner").count()) === 1, `${persona.label}: Needs Attention banner is missing`);
              if (persona.id === "hr") {
                check((await dashboard.locator(".dashboard-stat-card").count()) === 4, "HR: readiness summary must expose four compact signals");
              } else {
                check((await dashboard.locator(".payroll-focus-summary > div").count()) >= 3, `${persona.label}: payroll focus card must carry the primary financial summary`);
                check((await dashboard.locator(".dashboard-stat-card").count()) === 0, `${persona.label}: duplicate KPI cards should stay off the focused landing view`);
