          async function inspectPersonaViewport(page, persona, width, height, suffix) {
            await page.setViewportSize({ width, height });
            await page.waitForTimeout(120);

            const overflow = await page.evaluate(() => ({
              scrollWidth: document.documentElement.scrollWidth,
              innerWidth: window.innerWidth,
            }));
            check(
              overflow.scrollWidth <= overflow.innerWidth + 1,
              `${persona.label}: ${suffix} horizontal overflow ${overflow.scrollWidth}px > ${overflow.innerWidth}px`,
            );

            const sandbox = page.locator("section.demo-sandbox").first();
            if (await sandbox.count()) {
            const sandboxLayout = await sandbox.evaluate((element) => {
              const rect = element.getBoundingClientRect();
              return {
                left: rect.left,
                right: rect.right,
                scrollWidth: element.scrollWidth,
                clientWidth: element.clientWidth,
              };
            });
            check(sandboxLayout.left >= -1, `${persona.label}: ${suffix} sandbox escapes the left viewport edge`);
            check(sandboxLayout.right <= width + 1, `${persona.label}: ${suffix} sandbox escapes the right viewport edge`);
            check(
              sandboxLayout.scrollWidth <= sandboxLayout.clientWidth + 1,
              `${persona.label}: ${suffix} sandbox clips internally`,
            );

            }

            const responsiveControls = page.locator(".demo-role-button, .demo-access-chip, .demo-task-card");
            for (const control of await responsiveControls.all()) {
              if (!(await control.isVisible())) continue;
              const layout = await control.evaluate((element) => ({
                scrollWidth: element.scrollWidth,
                clientWidth: element.clientWidth,
              }));
              check(
                layout.scrollWidth <= layout.clientWidth + 1,
                `${persona.label}: ${suffix} sandbox control clips ${layout.scrollWidth}px > ${layout.clientWidth}px`,
              );
            }

            const handoffs = page.locator("[data-payroll-handoff]");
            for (const handoff of await handoffs.all()) {
              if (!(await handoff.isVisible())) continue;
              const layout = await handoff.evaluate((element) => ({
                scrollWidth: element.scrollWidth,
                clientWidth: element.clientWidth,
              }));
              check(
                layout.scrollWidth <= layout.clientWidth + 1,
                `${persona.label}: ${suffix} payroll handoff clips ${layout.scrollWidth}px > ${layout.clientWidth}px`,
              );
            }

            const topbar = page.locator(".topbar").first();
            if (await topbar.count()) {
              const layout = await topbar.evaluate((element) => ({
                scrollWidth: element.scrollWidth,
                clientWidth: element.clientWidth,
              }));
              check(
                layout.scrollWidth <= layout.clientWidth + 1,
                `${persona.label}: ${suffix} topbar clips ${layout.scrollWidth}px > ${layout.clientWidth}px`,
              );
            }

            if (persona.id === "employee") {
              if (width <= 768) {
                const mobileTabs = page.locator(".employee-tabs").first();
                check((await mobileTabs.count()) === 1, "Employee: mobile bottom navigation is missing");
                check(await mobileTabs.isVisible(), `Employee: ${suffix} mobile bottom navigation is not visible`);
              }
              const employeeActions = page.locator(".employee-self-service-actions").first();
              check((await employeeActions.count()) === 1, "Employee: responsive header actions are missing");
              const actionLayout = await employeeActions.evaluate((element) => ({
                scrollWidth: element.scrollWidth,
                clientWidth: element.clientWidth,
              }));
              check(
                actionLayout.scrollWidth <= actionLayout.clientWidth + 1,
                `Employee: ${suffix} header actions clip ${actionLayout.scrollWidth}px > ${actionLayout.clientWidth}px`,
              );
            } else if (width <= 768) {
              const drawerButton = page.getByRole("button", { name: "Open navigation" }).first();
              check((await drawerButton.count()) === 1, `${persona.label}: ${suffix} mobile/tablet navigation trigger is missing`);
              check(await drawerButton.isVisible(), `${persona.label}: ${suffix} navigation trigger is not visible`);
              const mobileNav = page.locator(".mobile-bottom-nav").first();
              check((await mobileNav.count()) === 1, `${persona.label}: ${suffix} bottom navigation is missing`);
              check(await mobileNav.isVisible(), `${persona.label}: ${suffix} bottom navigation is not visible`);
            }

            await page.screenshot({
              path: `${outDir}/persona-${persona.id}-landing-${suffix}.png`,
              fullPage: true,
            });
          }

          async function qaRolePicker(browser, name, viewport) {
            const context = await browser.newContext({ viewport });
            const page = await context.newPage();
            const pageErrors = [];
            page.on("pageerror", (error) => pageErrors.push(error.message));

            const response = await page.goto(`${base}/demo`, { waitUntil: "networkidle", timeout: 90000 });
            check(response && response.ok(), `${name}: demo role picker did not return 2xx`);
            check((await page.getByRole("tab").count()) === 6, `${name}: expected six selectable demo roles`);
            const owner = page.getByRole("tab").filter({ hasText: "Owner" }).first();
            await owner.focus();
            await page.keyboard.press("ArrowRight");
            const hr = page.getByRole("tab").filter({ hasText: "HR Admin" }).first();
            check(await hr.getAttribute("aria-selected") === "true", `${name}: keyboard did not select HR`);
            check(await hr.evaluate((element) => element === document.activeElement),
              `${name}: keyboard focus did not follow the selected role tab`);
            await page.screenshot({ path: `${outDir}/role-picker-${name}.png`, fullPage: true });

            // Explicitly mock an unavailable demo endpoint: no server mutations.
            await page.route("**/api/auth/demo-switch", (route) => route.fulfill({
              status: 503, contentType: "application/json",
              body: JSON.stringify({ error: "Sample demo temporarily unavailable" }),
            }));
            await page.getByRole("button", { name: /^Open HR Admin demo/i }).click();
            const alert = page.locator(".linaw-demo-role-picker [role=\"alert\"]").first();
            await alert.waitFor({ state: "visible", timeout: 10000 });
            check((await alert.count()) === 1 &&
              (await alert.innerText()).includes("Sample demo temporarily unavailable"),
              `${name}: a failed launch must show a readable error`);
            const fallback = page.getByRole("link", { name: /Explore interactive preview/i });
            check((await fallback.count()) === 1 &&
              (await fallback.getAttribute("href")) === "/#demo",
              `${name}: failed demo must offer the safe interactive preview`);
            check(pageErrors.length === 0,
              `${name}: uncaught page errors in role picker: ${pageErrors.join(" | ")}`);
            await page.screenshot({ path: `${outDir}/role-picker-fallback-${name}.png`, fullPage: true });
            await context.close();
          }

          async function qaPersona(browser, persona) {
            const context = await browser.newContext({ viewport: { width: 1440, height: 1000 } });
            const page = await context.newPage();
            const errors = [];
            attachErrorCollection(page, errors);

            const demoResponse = await page.goto(`${base}/demo`, { waitUntil: "networkidle", timeout: 90000 });
            check(demoResponse && demoResponse.ok(), `${persona.label}: /demo did not return 2xx`);

            const roleTab = page.getByRole("tab").filter({ hasText: persona.label }).first();
            check((await roleTab.count()) === 1, `${persona.label}: role tab is missing`);
            await roleTab.click();

            const openButton = page.getByRole("button", { name: new RegExp(`^Open ${persona.short} demo`, "i") });
            check((await openButton.count()) === 1, `${persona.label}: launch button is missing`);

            const [switchResponse] = await Promise.all([
              page.waitForResponse(
                (response) =>
                  response.url().includes("/api/auth/demo-switch") &&
                  response.request().method() === "POST",
                { timeout: 90000 },
              ),
              openButton.click(),
            ]);
            if (!switchResponse.ok()) {
              const switchText = await switchResponse.text().catch(() => "<response body unavailable>");
              throw new Error(`${persona.label}: demo switch returned ${switchResponse.status()} ${switchText}`);
            }
            await page.waitForURL(new RegExp(`[?&]demoRole=${persona.id}(?:&|$)`), { timeout: 30000 });
            const demoProbe = await context.request.post(`${base}/api/auth/demo-switch`, {
              data: { role: persona.id },
              headers: { Origin: base },
            });
            check(demoProbe.ok(), `${persona.label}: redacted demo probe returned ${demoProbe.status()}`);
            const demoPayload = await demoProbe.json();
            check(demoPayload.demoDataMode === "synthetic-redacted", `${persona.label}: demo is not using the redacted data contract`);
            check(demoPayload.sensitiveFieldsPersisted === false, `${persona.label}: demo claims sensitive fields are persisted`);
            await page.waitForLoadState("networkidle");

            const body = (await page.locator("body").textContent()) ?? "";
            check(body.includes(persona.person), `${persona.label}: expected persona identity ${persona.person} is missing`);
            check(body.toLowerCase().includes(persona.landing.toLowerCase()), `${persona.label}: expected landing context ${persona.landing} is missing`);

            if (persona.id === "owner") {
              check(new URL(page.url()).pathname === "/app", "Owner: demo must land on /app, not replace the homepage");
              const marketingPage = await context.newPage();
              const marketingResponse = await marketingPage.goto(base, { waitUntil: "networkidle", timeout: 90000 });
              check(marketingResponse && marketingResponse.ok(), "Owner: signed-in visit to / did not return 2xx");
              const marketingH1 = (await marketingPage.locator("h1").first().innerText()).trim();
              check(marketingH1.includes("Your people. Your payroll."), `Owner: signed-in / should stay on the Linaw marketing homepage; saw "${marketingH1}"`);
              await marketingPage.close();

              const legacyPage = await context.newPage();
              const legacyResponse = await legacyPage.goto(`${base}/workspace?demoRole=owner`, { waitUntil: "networkidle", timeout: 90000 });
              check(legacyResponse && legacyResponse.ok(), "Owner: legacy /workspace redirect did not resolve");
              const legacyUrl = new URL(legacyPage.url());
              check(legacyUrl.pathname === "/app", `Owner: legacy /workspace should redirect to /app; saw ${legacyUrl.pathname}`);
              check(legacyUrl.searchParams.get("demoRole") === "owner", "Owner: legacy /workspace redirect dropped demoRole");
              await legacyPage.close();

              const tonedItems = page.locator("aside .nav-item[data-tone]");
              check((await tonedItems.count()) >= 5, "Owner: real sidebar is missing module tone data");
              const firstIcon = tonedItems.nth(0).locator(".nav-icon");
              const secondIcon = tonedItems.nth(1).locator(".nav-icon");
              const iconColors = await Promise.all([
                firstIcon.evaluate((element) => ({
                  color: getComputedStyle(element).color,
                  background: getComputedStyle(element).backgroundColor,
                })),
                secondIcon.evaluate((element) => ({
                  color: getComputedStyle(element).color,
                  background: getComputedStyle(element).backgroundColor,
                })),
              ]);
              check(iconColors[0].color !== iconColors[1].color, "Owner: sidebar module icons were flattened to one color");
              check(await tonedItems.first().getAttribute("aria-current") === "page", "Owner: active navigation must be identified");

              const profile = page.locator("aside .side-profile");
              check((await profile.count()) === 1, "Owner: interactive profile control is missing");
              const profileAvatar = profile.locator(".avatar").first();
              const avatarBackground = await profileAvatar.evaluate((element) => getComputedStyle(element).backgroundColor);
              check(avatarBackground !== "rgb(238, 238, 239)", "Owner: profile avatar is still the old gray placeholder");
            }

            if (persona.dashboardRole) {
              const dashboard = page.locator(`[data-role-dashboard="${persona.dashboardRole}"]`);
              check((await dashboard.count()) === 1, `${persona.label}: role-specific dashboard did not render`);
              check((await dashboard.locator("h1").count()) === 1, `${persona.label}: primary dashboard heading is missing`);
              const isPremiumDashboard = (await dashboard.getAttribute("class"))?.includes("premium-dashboard") ?? false;
              if (isPremiumDashboard) {
                // The premium layout replaces the old clean-* containers, but
                // must still show an attributable role, actual payroll figures,
                // and five separate approval/release/bank payout stages.
                check(["owner", "payroll"].includes(persona.id), "Premium dashboard shown to unauthorized role");
                check((await dashboard.locator(".pd-hero").count()) === 1, `${persona.label}: current payroll hero is missing`);
                check((await dashboard.locator(".pd-figures .pd-figure").count()) === 4, `${persona.label}: current payroll figure categories are missing`);
                check((await dashboard.locator(".pd-progress .pd-step").count()) === 5, `${persona.label}: prepare/review/approve/release/payout stages must remain distinct`);
                const workflowText = (await dashboard.locator(".pd-progress").innerText()).toLowerCase();
                for (const step of ["prepare", "review", "approve", "release", "bank payout"]) {
                  check(workflowText.includes(step), `${persona.label}: missing the ${step} workflow stage`);
                }
              } else {
                if (persona.id === "owner") check((await dashboard.locator(".clean-assurance").count()) === 1, "Owner: server release summary is missing");
                if (persona.id === "payroll") check((await dashboard.locator(".clean-metrics").count()) >= 1, "Payroll: payroll figures are missing");
              }
              if (persona.id === "checker") check((await dashboard.getByRole("tablist").count()) === 1, "Checker: review tabs are missing");
              if (persona.id === "hr") check((await dashboard.getByText("Employee record checks", { exact: true }).count()) === 1, "HR: employee record checks are missing");
              if (persona.id === "hr") {
                // Screenshot regression: employee initials must stay centered in
                // their circular badges, not inherit subtitle overflow styles.
                const avatarBadges = dashboard.locator(".hr-mockup-table .mockup-person > .avatar");
                check((await avatarBadges.count()) >= 1, "HR: employee attention avatars are missing");
                const avatarStyles = await avatarBadges.evaluateAll((avatars) => avatars.map((el) => {
                  const style = getComputedStyle(el);
                  const rect = el.getBoundingClientRect();
                  return {
                    display: style.display,
                    alignItems: style.alignItems,
                    justifyItems: style.justifyItems,
                    width: rect.width,
                    height: rect.height,
                    initials: el.textContent?.trim() || "",
                  };
                }));
                check(avatarStyles.every((item) =>
                  item.display === "grid" &&
                  item.alignItems === "center" &&
                  item.justifyItems === "center" &&
                  Math.abs(item.width - item.height) < 2 &&
                  item.width >= 24 &&
                  item.initials.length >= 1 &&
                  item.initials.length <= 2
                ), "HR: employee initials are clipped, uncentered, or distorted");
                const actions = dashboard.locator(".hr-mockup-table .mockup-table-row > button");
                const actionsFit = await actions.evaluateAll((buttons) => buttons.every((el) => {
                  const style = getComputedStyle(el);
                  const rect = el.getBoundingClientRect();
                  const row = el.closest(".mockup-table-row")?.getBoundingClientRect();
                  return Boolean(row) &&
                    style.whiteSpace === "nowrap" &&
                    rect.width >= 120 &&
                    rect.left >= row.left - 1 &&
                    rect.right <= row.right + 1;
                }));
                check((await actions.count()) >= 1 && actionsFit, "HR: Open employee or attendance actions are wrapping/clipped on desktop");
              }
              if (persona.id === "bookkeeper") check((await dashboard.locator(".mockup-close-stage").count()) === 5, "Bookkeeper: close evidence stages are missing");
              const sandbox = page.locator(".demo-sandbox").first();
              if (await sandbox.count()) {
                check((await sandbox.isVisible()) === false, `${persona.label}: bulky demo sandbox must stay off the landing view`);
              }
              check((await dashboard.locator(".dashboard-secondary-controls:visible").count()) === 0, `${persona.label}: legacy handoff controls must stay off the focused landing view`);
              check((await dashboard.locator(".role-dashboard-grid:visible").count()) === 0, `${persona.label}: legacy detail grid must stay off the focused landing view`);
            }
            if (persona.id === "employee") {
              const employeeDesktopNav = page.locator(".employee-workspace-sidebar .employee-side-nav .nav-item:visible");
              const expectedEmployeeSections = ["Home", "Pay", "Time", "Leave", "Documents", "Performance", "Profile"];
              const desktopLabels = (await employeeDesktopNav.allTextContents()).map((value) => value.trim());
              check(
                desktopLabels.length === expectedEmployeeSections.length
                  && desktopLabels.every((label, index) => label === expectedEmployeeSections[index]),
                `Employee: desktop shared sidebar must expose Home, Pay, Time, Leave, Documents, Performance and Profile; saw ${desktopLabels.join(", ")}`,
              );
              const employeeNavHeights = await employeeDesktopNav.evaluateAll((items) =>
                items.map((item) => item.getBoundingClientRect().height),
              );
              check(
                employeeNavHeights.every((height) => height >= 40 && height <= 48),
                `Employee: desktop sidebar items are stretched: ${employeeNavHeights.join(", ")}`,
              );
              check(body.toLowerCase().includes("latest payslip"), "Employee: latest released payslip promotion is missing");
              check(body.includes("Payslip available"), "Employee: released payslip availability state is missing");
              check((await page.locator("[data-latest-payslip]").count()) === 1, "Employee: latest payslip card is missing");
              check(body.toLowerCase().includes("next payday"), "Employee: next pay status section is missing");
              check(body.includes("Your payslip will be available after payroll is released."), "Employee: unreleased-pay privacy copy is missing");
              const handoff = page.locator("[data-payroll-handoff]").first();
              check((await handoff.count()) === 1, "Employee: payroll handoff is missing");
              check((await handoff.locator(".handoff-step").count()) === 5, "Employee: payroll handoff must show all five owners");
            }

            if (persona.id === "payroll" || persona.id === "checker") {
              const bell = page.getByRole("button", { name: /^Notifications/ }).first();
              check((await bell.count()) === 1, `${persona.label}: notification bell is missing`);
              await bell.click();
              const tray = page.getByRole("dialog", { name: "Notifications" });
              check((await tray.count()) === 1, `${persona.label}: notification tray did not open`);
              const trayText = await tray.innerText();
              if (persona.id === "payroll") {
                check(trayText.includes("Resolve 2 payroll exceptions"), "Payroll: transition notification is missing");
              }
              if (persona.id === "checker") {
                check(trayText.includes("Review Sep 1–15, 2026 payroll"), "Checker: review transition notification is missing");
              }
              await bell.click();
            }

            const alert = page.getByRole("alert");
            if (await alert.count()) {
              const alertText = (await alert.first().innerText()).trim();
              check(!alertText, `${persona.label}: launch alert: ${alertText}`);
            }

            await page.screenshot({
              path: `${outDir}/persona-${persona.id}-landing.png`,
              fullPage: true,
            });

            const sidebar = page.locator("aside");
            if (persona.id === "hr") {
              check((await sidebar.locator(".nav-item").filter({ hasText: /^Payroll$/ }).count()) === 0, "HR: payroll operator navigation must stay hidden");
              check((await sidebar.locator(".nav-item").filter({ hasText: /^Migration$/ }).count()) === 0, "HR: migration admin navigation must stay hidden");
            }
            if (persona.id === "checker") {
              check((await sidebar.locator(".nav-item").filter({ hasText: /^(People|Employees|Team)$/ }).count()) === 0, "Checker: people administration must stay hidden");
              check((await sidebar.locator(".nav-item").filter({ hasText: /^Payroll$/ }).count()) === 0, "Checker: unsafe payroll-maker page must stay hidden");
            }
            if (persona.id === "payroll") {
              check((await sidebar.locator(".nav-item").filter({ hasText: /^Leave$/ }).count()) === 0, "Payroll: leave administration must stay hidden");
              let approvalsNav = sidebar.locator(".nav-item").filter({ hasText: /^Approvals/ }).first();
              if ((await approvalsNav.count()) === 0) {
                const more = sidebar.locator(".nav-more-toggle").first();
                check((await more.count()) === 1, "Payroll: secondary navigation trigger is missing");
                await more.click();
                approvalsNav = sidebar.locator(".nav-more-items .nav-item").filter({ hasText: /^Approvals/ }).first();
              }
              check((await approvalsNav.count()) === 1, "Payroll: approvals status page should remain accessible");
              await approvalsNav.click();
              await page.waitForTimeout(100);
              check((await page.getByRole("button", { name: /^Approve$/ }).count()) === 0, "Payroll: Approve action must be hidden");
              check((await page.getByRole("button", { name: /^Decline$/ }).count()) === 0, "Payroll: Decline action must be hidden");
              check((await page.getByRole("button", { name: /Delegation settings/i }).count()) === 0, "Payroll: delegation controls must be hidden");
              check((await page.locator("[data-payroll-handoff]").count()) >= 1, "Payroll: approvals page should retain the shared handoff context");
              const overviewNav = sidebar.locator(".nav-item").filter({ hasText: /^(Dashboard|Home|Overview|Today)$/ }).first();
              await overviewNav.click();
              await page.waitForTimeout(100);
            }

            if (persona.dashboardRole || persona.id === "employee") {
              await inspectPersonaViewport(page, persona, 768, 1024, "tablet-768");
              await inspectPersonaViewport(page, persona, 390, 844, "mobile-390");
              await page.setViewportSize({ width: 1440, height: 1000 });
              await page.waitForTimeout(120);
            }

            if (persona.id === "employee") {
              const viewPayslip = page.getByRole("button", { name: /View payslip/i }).first();
              check((await viewPayslip.count()) === 1, "Employee: payslip CTA is missing");
              await viewPayslip.click();
              await page.waitForTimeout(120);
              const afterTask = (await page.locator("body").textContent()) ?? "";
              check(afterTask.includes("Rule version"), "Employee: opening the payslip did not reveal its details");

              // Disposable browser-app proof: the identity-bound employee's
              // time-clock controls are enabled and keyboard usable. Actual
              // punch mutations are tested separately against isolated CI PG.
              const timeTab = page.locator(".employee-workspace-sidebar .employee-side-nav .nav-item:visible").filter({ hasText: /^Time$/ }).first();
              check((await timeTab.count()) === 1, "Employee: Time navigation must be present");
              await timeTab.click();
              const openClock = page.getByRole("button", { name: "Clock in / out", exact: true }).first();
              check((await openClock.count()) === 1, "Employee: Time page has no clock button");
              // A malformed current-employee GET must not be mistaken for
              // an empty day with Clock IN enabled. No punches are submitted,
              // and unlike an intentionally failed HTTP resource this fixture
              // does not pollute normal browser console-error monitoring.
              const bundyReadUrl = "**/api/web-bundy?**";
              await page.route(bundyReadUrl, async (route) => {
                await route.fulfill({
                  status: 200, contentType: "application/json",
                  body: '{"punches":"invalid-synthetic-employee-history"}',
                });
              });
              await openClock.click();
              const clockDialog = page.getByRole("dialog", { name: "Web Bundy Time Clock" });
              check((await clockDialog.count()) === 1, "Employee: clock dialog must open");
              const clockInButton = clockDialog.getByRole("button", { name: "Clock IN", exact: true });
              const retryRead = clockDialog.getByRole("button", { name: /Retry attendance check/i });
              await retryRead.waitFor({ state: "visible", timeout: 12000 });
              check(!(await clockInButton.isEnabled()), "Employee: no clock-in while attendance GET is unavailable");
              await page.unroute(bundyReadUrl);
              await retryRead.click();
              // Playwright trial clicks wait for an enabled button but never
              // submit the punch. Authorization is still tested via CI HTTP.
              await clockInButton.click({ trial: true, timeout: 12000 });
              check(await clockInButton.isEnabled(), "Employee: own Clock IN must be enabled after current-day history loads");
              await clockInButton.focus();
              check(await clockInButton.evaluate((el) => el === document.activeElement), "Employee: Clock IN must be keyboard focusable");
              await page.setViewportSize({ width: 375, height: 812 });
              const clockBounds = await clockDialog.evaluate((el) => {
                const rect = el.getBoundingClientRect();
                return { left: rect.left, right: rect.right };
              });
              check(clockBounds.left >= -1 && clockBounds.right <= 376,
                "Employee: clock dialog must fit a 375px phone without horizontal overflow");
              const closeClock = clockDialog.getByRole("button", { name: "Close time clock" });
              check((await closeClock.count()) === 1, "Employee: clock dialog close control has no accessible name");
              await closeClock.focus();
              check(await closeClock.evaluate((el) => el === document.activeElement), "Employee: clock close control must receive keyboard focus");
              await closeClock.press("Enter");
              check((await clockDialog.count()) === 0, "Employee: keyboard Enter must close the clock dialog");
              await page.setViewportSize({ width: 1440, height: 1000 });
              const payTab = page.locator(".employee-workspace-sidebar .employee-side-nav .nav-item:visible").filter({ hasText: /^Pay$/ }).first();
              await payTab.click();
            } else {
              const taskNav = page.locator("aside .nav-item").filter({ hasText: new RegExp(`^${persona.taskPage}`) }).first();
              check((await taskNav.count()) === 1, `${persona.label}: target navigation ${persona.taskPage} is missing`);
              await taskNav.click();
              await page.waitForTimeout(250);
              if (persona.id === "payroll") {
                const recovery = page.locator('[data-recovery-state="unresolved-exception"]');
                check((await recovery.count()) === 1, "Payroll: unresolved exception recovery state is missing");
                check((await recovery.innerText()).includes("Review exceptions"), "Payroll: exception recovery action is missing");
              }
              const activeNav = page.locator("aside .nav-item[aria-current='page']").filter({ hasText: new RegExp(`^${persona.taskPage}`) }).first();
              check((await activeNav.count()) === 1, `${persona.label}: task navigation did not reach ${persona.taskPage}`);
              if (persona.id === "hr") {
                const demoShell = page.locator('.app-shell[data-demo-role="hr"]');
                check((await demoShell.count()) === 1, "HR: demo shell marker was lost after opening People");

                const demoSidebar = demoShell.locator("aside.sidebar").first();
                const demoTopbar = demoShell.locator("header.topbar").first();
                const shellStyles = await Promise.all([
                  demoSidebar.evaluate((element) => getComputedStyle(element).backgroundColor),
                  demoTopbar.evaluate((element) => getComputedStyle(element).backgroundColor),
                ]);
                check(shellStyles[0] === "rgb(255, 255, 255)", `HR: the light sidebar must remain consistent on People; saw ${shellStyles[0]}`);
                check(shellStyles[1] !== "rgb(15, 27, 24)", `HR: People fell back to the old dark topbar; saw ${shellStyles[1]}`);
                check((await demoShell.locator(".demo-sandbox:visible").count()) === 0, "HR: People reintroduced the bulky demo tools strip");

                const peopleHeading = (await page.locator(".page-heading h1").first().innerText()).trim();
                check(peopleHeading === "Employees", `HR: People should be a directory page, saw "${peopleHeading}"`);
                const peopleText = (await page.locator(".content-area").innerText()).trim();
                check(!peopleText.includes("Payroll readiness."), "HR: People duplicates the Today payroll-readiness dashboard");

                const directPrimary = demoSidebar.locator(".side-navigation > .nav-group:not(.nav-more-group) > .nav-item:visible");
                check((await directPrimary.count()) === 6, "HR: primary navigation must expose Dashboard, Employees, Time, Leave, Approvals and Reports");
                const primaryTime = directPrimary.filter({ hasText: /^Time$/ }).first();
                check((await primaryTime.count()) === 1, "HR: Time should be directly accessible in the everyday menu");
                check((await demoSidebar.locator(".nav-more-toggle:visible").count()) === 1, "HR: secondary HR modules should stay accessible under More");

                const more = demoSidebar.locator(".nav-more-toggle").first();
                await more.click();
                const secondaryPlanning = demoSidebar.locator(".nav-more-items .nav-item").filter({ hasText: /^Planning$/ }).first();
                check((await secondaryPlanning.count()) === 1, "HR: advanced Planning must remain reachable under More");
                await primaryTime.click();
                await page.waitForTimeout(180);
                check((await page.locator('.app-shell[data-demo-role="hr"]').count()) === 1, "HR: demo shell marker was lost after opening a secondary module");
                check(
                  (await page.locator("aside.sidebar").first().evaluate((element) => getComputedStyle(element).backgroundColor)) === "rgb(255, 255, 255)",
                  "HR: navigating to Time must keep the premium light sidebar",
                );
                check((await page.locator(".demo-sandbox:visible").count()) === 0, "HR: secondary module reintroduced the bulky demo tools strip");
                // People was already exercised above. This verifies the promoted Time route
                // while the More group retains access to advanced Planning features.
                // HR can review workspace approvals, but the synthetic fixture
                // assigns all pending decisions to Mariel (Checker). HR must
                // see their status without receiving decision controls.
                const hrApprovalNav = demoSidebar.locator(".nav-item").filter({ hasText: /^Approvals/ }).first();
                check((await hrApprovalNav.count()) === 1, "Phase 2 HR: Approvals navigation missing");
                await hrApprovalNav.click();
                const hrApprovalQueue = page.locator(".p2-approval-queue");
                await hrApprovalQueue.waitFor({ state: "visible", timeout: 30000 });
                const hrPending = page.getByRole("group", { name: "Approval filter" }).getByRole("button", { name: /All pending/ });
                await hrPending.click();
                const hrApprovalRows = hrApprovalQueue.locator(".p2-approval-row");
                check((await hrApprovalRows.count()) >= 1, "Phase 2 HR: seeded pending approval tasks missing");
                check((await hrApprovalRows.locator(".p2-approval-actions").count()) === 0, "Phase 2 HR: unrelated tasks expose approval actions");
                check((await hrApprovalRows.locator(".p2-approval-readonly").count()) === (await hrApprovalRows.count()), "Phase 2 HR: unrelated tasks must all be read-only");
                await page.screenshot({ path: outDir + "/phase2-hr-approvals-readonly-desktop-1440.png", fullPage: true });

              }
            }

            // Phase 2: these checks are read-only except for opening/cancelling
            // the confirmation modal. The GitHub runner uses seeded demo Postgres.
            if (persona.id === "owner") {
              const ownerPayroll = page.locator('aside .nav-item[data-nav-name="Payroll"]').first();
              check((await ownerPayroll.count()) === 1, "Phase 2 Owner: payroll navigation is missing");
              await ownerPayroll.click();
              await page.waitForTimeout(200);
            }
            if (persona.id === "owner" || persona.id === "payroll") {
              const guided = page.locator(".p2-payroll-overview");
              await guided.waitFor({ state: "visible", timeout: 30000 });
              check((await guided.count()) === 1, "Phase 2: premium payroll lifecycle is missing");
              check((await guided.locator(".p2-payroll-step").count()) === 5, "Phase 2: five payroll stages are required");
              const stageLabels = (await guided.locator(".p2-payroll-step strong").allTextContents()).map(value => value.trim());
              check(
                JSON.stringify(stageLabels) === JSON.stringify(["Prepare", "Review", "Approve", "Release", "Bank payout"]),
                "Phase 2: payroll stage order or labels changed",
              );
              check((await guided.locator(".p2-payroll-values > div").count()) === 4, "Phase 2: stored payroll metrics missing");
              check((await guided.locator(".p2-payroll-disclaimer").innerText()).includes("stored run figures"), "Phase 2: client-only calculation disclaimer missing");
              check((await page.locator("button.run-item").count()) >= 1, "Phase 2: original payroll runs/register was removed");
              const actions = guided.locator(".p2-payroll-actions button");
              check((await actions.count()) >= 1, "Phase 2: no navigation back to existing guarded controls");
              await guided.screenshot({ path: outDir + "/phase2-" + persona.id + "-payroll-desktop-1440.png" });

              for (const viewport of [{ width: 768, height: 1024 }, { width: 390, height: 844 }]) {
                await page.setViewportSize(viewport);
                await page.waitForTimeout(180);
                const fitting = await guided.evaluate((element) => {
                  const bounds = element.getBoundingClientRect();
                  const figures = Array.from(element.querySelectorAll(".p2-payroll-values strong"));
                  return {
                    left: bounds.left,
                    right: bounds.right,
                    pageWidth: window.innerWidth,
                    amountsFit: figures.every(figure => figure.scrollWidth <= figure.clientWidth + 1),
                  };
                });
                check(fitting.left >= -1 && fitting.right <= fitting.pageWidth + 1, "Phase 2: payroll card exceeds " + viewport.width + "px viewport");
                check(fitting.amountsFit, "Phase 2: financial amounts clip at " + viewport.width + "px");
                await guided.screenshot({ path: outDir + "/phase2-" + persona.id + "-payroll-" + viewport.width + ".png" });
              }
              await page.setViewportSize({ width: 1440, height: 1000 });
            }
            if (persona.id === "checker") {
              const queue = page.locator(".p2-approval-queue");
              await queue.waitFor({ state: "visible", timeout: 30000 });
              check((await queue.count()) === 1, "Phase 2 Checker: approval queue is missing");
              const filters = page.getByRole("group", { name: "Approval filter" });
              check((await filters.count()) === 1, "Phase 2 Checker: approval filters are missing");
              check((await filters.getByRole("button", { name: /Assigned to me/ }).count()) === 1, "Phase 2 Checker: per-assignee filter is missing");
              check((await filters.getByRole("button", { name: /All pending/ }).count()) === 1, "Phase 2 Checker: workspace-wide pending option is missing");
              const checkerPayrollRow = queue.locator(".p2-approval-row").filter({ hasText: "Review Sep 1–15 payroll" }).first();
              check((await checkerPayrollRow.count()) === 1, "Phase 2 Checker: assigned payroll review is missing");
              const openEvidence = checkerPayrollRow.getByRole("button", { name: "Review payroll evidence" });
              check((await openEvidence.count()) === 1, "Phase 2 Checker: payroll decision must first lead to variance evidence");
              check((await checkerPayrollRow.getByRole("button", { name: "Review & approve", exact: true }).count()) === 0, "Phase 2 Checker: direct payroll approval bypasses variance evidence");
              await openEvidence.click();
              const evidence = page.locator("#p2-checker-evidence .checker-variance-center");
              await evidence.waitFor({ state: "visible", timeout: 30000 });
              check((await evidence.count()) === 1, "Phase 2 Checker: payroll variance evidence cannot be opened");


              const approve = page.getByRole("button", { name: "Review & approve", exact: true }).first();
              if (await approve.count()) {
                await approve.click();
                const confirmation = page.getByRole("dialog", { name: "Confirm approval" });
                check((await confirmation.count()) === 1, "Phase 2 Checker: approval must show explicit confirmation");
                check((await confirmation.innerText()).toLowerCase().includes("server"), "Phase 2 Checker: guard explanation is missing");
                await confirmation.getByRole("button", { name: "Cancel" }).click();
                await page.locator("dialog.p2-approval-confirm[open]").waitFor({ state: "hidden", timeout: 5000 });
                check((await page.locator("dialog.p2-approval-confirm[open]").count()) === 0, "Phase 2 Checker: cancel must close without deciding");
                const decline = page.getByRole("button", { name: "Decline", exact: true }).first();
                if (await decline.count()) {
                  await decline.click();
                  const declineDialog = page.getByRole("dialog", { name: "Confirm decline" });
                  check((await declineDialog.count()) === 1, "Phase 2 Checker: decline must require confirmation");
                  await declineDialog.getByRole("button", { name: "Cancel" }).click();
                  await page.locator("dialog.p2-approval-confirm[open]").waitFor({ state: "hidden", timeout: 5000 });
                }
              }
              await filters.getByRole("button", { name: /All pending/ }).click();
              check((await page.locator(".p2-approval-row").count()) >= 1, "Phase 2 Checker: pending task history missing");
              const shown = await page.locator(".p2-approval-row").count();
              const actionable = await page.locator(".p2-approval-row .p2-approval-actions").count();
              const readonly = await page.locator(".p2-approval-row .p2-approval-readonly").count();
              check(actionable + readonly === shown, "Phase 2 Checker: every task must be either actionable or read-only");
              await page.evaluate(() => window.scrollTo(0, 0));
              await page.screenshot({ path: outDir + "/phase2-checker-approvals-desktop-1440.png", fullPage: true });
              for (const viewport of [{ width: 768, height: 1024 }, { width: 390, height: 844 }]) {
                await page.setViewportSize(viewport);
                await page.waitForTimeout(160);
                const viewportFit = await page.evaluate(() => document.documentElement.scrollWidth <= window.innerWidth + 1);
                check(viewportFit, "Phase 2 Checker: Approvals causes horizontal overflow at " + viewport.width + "px");
                const buttonsFit = await page.locator(".p2-approval-row").evaluateAll((rows) => rows.every((row) => {
                  const parent = row.getBoundingClientRect();
                  return Array.from(row.querySelectorAll(".p2-approval-actions button")).every((button) => {
                    const rect = button.getBoundingClientRect();
                    return rect.left >= parent.left - 1 && rect.right <= parent.right + 1;
                  });
                }));
                check(buttonsFit, "Phase 2 Checker: approval buttons clip outside task cards at " + viewport.width + "px");
                await page.evaluate(() => window.scrollTo(0, 0));
                await page.screenshot({ path: outDir + "/phase2-checker-approvals-" + viewport.width + ".png", fullPage: true });
              }
              await page.setViewportSize({ width: 1440, height: 1000 });
            }

            await page.screenshot({
              path: `${outDir}/persona-${persona.id}.png`,
              fullPage: true,
            });

            await page.setViewportSize({ width: 768, height: 1024 });
            await page.waitForTimeout(120);
            const taskTabletOverflow = await page.evaluate(() => ({
              scrollWidth: document.documentElement.scrollWidth,
              innerWidth: window.innerWidth,
            }));
            check(
              taskTabletOverflow.scrollWidth <= taskTabletOverflow.innerWidth + 1,
              `${persona.label}: tablet task page horizontal overflow ${taskTabletOverflow.scrollWidth}px > ${taskTabletOverflow.innerWidth}px`,
            );
            await page.screenshot({
              path: `${outDir}/persona-${persona.id}-task-tablet-768.png`,
              fullPage: true,
            });
            await page.setViewportSize({ width: 1440, height: 1000 });
            await page.waitForTimeout(120);

            check(errors.length === 0, `${persona.label}: browser console/page errors: ${errors.join(" | ")}`);

            report.personas.push({
              id: persona.id,
              label: persona.label,
              url: page.url(),
              person: persona.person,
              landing: persona.landing,
              firstTask: "passed",
              errors,
            });
            await context.close();
          }


          async function qaEmployeeLogout(browser) {
            const logoutContext = await browser.newContext({ viewport: { width: 1440, height: 1000 } });
            try {
              const launch = await logoutContext.request.post(`${base}/api/auth/demo-switch`, {
                data: { role: "employee" },
                headers: { Origin: base },
              });
              check(launch.ok(), `Employee logout QA: demo launch returned ${launch.status()}`);
              const payload = await launch.json();
              const logoutPage = await logoutContext.newPage();
              const target = typeof payload.redirectTo === "string" ? payload.redirectTo : "/app?demoRole=employee";
              await logoutPage.goto(target.startsWith("http") ? target : `${base}${target}`, { waitUntil: "networkidle", timeout: 90000 });
              const signOut = logoutPage.getByRole("button", { name: /^Sign out$/ }).first();
              check((await signOut.count()) === 1, "Employee logout QA: Sign out button is missing");
              await Promise.all([
                logoutPage.waitForURL(/\/login(?:\?|$)/, { timeout: 15000 }),
                signOut.click(),
              ]);
              check(new URL(logoutPage.url()).pathname === "/login", "Employee logout QA: sign out did not return to /login");
            } finally {
              await logoutContext.close();
            }
          }

          const sameOriginHeaders = { Origin: base };

          async function switchPersona(context, page, role) {
            const response = await context.request.post(`${base}/api/auth/demo-switch`, {
              data: { role },
              headers: sameOriginHeaders,
            });
            check(response.ok(), `Lifecycle: switching to ${role} returned ${response.status()}`);
            const payload = await response.json();
            check(payload.demoDataMode === "synthetic-redacted", `Lifecycle: switching to ${role} left the redacted demo contract`);
            check(payload.sensitiveFieldsPersisted === false, `Lifecycle: switching to ${role} persisted sensitive demo fields`);
            const target = typeof payload.redirectTo === "string" ? payload.redirectTo : `/app?demoRole=${role}`;
            await page.goto(target.startsWith("http") ? target : `${base}${target}`, { waitUntil: "networkidle", timeout: 90000 });
            return payload;
          }

          async function notificationText(page) {
            const bell = page.getByRole("button", { name: /^Notifications/ }).first();
            check((await bell.count()) === 1, "Lifecycle: notification bell is missing");
            await bell.click();
            const tray = page.getByRole("dialog", { name: "Notifications" });
            check((await tray.count()) === 1, "Lifecycle: notification tray did not open");
            const text = await tray.innerText();
            await bell.click();
            return text;
          }

          async function qaReleaseCycle(browser) {
            const context = await browser.newContext({ viewport: { width: 1440, height: 1000 } });
            const page = await context.newPage();
            const errors = [];
            attachErrorCollection(page, errors);
            const period = "Sep 16–30, 2026";

            // HR has completed the input handoff for this exact run; Payroll owns
            // the next visible step before the same run moves through review.
            await switchPersona(context, page, "hr");
            const hrHandoff = page.locator("[data-payroll-handoff]").first();
            check((await hrHandoff.count()) === 1, "Lifecycle: HR handoff is missing");
            check((await hrHandoff.locator('[data-handoff-stage="hr"]').getAttribute("class")).includes("done"), "Lifecycle: HR stage should be complete");
            check((await hrHandoff.locator('[data-handoff-stage="payroll"]').getAttribute("class")).includes("current"), "Lifecycle: Payroll should own the run after HR");

            const payrollSession = await switchPersona(context, page, "payroll");
            const dashboardResponse = await context.request.get(
              `${base}/api/dashboard?organizationId=${payrollSession.organizationId}`,
            );
            check(dashboardResponse.ok(), "Lifecycle: payroll dashboard API failed");
            const dashboard = await dashboardResponse.json();
            const run = dashboard.payrollRuns.find((item) => item.periodLabel === period);
            check(run, `Lifecycle: ${period} run is missing`);
            check(run.status === "Needs review", `Lifecycle: expected Needs review before submission, saw ${run.status}`);

            const approversResponse = await context.request.get(
              `${base}/api/organizations/${dashboard.selectedOrganization.id}/payroll-approvers`,
            );
            check(approversResponse.ok(), "Lifecycle: checker list could not be loaded");
            const approvers = await approversResponse.json();
            const checker = approvers.approvers.find((item) => item.role === "checker" || item.name === "Mariel Santos");
            check(checker, "Lifecycle: seeded checker is missing");

            const submitResponse = await context.request.post(`${base}/api/payroll-runs/${run.id}/submit-review`, {
              data: { approverUserId: checker.id },
              headers: sameOriginHeaders,
            });
            const submitPayload = await submitResponse.json();
            check(submitResponse.ok(), `Lifecycle: review submission failed: ${submitPayload.error ?? submitResponse.status()}`);
            check(submitPayload.task?.id, "Lifecycle: review submission returned no approval task");
            await page.reload({ waitUntil: "networkidle" });
            const payrollNotifications = await notificationText(page);
            check(!payrollNotifications.includes("Resolve 2 payroll exceptions"), "Lifecycle: payroll exception notification should disappear after submission");

            await switchPersona(context, page, "checker");
            const checkerNotificationsBefore = await notificationText(page);
            check(checkerNotificationsBefore.includes(`Review ${period} payroll`), "Lifecycle: checker did not receive the submitted payroll notification");

            const approveResponse = await context.request.patch(`${base}/api/approvals/${submitPayload.task.id}`, {
              data: { status: "Approved" },
              headers: sameOriginHeaders,
            });
            const approvePayload = await approveResponse.json();
            check(approveResponse.ok(), `Lifecycle: checker approval failed: ${approvePayload.error ?? approveResponse.status()}`);
            await page.reload({ waitUntil: "networkidle" });
            const checkerNotificationsAfter = await notificationText(page);
            check(!checkerNotificationsAfter.includes(`Review ${period} payroll`), "Lifecycle: checker notification should disappear after approval");

            const ownerSession = await switchPersona(context, page, "owner");
            const ownerNotificationsBefore = await notificationText(page);
            check(ownerNotificationsBefore.includes(`${period} is approved and ready to release`), "Lifecycle: owner did not receive release-ready notification");

            const releaseResponse = await context.request.post(`${base}/api/payroll-runs/${run.id}/release`, {
              data: { acknowledgeExceptions: true },
              headers: sameOriginHeaders,
            });
            const releasePayload = await releaseResponse.json();
            check(releaseResponse.ok(), `Lifecycle: owner release failed: ${releasePayload.error ?? releaseResponse.status()}`);
            check(releasePayload.receipt?.employeeCount > 0, "Lifecycle: release receipt is missing employee count");
            check(Number(releasePayload.receipt?.totalNetPay) > 0, "Lifecycle: release receipt is missing net payroll");
            check(releasePayload.receipt?.bankExport?.status === "waiting", "Lifecycle: optional bank fallback should remain unused after release");
            check(releasePayload.receipt?.payout?.status === "awaiting-preflight", "Lifecycle: PayMongo payout should require preflight immediately after release");
            check(releasePayload.receipt?.payslips?.available > 0, "Lifecycle: payslip availability is missing");

            await page.reload({ waitUntil: "networkidle" });
            const ownerNotificationsAfter = await notificationText(page);
            check(!ownerNotificationsAfter.includes(`${period} is approved and ready to release`), "Lifecycle: owner release notification should disappear after release");

            const payrollNav = page.locator("button.nav-item").filter({ hasText: /^Payroll/ }).first();
            check((await payrollNav.count()) === 1, "Lifecycle: owner payroll navigation is missing");
            await payrollNav.click();
            await page.waitForTimeout(200);
            const runButton = page.locator("button.run-item").filter({ hasText: period }).first();
            check((await runButton.count()) === 1, "Lifecycle: released run is missing from payroll history");
            await runButton.click();
            await page.waitForTimeout(150);
            const receipt = page.locator("[data-release-receipt]");
            check((await receipt.count()) === 1, "Lifecycle: persistent owner release receipt is missing");
            const receiptText = (await receipt.innerText()).toLowerCase();
            check(receiptText.includes("total net payroll"), "Lifecycle: release receipt does not show net payroll");
            check(receiptText.includes("bank-file fallback"), "Lifecycle: release receipt does not show the optional bank-file fallback");
            check(receiptText.includes("payslip delivery"), "Lifecycle: release receipt does not show payslip delivery status");
            check(receiptText.includes(String(releasePayload.receipt.employeeCount)), "Lifecycle: release receipt does not show employee count");
            check(
              receiptText.includes(Number(releasePayload.receipt.totalNetPay).toLocaleString("en-PH")),
              "Lifecycle: release receipt does not show the released net total",
            );
            check(receiptText.includes("paymongo"), "Lifecycle: release receipt should identify PayMongo as the primary payout rail");
            check((await receipt.locator('[data-payout-status="awaiting-preflight"]').count()) === 1, "Lifecycle: payout state should require PayMongo preflight");

            // Bank files are optional fallback only. This lifecycle stops at
            // the PayMongo preflight gate in the redacted demo because the QA
            // environment intentionally has no live payout credentials.
            check(
              (await receipt.locator('[data-payout-status="awaiting-preflight"]').count()) === 1,
              "Lifecycle: released payroll should remain at the PayMongo preflight gate until provider credentials are connected",
            );

            await switchPersona(context, page, "employee");
            const latest = page.locator("[data-latest-payslip]");
            check((await latest.count()) === 1, "Lifecycle: employee latest payslip card is missing after release");
            const latestText = await latest.innerText();
            check(/Payslip available|payslip is ready/i.test(latestText), "Lifecycle: employee does not see the released payslip state");
            check(latestText.includes(period), "Lifecycle: newly released payslip is not promoted above history");

            check(errors.length === 0, `Lifecycle: browser console/page errors: ${errors.join(" | ")}`);
            report.personas.push({
              id: "release-cycle",
              label: "HR → Payroll → Checker → Owner → PayMongo preflight gate → Employee",
              period,
              firstTask: "passed",
              errors,
            });
            await context.close();
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            try {
              await qaHomepage(browser, "desktop", { width: 1440, height: 1000 });
              await qaHomepage(browser, "mobile-390", { width: 390, height: 844 });
              await qaHomepage(browser, "mobile-375", { width: 375, height: 812 });
              await qaPublicRoutes(browser);
              await qaRolePicker(browser, "desktop", { width: 1440, height: 1000 });
              await qaRolePicker(browser, "mobile-390", { width: 390, height: 844 });

              for (const persona of personas) {
                await qaPersona(browser, persona);
              }

              await qaEmployeeLogout(browser);
              await qaReleaseCycle(browser);
            } catch (error) {
              report.errors.push(error instanceof Error ? error.message : String(error));
              throw error;
            } finally {
              fs.writeFileSync(`${outDir}/report.json`, JSON.stringify(report, null, 2));
              await browser.close();
            }
          })();
          JS

          node preview-qa.cjs

      # All synthetic HTTP mutations are confined to the disposable CI Postgres
      # service. The script rejects remote URLs and unknown database targets.
      - name: Verify ESS Web Bundy employee and tenant isolation with synthetic HTTP
        env:
          CI: "true"
          SYNTHETIC_WFM_HTTP_REHEARSAL: isolated-ci-only
        run: node scripts/verify-ess-web-bundy-synthetic.mjs

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/payrollph-next.log || true

      - name: Upload browser QA artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: payrollph-preview-browser-qa
          path: qa-artifacts/
          retention-days: 3
