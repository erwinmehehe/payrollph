name: Marketing Browser QA

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - "src/components/marketing/**"
      - "src/app/workspace-theme.css"
      - "src/components/workspace/**"
      - "src/components/linaw-workspace.tsx"
      - "src/components/self-service-portal.tsx"
      - "src/components/demo-sandbox-bar.tsx"
      - "src/app/page.tsx"
      - "src/app/app/page.tsx"
      - "src/app/workspace/page.tsx"
      - "src/app/api/auth/demo-switch/route.ts"
      - "src/db/public-demo.ts"
      - "src/db/seed.ts"
      - "src/lib/demo-host.ts"
      - "src/lib/security-request.ts"
      - "src/lib/core-schema-compat.ts"
      - "src/lib/bank-account-crypto.ts"
      - "src/app/api/readiness/route.ts"
      - "src/lib/pricing-catalog.ts"
      - "src/lib/demo-roles.ts"
      - "package.json"
      - "package-lock.json"
      - "tests/marketing.test.ts"
      - "tests/demo-sandbox.test.ts"
      - ".github/workflows/preview-browser-qa.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
      DEMO_MODE: "false"
      APP_BASE_URL: "http://localhost:3000"
      TRUSTED_APP_ORIGINS: "http://localhost:3000"
      TOTP_ENCRYPTION_KEY: "2222222222222222222222222222222222222222222222222222222222222222"
      # Browser QA exercises privileged lifecycle behavior using isolated demo data.
      # Security HTTP Smoke separately verifies that production MFA enforcement fails closed.
      REQUIRE_PRIVILEGED_MFA: "false"
      QA_URL: http://localhost:3000
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run db:push
      - run: npx next build

      - name: Install Playwright for browser QA
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start production build
        shell: bash
        run: |
          nohup npm start -- -H 127.0.0.1 > /tmp/payrollph-next.log 2>&1 &
          echo $! > /tmp/payrollph-next.pid
          for attempt in {1..40}; do
            if curl -fsS "$QA_URL" >/tmp/homepage.html; then
              echo "Production build is reachable."
              exit 0
            fi
            sleep 2
          done
          cat /tmp/payrollph-next.log
          exit 1

      - name: Run Chromium homepage and persona QA
        shell: bash
        run: |
          cat > preview-qa.cjs <<'JS'
          const fs = require("node:fs");
          const { chromium } = require("playwright");

          const base = process.env.QA_URL;
          const outDir = "qa-artifacts";
          fs.mkdirSync(outDir, { recursive: true });

          const report = {
            base,
            homepage: [],
            modules: [],
            pricing: [],
            publicRoutes: [],
            personas: [],
            errors: [],
          };

          function check(condition, message) {
            if (!condition) throw new Error(message);
          }

          function attachErrorCollection(page, bucket) {
            page.on("pageerror", (error) => bucket.push(`pageerror: ${error.message}`));
            page.on("console", (message) => {
              if (message.type() === "error") bucket.push(`console: ${message.text()}`);
            });
          }

          async function qaHomepage(browser, name, viewport) {
            const context = await browser.newContext({ viewport });
            const page = await context.newPage();
            const errors = [];
            attachErrorCollection(page, errors);

            const response = await page.goto(base, { waitUntil: "networkidle", timeout: 90000 });
            check(response && response.ok(), `${name}: homepage did not return 2xx`);

            const h1 = (await page.locator("h1").first().innerText()).trim();
            check(h1.includes("Philippine payroll you can verify before you pay."), `${name}: expected Linaw payroll hero heading not found; saw "${h1}"`);
            const heroPrimary = page.locator(".hero-primary-cta");
            check((await heroPrimary.count()) === 1, `${name}: hero primary CTA is missing`);
            const heroPrimaryStyles = await heroPrimary.evaluate((el) => {
              const style = getComputedStyle(el);
              return { color: style.color, backgroundColor: style.backgroundColor };
            });
            check(heroPrimaryStyles.color === "rgb(255, 255, 255)", `${name}: hero primary CTA text lost white contrast; saw ${heroPrimaryStyles.color}`);
            check(heroPrimaryStyles.backgroundColor !== "rgba(0, 0, 0, 0)" && heroPrimaryStyles.backgroundColor !== "rgb(255, 255, 255)", `${name}: hero primary CTA background lost contrast; saw ${heroPrimaryStyles.backgroundColor}`);
            if (name === "desktop") {
              const primaryNav = page.getByRole("navigation", { name: "Primary" });
              check((await primaryNav.getByRole("link", { name: "Live demo", exact: true }).getAttribute("href")) === "/demo", "desktop: primary nav does not expose role-based demo");
              check((await primaryNav.getByRole("link", { name: "Payroll outsourcing", exact: true }).getAttribute("href")) === "/payroll-outsourcing", "desktop: primary nav does not expose payroll outsourcing");
              check((await primaryNav.getByRole("link", { name: "Trust", exact: true }).getAttribute("href")) === "/trust", "desktop: primary nav does not expose trust center");
              check((await primaryNav.getByRole("link", { name: "Pricing", exact: true }).getAttribute("href")) === "/pricing", "desktop: primary nav does not expose dedicated pricing page");
            } else {
              const menu = page.getByRole("button", { name: "Open menu" });
              check((await menu.count()) === 1, "mobile-390: menu button is missing");
              await menu.click();
              const mobileHeader = page.getByRole("banner");
              check((await mobileHeader.getByRole("link", { name: "Live demo", exact: true }).getAttribute("href")) === "/demo", "mobile-390: menu does not expose role-based demo");
              check((await mobileHeader.getByRole("link", { name: "Payroll outsourcing", exact: true }).getAttribute("href")) === "/payroll-outsourcing", "mobile-390: menu does not expose payroll outsourcing");
              check((await mobileHeader.getByRole("link", { name: "Trust", exact: true }).getAttribute("href")) === "/trust", "mobile-390: menu does not expose trust center");
              check((await mobileHeader.getByRole("link", { name: "Pricing", exact: true }).getAttribute("href")) === "/pricing", "mobile-390: menu does not expose dedicated pricing page");
              await page.getByRole("button", { name: "Close menu" }).click();
            }

            const overflow = await page.evaluate(() => ({
              scrollWidth: document.documentElement.scrollWidth,
              innerWidth: window.innerWidth,
            }));
            check(
              overflow.scrollWidth <= overflow.innerWidth + 1,
              `${name}: horizontal overflow ${overflow.scrollWidth}px > ${overflow.innerWidth}px`,
            );

            await page.screenshot({
              path: `${outDir}/homepage-${name}.png`,
              fullPage: true,
            });

            report.homepage.push({ name, viewport, h1, overflow, errors: [...errors] });

            const pricing = page.locator("#pricing");
            check((await pricing.count()) === 1, `${name}: pricing section is missing`);
            const planRows = pricing.locator(".pricing-plan-card");
            check((await planRows.count()) === 3, `${name}: expected three business pricing cards`);

            const firstAmount = (await planRows.first().locator(".pricing-amount").innerText()).trim();
            const fiftyPreset = pricing.locator('button[data-headcount="50"]').first();
            check((await fiftyPreset.count()) === 1, `${name}: 50 employee pricing preset is missing`);
            await fiftyPreset.click();
            await page.waitForTimeout(100);
            const updatedAmount = (await planRows.first().locator(".pricing-amount").innerText()).trim();
            check(firstAmount !== updatedAmount, `${name}: pricing estimate did not update after changing headcount`);
            check((await pricing.innerText()).includes("50 employees"), `${name}: pricing estimator did not show 50 employees`);
            report.pricing.push({ name, rows: 3, headcount: 50, firstAmount, updatedAmount });

            if (name === "desktop") {
              const hero = page.locator("#top");
              check((await hero.locator(".payroll-hero-control-card").count()) === 1, "desktop: release-readiness proof card is missing");
              check((await hero.getByRole("heading", { name: "Can I safely release this payroll?" }).count()) === 1, "desktop: release-readiness question is missing");
              check((await hero.locator(".payroll-hero-owl").count()) === 0, "desktop: homepage mascot must stay removed");
              check((await hero.locator(".payroll-hero-speech").count()) === 0, "desktop: mascot speech bubble must stay removed");
              check((await hero.locator(".payroll-home-trust li").count()) === 3, "desktop: hero trust list must expose three proof points");

              const demo = page.locator("#demo");
              check((await demo.count()) === 1, "desktop: live demo section is missing");
              check((await demo.getByText("Interactive payroll workflow").count()) === 1, "desktop: payroll workflow preview chrome did not render");
              const systemPreview = demo.locator(".system-demo-product .frame.standalone");
              check((await systemPreview.count()) === 1, "desktop: shared Linaw workspace preview did not render");
              const previewNav = systemPreview.locator(".nav-item");
              check((await previewNav.count()) >= 8, "desktop: real workspace navigation is unexpectedly sparse");
              const peopleNav = previewNav.filter({ hasText: /^People/ }).first();
              check((await peopleNav.count()) === 1, "desktop: People module is missing from the real-system preview");
              await peopleNav.click();
              await page.waitForTimeout(100);
              check((await peopleNav.getAttribute("aria-current")) === "page", "desktop: real-system preview navigation did not update");
              const peopleShell = systemPreview.locator(".preview-people-shell");
              check((await peopleShell.count()) === 1, "desktop: People preview shell is missing");
              const firstPersonRow = peopleShell.locator(".preview-person-row").first();
              check((await firstPersonRow.count()) === 1, "desktop: People preview rows are missing");
              const personRowStyles = await firstPersonRow.evaluate((element) => ({
                display: getComputedStyle(element).display,
                columns: getComputedStyle(element).gridTemplateColumns,
                width: element.getBoundingClientRect().width,
                scrollWidth: element.scrollWidth,
              }));
              check(personRowStyles.display === "grid", `desktop: People preview row styling did not load; display=${personRowStyles.display}`);
              check(personRowStyles.columns !== "none", "desktop: People preview row has no grid columns");
              check(personRowStyles.scrollWidth <= personRowStyles.width + 1, `desktop: People preview row overflows ${personRowStyles.scrollWidth}px > ${personRowStyles.width}px`);
              check((await peopleShell.locator(".preview-people-summary").count()) === 1, "desktop: People summary is missing");
              check((await peopleShell.locator(".preview-people-controls").count()) === 1, "desktop: People filters/search are missing");

              const migrationNav = previewNav.filter({ hasText: /^Migration/ }).first();
              check((await migrationNav.count()) === 1, "desktop: Migration module is missing from the real-system preview");
              await migrationNav.click();
              await page.waitForTimeout(100);
              const migrationCard = systemPreview.locator(".preview-migration-card");
              check((await migrationCard.count()) === 1, "desktop: Migration preview card is missing");
              const migrationStep = migrationCard.locator(".preview-migration-step").first();
              const migrationStyles = await migrationStep.evaluate((element) => ({
                display: getComputedStyle(element).display,
                columns: getComputedStyle(element).gridTemplateColumns,
                width: element.getBoundingClientRect().width,
                scrollWidth: element.scrollWidth,
              }));
              check(migrationStyles.display === "grid", `desktop: Migration preview styling did not load; display=${migrationStyles.display}`);
              check(migrationStyles.columns !== "none", "desktop: Migration preview has no grid columns");
              check(migrationStyles.scrollWidth <= migrationStyles.width + 1, `desktop: Migration preview overflows ${migrationStyles.scrollWidth}px > ${migrationStyles.width}px`);
              check((await demo.getByRole("link", { name: /Open role-based sandbox/i }).count()) === 1, "desktop: role-based sandbox handoff is missing");
              report.modules.push({ module: "Release-readiness hero", active: true });
              report.modules.push({ module: "Shared Linaw workspace preview", active: true });
            }

            if (name === "mobile-390") {
              const normalizedHeading = h1.replace(/\s+/g, " ");
              check(
                normalizedHeading.includes("Philippine payroll you can verify before you pay."),
                `mobile-390: hero words collided after responsive line-break removal; saw "${normalizedHeading}"`,
              );

              const mobileHero = page.locator("#top");
              const mobileControlCard = mobileHero.locator(".payroll-hero-control-card").first();
              check((await mobileControlCard.count()) === 1, "mobile-390: release-readiness proof card is missing");
              const controlFit = await mobileControlCard.evaluate((element) => ({
                clientWidth: element.clientWidth,
                scrollWidth: element.scrollWidth,
              }));
              check(
                controlFit.scrollWidth <= controlFit.clientWidth + 1,
                `mobile-390: release-readiness card clips ${controlFit.scrollWidth}px > ${controlFit.clientWidth}px`,
              );
              const securityProof = page.locator("#security article").first();
              const securityHeading = securityProof.getByRole("heading", { name: "One workspace can never read another's payroll." });
              const securityCopy = securityProof.locator("p").filter({ hasText: "Every session route passes one shared membership gate." }).first();

              check(
                !(await pricing.innerText()).includes("No credit card to start") &&
                  !(await pricing.innerText()).includes("Cancel anytime"),
                "mobile-390: stale self-serve pricing promises returned",
              );

              const closingCta = page.locator("#cta");
              const trialCta = closingCta.locator('a[href="/signup"]').first();
              check((await trialCta.count()) === 1, "mobile-390: trial access CTA is missing");
              const trialCtaStyles = await trialCta.evaluate((element) => ({
                color: getComputedStyle(element).color,
                backgroundColor: getComputedStyle(element).backgroundColor,
              }));
              check(
                trialCtaStyles.color === "rgb(17, 20, 31)",
                `mobile-390: trial CTA text lost dark contrast on white; saw ${trialCtaStyles.color}`,
              );
              check(
                trialCtaStyles.backgroundColor === "rgb(255, 255, 255)",
                `mobile-390: trial CTA background is not white; saw ${trialCtaStyles.backgroundColor}`,
              );

              await mobileHero.screenshot({ path: `${outDir}/homepage-mobile-390-hero.png` });
              await pricing.screenshot({ path: `${outDir}/homepage-mobile-390-pricing.png` });
              await securityProof.screenshot({ path: `${outDir}/homepage-mobile-390-security.png` });
              await closingCta.screenshot({ path: `${outDir}/homepage-mobile-390-cta.png` });

              for (const [label, locator] of [["heading", securityHeading], ["copy", securityCopy]]) {
                check((await locator.count()) === 1, `mobile-390: security proof ${label} is missing`);
                const fit = await locator.evaluate((element) => {
                  const article = element.closest("article");
                  const rect = element.getBoundingClientRect();
                  const parentRect = article?.getBoundingClientRect();
                  return {
                    clientWidth: element.clientWidth,
                    scrollWidth: element.scrollWidth,
                    left: rect.left,
                    right: rect.right,
                    parentLeft: parentRect?.left ?? rect.left,
                    parentRight: parentRect?.right ?? rect.right,
                  };
                });
                check(
                  fit.scrollWidth <= fit.clientWidth + 1 &&
                    fit.left >= fit.parentLeft - 1 &&
                    fit.right <= fit.parentRight + 1,
                  `mobile-390: security proof ${label} is clipped inside its card`,
                );
              }
            }

            check(errors.length === 0, `${name}: browser console/page errors: ${errors.join(" | ")}`);
            await context.close();
          }

          async function qaPublicRoutes(browser) {
            const routes = [
              { path: "/demo", heading: "See Linaw from the seat you actually use." },
              { path: "/signup", heading: "Request access to a Linaw trial workspace." },
              { path: "/payroll-outsourcing", heading: "Payroll outsourcing in the Philippines, without losing control." },
              { path: "/small-business-payroll", heading: "A clearer payroll process for Philippine small businesses." },
              { path: "/resources", heading: "Practical guidance for buying, migrating and operating Philippine payroll." },
              { path: "/industries", heading: "Payroll workflows shaped by how your workforce actually operates." },
              { path: "/calculators", heading: "Start with the payroll question you need to estimate." },
              { path: "/compliance", heading: "Compliance support with evidence, validation states and fewer hidden assumptions." },
              { path: "/industries/construction", heading: "Payroll and timekeeping for Philippine construction teams." },
              { path: "/industries/logistics", heading: "Payroll and timekeeping for Philippine logistics teams." },
              { path: "/book-demo", heading: "Bring your actual payroll questions." },
              { path: "/status", heading: "Linaw system status." },
              { path: "/scorecard", heading: "Verified claims only." },
              { path: "/login", heading: "Welcome back." },
              { path: "/invite", heading: "Join your team on Linaw." },
              { path: "/reset-password", heading: "Set a new password." },
              { path: "/verify-email", heading: "Verify your new email." },
            ];

            const context = await browser.newContext({ viewport: { width: 1280, height: 900 } });
            const page = await context.newPage();

            for (const route of routes) {
              const errors = [];
              const pageError = (error) => errors.push(`pageerror: ${error.message}`);
              const consoleError = (message) => {
                if (message.type() === "error") errors.push(`console: ${message.text()}`);
              };
              page.on("pageerror", pageError);
              page.on("console", consoleError);

              const response = await page.goto(`${base}${route.path}`, { waitUntil: "networkidle", timeout: 90000 });
              check(response && response.ok(), `${route.path}: did not return 2xx`);

              const h1 = (await page.locator("h1").first().innerText()).trim();
              check(h1.includes(route.heading), `${route.path}: expected heading "${route.heading}" not found; saw "${h1}"`);
              check((await page.getByRole("navigation", { name: "Primary" }).count()) >= 1, `${route.path}: shared primary navigation is missing`);
              if (route.path === "/login") {
                check((await page.locator("footer").count()) === 0, "/login: marketing footer should not distract from authentication");
              } else {
                check((await page.locator("footer").count()) >= 1, `${route.path}: shared footer is missing`);
              }

              const overflow = await page.evaluate(() => ({
                scrollWidth: document.documentElement.scrollWidth,
                innerWidth: window.innerWidth,
              }));
              check(
                overflow.scrollWidth <= overflow.innerWidth + 1,
                `${route.path}: horizontal overflow ${overflow.scrollWidth}px > ${overflow.innerWidth}px`,
              );
              check(errors.length === 0, `${route.path}: browser console/page errors: ${errors.join(" | ")}`);

              report.publicRoutes.push({ path: route.path, h1, overflow, errors: [...errors] });
              if (route.path === "/login") {
                const signInButton = page.getByRole("button", { name: /^Sign in$/ });
                check((await signInButton.count()) === 1, "/login: primary sign-in button is missing");
                const signInStyles = await signInButton.evaluate((element) => ({
                  backgroundColor: getComputedStyle(element).backgroundColor,
                  color: getComputedStyle(element).color,
                  borderRadius: getComputedStyle(element).borderRadius,
                }));
                check(signInStyles.backgroundColor === "rgb(97, 97, 255)", `/login: primary CTA lost Linaw indigo; saw ${signInStyles.backgroundColor}`);
                check(signInStyles.color === "rgb(255, 255, 255)", `/login: primary CTA text lost contrast; saw ${signInStyles.color}`);
                check((await page.locator('[data-testid="password-visibility"]').count()) === 1, "/login: password visibility control is missing");
                await page.screenshot({ path: `${outDir}/login-desktop.png`, fullPage: true });

                await page.setViewportSize({ width: 390, height: 844 });
                await page.waitForTimeout(100);
                const mobileOverflow = await page.evaluate(() => ({
                  scrollWidth: document.documentElement.scrollWidth,
                  innerWidth: window.innerWidth,
                }));
                check(mobileOverflow.scrollWidth <= mobileOverflow.innerWidth + 1, `/login: mobile horizontal overflow ${mobileOverflow.scrollWidth}px > ${mobileOverflow.innerWidth}px`);
                const formHeading = page.getByRole("heading", { name: "Welcome back." });
                check((await formHeading.count()) === 1, "/login: mobile auth heading is missing");
                const supportHeading = page.locator("h2").filter({ hasText: "Sign in to Linaw." }).first();
                check((await supportHeading.count()) === 1, "/login: desktop support heading is missing from the DOM");
                check((await supportHeading.isVisible()) === false, "/login: supporting marketing panel should stay hidden on mobile");
                await page.screenshot({ path: `${outDir}/login-mobile-390.png`, fullPage: true });
                await page.setViewportSize({ width: 1280, height: 900 });
              }
              page.off("pageerror", pageError);
              page.off("console", consoleError);
            }

            await page.goto(`${base}/demo`, { waitUntil: "networkidle", timeout: 90000 });
            const outsourcingLink = page.getByRole("link", { name: "Payroll outsourcing" }).first();
            check((await outsourcingLink.count()) === 1, "/demo: Outsourcing nav link is missing");
            await outsourcingLink.click();
            await page.waitForURL(new RegExp("/payroll-outsourcing(?:$|[?#])"), { timeout: 30000 });
            check(new URL(page.url()).pathname === "/payroll-outsourcing", "/demo: shared navigation did not reach payroll outsourcing");

            await context.close();
          }

          const personas = [
            { id: "owner", label: "Owner", short: "Owner", person: "Andrea Lim", landing: "Good morning, Andrea", taskPage: "Overview", dashboardRole: "owner" },
            { id: "hr", label: "HR Admin", short: "HR Admin", person: "Aira Villanueva", landing: "Good morning, Aira", taskPage: "People", dashboardRole: "hr" },
            { id: "payroll", label: "Payroll Officer", short: "Payroll", person: "Paolo Cruz", landing: "Good morning, Paolo", taskPage: "Payroll", dashboardRole: "payroll" },
            { id: "checker", label: "Checker", short: "Checker", person: "Mariel Santos", landing: "Good morning, Mariel", taskPage: "Reviews", dashboardRole: "checker" },
            { id: "bookkeeper", label: "Bookkeeper", short: "Bookkeeper", person: "Bea Navarro", landing: "Good morning, Bea", taskPage: "Exports", dashboardRole: "bookkeeper" },
            { id: "employee", label: "Employee", short: "Employee", person: "Jonas Reyes", landing: "My pay", taskPage: "My pay", dashboardRole: null },
          ];

          async function inspectPersonaViewport(page, persona, width, height, suffix) {
            await page.setViewportSize({ width, height });
            await page.waitForTimeout(120);

            const overflow = await page.evaluate(() => ({
              scrollWidth: document.documentElement.scrollWidth,
              innerWidth: window.innerWidth,
            }));
            check(
              overflow.scrollWidth <= overflow.innerWidth + 1,
              `${persona.label}: ${suffix} horizontal overflow ${overflow.scrollWidth}px > ${overflow.innerWidth}px`,
            );

            const sandbox = page.locator("section.demo-sandbox").first();
            if (await sandbox.count()) {
            const sandboxLayout = await sandbox.evaluate((element) => {
              const rect = element.getBoundingClientRect();
              return {
                left: rect.left,
                right: rect.right,
                scrollWidth: element.scrollWidth,
                clientWidth: element.clientWidth,
              };
            });
            check(sandboxLayout.left >= -1, `${persona.label}: ${suffix} sandbox escapes the left viewport edge`);
            check(sandboxLayout.right <= width + 1, `${persona.label}: ${suffix} sandbox escapes the right viewport edge`);
            check(
              sandboxLayout.scrollWidth <= sandboxLayout.clientWidth + 1,
              `${persona.label}: ${suffix} sandbox clips internally`,
            );

            }

            const responsiveControls = page.locator(".demo-role-button, .demo-access-chip, .demo-task-card");
            for (const control of await responsiveControls.all()) {
              if (!(await control.isVisible())) continue;
              const layout = await control.evaluate((element) => ({
                scrollWidth: element.scrollWidth,
                clientWidth: element.clientWidth,
              }));
              check(
                layout.scrollWidth <= layout.clientWidth + 1,
                `${persona.label}: ${suffix} sandbox control clips ${layout.scrollWidth}px > ${layout.clientWidth}px`,
              );
            }

            const handoffs = page.locator("[data-payroll-handoff]");
            for (const handoff of await handoffs.all()) {
              if (!(await handoff.isVisible())) continue;
              const layout = await handoff.evaluate((element) => ({
                scrollWidth: element.scrollWidth,
                clientWidth: element.clientWidth,
              }));
              check(
                layout.scrollWidth <= layout.clientWidth + 1,
                `${persona.label}: ${suffix} payroll handoff clips ${layout.scrollWidth}px > ${layout.clientWidth}px`,
              );
            }

            const topbar = page.locator(".topbar").first();
            if (await topbar.count()) {
              const layout = await topbar.evaluate((element) => ({
                scrollWidth: element.scrollWidth,
                clientWidth: element.clientWidth,
              }));
              check(
                layout.scrollWidth <= layout.clientWidth + 1,
                `${persona.label}: ${suffix} topbar clips ${layout.scrollWidth}px > ${layout.clientWidth}px`,
              );
            }

            if (persona.id === "employee") {
              if (width <= 768) {
                const mobileTabs = page.locator(".employee-tabs").first();
                check((await mobileTabs.count()) === 1, "Employee: mobile bottom navigation is missing");
                check(await mobileTabs.isVisible(), `Employee: ${suffix} mobile bottom navigation is not visible`);
              }
              const employeeActions = page.locator(".employee-self-service-actions").first();
              check((await employeeActions.count()) === 1, "Employee: responsive header actions are missing");
              const actionLayout = await employeeActions.evaluate((element) => ({
                scrollWidth: element.scrollWidth,
                clientWidth: element.clientWidth,
              }));
              check(
                actionLayout.scrollWidth <= actionLayout.clientWidth + 1,
                `Employee: ${suffix} header actions clip ${actionLayout.scrollWidth}px > ${actionLayout.clientWidth}px`,
              );
            } else if (width <= 768) {
              const drawerButton = page.getByRole("button", { name: "Open navigation" }).first();
              check((await drawerButton.count()) === 1, `${persona.label}: ${suffix} mobile/tablet navigation trigger is missing`);
              check(await drawerButton.isVisible(), `${persona.label}: ${suffix} navigation trigger is not visible`);
              const mobileNav = page.locator(".mobile-bottom-nav").first();
              check((await mobileNav.count()) === 1, `${persona.label}: ${suffix} bottom navigation is missing`);
              check(await mobileNav.isVisible(), `${persona.label}: ${suffix} bottom navigation is not visible`);
            }

            await page.screenshot({
              path: `${outDir}/persona-${persona.id}-landing-${suffix}.png`,
              fullPage: true,
            });
          }

          async function qaPersona(browser, persona) {
            const context = await browser.newContext({ viewport: { width: 1440, height: 1000 } });
            const page = await context.newPage();
            const errors = [];
            attachErrorCollection(page, errors);

            const demoResponse = await page.goto(`${base}/demo`, { waitUntil: "networkidle", timeout: 90000 });
            check(demoResponse && demoResponse.ok(), `${persona.label}: /demo did not return 2xx`);

            const roleTab = page.getByRole("tab").filter({ hasText: persona.label }).first();
            check((await roleTab.count()) === 1, `${persona.label}: role tab is missing`);
            await roleTab.click();

            const openButton = page.getByRole("button", { name: new RegExp(`^Open ${persona.short} demo`, "i") });
            check((await openButton.count()) === 1, `${persona.label}: launch button is missing`);

            const [switchResponse] = await Promise.all([
              page.waitForResponse(
                (response) =>
                  response.url().includes("/api/auth/demo-switch") &&
                  response.request().method() === "POST",
                { timeout: 90000 },
              ),
              openButton.click(),
            ]);
            if (!switchResponse.ok()) {
              const switchText = await switchResponse.text().catch(() => "<response body unavailable>");
              throw new Error(`${persona.label}: demo switch returned ${switchResponse.status()} ${switchText}`);
            }
            await page.waitForURL(new RegExp(`[?&]demoRole=${persona.id}(?:&|$)`), { timeout: 30000 });
            const demoProbe = await context.request.post(`${base}/api/auth/demo-switch`, {
              data: { role: persona.id },
              headers: { Origin: base },
            });
            check(demoProbe.ok(), `${persona.label}: redacted demo probe returned ${demoProbe.status()}`);
            const demoPayload = await demoProbe.json();
            check(demoPayload.demoDataMode === "synthetic-redacted", `${persona.label}: demo is not using the redacted data contract`);
            check(demoPayload.sensitiveFieldsPersisted === false, `${persona.label}: demo claims sensitive fields are persisted`);
            await page.waitForLoadState("networkidle");

            const body = (await page.locator("body").textContent()) ?? "";
            check(body.includes(persona.person), `${persona.label}: expected persona identity ${persona.person} is missing`);
            check(body.toLowerCase().includes(persona.landing.toLowerCase()), `${persona.label}: expected landing context ${persona.landing} is missing`);

            if (persona.id === "owner") {
              check(new URL(page.url()).pathname === "/app", "Owner: demo must land on /app, not replace the homepage");
              const marketingPage = await context.newPage();
              const marketingResponse = await marketingPage.goto(base, { waitUntil: "networkidle", timeout: 90000 });
              check(marketingResponse && marketingResponse.ok(), "Owner: signed-in visit to / did not return 2xx");
              const marketingH1 = (await marketingPage.locator("h1").first().innerText()).trim();
              check(marketingH1.includes("Philippine payroll you can verify before you pay."), `Owner: signed-in / should stay on the Linaw marketing homepage; saw "${marketingH1}"`);
              await marketingPage.close();

              const legacyPage = await context.newPage();
              const legacyResponse = await legacyPage.goto(`${base}/workspace?demoRole=owner`, { waitUntil: "networkidle", timeout: 90000 });
              check(legacyResponse && legacyResponse.ok(), "Owner: legacy /workspace redirect did not resolve");
              const legacyUrl = new URL(legacyPage.url());
              check(legacyUrl.pathname === "/app", `Owner: legacy /workspace should redirect to /app; saw ${legacyUrl.pathname}`);
              check(legacyUrl.searchParams.get("demoRole") === "owner", "Owner: legacy /workspace redirect dropped demoRole");
              await legacyPage.close();

              const tonedItems = page.locator("aside .nav-item[data-tone]");
              check((await tonedItems.count()) >= 5, "Owner: real sidebar is missing module tone data");
              const firstIcon = tonedItems.nth(0).locator(".nav-icon");
              const secondIcon = tonedItems.nth(1).locator(".nav-icon");
              const iconColors = await Promise.all([
                firstIcon.evaluate((element) => ({
                  color: getComputedStyle(element).color,
                  background: getComputedStyle(element).backgroundColor,
                })),
                secondIcon.evaluate((element) => ({
                  color: getComputedStyle(element).color,
                  background: getComputedStyle(element).backgroundColor,
                })),
              ]);
              check(iconColors[0].color !== iconColors[1].color, "Owner: sidebar module icons were flattened to one color");
              check(iconColors[0].background !== "rgba(0, 0, 0, 0)", "Owner: sidebar icon tint background is transparent");

              const profile = page.locator("aside .side-profile");
              check((await profile.count()) === 1, "Owner: interactive profile control is missing");
              const profileAvatar = profile.locator(".avatar").first();
              const avatarBackground = await profileAvatar.evaluate((element) => getComputedStyle(element).backgroundColor);
              check(avatarBackground !== "rgb(238, 238, 239)", "Owner: profile avatar is still the old gray placeholder");
