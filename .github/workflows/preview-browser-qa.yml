name: Marketing Browser QA

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      # Stacked ESS and billing PRs also require browser/security assurance.
      - feat/hcm-work-item-ownership-sla
      - ui/ess-mobile-ux
      # Stacked Phase 2 UI PR is reviewed against the Phase 1 feature branch.
      - design/gusto-inspired-ux-2026-10-11
    paths:
      - "src/components/marketing/**"
      - "src/app/workspace-theme.css"
      - "src/app/phase-two.css"
      - "src/lib/payroll-workflow-presentation.ts"
      - "src/lib/workspace-approval-eligibility.ts"
      - "tests/payroll-approvals-phase-two.test.ts"
      - "src/components/workspace/**"
      - "src/components/linaw-workspace.tsx"
      - "src/components/self-service-portal.tsx"
      - "src/components/web-bundy-modal.tsx"
      - "src/lib/web-bundy-display-scope.ts"
      - "tests/web-bundy-display-scope.test.ts"
      - "src/app/api/web-bundy/route.ts"
      - "scripts/verify-ess-web-bundy-synthetic.mjs"
      - "src/components/demo-sandbox-bar.tsx"
      - "src/app/page.tsx"
      - "src/app/app/page.tsx"
      - "src/app/workspace/page.tsx"
      - "src/app/api/auth/demo-switch/route.ts"
      - "src/db/public-demo.ts"
      - "src/db/seed.ts"
      - "src/lib/demo-host.ts"
      - "src/lib/security-request.ts"
      - "src/lib/core-schema-compat.ts"
      - "src/lib/bank-account-crypto.ts"
      - "src/app/api/readiness/route.ts"
      - "src/lib/pricing-catalog.ts"
      - "src/lib/demo-roles.ts"
      - "package.json"
      - "package-lock.json"
      - "tests/marketing.test.ts"
      - "tests/demo-sandbox.test.ts"
      - ".github/workflows/preview-browser-qa.yml"
  workflow_dispatch:

concurrency:
  # A newer push to a pull request supersedes its older run. Runs for main and
  # manual dispatch are keyed by commit and never cancelled, so a quick follow-up
  # merge cannot leave a main commit with a cancelled (or missing) result.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
      DEMO_MODE: "false"
      APP_BASE_URL: "http://localhost:3000"
      TRUSTED_APP_ORIGINS: "http://localhost:3000"
      TOTP_ENCRYPTION_KEY: "2222222222222222222222222222222222222222222222222222222222222222"
      # Browser QA exercises privileged lifecycle behavior using isolated demo data.
      # Security HTTP Smoke separately verifies that production MFA enforcement fails closed.
      REQUIRE_PRIVILEGED_MFA: "false"
      QA_URL: http://localhost:3000
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Provision isolated synthetic PII key

        shell: bash

        run: |

          pii_key=$(openssl rand -hex 32)

          echo "::add-mask::$pii_key"

          echo "PII_ENCRYPTION_KEY=$pii_key" >> "$GITHUB_ENV"

      - run: npm ci
      - run: npm run db:push
      - run: npx next build

      - name: Install Playwright for browser QA
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      # A production build must still boot on disposable PG16 and refuse all
      # unattested fictional-account provisioning. This test NEVER contacts
      # Vercel or live Neon and does not create a production session.
      - name: Verify production build boots and denies unattested demo sessions
        shell: bash
        run: |
          set -euo pipefail
          if [ "${PUBLIC_DEMO_DATABASE_ATTESTED:-}" = "true" ]; then
            echo "::error::Never attest a disposable PG16 runner as a production demo database."
            exit 1
          fi
          node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3001 > /tmp/payrollph-next-production.log 2>&1 &
          server_pid=$!
          response_file=$(mktemp)
          header_file=$(mktemp)
          trap 'kill "$server_pid" 2>/dev/null || true; rm -f -- "$response_file" "$header_file"' EXIT
          ready=false
          for attempt in {1..40}; do
            if curl -fsS --max-time 10 --proto '=http' --resolve localhost:3001:127.0.0.1                 http://localhost:3001/ -o /dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            echo "::error::Production bundle did not boot on the isolated database."
            exit 1
          fi
          status=$(curl -sS --max-time 15 --proto '=http' --resolve localhost:3001:127.0.0.1             -D "$header_file" -o "$response_file" -w '%{http_code}'             -X POST http://localhost:3001/api/auth/demo-switch             -H "Origin: http://localhost:3001"             -H "Sec-Fetch-Site: same-origin"             -H "Content-Type: application/json"             --data '{"role":"owner"}' || true)
          echo "Disposable production-mode demo login http_status=$status expected=404"
          if [ "$status" != 404 ] || grep -qi '^set-cookie:' "$header_file"; then
            echo "::error::Unattested production demo login must refuse and issue no session cookie."
            exit 1
          fi
          if ! grep -qi '^content-security-policy:' "$header_file" ||
              grep -i '^content-security-policy:' "$header_file" | grep -Fq "'unsafe-eval'"; then
            echo "::error::The production Content-Security-Policy must exist and prohibit unsafe-eval."
            exit 1
          fi
          echo "PASS: production build boots; demo login denies without a cookie; production CSP remains strict."

      # Browser persona workflows intentionally use a DEVELOPMENT-only server
      # against disposable PG16. Production's guard above must not be weakened
      # or mocked to permit account seeding on a customer-serving database.
      - name: Start isolated development demo server for browser persona QA
        shell: bash
        run: |
          set -euo pipefail
          nohup node node_modules/next/dist/bin/next dev --hostname 127.0.0.1 --port 3000 > /tmp/payrollph-next.log 2>&1 &
          echo $! > /tmp/payrollph-next.pid
          for attempt in {1..90}; do
            if curl -fsS --max-time 15 --proto '=http' "$QA_URL" -o /tmp/homepage.html; then
              dev_csp=$(curl -fsSI --max-time 15 --proto '=http' "$QA_URL" |
                grep -i '^content-security-policy:' || true)
              if [[ "$dev_csp" != *"'unsafe-eval'"* ]]; then
                echo "::error::Isolated Next.js development server needs dev-only eval for React diagnostics."
                exit 1
              fi
              echo "Disposable development browser sandbox is reachable with a development-only CSP."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Development browser sandbox did not start."
          exit 1

      - name: Run Chromium homepage and persona QA
        shell: bash
        run: |
          cat > preview-qa.cjs <<'JS'
          const fs = require("node:fs");
          const { chromium } = require("playwright");

          const base = process.env.QA_URL;
          const outDir = "qa-artifacts";
          fs.mkdirSync(outDir, { recursive: true });

          const report = {
            base,
            homepage: [],
            modules: [],
            pricing: [],
            publicRoutes: [],
            personas: [],
            errors: [],
          };

          function check(condition, message) {
            if (!condition) throw new Error(message);
          }

          function attachErrorCollection(page, bucket) {
            page.on("pageerror", (error) => bucket.push(`pageerror: ${error.message}`));
            page.on("console", (message) => {
              if (message.type() === "error") bucket.push(`console: ${message.text()}`);
            });
          }

          async function qaHomepage(browser, name, viewport) {
            const context = await browser.newContext({ viewport });
            const page = await context.newPage();
            const errors = [];
            attachErrorCollection(page, errors);

            const response = await page.goto(base, { waitUntil: "networkidle", timeout: 90000 });
            check(response && response.ok(), `${name}: homepage did not return 2xx`);

            const h1 = (await page.locator("h1").first().innerText()).trim();
            check(h1.includes("Your people. Your payroll."), `${name}: expected Linaw payroll hero heading not found; saw "${h1}"`);
            const heroPrimary = page.locator(".hero-primary-cta");
            check((await heroPrimary.count()) === 1, `${name}: hero primary CTA is missing`);
            const heroPrimaryStyles = await heroPrimary.evaluate((el) => {
              const style = getComputedStyle(el);
              return { color: style.color, backgroundColor: style.backgroundColor };
            });
            check(heroPrimaryStyles.color === "rgb(255, 255, 255)", `${name}: hero primary CTA text lost white contrast; saw ${heroPrimaryStyles.color}`);
            check(heroPrimaryStyles.backgroundColor !== "rgba(0, 0, 0, 0)" && heroPrimaryStyles.backgroundColor !== "rgb(255, 255, 255)", `${name}: hero primary CTA background lost contrast; saw ${heroPrimaryStyles.backgroundColor}`);
            if (name === "desktop") {
              const primaryNav = page.getByRole("navigation", { name: "Primary" });
              check((await primaryNav.getByRole("link", { name: "Try demo", exact: true }).getAttribute("href")) === "/demo", "desktop: primary nav does not expose role-based demo");
              check((await primaryNav.getByRole("link", { name: "Outsourcing", exact: true }).getAttribute("href")) === "/payroll-outsourcing", "desktop: primary nav does not expose payroll outsourcing");
              const companyMenu = primaryNav.locator("summary").filter({ hasText: "Company" });
              await companyMenu.click();
              check((await primaryNav.getByRole("link", { name: "Trust center", exact: true }).getAttribute("href")) === "/trust", "desktop: company menu does not expose trust center");
              await primaryNav.getByRole("link", { name: "Trust center", exact: true }).focus();
              await page.keyboard.press("Escape");
              check(await companyMenu.evaluate(el => el === document.activeElement), "desktop: Escape must restore focus to the open menu summary");
              const productMenu = primaryNav.locator("summary").filter({ hasText: "Product" });
              await productMenu.click();
              check(await primaryNav.getByRole("link", { name: "HRIS", exact: true }).isVisible(), "desktop: product menu must expose HRIS");
              await page.keyboard.press("Escape");
              check((await primaryNav.getByRole("link", { name: "Pricing", exact: true }).getAttribute("href")) === "/pricing", "desktop: primary nav does not expose dedicated pricing page");
            } else {
              const menu = page.getByRole("button", { name: "Open menu" });
              check((await menu.count()) === 1, "mobile-390: menu button is missing");
              await menu.focus();
              check(await menu.evaluate(el => el === document.activeElement), `${name}: mobile menu trigger must receive keyboard focus`);
              await menu.press("Enter");
              const mobileHeader = page.getByRole("banner");
              check((await mobileHeader.getByRole("link", { name: "Try demo", exact: true }).getAttribute("href")) === "/demo", "mobile-390: menu does not expose role-based demo");
              check((await mobileHeader.getByRole("link", { name: "Payroll outsourcing", exact: true }).getAttribute("href")) === "/payroll-outsourcing", "mobile-390: menu does not expose payroll outsourcing");
              await mobileHeader.locator(".ln-mobile summary").filter({ hasText: "Company" }).click();
              check((await mobileHeader.getByRole("link", { name: "Trust center", exact: true }).getAttribute("href")) === "/trust", "mobile-390: menu does not expose trust center");
              await mobileHeader.locator(".ln-mobile summary").filter({ hasText: "Product" }).click();
              check(await mobileHeader.getByRole("link", { name: "HRIS", exact: true }).isVisible(), "mobile-390: product menu must expose HRIS");
              check((await mobileHeader.getByRole("link", { name: "Pricing", exact: true }).getAttribute("href")) === "/pricing", "mobile-390: menu does not expose dedicated pricing page");
              await page.getByRole("button", { name: "Close menu" }).press("Enter");
              check(await menu.isVisible(), `${name}: mobile menu trigger must remain discoverable after keyboard close`);
            }

            const overflow = await page.evaluate(() => ({
              scrollWidth: document.documentElement.scrollWidth,
              innerWidth: window.innerWidth,
            }));
            check(
              overflow.scrollWidth <= overflow.innerWidth + 1,
              `${name}: horizontal overflow ${overflow.scrollWidth}px > ${overflow.innerWidth}px`,
            );

            // A clipped child does not increase document.scrollWidth, so check
            // the embedded simulation CTA itself at narrow phone widths.
            if (name.startsWith("mobile")) {
              const demoFrame = page.locator("#demo.lp-simulation").first();
              const primary = page.locator("#demo .ls-primary").filter({ hasText: "Continue payroll" }).first();
              check((await demoFrame.count()) === 1 && (await primary.count()) === 1,
                `${name}: the phone payroll simulation is missing its primary action`);
              const frameBox = await demoFrame.boundingBox();
              const primaryBox = await primary.boundingBox();
              check(Boolean(frameBox && primaryBox) &&
                primaryBox.x >= frameBox.x - 2 &&
                primaryBox.x + primaryBox.width <= frameBox.x + frameBox.width + 2,
                `${name}: Continue payroll button is clipped inside the phone simulation`);
            }

            await page.screenshot({
              path: `${outDir}/homepage-${name}.png`,
              fullPage: true,
            });

            report.homepage.push({ name, viewport, h1, overflow, errors: [...errors] });

            const pricing = page.locator("#pricing");
            check((await pricing.count()) === 1, `${name}: pricing section is missing`);
            const planRows = pricing.locator(".pricing-plan-card");
            check((await planRows.count()) === 3, `${name}: expected three business pricing cards`);

            const firstAmount = (await planRows.first().locator(".pricing-amount").innerText()).trim();
            const fiftyPreset = pricing.locator('button[data-headcount="50"]').first();
            check((await fiftyPreset.count()) === 1, `${name}: 50 employee pricing preset is missing`);
            await fiftyPreset.click();
            await page.waitForTimeout(100);
            const updatedAmount = (await planRows.first().locator(".pricing-amount").innerText()).trim();
            check(firstAmount !== updatedAmount, `${name}: pricing estimate did not update after changing headcount`);
            check((await pricing.innerText()).includes("50 employees"), `${name}: pricing estimator did not show 50 employees`);
            report.pricing.push({ name, rows: 3, headcount: 50, firstAmount, updatedAmount });

            if (name === "desktop") {
              const hero = page.locator("#top");
              const areaButtons = hero.getByRole("group", { name: "Choose a product area" }).getByRole("button");
              check((await areaButtons.count()) === 6, "desktop: six product areas must be available");
              for (const button of await areaButtons.all()) {
                await button.click();
                check((await button.getAttribute("aria-pressed")) === "true", "desktop: product selection did not update");
                check((await hero.locator(".frame.standalone").count()) === 1, "desktop: working simulation did not render");
              }
              check((await hero.getByText("Interactive simulation", { exact: false }).count()) === 1, "desktop: sample screen attribution is missing");

              const demo = page.locator("#demo");
              check((await demo.count()) === 1, "desktop: live demo section is missing");
              check((await demo.getByText("Your team. One connected workspace.").count()) === 1, "desktop: payroll workflow preview chrome did not render");
              const systemPreview = demo.locator(".frame.standalone");
              check((await systemPreview.count()) === 1, "desktop: shared Linaw workspace preview did not render");
              await page.getByRole("group", { name: "Choose a product area" }).getByRole("button", { name: "HRIS", exact: true }).click();
              await systemPreview.getByRole("textbox", { name: "Search employees" }).fill("Maria");
              await systemPreview.getByRole("button", { name: /Maria Santos/ }).click();
              const employeeProfile = page.getByRole("dialog", { name: "Employee profile" });
              await employeeProfile.getByRole("button", { name: "Pay profile", exact: true }).click();
              check(await employeeProfile.getByText("₱32,000", { exact: true }).count() === 1, "HRIS pay profile must show the sample salary");
              await page.keyboard.press("Escape");
              check(await employeeProfile.count() === 0, "HRIS profile must dismiss with Escape");
              const perspectives = systemPreview.getByRole("group", { name: "Choose a team perspective" });
              await perspectives.getByRole("button", { name: "Checker", exact: true }).click();
              await systemPreview.getByRole("button", { name: "Review exceptions", exact: true }).click();
              await systemPreview.getByRole("button", { name: "Approve payroll", exact: true }).click();
              await perspectives.getByRole("button", { name: "Owner", exact: true }).click();
              check(await systemPreview.getByRole("button", { name: "Release sample payroll" }).isEnabled(), "owner release must unlock after checker approval");
              await systemPreview.getByRole("button", { name: "Release sample payroll" }).click();
              await perspectives.getByRole("button", { name: "Employee", exact: true }).click();
              check(await systemPreview.getByText("Your payslip is ready to view.").count() === 1, "employee payday must reflect sample release");
              check((await demo.getByRole("link", { name: /Open role-based sandbox/i }).count()) === 1, "desktop: role-based sandbox handoff is missing");
              report.modules.push({ module: "Connected product area hero", active: true });
              report.modules.push({ module: "Shared Linaw workspace preview", active: true });
            }

            if (name === "mobile-390") {
              const normalizedHeading = h1.replace(/\s+/g, " ");
              check(
                normalizedHeading.includes("Your people. Your payroll."),
                `mobile-390: hero words collided after responsive line-break removal; saw "${normalizedHeading}"`,
              );

              const mobileHero = page.locator("#top");
              const mobileControlCard = mobileHero.locator(".lp-picker").first();
              check((await mobileControlCard.count()) === 1, "mobile-390: product area selector is missing");
              const controlFit = await mobileControlCard.evaluate((element) => ({
                clientWidth: element.clientWidth,
                scrollWidth: element.scrollWidth,
              }));
              check(
                controlFit.scrollWidth <= controlFit.clientWidth + 1,
                `mobile-390: release-readiness card clips ${controlFit.scrollWidth}px > ${controlFit.clientWidth}px`,
              );
              const securityProof = page.locator(".lp-buyer-guide").first();
              const securityHeading = securityProof.getByRole("heading", { name: "A clearer cutoff for the team you have." });
              const securityCopy = securityProof.locator("p").filter({ hasText: "Review the controls and responsibilities before sharing real payroll data." }).first();

              check(
                !(await pricing.innerText()).includes("No credit card to start") &&
                  !(await pricing.innerText()).includes("Cancel anytime"),
                "mobile-390: stale self-serve pricing promises returned",
              );

              check((await securityProof.locator(".lp-audiences article").count()) === 3, "homepage buyer audiences missing");
              check((await securityProof.locator(".lp-first-payroll li").count()) === 3, "homepage rollout steps missing");
              const closingCta = page.locator("#cta");
              check(await closingCta.locator("h2").evaluate(element => getComputedStyle(element).color) === "rgb(255, 255, 255)", "closing CTA heading lost white contrast");
              const trialCta = closingCta.locator('a[href="/signup"]').first();
              check((await trialCta.count()) === 1, "mobile-390: trial access CTA is missing");
              const trialCtaStyles = await trialCta.evaluate((element) => ({
                color: getComputedStyle(element).color,
                backgroundColor: getComputedStyle(element).backgroundColor,
              }));
              check(
                trialCtaStyles.color === "rgb(17, 20, 31)",
                `mobile-390: trial CTA text lost dark contrast on white; saw ${trialCtaStyles.color}`,
              );
              check(
                trialCtaStyles.backgroundColor === "rgb(255, 255, 255)",
                `mobile-390: trial CTA background is not white; saw ${trialCtaStyles.backgroundColor}`,
              );

              await mobileHero.screenshot({ path: `${outDir}/homepage-mobile-390-hero.png` });
              await pricing.screenshot({ path: `${outDir}/homepage-mobile-390-pricing.png` });
              await securityProof.screenshot({ path: `${outDir}/homepage-mobile-390-security.png` });
              await closingCta.screenshot({ path: `${outDir}/homepage-mobile-390-cta.png` });

              for (const [label, locator] of [["heading", securityHeading], ["copy", securityCopy]]) {
                check((await locator.count()) === 1, `mobile-390: security proof ${label} is missing`);
                const fit = await locator.evaluate((element) => {
                  const article = element.closest(".lp-buyer-guide");
                  const rect = element.getBoundingClientRect();
                  const parentRect = article?.getBoundingClientRect();
                  return {
                    clientWidth: element.clientWidth,
                    scrollWidth: element.scrollWidth,
                    left: rect.left,
                    right: rect.right,
                    parentLeft: parentRect?.left ?? rect.left,
                    parentRight: parentRect?.right ?? rect.right,
                  };
                });
                check(
                  fit.scrollWidth <= fit.clientWidth + 1 &&
                    fit.left >= fit.parentLeft - 1 &&
                    fit.right <= fit.parentRight + 1,
                  `mobile-390: security proof ${label} is clipped inside its card`,
                );
              }
            }

            check(errors.length === 0, `${name}: browser console/page errors: ${errors.join(" | ")}`);
            await context.close();
          }

          async function qaPublicRoutes(browser) {
            const routes = [
              { path: "/demo", heading: "See Linaw from the seat you actually use." },
              { path: "/signup", heading: "Create your Linaw company account." },
              { path: "/payroll-outsourcing", heading: "Payroll Outsourcing Philippines" },
              { path: "/small-business-payroll", heading: "One cutoff. Every decision, from inputs to release." },
              { path: "/resources", heading: "Practical guidance for buying, migrating and operating Philippine payroll." },
              { path: "/industries", heading: "Payroll workflows shaped by how your workforce actually operates." },
              { path: "/hcm", heading: "Every employee change has a next step." },
              { path: "/workforce-management", heading: "Plan the coverage. See the gaps. Review the trade-offs." },
              { path: "/about", heading: "Payroll is people’s pay." },
              { path: "/contact", heading: "Contact us" },
              { path: "/calculators/withholding-tax", heading: "Monthly Withholding" },
              { path: "/calculators", heading: "Start with the payroll question you need to estimate." },
              { path: "/compliance", heading: "Compliance support with evidence, validation states and fewer hidden assumptions." },
              { path: "/industries/construction", heading: "Payroll and timekeeping for Philippine construction teams." },
              { path: "/industries/logistics", heading: "Payroll and timekeeping for Philippine logistics teams." },
              { path: "/book-demo", heading: "Bring your actual payroll questions." },
              { path: "/status", heading: "Linaw system status." },
              { path: "/scorecard", heading: "Verified claims only." },
              { path: "/login", heading: "Welcome back." },
              { path: "/invite", heading: "Join your team on Linaw." },
              { path: "/reset-password", heading: "Set a new password." },
              { path: "/verify-email", heading: "Verify your new email." },
            ];

            const context = await browser.newContext({ viewport: { width: 1280, height: 900 } });
            const page = await context.newPage();

            for (const route of routes) {
              const errors = [];
              const pageError = (error) => errors.push(`pageerror: ${error.message}`);
              const consoleError = (message) => {
                if (message.type() === "error") errors.push(`console: ${message.text()}`);
              };
              page.on("pageerror", pageError);
              page.on("console", consoleError);

              const response = await page.goto(`${base}${route.path}`, { waitUntil: "networkidle", timeout: 90000 });
              check(response && response.ok(), `${route.path}: did not return 2xx`);

              const h1 = (await page.locator("h1").first().innerText()).trim();
              check(h1.includes(route.heading), `${route.path}: expected heading "${route.heading}" not found; saw "${h1}"`);
              check((await page.getByRole("navigation", { name: "Primary" }).count()) >= 1, `${route.path}: shared primary navigation is missing`);
              if (route.path === "/login") {
                check((await page.locator("footer").count()) === 0, "/login: marketing footer should not distract from authentication");
              } else {
                check((await page.locator("footer").count()) >= 1, `${route.path}: shared footer is missing`);
              }

              const overflow = await page.evaluate(() => ({
                scrollWidth: document.documentElement.scrollWidth,
                innerWidth: window.innerWidth,
              }));
              check(
                overflow.scrollWidth <= overflow.innerWidth + 1,
                `${route.path}: horizontal overflow ${overflow.scrollWidth}px > ${overflow.innerWidth}px`,
              );
              check(errors.length === 0, `${route.path}: browser console/page errors: ${errors.join(" | ")}`);

              report.publicRoutes.push({ path: route.path, h1, overflow, errors: [...errors] });
              if (route.path === "/login") {
                const signInButton = page.getByRole("button", { name: /^Sign in$/ });
                check((await signInButton.count()) === 1, "/login: primary sign-in button is missing");
                const signInStyles = await signInButton.evaluate((element) => ({
                  backgroundColor: getComputedStyle(element).backgroundColor,
                  color: getComputedStyle(element).color,
                  borderRadius: getComputedStyle(element).borderRadius,
                }));
                check(signInStyles.backgroundColor === "rgb(97, 97, 255)", `/login: primary CTA lost Linaw indigo; saw ${signInStyles.backgroundColor}`);
                check(signInStyles.color === "rgb(255, 255, 255)", `/login: primary CTA text lost contrast; saw ${signInStyles.color}`);
                check((await page.locator('[data-testid="password-visibility"]').count()) === 1, "/login: password visibility control is missing");
