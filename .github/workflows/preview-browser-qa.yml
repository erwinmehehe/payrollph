name: Marketing Browser QA

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/components/marketing/**"
      - "src/components/workspace/**"
      - "src/components/linaw-workspace.tsx"
      - "src/components/self-service-portal.tsx"
      - "src/components/demo-sandbox-bar.tsx"
      - "src/app/page.tsx"
      - "src/app/app/page.tsx"
      - "src/app/workspace/page.tsx"
      - "src/app/api/auth/demo-switch/route.ts"
      - "src/db/public-demo.ts"
      - "src/db/seed.ts"
      - "src/lib/demo-host.ts"
      - "src/lib/security-request.ts"
      - "src/lib/core-schema-compat.ts"
      - "src/lib/bank-account-crypto.ts"
      - "src/app/api/readiness/route.ts"
      - "src/lib/pricing-catalog.ts"
      - "src/lib/demo-roles.ts"
      - "package.json"
      - "package-lock.json"
      - "tests/marketing.test.ts"
      - "tests/demo-sandbox.test.ts"
      - ".github/workflows/preview-browser-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
      DEMO_MODE: "false"
      APP_BASE_URL: "http://localhost:3000"
      TRUSTED_APP_ORIGINS: "http://localhost:3000"
      TOTP_ENCRYPTION_KEY: "2222222222222222222222222222222222222222222222222222222222222222"
      # Browser QA exercises privileged lifecycle behavior using isolated demo data.
      # Security HTTP Smoke separately verifies that production MFA enforcement fails closed.
      REQUIRE_PRIVILEGED_MFA: "false"
      QA_URL: http://localhost:3000
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run db:push
      - run: npx next build

      - name: Install Playwright for browser QA
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start production build
        shell: bash
        run: |
          nohup npm start -- -H 127.0.0.1 > /tmp/payrollph-next.log 2>&1 &
          echo $! > /tmp/payrollph-next.pid
          for attempt in {1..40}; do
            if curl -fsS "$QA_URL" >/tmp/homepage.html; then
              echo "Production build is reachable."
              exit 0
            fi
            sleep 2
          done
          cat /tmp/payrollph-next.log
          exit 1

      - name: Run Chromium homepage and persona QA
        shell: bash
        run: |
          cat > preview-qa.cjs <<'JS'
          const fs = require("node:fs");
          const { chromium } = require("playwright");

          const base = process.env.QA_URL;
          const outDir = "qa-artifacts";
          fs.mkdirSync(outDir, { recursive: true });

          const report = {
            base,
            homepage: [],
            modules: [],
            pricing: [],
            publicRoutes: [],
            personas: [],
            errors: [],
          };

          function check(condition, message) {
            if (!condition) throw new Error(message);
          }

          function attachErrorCollection(page, bucket) {
            page.on("pageerror", (error) => bucket.push(`pageerror: ${error.message}`));
            page.on("console", (message) => {
              if (message.type() === "error") bucket.push(`console: ${message.text()}`);
            });
          }

          async function qaHomepage(browser, name, viewport) {
            const context = await browser.newContext({ viewport });
            const page = await context.newPage();
            const errors = [];
            attachErrorCollection(page, errors);

            const response = await page.goto(base, { waitUntil: "networkidle", timeout: 90000 });
            check(response && response.ok(), `${name}: homepage did not return 2xx`);

            const h1 = (await page.locator("h1").first().innerText()).trim();
            check(h1.includes("Payroll that stays clear") && h1.includes("under control."), `${name}: expected PayrollPH hero heading not found; saw "${h1}"`);
            const heroPrimary = page.locator(".hero-primary-cta");
            check((await heroPrimary.count()) === 1, `${name}: hero primary CTA is missing`);
            const heroPrimaryStyles = await heroPrimary.evaluate((el) => {
              const style = getComputedStyle(el);
              return { color: style.color, backgroundColor: style.backgroundColor };
            });
            check(heroPrimaryStyles.color === "rgb(255, 255, 255)", `${name}: hero primary CTA text lost white contrast; saw ${heroPrimaryStyles.color}`);
            check(heroPrimaryStyles.backgroundColor !== "rgba(0, 0, 0, 0)" && heroPrimaryStyles.backgroundColor !== "rgb(255, 255, 255)", `${name}: hero primary CTA background lost contrast; saw ${heroPrimaryStyles.backgroundColor}`);
            if (name === "desktop") {
              const primaryNav = page.getByRole("navigation", { name: "Primary" });
              check((await primaryNav.getByRole("link", { name: "Demo", exact: true }).getAttribute("href")) === "/demo", "desktop: primary nav does not expose role-based demo");
              check((await primaryNav.getByRole("link", { name: "Payroll outsourcing", exact: true }).getAttribute("href")) === "/payroll-outsourcing", "desktop: primary nav does not expose payroll outsourcing");
              check((await primaryNav.getByRole("link", { name: "Trust", exact: true }).getAttribute("href")) === "/scorecard", "desktop: primary nav does not expose scorecard");
            } else {
              const menu = page.getByRole("button", { name: "Open menu" });
              check((await menu.count()) === 1, "mobile-390: menu button is missing");
              await menu.click();
              const mobileHeader = page.getByRole("banner");
              check((await mobileHeader.getByRole("link", { name: "Demo", exact: true }).getAttribute("href")) === "/demo", "mobile-390: menu does not expose role-based demo");
              check((await mobileHeader.getByRole("link", { name: "Payroll outsourcing", exact: true }).getAttribute("href")) === "/payroll-outsourcing", "mobile-390: menu does not expose payroll outsourcing");
              check((await mobileHeader.getByRole("link", { name: "Trust", exact: true }).getAttribute("href")) === "/scorecard", "mobile-390: menu does not expose scorecard");
              await page.getByRole("button", { name: "Close menu" }).click();
            }

            const overflow = await page.evaluate(() => ({
              scrollWidth: document.documentElement.scrollWidth,
              innerWidth: window.innerWidth,
            }));
            check(
              overflow.scrollWidth <= overflow.innerWidth + 1,
              `${name}: horizontal overflow ${overflow.scrollWidth}px > ${overflow.innerWidth}px`,
            );

            await page.screenshot({
              path: `${outDir}/homepage-${name}.png`,
              fullPage: true,
            });

            report.homepage.push({ name, viewport, h1, overflow, errors: [...errors] });

            const pricing = page.locator("#pricing");
            check((await pricing.count()) === 1, `${name}: pricing section is missing`);
            const planRows = pricing.locator(".pricing-plan-card");
            check((await planRows.count()) === 3, `${name}: expected three business pricing cards`);

            const firstAmount = (await planRows.first().locator(".pricing-amount").innerText()).trim();
            const fiftyPreset = pricing.locator('button[data-headcount="50"]').first();
            check((await fiftyPreset.count()) === 1, `${name}: 50 employee pricing preset is missing`);
            await fiftyPreset.click();
            await page.waitForTimeout(100);
            const updatedAmount = (await planRows.first().locator(".pricing-amount").innerText()).trim();
            check(firstAmount !== updatedAmount, `${name}: pricing estimate did not update after changing headcount`);
            check((await pricing.innerText()).includes("50 employees"), `${name}: pricing estimator did not show 50 employees`);
            report.pricing.push({ name, rows: 3, headcount: 50, firstAmount, updatedAmount });

            if (name === "desktop") {
              const hero = page.locator("#top");
              const audienceButtons = hero.getByRole("radio");
              check((await audienceButtons.count()) === 4, "desktop: hero audience selector must expose four setup choices");
              const smallTeam = hero.getByRole("radio", { name: "Small team" });
              await smallTeam.click();
              check((await smallTeam.getAttribute("aria-checked")) === "true", "desktop: hero audience selector did not update");

              const demo = page.locator("#demo");
              check((await demo.count()) === 1, "desktop: live demo section is missing");
              check((await demo.getByText("Interactive product preview").count()) === 1, "desktop: real product preview chrome did not render");
              const systemPreview = demo.locator(".system-demo-product .frame.standalone");
              check((await systemPreview.count()) === 1, "desktop: shared Linaw workspace preview did not render");
              const previewNav = systemPreview.locator(".nav-item");
              check((await previewNav.count()) >= 8, "desktop: real workspace navigation is unexpectedly sparse");
              const peopleNav = previewNav.filter({ hasText: /^People/ }).first();
              check((await peopleNav.count()) === 1, "desktop: People module is missing from the real-system preview");
              await peopleNav.click();
              await page.waitForTimeout(100);
              check((await peopleNav.getAttribute("aria-current")) === "page", "desktop: real-system preview navigation did not update");
              const peopleShell = systemPreview.locator(".preview-people-shell");
              check((await peopleShell.count()) === 1, "desktop: People preview shell is missing");
              const firstPersonRow = peopleShell.locator(".preview-person-row").first();
              check((await firstPersonRow.count()) === 1, "desktop: People preview rows are missing");
              const personRowStyles = await firstPersonRow.evaluate((element) => ({
                display: getComputedStyle(element).display,
                columns: getComputedStyle(element).gridTemplateColumns,
                width: element.getBoundingClientRect().width,
                scrollWidth: element.scrollWidth,
              }));
              check(personRowStyles.display === "grid", `desktop: People preview row styling did not load; display=${personRowStyles.display}`);
              check(personRowStyles.columns !== "none", "desktop: People preview row has no grid columns");
              check(personRowStyles.scrollWidth <= personRowStyles.width + 1, `desktop: People preview row overflows ${personRowStyles.scrollWidth}px > ${personRowStyles.width}px`);
              check((await peopleShell.locator(".preview-people-summary").count()) === 1, "desktop: People summary is missing");
              check((await peopleShell.locator(".preview-people-controls").count()) === 1, "desktop: People filters/search are missing");

              const migrationNav = previewNav.filter({ hasText: /^Migration/ }).first();
              check((await migrationNav.count()) === 1, "desktop: Migration module is missing from the real-system preview");
              await migrationNav.click();
              await page.waitForTimeout(100);
              const migrationCard = systemPreview.locator(".preview-migration-card");
              check((await migrationCard.count()) === 1, "desktop: Migration preview card is missing");
              const migrationStep = migrationCard.locator(".preview-migration-step").first();
              const migrationStyles = await migrationStep.evaluate((element) => ({
                display: getComputedStyle(element).display,
                columns: getComputedStyle(element).gridTemplateColumns,
                width: element.getBoundingClientRect().width,
                scrollWidth: element.scrollWidth,
              }));
              check(migrationStyles.display === "grid", `desktop: Migration preview styling did not load; display=${migrationStyles.display}`);
              check(migrationStyles.columns !== "none", "desktop: Migration preview has no grid columns");
              check(migrationStyles.scrollWidth <= migrationStyles.width + 1, `desktop: Migration preview overflows ${migrationStyles.scrollWidth}px > ${migrationStyles.width}px`);
              check((await demo.getByRole("link", { name: /Open role-based sandbox/i }).count()) === 1, "desktop: role-based sandbox handoff is missing");
              report.modules.push({ module: "Claude hero audience selector", active: true });
              report.modules.push({ module: "Shared Linaw workspace preview", active: true });
            }

            check(errors.length === 0, `${name}: browser console/page errors: ${errors.join(" | ")}`);
            await context.close();
          }

          async function qaPublicRoutes(browser) {
            const routes = [
              { path: "/demo", heading: "See Linaw from the seat you actually use." },
              { path: "/payroll-outsourcing", heading: "Payroll outsourcing without losing control of the run." },
              { path: "/book-demo", heading: "Bring your actual payroll questions." },
              { path: "/status", heading: "Linaw system status." },
              { path: "/scorecard", heading: "Verified claims only." },
              { path: "/login", heading: "Welcome back." },
              { path: "/invite", heading: "Join your team on Linaw." },
              { path: "/reset-password", heading: "Set a new password." },
              { path: "/verify-email", heading: "Verify your new email." },
            ];

            const context = await browser.newContext({ viewport: { width: 1280, height: 900 } });
            const page = await context.newPage();

            for (const route of routes) {
              const errors = [];
              const pageError = (error) => errors.push(`pageerror: ${error.message}`);
              const consoleError = (message) => {
                if (message.type() === "error") errors.push(`console: ${message.text()}`);
              };
              page.on("pageerror", pageError);
              page.on("console", consoleError);

              const response = await page.goto(`${base}${route.path}`, { waitUntil: "networkidle", timeout: 90000 });
              check(response && response.ok(), `${route.path}: did not return 2xx`);

              const h1 = (await page.locator("h1").first().innerText()).trim();
              check(h1.includes(route.heading), `${route.path}: expected heading "${route.heading}" not found; saw "${h1}"`);
              check((await page.getByRole("navigation", { name: "Primary" }).count()) >= 1, `${route.path}: shared primary navigation is missing`);
              if (route.path === "/login") {
                check((await page.locator("footer").count()) === 0, "/login: marketing footer should not distract from authentication");
              } else {
                check((await page.locator("footer").count()) >= 1, `${route.path}: shared footer is missing`);
              }

              const overflow = await page.evaluate(() => ({
                scrollWidth: document.documentElement.scrollWidth,
                innerWidth: window.innerWidth,
              }));
              check(
                overflow.scrollWidth <= overflow.innerWidth + 1,
                `${route.path}: horizontal overflow ${overflow.scrollWidth}px > ${overflow.innerWidth}px`,
              );
              check(errors.length === 0, `${route.path}: browser console/page errors: ${errors.join(" | ")}`);

              report.publicRoutes.push({ path: route.path, h1, overflow, errors: [...errors] });
              if (route.path === "/login") {
                const signInButton = page.getByRole("button", { name: /^Sign in$/ });
                check((await signInButton.count()) === 1, "/login: primary sign-in button is missing");
                const signInStyles = await signInButton.evaluate((element) => ({
                  backgroundColor: getComputedStyle(element).backgroundColor,
                  color: getComputedStyle(element).color,
                  borderRadius: getComputedStyle(element).borderRadius,
                }));
                check(signInStyles.backgroundColor === "rgb(97, 97, 255)", `/login: primary CTA lost Linaw indigo; saw ${signInStyles.backgroundColor}`);
                check(signInStyles.color === "rgb(255, 255, 255)", `/login: primary CTA text lost contrast; saw ${signInStyles.color}`);
                check((await page.locator('[data-testid="password-visibility"]').count()) === 1, "/login: password visibility control is missing");
                await page.screenshot({ path: `${outDir}/login-desktop.png`, fullPage: true });

                await page.setViewportSize({ width: 390, height: 844 });
                await page.waitForTimeout(100);
                const mobileOverflow = await page.evaluate(() => ({
                  scrollWidth: document.documentElement.scrollWidth,
                  innerWidth: window.innerWidth,
                }));
                check(mobileOverflow.scrollWidth <= mobileOverflow.innerWidth + 1, `/login: mobile horizontal overflow ${mobileOverflow.scrollWidth}px > ${mobileOverflow.innerWidth}px`);
                const formHeading = page.getByRole("heading", { name: "Welcome back." });
                check((await formHeading.count()) === 1, "/login: mobile auth heading is missing");
                const supportHeading = page.locator("h2").filter({ hasText: "Sign in to Linaw." }).first();
                check((await supportHeading.count()) === 1, "/login: desktop support heading is missing from the DOM");
                check((await supportHeading.isVisible()) === false, "/login: supporting marketing panel should stay hidden on mobile");
                await page.screenshot({ path: `${outDir}/login-mobile-390.png`, fullPage: true });
                await page.setViewportSize({ width: 1280, height: 900 });
              }
              page.off("pageerror", pageError);
              page.off("console", consoleError);
            }

            await page.goto(`${base}/demo`, { waitUntil: "networkidle", timeout: 90000 });
            const outsourcingLink = page.getByRole("link", { name: "Payroll outsourcing" }).first();
            check((await outsourcingLink.count()) === 1, "/demo: Outsourcing nav link is missing");
            await outsourcingLink.click();
            await page.waitForURL(new RegExp("/payroll-outsourcing(?:$|[?#])"), { timeout: 30000 });
            check(new URL(page.url()).pathname === "/payroll-outsourcing", "/demo: shared navigation did not reach payroll outsourcing");

            await context.close();
          }

          const personas = [
            { id: "owner", label: "Owner", short: "Owner", person: "Andrea Lim", landing: "Good morning, Andrea", taskPage: "Dashboard", dashboardRole: "owner" },
            { id: "hr", label: "HR Admin", short: "HR Admin", person: "Aira Villanueva", landing: "Good morning, Aira", taskPage: "Employees", dashboardRole: "hr" },
            { id: "payroll", label: "Payroll Officer", short: "Payroll", person: "Paolo Cruz", landing: "Good morning, Paolo", taskPage: "Payroll", dashboardRole: "payroll" },
            { id: "checker", label: "Checker", short: "Checker", person: "Mariel Santos", landing: "Good morning, Mariel", taskPage: "Approvals", dashboardRole: "checker" },
            { id: "employee", label: "Employee", short: "Employee", person: "Jonas Reyes", landing: "My pay", taskPage: "My pay", dashboardRole: null },
          ];

          async function inspectPersonaViewport(page, persona, width, height, suffix) {
            await page.setViewportSize({ width, height });
            await page.waitForTimeout(120);

            const overflow = await page.evaluate(() => ({
              scrollWidth: document.documentElement.scrollWidth,
              innerWidth: window.innerWidth,
            }));
            check(
              overflow.scrollWidth <= overflow.innerWidth + 1,
              `${persona.label}: ${suffix} horizontal overflow ${overflow.scrollWidth}px > ${overflow.innerWidth}px`,
            );

            const sandbox = page.locator("section.demo-sandbox").first();
            if (await sandbox.count()) {
            const sandboxLayout = await sandbox.evaluate((element) => {
              const rect = element.getBoundingClientRect();
              return {
                left: rect.left,
                right: rect.right,
                scrollWidth: element.scrollWidth,
                clientWidth: element.clientWidth,
              };
            });
            check(sandboxLayout.left >= -1, `${persona.label}: ${suffix} sandbox escapes the left viewport edge`);
            check(sandboxLayout.right <= width + 1, `${persona.label}: ${suffix} sandbox escapes the right viewport edge`);
            check(
              sandboxLayout.scrollWidth <= sandboxLayout.clientWidth + 1,
              `${persona.label}: ${suffix} sandbox clips internally`,
            );

            }

            const responsiveControls = page.locator(".demo-role-button, .demo-access-chip, .demo-task-card");
            for (const control of await responsiveControls.all()) {
              if (!(await control.isVisible())) continue;
              const layout = await control.evaluate((element) => ({
                scrollWidth: element.scrollWidth,
                clientWidth: element.clientWidth,
              }));
              check(
                layout.scrollWidth <= layout.clientWidth + 1,
                `${persona.label}: ${suffix} sandbox control clips ${layout.scrollWidth}px > ${layout.clientWidth}px`,
              );
            }

            const handoffs = page.locator("[data-payroll-handoff]");
            for (const handoff of await handoffs.all()) {
              if (!(await handoff.isVisible())) continue;
              const layout = await handoff.evaluate((element) => ({
                scrollWidth: element.scrollWidth,
                clientWidth: element.clientWidth,
              }));
              check(
                layout.scrollWidth <= layout.clientWidth + 1,
                `${persona.label}: ${suffix} payroll handoff clips ${layout.scrollWidth}px > ${layout.clientWidth}px`,
              );
            }

            const topbar = page.locator(".topbar").first();
            if (await topbar.count()) {
              const layout = await topbar.evaluate((element) => ({
                scrollWidth: element.scrollWidth,
                clientWidth: element.clientWidth,
              }));
              check(
                layout.scrollWidth <= layout.clientWidth + 1,
                `${persona.label}: ${suffix} topbar clips ${layout.scrollWidth}px > ${layout.clientWidth}px`,
              );
            }

            if (persona.id === "employee") {
              const employeeActions = page.locator(".employee-self-service-actions").first();
              check((await employeeActions.count()) === 1, "Employee: responsive header actions are missing");
              const actionLayout = await employeeActions.evaluate((element) => ({
                scrollWidth: element.scrollWidth,
                clientWidth: element.clientWidth,
              }));
              check(
                actionLayout.scrollWidth <= actionLayout.clientWidth + 1,
                `Employee: ${suffix} header actions clip ${actionLayout.scrollWidth}px > ${actionLayout.clientWidth}px`,
              );
            } else if (width <= 768) {
              const drawerButton = page.getByRole("button", { name: "Open navigation" }).first();
              check((await drawerButton.count()) === 1, `${persona.label}: ${suffix} mobile/tablet navigation trigger is missing`);
              check(await drawerButton.isVisible(), `${persona.label}: ${suffix} navigation trigger is not visible`);
            }

            await page.screenshot({
              path: `${outDir}/persona-${persona.id}-landing-${suffix}.png`,
              fullPage: true,
            });
          }

          async function qaPersona(browser, persona) {
            const context = await browser.newContext({ viewport: { width: 1440, height: 1000 } });
            const page = await context.newPage();
            const errors = [];
            attachErrorCollection(page, errors);

            const demoResponse = await page.goto(`${base}/demo`, { waitUntil: "networkidle", timeout: 90000 });
            check(demoResponse && demoResponse.ok(), `${persona.label}: /demo did not return 2xx`);

            const roleTab = page.getByRole("tab").filter({ hasText: persona.label }).first();
            check((await roleTab.count()) === 1, `${persona.label}: role tab is missing`);
            await roleTab.click();

            const openButton = page.getByRole("button", { name: new RegExp(`^Open ${persona.short} demo`, "i") });
            check((await openButton.count()) === 1, `${persona.label}: launch button is missing`);

            const [switchResponse] = await Promise.all([
              page.waitForResponse(
                (response) =>
                  response.url().includes("/api/auth/demo-switch") &&
                  response.request().method() === "POST",
                { timeout: 90000 },
              ),
              openButton.click(),
            ]);
            if (!switchResponse.ok()) {
              const switchText = await switchResponse.text().catch(() => "<response body unavailable>");
              throw new Error(`${persona.label}: demo switch returned ${switchResponse.status()} ${switchText}`);
            }
            await page.waitForURL(new RegExp(`[?&]demoRole=${persona.id}(?:&|$)`), { timeout: 30000 });
            const encryptionProbe = await context.request.post(`${base}/api/auth/demo-switch`, {
              data: { role: persona.id },
              headers: { Origin: base },
            });
            check(encryptionProbe.ok(), `${persona.label}: encryption readiness probe returned ${encryptionProbe.status()}`);
            const encryptionPayload = await encryptionProbe.json();
            check(encryptionPayload.bankDataEncryptionReady === true, `${persona.label}: demo provisioning left plaintext bank data behind`);
            await page.waitForLoadState("networkidle");

            const body = (await page.locator("body").textContent()) ?? "";
            check(body.includes(persona.person), `${persona.label}: expected persona identity ${persona.person} is missing`);
            check(body.toLowerCase().includes(persona.landing.toLowerCase()), `${persona.label}: expected landing context ${persona.landing} is missing`);

            if (persona.id === "owner") {
              check(new URL(page.url()).pathname === "/app", "Owner: demo must land on /app, not replace the homepage");
              const marketingPage = await context.newPage();
              const marketingResponse = await marketingPage.goto(base, { waitUntil: "networkidle", timeout: 90000 });
              check(marketingResponse && marketingResponse.ok(), "Owner: signed-in visit to / did not return 2xx");
              const marketingH1 = (await marketingPage.locator("h1").first().innerText()).trim();
              check(marketingH1.includes("Payroll that stays clear") && marketingH1.includes("under control."), `Owner: signed-in / should stay on the PayrollPH marketing homepage; saw "${marketingH1}"`);
              await marketingPage.close();

              const legacyPage = await context.newPage();
              const legacyResponse = await legacyPage.goto(`${base}/workspace?demoRole=owner`, { waitUntil: "networkidle", timeout: 90000 });
              check(legacyResponse && legacyResponse.ok(), "Owner: legacy /workspace redirect did not resolve");
              const legacyUrl = new URL(legacyPage.url());
              check(legacyUrl.pathname === "/app", `Owner: legacy /workspace should redirect to /app; saw ${legacyUrl.pathname}`);
              check(legacyUrl.searchParams.get("demoRole") === "owner", "Owner: legacy /workspace redirect dropped demoRole");
              await legacyPage.close();

              const tonedItems = page.locator("aside .nav-item[data-tone]");
              check((await tonedItems.count()) >= 5, "Owner: real sidebar is missing module tone data");
              const firstIcon = tonedItems.nth(0).locator(".nav-icon");
              const secondIcon = tonedItems.nth(1).locator(".nav-icon");
              const iconColors = await Promise.all([
                firstIcon.evaluate((element) => ({
                  color: getComputedStyle(element).color,
                  background: getComputedStyle(element).backgroundColor,
                })),
                secondIcon.evaluate((element) => ({
                  color: getComputedStyle(element).color,
                  background: getComputedStyle(element).backgroundColor,
                })),
              ]);
              check(iconColors[0].color !== iconColors[1].color, "Owner: sidebar module icons were flattened to one color");
              check(iconColors[0].background !== "rgba(0, 0, 0, 0)", "Owner: sidebar icon tint background is transparent");

              const profile = page.locator("aside .side-profile");
              check((await profile.count()) === 1, "Owner: interactive profile control is missing");
              const profileAvatar = profile.locator(".avatar").first();
              const avatarBackground = await profileAvatar.evaluate((element) => getComputedStyle(element).backgroundColor);
              check(avatarBackground !== "rgb(238, 238, 239)", "Owner: profile avatar is still the old gray placeholder");
            }

            if (persona.dashboardRole) {
              const dashboard = page.locator(`[data-role-dashboard="${persona.dashboardRole}"]`);
              check((await dashboard.count()) === 1, `${persona.label}: role-specific dashboard did not render`);
              check((await dashboard.locator(".dashboard-alert-banner").count()) === 1, `${persona.label}: focused owl alert banner is missing`);
              check((await dashboard.locator(".dashboard-stat-card").count()) === 4, `${persona.label}: dashboard must show exactly four primary metrics`);
              const sandbox = page.locator(".demo-sandbox").first();
              if (await sandbox.count()) {
                check((await sandbox.isVisible()) === false, `${persona.label}: bulky demo sandbox must stay off the landing view`);
              }
              check((await dashboard.locator(".dashboard-secondary-controls:visible").count()) === 0, `${persona.label}: legacy handoff controls must stay off the focused landing view`);
              check((await dashboard.locator(".role-dashboard-grid:visible").count()) === 0, `${persona.label}: legacy detail grid must stay off the focused landing view`);
            }
            if (persona.id === "employee") {
              check(body.includes("LATEST PAYSLIP"), "Employee: latest released payslip promotion is missing");
              check(body.includes("Payslip available"), "Employee: released payslip availability state is missing");
              check((await page.locator("[data-latest-payslip]").count()) === 1, "Employee: latest payslip card is missing");
              check(body.includes("NEXT PAY STATUS"), "Employee: next pay status section is missing");
              check(body.includes("Your pay amount stays private and hidden until payroll is released."), "Employee: unreleased-pay privacy copy is missing");
              const handoff = page.locator("[data-payroll-handoff]").first();
              check((await handoff.count()) === 1, "Employee: payroll handoff is missing");
              check((await handoff.locator(".handoff-step").count()) === 5, "Employee: payroll handoff must show all five owners");
            }

            if (persona.id === "payroll" || persona.id === "checker") {
              const bell = page.getByRole("button", { name: /^Notifications/ }).first();
              check((await bell.count()) === 1, `${persona.label}: notification bell is missing`);
              await bell.click();
              const tray = page.getByRole("dialog", { name: "Notifications" });
              check((await tray.count()) === 1, `${persona.label}: notification tray did not open`);
              const trayText = await tray.innerText();
              if (persona.id === "payroll") {
                check(trayText.includes("Resolve 2 payroll exceptions"), "Payroll: transition notification is missing");
              }
              if (persona.id === "checker") {
                check(trayText.includes("Review Sep 1–15, 2026 payroll"), "Checker: review transition notification is missing");
              }
              await bell.click();
            }

            const alert = page.getByRole("alert");
            if (await alert.count()) {
              const alertText = (await alert.first().innerText()).trim();
              check(!alertText, `${persona.label}: launch alert: ${alertText}`);
            }

            await page.screenshot({
              path: `${outDir}/persona-${persona.id}-landing.png`,
              fullPage: true,
            });

            const sidebar = page.locator("aside");
            if (persona.id === "hr") {
              check((await sidebar.locator(".nav-item").filter({ hasText: /^Payroll$/ }).count()) === 0, "HR: payroll operator navigation must stay hidden");
              check((await sidebar.locator(".nav-item").filter({ hasText: /^Migration$/ }).count()) === 0, "HR: migration admin navigation must stay hidden");
            }
            if (persona.id === "checker") {
              check((await sidebar.locator(".nav-item").filter({ hasText: /^Employees$/ }).count()) === 0, "Checker: people administration must stay hidden");
              check((await sidebar.locator(".nav-item").filter({ hasText: /^Payroll$/ }).count()) === 0, "Checker: unsafe payroll-maker page must stay hidden");
            }
            if (persona.id === "payroll") {
              check((await sidebar.locator(".nav-item").filter({ hasText: /^Leave$/ }).count()) === 0, "Payroll: leave administration must stay hidden");
              const approvalsNav = sidebar.locator(".nav-item").filter({ hasText: /^Approvals/ }).first();
              check((await approvalsNav.count()) === 1, "Payroll: approvals status page should remain visible");
              await approvalsNav.click();
              await page.waitForTimeout(100);
              check((await page.getByRole("button", { name: /^Approve$/ }).count()) === 0, "Payroll: Approve action must be hidden");
              check((await page.getByRole("button", { name: /^Decline$/ }).count()) === 0, "Payroll: Decline action must be hidden");
              check((await page.getByRole("button", { name: /Delegation settings/i }).count()) === 0, "Payroll: delegation controls must be hidden");
              check((await page.locator("[data-payroll-handoff]").count()) >= 1, "Payroll: approvals page should retain the shared handoff context");
              const overviewNav = sidebar.locator(".nav-item").filter({ hasText: /^Dashboard$/ }).first();
              await overviewNav.click();
              await page.waitForTimeout(100);
            }

            if (persona.dashboardRole || persona.id === "employee") {
              await inspectPersonaViewport(page, persona, 768, 1024, "tablet-768");
              await inspectPersonaViewport(page, persona, 390, 844, "mobile-390");
              await page.setViewportSize({ width: 1440, height: 1000 });
              await page.waitForTimeout(120);
            }

            if (persona.id === "employee") {
              const viewPayslip = page.getByRole("button", { name: /View payslip/i }).first();
              check((await viewPayslip.count()) === 1, "Employee: payslip CTA is missing");
              await viewPayslip.click();
              await page.waitForTimeout(120);
              const afterTask = (await page.locator("body").textContent()) ?? "";
              check(afterTask.includes("Rule version"), "Employee: opening the payslip did not reveal its details");
            } else {
              const taskNav = page.locator("aside .nav-item").filter({ hasText: new RegExp(`^${persona.taskPage}`) }).first();
              check((await taskNav.count()) === 1, `${persona.label}: target navigation ${persona.taskPage} is missing`);
              await taskNav.click();
              await page.waitForTimeout(250);
              if (persona.id === "payroll") {
                const recovery = page.locator('[data-recovery-state="unresolved-exception"]');
                check((await recovery.count()) === 1, "Payroll: unresolved exception recovery state is missing");
                check((await recovery.innerText()).includes("Review exceptions"), "Payroll: exception recovery action is missing");
              }
              const activeNav = page.locator("aside .nav-item[aria-current='page']").filter({ hasText: new RegExp(`^${persona.taskPage}`) }).first();
              check((await activeNav.count()) === 1, `${persona.label}: task navigation did not reach ${persona.taskPage}`);
            }

            await page.screenshot({
              path: `${outDir}/persona-${persona.id}.png`,
              fullPage: true,
            });

            await page.setViewportSize({ width: 768, height: 1024 });
            await page.waitForTimeout(120);
            const taskTabletOverflow = await page.evaluate(() => ({
              scrollWidth: document.documentElement.scrollWidth,
              innerWidth: window.innerWidth,
            }));
            check(
              taskTabletOverflow.scrollWidth <= taskTabletOverflow.innerWidth + 1,
              `${persona.label}: tablet task page horizontal overflow ${taskTabletOverflow.scrollWidth}px > ${taskTabletOverflow.innerWidth}px`,
            );
            await page.screenshot({
              path: `${outDir}/persona-${persona.id}-task-tablet-768.png`,
              fullPage: true,
            });
            await page.setViewportSize({ width: 1440, height: 1000 });
            await page.waitForTimeout(120);

            check(errors.length === 0, `${persona.label}: browser console/page errors: ${errors.join(" | ")}`);

            report.personas.push({
              id: persona.id,
              label: persona.label,
              url: page.url(),
              person: persona.person,
              landing: persona.landing,
              firstTask: "passed",
              errors,
            });
            await context.close();
          }


          async function qaEmployeeLogout(browser) {
            const logoutContext = await browser.newContext({ viewport: { width: 1440, height: 1000 } });
            try {
              const launch = await logoutContext.request.post(`${base}/api/auth/demo-switch`, {
                data: { role: "employee" },
                headers: { Origin: base },
              });
              check(launch.ok(), `Employee logout QA: demo launch returned ${launch.status()}`);
              const payload = await launch.json();
              const logoutPage = await logoutContext.newPage();
              const target = typeof payload.redirectTo === "string" ? payload.redirectTo : "/app?demoRole=employee";
              await logoutPage.goto(target.startsWith("http") ? target : `${base}${target}`, { waitUntil: "networkidle", timeout: 90000 });
              const signOut = logoutPage.getByRole("button", { name: /^Sign out$/ }).first();
              check((await signOut.count()) === 1, "Employee logout QA: Sign out button is missing");
              await Promise.all([
                logoutPage.waitForURL(/\/login(?:\?|$)/, { timeout: 15000 }),
                signOut.click(),
              ]);
              check(new URL(logoutPage.url()).pathname === "/login", "Employee logout QA: sign out did not return to /login");
            } finally {
              await logoutContext.close();
            }
          }

          const sameOriginHeaders = { Origin: base };

          async function switchPersona(context, page, role) {
            const response = await context.request.post(`${base}/api/auth/demo-switch`, {
              data: { role },
              headers: sameOriginHeaders,
            });
            check(response.ok(), `Lifecycle: switching to ${role} returned ${response.status()}`);
            const payload = await response.json();
            check(payload.bankDataEncryptionReady === true, `Lifecycle: switching to ${role} left plaintext bank data behind`);
            const target = typeof payload.redirectTo === "string" ? payload.redirectTo : `/app?demoRole=${role}`;
            await page.goto(target.startsWith("http") ? target : `${base}${target}`, { waitUntil: "networkidle", timeout: 90000 });
            return payload;
          }

          async function notificationText(page) {
            const bell = page.getByRole("button", { name: /^Notifications/ }).first();
            check((await bell.count()) === 1, "Lifecycle: notification bell is missing");
            await bell.click();
            const tray = page.getByRole("dialog", { name: "Notifications" });
            check((await tray.count()) === 1, "Lifecycle: notification tray did not open");
            const text = await tray.innerText();
            await bell.click();
            return text;
          }

          async function qaReleaseCycle(browser) {
            const context = await browser.newContext({ viewport: { width: 1440, height: 1000 } });
            const page = await context.newPage();
            const errors = [];
            attachErrorCollection(page, errors);
            const period = "Sep 16–30, 2026";

            // HR has completed the input handoff for this exact run; Payroll owns
            // the next visible step before the same run moves through review.
            await switchPersona(context, page, "hr");
            const hrHandoff = page.locator("[data-payroll-handoff]").first();
            check((await hrHandoff.count()) === 1, "Lifecycle: HR handoff is missing");
            check((await hrHandoff.locator('[data-handoff-stage="hr"]').getAttribute("class")).includes("done"), "Lifecycle: HR stage should be complete");
            check((await hrHandoff.locator('[data-handoff-stage="payroll"]').getAttribute("class")).includes("current"), "Lifecycle: Payroll should own the run after HR");

            const payrollSession = await switchPersona(context, page, "payroll");
            const dashboardResponse = await context.request.get(
              `${base}/api/dashboard?organizationId=${payrollSession.organizationId}`,
            );
            check(dashboardResponse.ok(), "Lifecycle: payroll dashboard API failed");
            const dashboard = await dashboardResponse.json();
            const run = dashboard.payrollRuns.find((item) => item.periodLabel === period);
            check(run, `Lifecycle: ${period} run is missing`);
            check(run.status === "Needs review", `Lifecycle: expected Needs review before submission, saw ${run.status}`);

            const approversResponse = await context.request.get(
              `${base}/api/organizations/${dashboard.selectedOrganization.id}/payroll-approvers`,
            );
            check(approversResponse.ok(), "Lifecycle: checker list could not be loaded");
            const approvers = await approversResponse.json();
            const checker = approvers.approvers.find((item) => item.role === "checker" || item.name === "Mariel Santos");
            check(checker, "Lifecycle: seeded checker is missing");

            const submitResponse = await context.request.post(`${base}/api/payroll-runs/${run.id}/submit-review`, {
              data: { approverUserId: checker.id },
              headers: sameOriginHeaders,
            });
            const submitPayload = await submitResponse.json();
            check(submitResponse.ok(), `Lifecycle: review submission failed: ${submitPayload.error ?? submitResponse.status()}`);
            check(submitPayload.task?.id, "Lifecycle: review submission returned no approval task");
            await page.reload({ waitUntil: "networkidle" });
            const payrollNotifications = await notificationText(page);
            check(!payrollNotifications.includes("Resolve 2 payroll exceptions"), "Lifecycle: payroll exception notification should disappear after submission");

            await switchPersona(context, page, "checker");
            const checkerNotificationsBefore = await notificationText(page);
            check(checkerNotificationsBefore.includes(`Review ${period} payroll`), "Lifecycle: checker did not receive the submitted payroll notification");

            const approveResponse = await context.request.patch(`${base}/api/approvals/${submitPayload.task.id}`, {
              data: { status: "Approved" },
              headers: sameOriginHeaders,
            });
            const approvePayload = await approveResponse.json();
            check(approveResponse.ok(), `Lifecycle: checker approval failed: ${approvePayload.error ?? approveResponse.status()}`);
            await page.reload({ waitUntil: "networkidle" });
            const checkerNotificationsAfter = await notificationText(page);
            check(!checkerNotificationsAfter.includes(`Review ${period} payroll`), "Lifecycle: checker notification should disappear after approval");

            const ownerSession = await switchPersona(context, page, "owner");
            const ownerNotificationsBefore = await notificationText(page);
            check(ownerNotificationsBefore.includes(`${period} is approved and ready to release`), "Lifecycle: owner did not receive release-ready notification");

            const releaseResponse = await context.request.post(`${base}/api/payroll-runs/${run.id}/release`, {
              data: { acknowledgeExceptions: true },
              headers: sameOriginHeaders,
            });
            const releasePayload = await releaseResponse.json();
            check(releaseResponse.ok(), `Lifecycle: owner release failed: ${releasePayload.error ?? releaseResponse.status()}`);
            check(releasePayload.receipt?.employeeCount > 0, "Lifecycle: release receipt is missing employee count");
            check(Number(releasePayload.receipt?.totalNetPay) > 0, "Lifecycle: release receipt is missing net payroll");
            check(releasePayload.receipt?.bankExport?.status === "waiting", "Lifecycle: release receipt should wait for the final bank file");
            check(releasePayload.receipt?.payout?.status === "waiting-for-file", "Lifecycle: payout should wait for the final bank file immediately after release");
            check(releasePayload.receipt?.payslips?.available > 0, "Lifecycle: payslip availability is missing");

            await page.reload({ waitUntil: "networkidle" });
            const ownerNotificationsAfter = await notificationText(page);
            check(!ownerNotificationsAfter.includes(`${period} is approved and ready to release`), "Lifecycle: owner release notification should disappear after release");

            const payrollNav = page.locator("button.nav-item").filter({ hasText: /^Payroll/ }).first();
            check((await payrollNav.count()) === 1, "Lifecycle: owner payroll navigation is missing");
            await payrollNav.click();
            await page.waitForTimeout(200);
            const runButton = page.locator("button.run-item").filter({ hasText: period }).first();
            check((await runButton.count()) === 1, "Lifecycle: released run is missing from payroll history");
            await runButton.click();
            await page.waitForTimeout(150);
            const receipt = page.locator("[data-release-receipt]");
            check((await receipt.count()) === 1, "Lifecycle: persistent owner release receipt is missing");
            const receiptText = (await receipt.innerText()).toLowerCase();
            check(receiptText.includes("total net payroll"), "Lifecycle: release receipt does not show net payroll");
            check(receiptText.includes("bank / export status"), "Lifecycle: release receipt does not show export status");
            check(receiptText.includes("payslip delivery"), "Lifecycle: release receipt does not show payslip delivery status");
            check(receiptText.includes(String(releasePayload.receipt.employeeCount)), "Lifecycle: release receipt does not show employee count");
            check(
              receiptText.includes(Number(releasePayload.receipt.totalNetPay).toLocaleString("en-PH")),
              "Lifecycle: release receipt does not show the released net total",
            );
            check(receiptText.includes("waiting"), "Lifecycle: receipt should show bank export waiting before the final file exists");
            check((await receipt.locator('[data-payout-status="waiting-for-file"]').count()) === 1, "Lifecycle: receipt payout state should wait for the final bank file");

            const bankExportResponse = await context.request.get(
              `${base}/api/payroll-runs/${run.id}/exports?kind=bank&template=${encodeURIComponent("BDO DAT")}&dryRun=false`,
            );
            check(bankExportResponse.ok(), `Lifecycle: final bank export failed: ${bankExportResponse.status()}`);
            const bankDisposition = bankExportResponse.headers()["content-disposition"] ?? "";
            check(bankDisposition.toLowerCase().includes("attachment"), "Lifecycle: final bank export did not return a downloadable file");

            const postExportDashboardResponse = await context.request.get(
              `${base}/api/dashboard?organizationId=${ownerSession.organizationId}`,
            );
            check(postExportDashboardResponse.ok(), "Lifecycle: dashboard refresh after bank export failed");
            const postExportDashboard = await postExportDashboardResponse.json();
            const bankAudit = postExportDashboard.auditEvents.find((event) =>
              event.action === "bank export generated"
              && Number(event.metadata?.runId) === run.id
              && event.metadata?.dryRun !== true
            );
            check(bankAudit, "Lifecycle: final bank export was not audit-logged");

            await switchPersona(context, page, "owner");
            const payrollNavAfterExport = page.locator("button.nav-item").filter({ hasText: /^Payroll/ }).first();
            await payrollNavAfterExport.click();
            await page.waitForTimeout(200);
            const runAfterExport = page.locator("button.run-item").filter({ hasText: period }).first();
            await runAfterExport.click();
            await page.waitForTimeout(150);
            const receiptAfterExport = page.locator("[data-release-receipt]");
            check((await receiptAfterExport.count()) === 1, "Lifecycle: release receipt disappeared after bank export");
            const receiptAfterExportText = (await receiptAfterExport.innerText()).toLowerCase();
            check(receiptAfterExportText.includes("generated"), "Lifecycle: bank/export receipt did not advance to generated");
            check((await receiptAfterExport.locator('[data-payout-status="ready"]').count()) === 1, "Lifecycle: payout did not advance to ready after final bank export");

            await switchPersona(context, page, "employee");
            const latest = page.locator("[data-latest-payslip]");
            check((await latest.count()) === 1, "Lifecycle: employee latest payslip card is missing after release");
            const latestText = await latest.innerText();
            check(/Payslip available|payslip is ready/i.test(latestText), "Lifecycle: employee does not see the released payslip state");
            check(latestText.includes(period), "Lifecycle: newly released payslip is not promoted above history");

            check(errors.length === 0, `Lifecycle: browser console/page errors: ${errors.join(" | ")}`);
            report.personas.push({
              id: "release-cycle",
              label: "HR → Payroll → Checker → Owner → Bank export → Employee",
              period,
              firstTask: "passed",
              errors,
            });
            await context.close();
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            try {
              await qaHomepage(browser, "desktop", { width: 1440, height: 1000 });
              await qaHomepage(browser, "mobile-390", { width: 390, height: 844 });
              await qaPublicRoutes(browser);

              for (const persona of personas) {
                await qaPersona(browser, persona);
              }

              await qaEmployeeLogout(browser);
              await qaReleaseCycle(browser);
            } catch (error) {
              report.errors.push(error instanceof Error ? error.message : String(error));
              throw error;
            } finally {
              fs.writeFileSync(`${outDir}/report.json`, JSON.stringify(report, null, 2));
              await browser.close();
            }
          })();
