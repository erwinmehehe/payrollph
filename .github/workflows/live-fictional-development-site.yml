name: Live Fictional Development Website Acceptance (GET-Only)

on:
  pull_request:
    paths:
      - "scripts/qa/live-fictional-development-site.mjs"
      - ".github/workflows/live-fictional-development-site.yml"
  push:
    branches: [main]
    paths:
      - "scripts/qa/live-fictional-development-site.mjs"
      - ".github/workflows/live-fictional-development-site.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-fictional-demo-read-path:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      LIVE_FICTIONAL_QA_MODE: public-fictional-demo-readonly
      LIVE_FICTIONAL_QA_ORIGIN: https://erwinmehehe-payrollph.vercel.app
    steps:
      - name: Checkout reviewed test source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Verify live acceptance source syntax
        run: node --check scripts/qa/live-fictional-development-site.mjs
      - name: Probe deployed fictional demo roles, HR, attendance, payroll and tenant GET boundaries
        run: node scripts/qa/live-fictional-development-site.mjs
      - name: Save only sanitized HTTP status evidence (never session cookies or responses)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-fictional-dev-status
          path: qa-artifacts/live-fictional-development-site.json
          if-no-files-found: ignore
          retention-days: 7

# This workflow NEVER obtains real login credentials, Neon database access,
# payout/billing provider access, readiness tokens, or production PII.
# Public synthetic demo-switch is the sole session-setup POST; all protected
# business endpoints use GET, and no government filing is submitted.
# CI proves live deployed demo read paths, NOT authenticated customer launch.
