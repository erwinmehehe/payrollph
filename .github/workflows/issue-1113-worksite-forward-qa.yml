name: Issue 1113 Worksite Decision Forward Candidate (Synthetic PG16/PG18)

on:
  pull_request:
    paths:
      - "docs/sql/issue-1113-worksite-decision-forward-candidate.sql"
      - "drizzle/0130_worksite_assignment_decision_forward.sql"
      - "drizzle/0131_separation_record_forward_repair.sql"
      - "tests/issue-1113-separation-forward-postgres.test.mjs"
      - "docs/engineering/issue-1113-worksite-decision-plan.md"
      - "tests/issue-1113-worksite-decision-postgres.test.mjs"
      - "tests/issue-1113-worksite-decision-contract.test.mjs"
      - ".github/workflows/issue-1113-worksite-forward-qa.yml"
  push:
    branches: [main]
    paths:
      - "docs/sql/issue-1113-worksite-decision-forward-candidate.sql"
      - "drizzle/0130_worksite_assignment_decision_forward.sql"
      - "drizzle/0131_separation_record_forward_repair.sql"
      - "tests/issue-1113-separation-forward-postgres.test.mjs"
      - "tests/issue-1113-worksite-decision-postgres.test.mjs"
      - "tests/issue-1113-worksite-decision-contract.test.mjs"
      - ".github/workflows/issue-1113-worksite-forward-qa.yml"

# Supersede only older PR attempts; main/manual runs retain independent groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  disposable-worksite-repair:
    name: Candidate preflight, row preservation and rollback (PG${{ matrix.postgres }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        postgres: ["16", "18"]
    env:
      CI: "true"
      GITHUB_ACTIONS: "true"
      MIGRATION_REHEARSAL_MODE: isolated-ci-only
      ISSUE_1113_REHEARSAL: isolated-ci-only
      ISSUE_1113_PG_MAJOR: ${{ matrix.postgres }}
      TZ: Asia/Manila
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout tested commit without stored credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Validate CI-only localhost target and source contract
        run: |
          set -euo pipefail
          node --check tests/issue-1113-worksite-decision-postgres.test.mjs
          node --check tests/issue-1113-worksite-decision-contract.test.mjs
          node --test tests/isolated-migration-target.test.mjs
          node --test tests/issue-1113-worksite-decision-contract.test.mjs
      - name: Bootstrap ONLY the empty throwaway localhost schema
        run: npm run db:push
      - name: Reproduce missing historical column, test strict denial and ROLLBACK
        run: |
          set -euo pipefail
          node --test tests/issue-1113-worksite-decision-postgres.test.mjs
          node --import tsx --test tests/issue-1113-separation-forward-postgres.test.mjs
          sha256sum drizzle/0130_worksite_assignment_decision_forward.sql drizzle/0131_separation_record_forward_repair.sql
          printf '%s\n' 'SYNTHETIC ONLY - no production schema, receipts or applied SQL'
