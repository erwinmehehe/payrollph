name: Homepage production-state QA

on:
  push:
    branches:
      - fix/homepage-pricing-data-and-hero

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
      DEMO_MODE: "false"
      APP_BASE_URL: http://127.0.0.1:3000
      PG_POOL_MAX: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Apply empty production schema
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const { Client } = require("pg");
          (async () => {
            const client = new Client({ connectionString: process.env.DATABASE_URL });
            await client.connect();
            await client.query(fs.readFileSync("drizzle/baseline.sql", "utf8"));
            const before = await client.query("select count(*)::int as count from pricing_plans");
            console.log("pricing rows before homepage:", before.rows[0].count);
            if (before.rows[0].count !== 0) throw new Error("Production-like DB should start without pricing rows");
            await client.end();
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
      - run: npx tsc --noEmit
      - run: npx eslint src tests
      - run: npx tsx --test tests/marketing.test.ts
      - run: npm run build
      - name: Start app
        run: |
          npm start > /tmp/linaw-next.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/linaw-next.log
          exit 1
      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify live-like homepage
        run: |
          mkdir -p homepage-qa
          node <<'NODE'
          const { chromium } = require("playwright");
          const { Client } = require("pg");

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1450, height: 900 }, deviceScaleFactor: 1 });

            await page.goto("http://127.0.0.1:3000/", { waitUntil: "networkidle" });
            await page.addStyleTag({ content: `
              @supports (animation-timeline: view()) {
                .software-home * { animation: none !important; opacity: 1 !important; }
              }
              .software-home .site-nav { position: static !important; }
            `});

            const hero = page.locator(".home-hero");
            const heroBox = await hero.boundingBox();
            const heroVisual = await page.locator(".home-hero-visual .frame").boundingBox();
            const heroCopy = await page.locator(".home-hero-copy").boundingBox();
            if (!heroBox || !heroVisual || !heroCopy) throw new Error("Hero geometry missing");
            if (heroBox.height > 800) throw new Error(`Hero still too tall: ${heroBox.height}`);
            if (heroVisual.width < 610 || heroVisual.height < 500) {
              throw new Error(`Hero product is too small: ${JSON.stringify(heroVisual)}`);
            }

            const pricing = page.locator("#pricing");
            await pricing.scrollIntoViewIfNeeded();
            const cards = pricing.locator(".pricing-grid .price-card");
            if ((await cards.count()) !== 4) throw new Error(`Expected 4 pricing cards, found ${await cards.count()}`);

            const names = await pricing.locator(".price-plan").allTextContents();
            if (names.join(",") !== "Solo,Core,Scale,Enterprise") {
              throw new Error(`Unexpected plans: ${names.join(",")}`);
            }

            const input = pricing.getByLabel("Employee headcount");
            const prices = pricing.locator(".price strong");
            const before = await prices.allTextContents();
            await input.fill("50");
            const after = await prices.allTextContents();
            if (JSON.stringify(before) === JSON.stringify(after)) throw new Error("Pricing did not recalculate");

            const client = new Client({ connectionString: process.env.DATABASE_URL });
            await client.connect();
            const dbRows = await client.query("select name, monthly_base, per_employee, active from pricing_plans order by id");
            await client.end();
            if (dbRows.rows.length !== 4) throw new Error(`Expected 4 DB pricing rows, found ${dbRows.rows.length}`);

            const width = await page.evaluate(() => Math.max(document.body.scrollWidth, document.documentElement.scrollWidth));
            if (width > 1452) throw new Error(`Desktop overflow: ${width}`);

            await page.locator(".home-hero").screenshot({ path: "homepage-qa/hero-1450.png" });
            await pricing.screenshot({ path: "homepage-qa/pricing-1450.png" });

            const mobile = await browser.newPage({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 1 });
            await mobile.goto("http://127.0.0.1:3000/", { waitUntil: "networkidle" });
            const mobileWidth = await mobile.evaluate(() => Math.max(document.body.scrollWidth, document.documentElement.scrollWidth));
            if (mobileWidth > 392) throw new Error(`Mobile overflow: ${mobileWidth}`);
            if ((await mobile.locator("#pricing .pricing-grid .price-card").count()) !== 4) throw new Error("Mobile pricing cards missing");
            await mobile.locator(".home-hero").screenshot({ path: "homepage-qa/hero-390.png" });
            await mobile.locator("#pricing").screenshot({ path: "homepage-qa/pricing-390.png" });

            console.log(JSON.stringify({
              heroBox, heroVisual, heroCopy, before, after, dbRows: dbRows.rows, width, mobileWidth
            }, null, 2));

            await browser.close();
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homepage-production-state-qa
          path: homepage-qa/
          retention-days: 1
