name: Inline first payroll acceptance
on:
  pull_request:
    paths:
      - 'src/lib/first-payroll*'
      - 'src/lib/payroll-engine.ts'
      - 'src/lib/auth.ts'
      - 'src/components/workspace/inline-first-payroll-journey.tsx'
      - 'src/components/linaw-workspace.tsx'
      - 'src/components/new-hire-modal.tsx'
      - 'src/app/api/first-payroll-journey/**'
      - 'scripts/inline-first-payroll-*'
      - 'tests/inline-first-payroll*'
      - '.github/workflows/inline-first-payroll-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inline-acceptance:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Manila
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
      APP_BASE_URL: http://127.0.0.1:3000
      TRUSTED_APP_ORIGINS: http://127.0.0.1:3000
      INLINE_FIRST_PAYROLL_ENABLED: 'true'
      INLINE_FIRST_PAYROLL_ACCEPTANCE_MODE: synthetic-postgres-only
      REQUIRE_PRIVILEGED_MFA: 'false'
      DEMO_MODE: 'false'
      OPENAI_API_KEY: ''
      PAYMONGO_DISBURSEMENTS_ENABLED: 'false'
      XENDIT_PAYOUTS_ENABLED: 'false'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Ephemeral encryption for fictional records
        run: echo "BANK_DATA_ENCRYPTION_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - run: npm run db:push
      - run: node --import tsx --test tests/inline-first-payroll*.test.ts
      - run: node --import tsx scripts/inline-first-payroll-synthetic-fixture.ts
      - run: npm run build
      - name: Install Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start isolated app
        run: |
          nohup npm start -- -H 127.0.0.1 > /tmp/inline-first-payroll.log 2>&1 &
          for attempt in {1..45}; do
            if curl -fsS http://127.0.0.1:3000/login >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/inline-first-payroll.log
          exit 1
      - run: node scripts/inline-first-payroll-synthetic-browser.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: inline-first-payroll-acceptance
          path: qa-artifacts/inline-first-payroll-*
          retention-days: 7
