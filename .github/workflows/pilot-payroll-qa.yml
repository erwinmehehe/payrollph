name: Production Pilot Payroll QA

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      # Stacked ESS and billing PRs also require browser/security assurance.
      - feat/hcm-work-item-ownership-sla
      - ui/ess-mobile-ux
    paths:
      - "src/app/api/employees/route.ts"
      - "src/app/api/provisioning/**"
      - "src/app/api/web-bundy/**"
      - "src/app/api/compliance/filing-validations/**"
      - "src/lib/filing-evidence*.ts"
      - "src/app/api/invitations/**"
      - "src/app/api/payroll-runs/**"
      - "src/app/api/compliance/bank-validations/**"
      - "src/app/api/payout-destination-changes/**"
      - "src/app/api/payout-profiles/**"
      - "src/app/api/treasury-controls/**"
      - "src/app/api/webhooks/paymongo/**"
      - "src/app/api/approvals/**"
      - "src/app/api/self/**"
      - "src/app/api/setup/**"
      - "src/components/payout-profiles-panel.tsx"
      - "src/components/new-hire-modal.tsx"
      - "src/components/workspace/**"
      - "src/lib/access.ts"
      - "src/lib/bank-**"
      - "src/lib/paymongo.ts"
      - "src/lib/paymongo-**"
      - "src/lib/payout-**"
      - "src/lib/treasury-**"
      - "src/lib/exporters.ts"
      - "src/lib/filing-evidence-store.ts"
      - "tests/filing-evidence-lifecycle.test.ts"
      - "src/lib/payroll-**"
      - "src/lib/workforce-**"
      - "src/app/api/workforce/**"
      - "tests/workforce-*.test.ts"
      - "src/lib/roles.ts"
      - "src/db/**"
      - "scripts/pilot-payroll-qa.ts"
      - "scripts/first-payroll-mobile-synthetic-*"
      - "tests/*bank*.test.ts"
      - "tests/*paymongo*.test.ts"
      - "tests/*payout*.test.ts"
      - "tests/*treasury*.test.ts"
      - "tests/production-pilot-readiness.test.ts"
      - ".github/workflows/pilot-payroll-qa.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

concurrency:
  # A newer push to a pull request supersedes its older run. Runs for main and
  # manual dispatch are keyed by commit and never cancelled, so a quick follow-up
  # merge cannot leave a main commit with a cancelled (or missing) result.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pilot-payroll:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      TZ: Asia/Manila
      # Fictional leave type for the fresh, single-tenant local CI database.
      # This is not an employer policy or a production conversion authorization.
      LEAVE_CONVERSION_MAX_DAYS_JSON: '{"1":{"synthetic exit leave":5}}'
      SYNTHETIC_SEPARATION_QA: "true"
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
      APP_BASE_URL: http://127.0.0.1:3000
      TRUSTED_APP_ORIGINS: http://127.0.0.1:3000
      DEMO_MODE: "false"
      # Positive no-money lifecycle uses the legacy timesheet guard. Strict
      # flag-ON pre-run source rejection is separately proven on disposable PG.
      PAYROLL_PRE_RUN_READINESS_ENABLED: "false"
      PAYMONGO_DISBURSEMENTS_ENABLED: "false"
      XENDIT_PAYOUTS_ENABLED: "false"
      XENDIT_PAYOUTS_LIVE_APPROVED: "false"
      WFM_GEOFENCE_PILOT_ENABLED: "false"
      OPENAI_API_KEY: ""
      WORKER_TOKEN: ci-worker-token-00000000000000000000000000000000
      READINESS_TOKEN: ci-readiness-token-0000000000000000000000000000
      SETUP_TOKEN: ci-setup-token-0000000000000000000000000000000
      TOTP_ENCRYPTION_KEY: "1111111111111111111111111111111111111111111111111111111111111111"
      # Functional lifecycle QA disables privileged MFA only for its fresh,
      # isolated tenant. Security HTTP Smoke separately proves production MFA
      # enforcement fails closed.
      REQUIRE_PRIVILEGED_MFA: "false"
      QA_URL: http://127.0.0.1:3000
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
          POSTGRES_INITDB_ARGS: "--encoding=UTF8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - name: Provision dedicated ephemeral PII key (fictional pilot only)
        run: |
          pii_key=$(openssl rand -hex 32)
          echo "::add-mask::$pii_key"
          echo "PII_ENCRYPTION_KEY=$pii_key" >> "$GITHUB_ENV"
      - run: npm run db:push
      - name: Apply audit 0109 on isolated real PG16 before acceptance
        run: node scripts/qa/apply-audit-0109-isolated.mjs
      - name: Apply the cutover baseline objects (0109 audit chain + reviewed supplement); request code only verifies schema
        run: node scripts/qa/apply-isolated-baseline.mjs
      - run: npm run build

      - name: Start production build
        shell: bash
        run: |
          nohup npm start -- -H 127.0.0.1 > /tmp/payrollph-pilot.log 2>&1 &
          echo $! > /tmp/payrollph-pilot.pid
          for attempt in {1..40}; do
            if curl -fsS "$QA_URL" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/payrollph-pilot.log
          exit 1

      - name: Run fresh tenant payroll pilot
        run: npx tsx scripts/pilot-payroll-qa.ts

      - name: Authenticate synthetic bank envelopes across all four stores
        run: npx tsx scripts/verify-bank-account-envelopes.ts

      # Keep the first-employer fixture intact: it binds its policy to ID 1.
      - name: Verify filing month boundaries and missing-ID rejection
        run: node --import tsx --test tests/filing-evidence-lifecycle.test.ts

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/payrollph-pilot.log || true

      - name: Upload pilot report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: payrollph-production-pilot-report
          path: qa-artifacts/pilot-payroll-report.json
          retention-days: 7
