name: Reviewed SQL Migration Runner (Synthetic PostgreSQL 16)

on:
  pull_request:
    paths:
      - "scripts/lib/reviewed-migration-runner.mjs"
      - "scripts/run-reviewed-migration.mjs"
      - "tests/reviewed-migration-*.test.mjs"
      - "docs/engineering/reviewed-migration-cutover-template.sql"
      - ".github/workflows/reviewed-migration-rehearsal.yml"
  push:
    branches: [main]
    paths:
      - "scripts/lib/reviewed-migration-runner.mjs"
      - "scripts/run-reviewed-migration.mjs"
      - "tests/reviewed-migration-*.test.mjs"
      - "docs/engineering/reviewed-migration-cutover-template.sql"
      - ".github/workflows/reviewed-migration-rehearsal.yml"

permissions:
  contents: read

jobs:
  isolated-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CI: "true"
      TZ: Asia/Manila
      MIGRATION_REHEARSAL_MODE: isolated-ci-only
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout unprivileged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Check Node module syntax and pure migration decision tests
        run: |
          node --check scripts/lib/reviewed-migration-runner.mjs
          node --check scripts/run-reviewed-migration.mjs
          node --test tests/reviewed-migration-runner.test.mjs
      - name: PostgreSQL transaction, ledger, concurrency and rollback rehearsal
        run: node --test tests/reviewed-migration-postgres.test.mjs
      - name: Source-only inventory remains non-mutating
        run: node scripts/audit-production-migration-receipts.mjs --inventory
