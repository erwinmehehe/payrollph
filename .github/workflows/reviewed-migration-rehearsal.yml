name: Reviewed SQL Migration Runner (Synthetic PostgreSQL 16)

on:
  pull_request:
    paths:
      - "scripts/lib/reviewed-migration-runner.mjs"
      - "scripts/lib/reviewed-migration-control-ledger.mjs"
      - "scripts/lib/historical-catalog-gate.mjs"
      - "scripts/lib/schema-lineage-preflight.mjs"
      - "scripts/lib/database-generation-fingerprint.mjs"
      - "scripts/lib/foundation-migration-objects.mjs"
      - "scripts/audit-neon-schema-generation.mjs"
      - "tests/schema-lineage-preflight.test.mjs"
      - "tests/historical-catalog-gate.test.mjs"
      - "scripts/run-reviewed-migration.mjs"
      - "tests/reviewed-migration-*.test.mjs"
      - "docs/engineering/reviewed-migration-cutover-template.sql"
      - ".github/workflows/reviewed-migration-rehearsal.yml"
  push:
    branches: [main]
    paths:
      - "scripts/lib/reviewed-migration-runner.mjs"
      - "scripts/lib/reviewed-migration-control-ledger.mjs"
      - "scripts/lib/historical-catalog-gate.mjs"
      - "scripts/lib/schema-lineage-preflight.mjs"
      - "scripts/lib/database-generation-fingerprint.mjs"
      - "scripts/lib/foundation-migration-objects.mjs"
      - "scripts/audit-neon-schema-generation.mjs"
      - "tests/schema-lineage-preflight.test.mjs"
      - "tests/historical-catalog-gate.test.mjs"
      - "scripts/run-reviewed-migration.mjs"
      - "tests/reviewed-migration-*.test.mjs"
      - "docs/engineering/reviewed-migration-cutover-template.sql"
      - ".github/workflows/reviewed-migration-rehearsal.yml"

# Supersede only older PR attempts; main/manual runs retain independent groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  isolated-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CI: "true"
      TZ: Asia/Manila
      MIGRATION_REHEARSAL_MODE: isolated-ci-only
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout unprivileged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Check Node module syntax and pure migration decision tests
        run: |
          node --check scripts/lib/reviewed-migration-runner.mjs
          node --check scripts/lib/reviewed-migration-control-ledger.mjs
          node --check scripts/lib/historical-catalog-gate.mjs
          node --check tests/historical-catalog-gate.test.mjs
          node --check scripts/lib/schema-lineage-preflight.mjs
          node --check scripts/run-reviewed-migration.mjs
          node --test tests/schema-lineage-preflight.test.mjs tests/reviewed-migration-runner.test.mjs tests/historical-catalog-gate.test.mjs
          node --test tests/database-generation-fingerprint.test.mjs tests/foundation-migration-objects.test.mjs tests/canonical-migration-base-tables.test.mjs
          node --test tests/reviewed-migration-neon-target.test.mjs tests/neon-schema-audit-identity.test.mjs
      - name: PostgreSQL transaction, ledger, concurrency and rollback rehearsal
        run: node --test tests/reviewed-migration-postgres.test.mjs
      - name: Source-only inventory remains non-mutating
        run: node scripts/audit-production-migration-receipts.mjs --inventory
      - name: Rehearse synthetic isolated backup and restore
        env:
          DR_REHEARSAL_MODE: isolated-ci-only
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: bash scripts/verify-backup-restore.sh
      - name: Preserve synthetic restore evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reviewed-migration-synthetic-restore
          path: qa-artifacts/dr-rehearsal.json
          retention-days: 14
          if-no-files-found: error
