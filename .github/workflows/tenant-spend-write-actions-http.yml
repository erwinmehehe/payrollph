name: Spend write actions tenant isolation (fictional PG16 HTTP, zero credit)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - '.github/workflows/tenant-spend-write-actions-http.yml'
      - 'scripts/qa/tenant-spend-write-actions-http.mjs'
      - 'tests/tenant-spend-full-method-candidate.test.mjs'
      - 'docs/qa/tenant-spend-write-actions-recovery.md'
      - 'src/app/api/spend/**'
      - 'src/lib/spend-*.ts'
      - 'src/lib/security-request.ts'
      - 'src/lib/access.ts'
      - 'src/lib/auth.ts'
      - 'scripts/qa/tenant-table-http.mjs'
      - 'scripts/qa/tenant-table-env.mjs'
      - 'src/db/**'
permissions:
  contents: read
concurrency:
  group: tenant-spend-write-actions-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  spend-full-write-method:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      WORKER_ENABLED: 'false'
      CENTRAL_SCHEDULER_ENABLED: 'false'
      MULTI_ENTITY_ENABLED: 'false'
      XENDIT_BILLING_ENABLED: 'false'
      XENDIT_PAYOUTS_ENABLED: 'false'
      PAYMONGO_DISBURSEMENTS_ENABLED: 'false'
      WFM_LOYVERSE_POS_ENABLED: 'false'
      WFM_SQUARE_SANDBOX_ENABLED: 'false'
      SPEND_PAYROLL_REIMBURSEMENTS_ENABLED: 'true'
      NEXT_CSP_ENABLED: 'false'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install exact locked dependencies
        run: npm ci
      - name: Export disposable CI-only fixture, never production or providers
        shell: bash
        run: |
          set -euo pipefail
          node scripts/qa/tenant-table-env.mjs default >> "$GITHUB_ENV"
          {
            echo "WORKER_ENABLED=false"
            echo "CENTRAL_SCHEDULER_ENABLED=false"
            echo "MULTI_ENTITY_ENABLED=false"
            echo "SPEND_PAYROLL_REIMBURSEMENTS_ENABLED=true"
            echo "XENDIT_BILLING_ENABLED=false"
            echo "XENDIT_PAYOUTS_ENABLED=false"
            echo "PAYMONGO_DISBURSEMENTS_ENABLED=false"
            echo "WFM_LOYVERSE_POS_ENABLED=false"
            echo "WFM_SQUARE_SANDBOX_ENABLED=false"
            echo "NEXT_CSP_ENABLED=false"
            echo "TRUSTED_APP_ORIGINS=http://127.0.0.1:3000"
            echo "PAYMONGO_SECRET_KEY="
            echo "XENDIT_SECRET_KEY="
            echo "XENDIT_PAYOUT_SECRET_KEY="
            echo "RESEND_API_KEY="
            echo "STRIPE_SECRET_KEY="
            echo "DOCUMENT_OBJECT_STORAGE_ACCESS_KEY_ID="
            echo "DOCUMENT_OBJECT_STORAGE_SECRET_ACCESS_KEY="
          } >> "$GITHUB_ENV"
      - name: Fail-closed exact-source and action contract
        run: |
          node --check scripts/qa/tenant-spend-write-actions-http.mjs
          node --test tests/tenant-spend-full-method-candidate.test.mjs
          node --test tests/tenant-spend-review-family.test.mjs
      - name: Ephemeral fictional encryption and webhook material only
        shell: bash
        run: |
          set -euo pipefail
          for name in PII_ENCRYPTION_KEY BANK_DATA_ENCRYPTION_KEY; do
            key=$(openssl rand -hex 32)
            echo "::add-mask::$key"
            echo "$name=$key" >> "$GITHUB_ENV"
          done
          secret="whsec_$(openssl rand -base64 32 | tr -d '\n')"
          echo "::add-mask::$secret"
          echo "RESEND_WEBHOOK_SECRET=$secret" >> "$GITHUB_ENV"
      - name: Build empty synthetic PostgreSQL 16 schema
        run: npm run db:push
      - name: Apply isolated-only reviewed SQL baseline
        run: node scripts/qa/apply-isolated-baseline.mjs
      - name: Build production Next only against disposable PostgreSQL
        run: npm run build
      - name: Start localhost Next; never deploy
        shell: bash
        run: |
          set -euo pipefail
          nohup npm start -- -H 127.0.0.1 > /tmp/tenant-spend-write-actions.log 2>&1 &
          server=$!
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:3000/login >/dev/null; then exit 0; fi
            if ! kill -0 "$server" 2>/dev/null; then break; fi
            sleep 2
          done
          tail -n 50 /tmp/tenant-spend-write-actions.log || true
          exit 1
      - name: Two independent owned and foreign POST/PATCH positive/negative action matrices
        run: node --import tsx scripts/qa/tenant-spend-write-actions-http.mjs
      - name: Print bounded synthetic-only logs on failure
        if: failure()
        run: |
          if test -f /tmp/tenant-spend-write-actions.log; then
            grep -Ei 'Error:|cause:|failed|code:' /tmp/tenant-spend-write-actions.log | tail -n 30 | cut -c 1-160 || true
          fi
