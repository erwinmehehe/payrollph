name: Independent PG16 Atlas Parity and Squawk SQL Lint (Synthetic Only)

on:
  pull_request:
    paths:
      - ".github/workflows/independent-pg16-schema-audit.yml"
      - "scripts/independent-pg16-schema-audit.mjs"
      - "scripts/independent-pg16-catalog-report.mjs"
      - "scripts/check-independent-schema-evidence.mjs"
      - "scripts/check-independent-atlas-inspection.mjs"
      - "scripts/independent-pg16-0128-checkpoint.mjs"
      - "scripts/independent-pg16-name-review-checkpoint.mjs"
      - "scripts/lib/independent-name-review.mjs"
      - "tests/independent-name-review.test.mjs"
      - "scripts/independent-squawk-review.mjs"
      - "scripts/lib/independent-reconciliation-evidence.mjs"
      - "scripts/lib/independent-cascade-provenance.mjs"
      - "tests/independent-cascade-provenance.test.mjs"
      - "tests/independent-reconciliation-evidence.test.mjs"
      - "scripts/lib/independent-schema-evidence.mjs"
      - "tests/independent-schema-evidence.test.mjs"
      - "drizzle/0115_*.sql"
      - "drizzle/0116_*.sql"
      - "drizzle/0117_*.sql"
      - "drizzle/0118_*.sql"
      - "drizzle/0119_*.sql"
      - "drizzle/0120_*.sql"
      - "drizzle/0121_*.sql"
      - "drizzle/0122_*.sql"
      - "drizzle/0123_*.sql"
      - "drizzle/0124_*.sql"
      - "drizzle/0125_*.sql"
      - "drizzle/0126_*.sql"
      - "drizzle/0128_*.sql"
      - "src/db/schema.ts"
  # Intentionally no production workflow_dispatch, environment or credentials.

permissions:
  contents: read

jobs:
  squawk:
    name: Squawk 0124-0126 (pinned, SQL only)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Test fail-closed independent evidence classification
        run: node --test tests/independent-schema-evidence.test.mjs tests/independent-reconciliation-evidence.test.mjs tests/independent-cascade-provenance.test.mjs tests/independent-name-review.test.mjs
      - name: Squawk 2.65.0, PG16, reviewed-runner transaction semantics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-artifacts/independent-pg16
          npm exec --yes --package=squawk-cli@2.65.0 -- squawk --version \
            > qa-artifacts/independent-pg16/squawk-version.txt
          sha256sum drizzle/012{4,5,6}_*.sql \
            > qa-artifacts/independent-pg16/squawk-source-shas.txt
          # Capture even a nonzero linter status so raw warnings and a human
          # readable summary survive. The NEXT step still fails closed.
          set +e
          npm exec --yes --package=squawk-cli@2.65.0 -- squawk \
            --pg-version=16.0 --assume-in-transaction --reporter=json \
            drizzle/0124_attendance_exception_forward_repair.sql \
            drizzle/0125_wfm_availability_open_shifts_forward_repair.sql \
            drizzle/0126_compensation_governance_forward_repair.sql \
            > qa-artifacts/independent-pg16/squawk.json \
            2> qa-artifacts/independent-pg16/squawk-stderr.txt
          squawk_status=$?
          set -e
          printf '%s\n' "$squawk_status" \
            > qa-artifacts/independent-pg16/squawk-exit.txt
      - name: Classify every unsuppressed Squawk finding for independent review
        run: node scripts/independent-squawk-review.mjs
      - name: Fail closed on every Squawk finding and CLI error
        run: node scripts/check-independent-schema-evidence.mjs squawk
      - name: Preserve syntax/locking warnings (not deployment approval)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: independent-pg16-squawk
          path: qa-artifacts/independent-pg16/
          retention-days: 14
          if-no-files-found: warn

  atlas:
    name: Atlas source-vs-0115-0126 local PG16 diff (read-only CLI)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      GITHUB_ACTIONS: "true"
      INDEPENDENT_SCHEMA_AUDIT_MODE: isolated-local-pg16
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PAYMONGO_DISBURSEMENTS_ENABLED: "false"
      XENDIT_PAYOUTS_ENABLED: "false"
      MULTI_ENTITY_ENABLED: "false"
      MULTI_ENTITY_TRANSFERS_ENABLED: "false"
      WFM_PUNCH_EVIDENCE_ENABLED: "false"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Test independent evidence and recovery classifiers (no database)
        run: node --test tests/independent-schema-evidence.test.mjs tests/independent-reconciliation-evidence.test.mjs tests/independent-cascade-provenance.test.mjs tests/independent-name-review.test.mjs
      - name: Guarded first and ONLY source Drizzle push to local app_db
        run: npm run db:push
      - name: Clone only the disposable source schema to a second local DB
        shell: bash
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE atlas_candidate_db TEMPLATE app_db'
      - name: Install pinned Atlas 1.3.0 for inspection/diff only
        uses: ariga/setup-atlas@2f3c785c89a15e1c0d07bcae3900fb5feb969eea # v0.3
        with:
          version: v1.3.0
      - name: Apply exact source train only to throwaway candidate_db
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-artifacts/independent-pg16
          node scripts/independent-pg16-schema-audit.mjs \
            > qa-artifacts/independent-pg16/synthetic-source-shas.json
      - name: Clone disposable candidate for proposed 0128-only reconciliation checkpoint
        shell: bash
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE atlas_reconciled_db TEMPLATE atlas_candidate_db'
      - name: Rehearse 0128 rollback then apply only inside third disposable PG16 DB
        shell: bash
        run: |
          set -euo pipefail
          node scripts/independent-pg16-0128-checkpoint.mjs \
            > qa-artifacts/independent-pg16/0128-rollback-and-reconciliation.json
      - name: Clone reconciled catalog into FOURTH disposable name-only review DB
        shell: bash
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE atlas_name_review_db TEMPLATE atlas_reconciled_db'
      - name: Provision synthetic catalog-only and REFERENCES-only inspection roles on four PG16 databases
        shell: bash
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE atlas_auditor LOGIN PASSWORD 'synthetic_audit_only'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          CREATE ROLE atlas_inspector LOGIN PASSWORD 'synthetic_audit_only'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          ALTER ROLE atlas_auditor SET default_transaction_read_only = on;
          ALTER ROLE atlas_inspector SET default_transaction_read_only = on;
          GRANT CONNECT ON DATABASE app_db, atlas_candidate_db, atlas_reconciled_db, atlas_name_review_db TO atlas_auditor, atlas_inspector;
          SQL
          for db in app_db atlas_candidate_db atlas_reconciled_db atlas_name_review_db; do
            psql -h 127.0.0.1 -U postgres -d "$db" -v ON_ERROR_STOP=1 <<'SQL'
          GRANT USAGE ON SCHEMA public TO atlas_auditor, atlas_inspector;
          -- Atlas 1.3 PostgreSQL inspector queries information_schema.columns,
          -- which hides columns without any column privilege. REFERENCES
          -- exposes metadata but grants NO application-row SELECT or DML.
          -- This permission exists ONLY on fictional throwaway databases.
          GRANT REFERENCES ON ALL TABLES IN SCHEMA public TO atlas_inspector;
          SQL
          done
      - name: Fail closed if Atlas inspector can read rows or see too few columns
        shell: bash
        env:
          PGPASSWORD: synthetic_audit_only
        run: |
          set -euo pipefail
          for db in app_db atlas_candidate_db atlas_reconciled_db atlas_name_review_db; do
            state=$(psql -h 127.0.0.1 -U atlas_inspector -d "$db" -v ON_ERROR_STOP=1 -Atc "
              SELECT CASE WHEN current_user='atlas_inspector'
                AND current_setting('transaction_read_only')='on'
                AND NOT pg_catalog.has_table_privilege(current_user,'public.employees',
                  'SELECT,INSERT,UPDATE,DELETE,TRUNCATE,TRIGGER')
                AND NOT pg_catalog.has_schema_privilege(current_user,'public','CREATE')
                AND (SELECT count(*) FROM information_schema.columns
                     WHERE table_schema='public') >= 270
                THEN 'ok' ELSE 'blocked' END")
            if [ "$state" != 'ok' ]; then
              echo "Atlas metadata-only inspector role or visibility guard failed."
              exit 1
            fi
          done
      - name: Re-run #1031 comparison on source, pre-0128 and post-0128 PG16 (read only)
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx scripts/independent-pg16-catalog-report.mjs
      - name: Rehearse 54 unapproved FK-name-only fixes in FOURTH disposable PG16 DB
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx scripts/independent-pg16-name-review-checkpoint.mjs
      - name: Recheck fourth-name-only catalog through independent read-only auditor
        shell: bash
        env:
          INDEPENDENT_NAME_REVIEW_READY: "true"
        run: |
          set -euo pipefail
          node --import tsx scripts/independent-pg16-catalog-report.mjs
      - name: Verify Atlas can inspect every Drizzle table under catalog-only role
        shell: bash
        run: |
          set -euo pipefail
          atlas schema inspect \
            --url 'postgresql://atlas_inspector:synthetic_audit_only@127.0.0.1:5432/app_db?search_path=public&sslmode=disable' \
            --format '{{ json . }}' \
            > qa-artifacts/independent-pg16/atlas-source-inspect.json
          atlas schema inspect \
            --url 'postgresql://atlas_inspector:synthetic_audit_only@127.0.0.1:5432/atlas_candidate_db?search_path=public&sslmode=disable' \
            --format '{{ json . }}' \
            > qa-artifacts/independent-pg16/atlas-candidate-inspect.json
          atlas schema inspect \
            --url 'postgresql://atlas_inspector:synthetic_audit_only@127.0.0.1:5432/atlas_reconciled_db?search_path=public&sslmode=disable' \
            --format '{{ json . }}' \
            > qa-artifacts/independent-pg16/atlas-reconciled-inspect.json
          atlas schema inspect \
            --url 'postgresql://atlas_inspector:synthetic_audit_only@127.0.0.1:5432/atlas_name_review_db?search_path=public&sslmode=disable' \
            --format '{{ json . }}' \
            > qa-artifacts/independent-pg16/atlas-name-review-inspect.json
          node --import tsx scripts/check-independent-atlas-inspection.mjs
      - name: Read-only independent Atlas schema comparison
        shell: bash
        run: |
          set -euo pipefail
          atlas version > qa-artifacts/independent-pg16/atlas-version.txt
          atlas schema diff \
            --from 'postgresql://atlas_inspector:synthetic_audit_only@127.0.0.1:5432/atlas_candidate_db?search_path=public&sslmode=disable' \
            --to 'postgresql://atlas_inspector:synthetic_audit_only@127.0.0.1:5432/app_db?search_path=public&sslmode=disable' \
            --schema public --format '{{ sql . "" }}' \
            > qa-artifacts/independent-pg16/atlas-source-vs-train.diff.sql
          atlas schema diff \
            --from 'postgresql://atlas_inspector:synthetic_audit_only@127.0.0.1:5432/atlas_reconciled_db?search_path=public&sslmode=disable' \
            --to 'postgresql://atlas_inspector:synthetic_audit_only@127.0.0.1:5432/app_db?search_path=public&sslmode=disable' \
            --schema public --format '{{ sql . "" }}' \
            > qa-artifacts/independent-pg16/atlas-post-0128-vs-source.diff.sql
          atlas schema diff \
            --from 'postgresql://atlas_inspector:synthetic_audit_only@127.0.0.1:5432/atlas_name_review_db?search_path=public&sslmode=disable' \
            --to 'postgresql://atlas_inspector:synthetic_audit_only@127.0.0.1:5432/app_db?search_path=public&sslmode=disable' \
            --schema public --format '{{ sql . "" }}' \
            > qa-artifacts/independent-pg16/atlas-post-name-review-vs-source.diff.sql
      - name: Fail closed on post-0128 Atlas differences (preserve both plans)
        run: node scripts/check-independent-schema-evidence.mjs atlas
      - name: Retain independent structural-only evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: independent-pg16-atlas-schema-diff
          path: qa-artifacts/independent-pg16/
          retention-days: 14
          if-no-files-found: warn
      - name: Release boundary
        if: always()
        run: |
          echo "SYNTHETIC_ONLY_NOT_MIGRATION_RECEIPT_OR_RELEASE_APPROVAL"
          echo "No Neon, Vercel, production, payroll, bank or employer credentials."
          echo "Atlas never applies SQL; db:push and source replay used throwaway PG16 only."
