name: Exact-SHA QA Overview (Advisory)
on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Full 40-character source commit SHA to inspect"
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  qa-overview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      QA_TARGET_SHA: ${{ inputs.target_sha }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Offline synthetic-state regression checks
        run: node --test tests/exact-sha-triage.test.mjs
      - name: Inspect exact-commit GitHub Actions metadata (read-only)
        run: node scripts/qa/exact-sha-triage.mjs
      - name: Upload advisory sanitized report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-sha-qa-triage
          path: |
            qa-artifacts/qa-triage.json
            qa-artifacts/qa-triage.md
          retention-days: 7
          if-no-files-found: warn
