name: Invitation acceptance two-method credit final-head PG16

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - '.github/workflows/tenant-invitation-accept-credit.yml'
      - 'scripts/qa/tenant-invitation-accept-credit.mjs'
      - 'tests/tenant-invitation-accept-credit.test.mjs'
      - 'scripts/qa/tenant-isolation-coverage-manifest.json'
      - 'tests/tenant-isolation-coverage-inventory.test.mjs'
      - 'tests/tenant-six-method-proof-review.test.mjs'
      - 'src/app/api/invitations/accept/**'
      - 'src/lib/tokens.ts'
      - 'src/lib/auth.ts'
      - 'src/lib/security-request.ts'
      - 'src/lib/audit.ts'
      - 'src/db/**'
      - 'scripts/qa/tenant-invitation-preview-get-http.mjs'
      - 'scripts/qa/tenant-invitations-accept-http.mjs'
      - 'tests/tenant-invitation-preview-get-contract.test.mjs'
      - 'tests/tenant-invitations-accept-contract.test.mjs'
      - '.github/workflows/tenant-invitation-preview-get-http.yml'
      - '.github/workflows/tenant-invitations-accept-http.yml'

permissions:
  contents: read

concurrency:
  group: invitation-two-credit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fictional-invitation-preview-get:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TENANT_APPROVAL_TASK_MODE: fictional-pg16-http
      PAYMONGO_DISBURSEMENTS_ENABLED: 'false'
      XENDIT_PAYOUTS_ENABLED: 'false'
      XENDIT_BILLING_ENABLED: 'false'
      WORKER_ENABLED: 'false'
      CENTRAL_SCHEDULER_ENABLED: 'false'
      PAYMONGO_SECRET_KEY: ''
      XENDIT_SECRET_KEY: ''
      XENDIT_PAYOUT_SECRET_KEY: ''
      RESEND_API_KEY: ''
      POSTMARK_SERVER_TOKEN: ''
      SMTP_URL: ''
      STRIPE_SECRET_KEY: ''
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Export throwaway localhost targets with providers and workers disabled
        shell: bash
        run: |
          set -euo pipefail
          node scripts/qa/tenant-table-env.mjs compliance-posts >> "$GITHUB_ENV"
          {
            echo 'TENANT_APPROVAL_TASK_MODE=fictional-pg16-http'
            echo 'PAYMONGO_DISBURSEMENTS_ENABLED=false'
            echo 'XENDIT_PAYOUTS_ENABLED=false'
            echo 'XENDIT_BILLING_ENABLED=false'
            echo 'WORKER_ENABLED=false'
            echo 'CENTRAL_SCHEDULER_ENABLED=false'
            echo 'PAYMONGO_SECRET_KEY='
            echo 'XENDIT_SECRET_KEY='
            echo 'XENDIT_PAYOUT_SECRET_KEY='
            echo 'RESEND_API_KEY='
            echo 'POSTMARK_SERVER_TOKEN='
            echo 'SMTP_URL='
            echo 'STRIPE_SECRET_KEY='
          } >> "$GITHUB_ENV"
      - name: Syntax, adversarial proof contracts and source pins
        run: |
          node --check scripts/qa/tenant-invitation-preview-get-http.mjs
          node --check tests/tenant-invitation-preview-get-contract.test.mjs
          node --test tests/tenant-invitation-preview-get-contract.test.mjs
      - name: Generate disposable keys
        shell: bash
        run: |
          set -euo pipefail
          for name in PII_ENCRYPTION_KEY BANK_DATA_ENCRYPTION_KEY; do
            key=$(openssl rand -hex 32)
            echo "::add-mask::$key"
            echo "$name=$key" >> "$GITHUB_ENV"
          done
          secret="whsec_$(openssl rand -base64 32 | tr -d '\n')"
          echo "::add-mask::$secret"
          echo "RESEND_WEBHOOK_SECRET=$secret" >> "$GITHUB_ENV"
      - name: Initialize disposable PostgreSQL 16
        run: npm run db:push
      - name: Apply fictional baseline objects only
        run: node scripts/qa/apply-isolated-baseline.mjs
      - name: Build production-mode Next against disposable database
        run: npm run build
      - name: Start HTTP server on loopback only
        shell: bash
        run: |
          set -euo pipefail
          nohup npm start -- -H 127.0.0.1 > /tmp/tenant-invitation-preview-next.log 2>&1 &
          server=$!
          for attempt in $(seq 1 60); do
            if curl --silent --fail "$SECURITY_SMOKE_URL/login" > /dev/null; then
              exit 0
            fi
            if ! kill -0 "$server" 2>/dev/null; then
              cat /tmp/tenant-invitation-preview-next.log
              exit 1
            fi
            sleep 2
          done
          cat /tmp/tenant-invitation-preview-next.log
          exit 1
      - name: Prove real own-token previews and victim non-disclosure over HTTP
        run: node --import tsx scripts/qa/tenant-invitation-preview-get-http.mjs
      - name: Show fictional diagnostics if proof fails
        if: failure()
        run: cat /tmp/tenant-invitation-preview-next.log || true
  fictional-invitation-accept-http:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TENANT_APPROVAL_TASK_MODE: fictional-pg16-http
      PAYMONGO_DISBURSEMENTS_ENABLED: 'false'
      XENDIT_PAYOUTS_ENABLED: 'false'
      XENDIT_BILLING_ENABLED: 'false'
      WORKER_ENABLED: 'false'
      CENTRAL_SCHEDULER_ENABLED: 'false'
      PAYMONGO_SECRET_KEY: ''
      XENDIT_SECRET_KEY: ''
      XENDIT_PAYOUT_SECRET_KEY: ''
      RESEND_API_KEY: ''
      POSTMARK_SERVER_TOKEN: ''
      SMTP_URL: ''
      STRIPE_SECRET_KEY: ''
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Export throwaway localhost targets with all providers and workers off
        shell: bash
        run: |
          set -euo pipefail
          node scripts/qa/tenant-table-env.mjs compliance-posts >> "$GITHUB_ENV"
          {
            echo 'TENANT_APPROVAL_TASK_MODE=fictional-pg16-http'
            echo 'PAYMONGO_DISBURSEMENTS_ENABLED=false'
            echo 'XENDIT_PAYOUTS_ENABLED=false'
            echo 'XENDIT_BILLING_ENABLED=false'
            echo 'WORKER_ENABLED=false'
            echo 'CENTRAL_SCHEDULER_ENABLED=false'
            echo 'PAYMONGO_SECRET_KEY='
            echo 'XENDIT_SECRET_KEY='
            echo 'XENDIT_PAYOUT_SECRET_KEY='
            echo 'RESEND_API_KEY='
            echo 'POSTMARK_SERVER_TOKEN='
            echo 'SMTP_URL='
            echo 'STRIPE_SECRET_KEY='
          } >> "$GITHUB_ENV"
      - name: Check synthetic guard, route contract and script syntax
        run: |
          node --check scripts/qa/tenant-invitations-accept-http.mjs
          node --check tests/tenant-invitations-accept-contract.test.mjs
          node --test tests/tenant-invitations-accept-contract.test.mjs
          npx eslint src/app/api/invitations/accept/route.ts
      - name: Generate disposable encryption keys and webhook secret
        shell: bash
        run: |
          set -euo pipefail
          for name in PII_ENCRYPTION_KEY BANK_DATA_ENCRYPTION_KEY; do
            key=$(openssl rand -hex 32)
            echo "::add-mask::$key"
            echo "$name=$key" >> "$GITHUB_ENV"
          done
          secret="whsec_$(openssl rand -base64 32 | tr -d '\n')"
          echo "::add-mask::$secret"
          echo "RESEND_WEBHOOK_SECRET=$secret" >> "$GITHUB_ENV"
      - name: Initialize disposable PostgreSQL 16
        run: npm run db:push
      - name: Apply only fictional baseline objects
        run: node scripts/qa/apply-isolated-baseline.mjs
      - name: Build production-mode Next app against the disposable database
        run: npm run build
      - name: Start the production-mode app on localhost only
        shell: bash
        run: |
          set -euo pipefail
          nohup npm start -- -H 127.0.0.1 > /tmp/tenant-invitation-accept-next.log 2>&1 &
          server=$!
          for attempt in $(seq 1 60); do
            if curl --silent --fail "$SECURITY_SMOKE_URL/login" > /dev/null; then
              exit 0
            fi
            if ! kill -0 "$server" 2>/dev/null; then
              cat /tmp/tenant-invitation-accept-next.log
              exit 1
            fi
            sleep 2
          done
          cat /tmp/tenant-invitation-accept-next.log
          exit 1
      - name: Prove two own acceptances, poisoned-unit refusal, ignored forged selectors and unchanged victim
        run: node --import tsx scripts/qa/tenant-invitations-accept-http.mjs
      - name: Show fictional localhost diagnostics on failure
        if: failure()
        run: cat /tmp/tenant-invitation-accept-next.log || true
