name: WPS-01 scenario POST tenant isolation (fictional PG16 HTTP; zero credits)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - '.github/workflows/tenant-wps01-scenarios-http.yml'
      - 'scripts/qa/tenant-wps01-scenarios-*.mjs'
      - 'tests/tenant-wps01-scenarios-contract.test.mjs'
      - 'docs/qa/tenant-wps01-scenarios.md'
      - 'src/app/api/workforce-planning/scenarios/route.ts'
      - 'src/lib/workforce-forecast-server.ts'
      - 'src/lib/workforce-tenant-scope.ts'
      - 'src/lib/enterprise-advanced-plan-policy.ts'
      - 'src/lib/access.ts'
      - 'src/lib/auth.ts'
      - 'src/db/**'
      - 'scripts/qa/tenant-table-http.mjs'
      - 'scripts/qa/tenant-table-env.mjs'
      - 'scripts/qa/apply-isolated-baseline.mjs'
      - 'scripts/qa/tenant-isolation-coverage-manifest.json'

permissions:
  contents: read

concurrency:
  group: tenant-wps01-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fictional-workforce-scenario-post:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TENANT_WPS01_MODE: fictional-pg16-http
      PAYMONGO_DISBURSEMENTS_ENABLED: 'false'
      XENDIT_PAYOUTS_ENABLED: 'false'
      XENDIT_BILLING_ENABLED: 'false'
      WORKER_ENABLED: 'false'
      CENTRAL_SCHEDULER_ENABLED: 'false'
      PAYMONGO_SECRET_KEY: ''
      XENDIT_SECRET_KEY: ''
      XENDIT_PAYOUT_SECRET_KEY: ''
      RESEND_API_KEY: ''
      POSTMARK_SERVER_TOKEN: ''
      SMTP_URL: ''
      STRIPE_SECRET_KEY: ''
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install immutable dependencies
        run: npm ci
      - name: Export fictional localhost PG16 and permanently disabled providers
        shell: bash
        run: |
          set -euo pipefail
          node scripts/qa/tenant-table-env.mjs compliance-posts >> "$GITHUB_ENV"
          {
            echo 'TENANT_WPS01_MODE=fictional-pg16-http'
            echo 'PAYMONGO_DISBURSEMENTS_ENABLED=false'
            echo 'XENDIT_PAYOUTS_ENABLED=false'
            echo 'XENDIT_BILLING_ENABLED=false'
            echo 'WORKER_ENABLED=false'
            echo 'CENTRAL_SCHEDULER_ENABLED=false'
            echo 'PAYMONGO_SECRET_KEY='
            echo 'XENDIT_SECRET_KEY='
            echo 'XENDIT_PAYOUT_SECRET_KEY='
            echo 'RESEND_API_KEY='
            echo 'POSTMARK_SERVER_TOKEN='
            echo 'SMTP_URL='
            echo 'STRIPE_SECRET_KEY='
          } >> "$GITHUB_ENV"
      - name: Enforce WPS-01 zero-credit contract and adversarial refusal guards
        run: |
          node --check scripts/qa/tenant-wps01-scenarios-contract.mjs
          node --check scripts/qa/tenant-wps01-scenarios-http.mjs
          node --check tests/tenant-wps01-scenarios-contract.test.mjs
          node --test tests/tenant-wps01-scenarios-contract.test.mjs
      - name: Generate disposable at-rest keys
        shell: bash
        run: |
          set -euo pipefail
          for name in PII_ENCRYPTION_KEY BANK_DATA_ENCRYPTION_KEY; do
            key=$(openssl rand -hex 32)
            echo "::add-mask::$key"
            echo "$name=$key" >> "$GITHUB_ENV"
          done
          secret="whsec_$(openssl rand -base64 32 | tr -d '\n')"
          echo "::add-mask::$secret"
          echo "RESEND_WEBHOOK_SECRET=$secret" >> "$GITHUB_ENV"
      - name: Initialize disposable PostgreSQL 16
        run: npm run db:push
      - name: Apply only reviewed fictional baseline schema
        run: node scripts/qa/apply-isolated-baseline.mjs
      - name: Build production-mode app against disposable PostgreSQL 16
        run: npm run build
      - name: Start Next.js on loopback only
        shell: bash
        run: |
          set -euo pipefail
          nohup npm start -- -H 127.0.0.1 > /tmp/tenant-wps01-next.log 2>&1 &
          server=$!
          for attempt in $(seq 1 60); do
            if curl --silent --fail "$SECURITY_SMOKE_URL/login" > /dev/null; then
              exit 0
            fi
            if ! kill -0 "$server" 2>/dev/null; then
              cat /tmp/tenant-wps01-next.log
              exit 1
            fi
            sleep 2
          done
          cat /tmp/tenant-wps01-next.log
          exit 1
      - name: Real two-attacker and high-ID victim scenario POST, audit and revocation proof
        run: node --import tsx scripts/qa/tenant-wps01-scenarios-http.mjs
      - name: Show only disposable localhost diagnostics on failure
        if: failure()
        run: cat /tmp/tenant-wps01-next.log || true
