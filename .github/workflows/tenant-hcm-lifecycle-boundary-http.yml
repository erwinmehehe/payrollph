name: HCM lifecycle notifications own/foreign PG16 HTTP proof

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - '.github/workflows/tenant-hcm-lifecycle-boundary-http.yml'
      - 'scripts/qa/tenant-hcm-lifecycle-boundary-*.mjs'
      - 'tests/tenant-hcm-lifecycle-boundary-http.test.mjs'
      - 'tests/tenant-hcm-lifecycle-boundary.test.ts'
      - 'src/app/api/hcm/lifecycle-notifications/**'
      - 'src/lib/hcm-lifecycle-notification-tenant.ts'
      - 'src/lib/audit.ts'
      - 'src/db/**'
      - 'scripts/qa/tenant-isolation-coverage-manifest.json'

permissions:
  contents: read

jobs:
  own-foreign-audit-veto:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TENANT_APPROVAL_TASK_MODE: fictional-pg16-http
      TENANT_HCM_LIFECYCLE_BOUNDARY_MODE: fictional-pg16-http
      WORKER_ENABLED: "false"
      CENTRAL_SCHEDULER_ENABLED: "false"
      PAYMONGO_DISBURSEMENTS_ENABLED: "false"
      XENDIT_PAYOUTS_ENABLED: "false"
      XENDIT_BILLING_ENABLED: "false"
      PAYMONGO_SECRET_KEY: ""
      XENDIT_SECRET_KEY: ""
      XENDIT_PAYOUT_SECRET_KEY: ""
      RESEND_API_KEY: ""
      POSTMARK_SERVER_TOKEN: ""
      STRIPE_SECRET_KEY: ""
      SMTP_URL: ""
      NEON_DATABASE_URL: ""
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Export disposable local DB profile and disable all providers
        shell: bash
        run: |
          set -euo pipefail
          node scripts/qa/tenant-table-env.mjs compliance-posts >> "$GITHUB_ENV"
          {
            echo 'TENANT_APPROVAL_TASK_MODE=fictional-pg16-http'
            echo 'TENANT_HCM_LIFECYCLE_BOUNDARY_MODE=fictional-pg16-http'
            echo 'WORKER_ENABLED=false'
            echo 'CENTRAL_SCHEDULER_ENABLED=false'
            echo 'PAYMONGO_DISBURSEMENTS_ENABLED=false'
            echo 'XENDIT_PAYOUTS_ENABLED=false'
            echo 'XENDIT_BILLING_ENABLED=false'
            echo 'PAYMONGO_SECRET_KEY='
            echo 'XENDIT_SECRET_KEY='
            echo 'XENDIT_PAYOUT_SECRET_KEY='
            echo 'RESEND_API_KEY='
            echo 'POSTMARK_SERVER_TOKEN='
            echo 'STRIPE_SECRET_KEY='
            echo 'SMTP_URL='
            echo 'NEON_DATABASE_URL='
          } >> "$GITHUB_ENV"
      - name: Source-contract negative controls, targeted HCM route protections
        run: |
          node --check scripts/qa/tenant-hcm-lifecycle-boundary-contract.mjs
          node --check scripts/qa/tenant-hcm-lifecycle-boundary-http.mjs
          node --test tests/tenant-hcm-lifecycle-boundary-http.test.mjs tests/tenant-hcm-lifecycle-contract.test.mjs
      - name: Generate ephemeral fixture-only encryption and signing keys
        shell: bash
        run: |
          set -euo pipefail
          for key in PII_ENCRYPTION_KEY BANK_DATA_ENCRYPTION_KEY; do
            value=$(openssl rand -hex 32)
            echo "::add-mask::$value"
            echo "$key=$value" >> "$GITHUB_ENV"
          done
          value="whsec_$(openssl rand -base64 32 | tr -d '\n')"
          echo "::add-mask::$value"
          echo "RESEND_WEBHOOK_SECRET=$value" >> "$GITHUB_ENV"
      - name: Create fresh isolated PG16 database schema
        run: npm run db:push
      - name: Install approved isolated audit and schema baseline
        run: node scripts/qa/apply-isolated-baseline.mjs
      - name: Build production-mode Next app only against disposable DB
        run: npm run build
      - name: Start production-mode HTTP server on 127.0.0.1
        shell: bash
        run: |
          set -euo pipefail
          nohup npm start -- -H 127.0.0.1 > /tmp/hcm-lifecycle-boundary-next.log 2>&1 &
          server=$!
          for attempt in $(seq 1 60); do
            if curl --silent --fail "$SECURITY_SMOKE_URL/login" > /dev/null; then exit 0; fi
            if ! kill -0 "$server" 2>/dev/null; then break; fi
            sleep 2
          done
          tail -n 120 /tmp/hcm-lifecycle-boundary-next.log
          exit 1
      - name: Verify two real owners, forged victim, mismatched worker and transactional audit veto
        run: node --import tsx scripts/qa/tenant-hcm-lifecycle-boundary-http.mjs
      - name: Display disposable server diagnostics only on failure
        if: failure()
        run: tail -n 100 /tmp/hcm-lifecycle-boundary-next.log || true
