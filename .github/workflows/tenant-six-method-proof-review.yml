name: Tenant six-method exact-head GAP review (source only)
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/qa/tenant-isolation-coverage-manifest.json
      - docs/engineering/tenant-isolation-closure-plan.md
      - docs/engineering/tenant-isolation-coverage-inventory*.md
      - docs/qa/tenant-six-method-proof-review-2026-11-02.md
      - tests/tenant-six-method-proof-review.test.mjs
      - .github/workflows/tenant-six-method-proof-review.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  source-only-gap-guard-and-repin:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PAYMONGO_DISBURSEMENTS_ENABLED: "false"
      XENDIT_PAYOUTS_ENABLED: "false"
      WORKER_ENABLED: "false"
      CENTRAL_SCHEDULER_ENABLED: "false"
      PAYROLL_OVERPAYMENT_REVIEW_ENABLED: "false"
      BIR_1604C_DAT_CANDIDATE_ENABLED: "false"
      MULTI_ENTITY_TRANSFERS_ENABLED: "false"
      CSP_REPORT_ONLY: "false"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install pinned verification dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Fetch source ledger baseline (no external applications or databases)
        run: git fetch --no-tags origin main
      # The six-method legacy test is pinned byte-for-byte to the PR base.
      # Run it against the exact source it certified, not an updated wage
      # registry whose 75 historical method receipts are now explicitly held.
      # This historical replay does NOT confer current-source coverage credit.
      - name: Verify historic six-method source against exact PR base (historical only)
        env:
          REVIEW_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          base="${REVIEW_BASE_SHA:-origin/main}"
          git cat-file -e "$base:scripts/qa/tenant-isolation-coverage-manifest.json"
          test "$(git rev-parse HEAD:tests/tenant-six-method-proof-review.test.mjs)" = \
            "$(git rev-parse "$base:tests/tenant-six-method-proof-review.test.mjs")"
          historical="$(mktemp -d "${RUNNER_TEMP:-/tmp}/six-method-historical.XXXXXX")"
          git worktree add --detach "$historical" "$base"
          trap 'git worktree remove --force "$historical"' EXIT
          ln -s "$GITHUB_WORKSPACE/node_modules" "$historical/node_modules"
          # The immutable old test predates one exact owner-approved public SSO
          # relabel on main. Verify that change, then patch ONLY this temp copy.
          # No original test, proof receipt, or live coverage record is rewritten.
          node scripts/qa/tenant-six-method-public-replay.mjs "$historical"
          (cd "$historical" && node --test tests/tenant-six-method-proof-review.test.mjs)
      - name: Verify exact-head 75 wage dependency holds (no credits)
        run: |
          set -euo pipefail
          node --test \
            tests/wage-registry-source-hold.test.mjs \
            tests/wage-registry-transitive-source-hold.test.mjs \
            tests/wage-registry-sealed-receipt-source-hold.test.mjs \
            tests/wage-order-transitive-import-inventory.test.mjs
      - name: Read-only exact-line manifest repin against latest origin/main
        run: node scripts/qa/tenant-manifest-repin.mjs --base origin/main
