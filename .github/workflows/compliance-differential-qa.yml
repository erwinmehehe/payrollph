name: Compliance differential QA

on:
  push:
    branches:
      - feat/compliance-differential-hardening

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Refresh lockfile for pinned compliance reference
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: pin payroll compliance reference [skip ci]"
            git push
          fi
      - name: Install exactly from refreshed lockfile
        run: npm ci
      - name: Differential compliance tests
        run: npx tsx --test tests/compliance-differential.test.mts tests/payroll-rules.test.ts
      - name: TypeScript
        run: npx tsc --noEmit
      - name: ESLint
        run: npx eslint src tests
      - name: Build
        run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compliance-lockfile
          path: package-lock.json
          retention-days: 1
