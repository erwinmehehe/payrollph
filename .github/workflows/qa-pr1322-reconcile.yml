name: PR1322 pinned source reconciliation
on:
  push:
    branches: [qa/tenant-isolation-dl01-evidence-20261021]
    paths: [.github/workflows/qa-pr1322-reconcile.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      TZ: Asia/Manila
      PAYMONGO_DISBURSEMENTS_ENABLED: "false"
      XENDIT_PAYOUTS_ENABLED: "false"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
      - name: Prepare a pinned source-only merge; no branch or production writes
        shell: bash
        run: |
          python3 - <<'PYRECONCILE'
          import collections
          import json
          import pathlib
          import re
          import subprocess

          BASE = "2dc93b1dc65e659c545820d3efd4d25be4a56114"
          OURS = "9fc73ee35f111f2d53ea93965a18ee6546c6778b"
          MAIN = "d1c6c5d785816f1d9a124174d87b6d5d676d8199"
          EXPECTED = {
              ".github/workflows/qa-dl01-regression-diagnostics.yml",
              "docs/engineering/tenant-isolation-coverage-inventory.md",
              "scripts/qa/tenant-dl01-filing-file-http.mjs",
              "scripts/qa/tenant-dl01-import-history-http.mjs",
              "scripts/qa/tenant-isolation-coverage-manifest.json",
              "scripts/qa/tenant-manifest-driven-http.mjs",
              "scripts/qa/tenant-second-pass-http.mjs",
              "scripts/qa/tenant-static-template-http.mjs",
              "scripts/run-sharded-tests.mjs",
              "tests/remittance-month-close-read.test.ts",
              "tests/tenant-dl01-evidence-order.test.mjs",
              "tests/tenant-dl01-filing-file-http.test.mjs",
              "tests/tenant-dl01-import-history-http.test.mjs",
              "tests/tenant-high-risk-batch-01.test.mjs",
              "tests/tenant-isolation-closure-plan.test.mjs",
              "tests/tenant-isolation-coverage-inventory.test.mjs",
              "tests/tenant-manifest-driven-http.test.mjs",
              "tests/tenant-static-import-template.test.mjs",
          }

          def git(*args):
              return subprocess.check_output(["git", *args], text=True)

          def source(ref, path):
              return git("show", ref + ":" + path)

          def once(text, old, new):
              assert text.count(old) == 1, "Expected unique source anchor: " + old[:120]
              return text.replace(old, new, 1)

          def write(path, text):
              p = pathlib.Path(path)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(text, encoding="utf-8")

          assert git("merge-base", OURS, MAIN).strip() == BASE
          assert set(git("diff", "--name-only", BASE, OURS).splitlines()) == EXPECTED
          assert all(line[0] in {"A", "M"} for line in git("diff", "--name-status", BASE, OURS).splitlines())
          # Start with every byte of the reviewed new main, then retain all 18 PR files.
          # This updates only the disposable runner index/worktree, never a branch ref.
          subprocess.run(["git", "read-tree", "--reset", "-u", MAIN], check=True)
          for path in sorted(EXPECTED):
              write(path, source(OURS, path))

          manifest_path = "scripts/qa/tenant-isolation-coverage-manifest.json"
          base_manifest = json.loads(source(BASE, manifest_path))
          ours_manifest = json.loads(source(OURS, manifest_path))
          main_manifest = json.loads(source(MAIN, manifest_path))
          route = "src/app/api/hcm/salary-corrections/cases/route.ts"
          assert set(main_manifest["allApiRouteFiles"]) - set(base_manifest["allApiRouteFiles"]) == {route}
          assert route not in ours_manifest["allApiRouteFiles"]
          assert {m["name"]: m["status"] for m in main_manifest["allApiRouteFiles"][route]["methods"]} == {
              "GET": "COVERED", "POST": "COVERED", "PATCH": "COVERED"
          }
          # Main changes no earlier method dispositions or evidence. Fail rather than infer.
          for path, record in base_manifest["allApiRouteFiles"].items():
              assert main_manifest["allApiRouteFiles"][path] == record, path
          merged = json.loads(json.dumps(ours_manifest))
          merged["allApiRouteFiles"][route] = main_manifest["allApiRouteFiles"][route]
          merged["allApiRouteFiles"] = dict(sorted(merged["allApiRouteFiles"].items()))
          methods = [m for record in merged["allApiRouteFiles"].values() for m in record["methods"]]
          counts = collections.Counter(m["status"] for m in methods)
          assert counts == {"COVERED": 93, "PUBLIC-BY-DESIGN": 10, "GAP": 390}
          assert len(methods) == 493 and len(merged["allApiRouteFiles"]) == 290
          merged["metrics"].update(routeFiles=290, methods=493, coveredAfter=93, publicByDesign=10, gap=390)
          for path, record in ours_manifest["allApiRouteFiles"].items():
              assert merged["allApiRouteFiles"][path] == record, path
          for key in ours_manifest:
              if key not in {"metrics", "allApiRouteFiles"}:
                  assert merged[key] == ours_manifest[key], key
          assert merged["metrics"]["scopedPagesAndActions"] == 20
          write(manifest_path, json.dumps(merged, ensure_ascii=False, indent=2) + "\n")

          # Reconcile the active documentation, keeping historical narrative unchanged.
          path = "docs/engineering/tenant-isolation-coverage-inventory.md"
          doc = source(OURS, path)
          for old, new in [
              ("| routeFiles | 289 |", "| routeFiles | 290 |"),
              ("| methods | 490 |", "| methods | 493 |"),
              ("| coveredAfter | 90 |", "| coveredAfter | 93 |"),
              ("**90 COVERED / 10 PUBLIC-BY-DESIGN / 390 GAP**", "**93 COVERED / 10 PUBLIC-BY-DESIGN / 390 GAP**"),
              ("Every one of the 289 route files and 490 exported handlers", "Every one of the 290 route files and 493 exported handlers"),
          ]:
              doc = once(doc, old, new)
          rows = [line for line in source(MAIN, path).splitlines() if line.startswith("| [`hcm/salary-corrections/cases`")]
          assert len(rows) == 3
          anchor = next(line for line in doc.splitlines() if line.startswith("| [`hcm/salary-corrections/preview`"))
          doc = once(doc, anchor, "\n".join(rows) + "\n" + anchor)
          marker = "\n| Metric | Count |\n"
          doc = once(doc, marker, "\nThree salary-correction-case method proofs are inherited unchanged from main commit `" + MAIN + "` (#1324); they are not new DL-01 closures. The import-history and filing-file probes remain GAP pending executed evidence.\n" + marker)
          write(path, doc)

          # Preserve the exact one-line new-main harness hook without shifting proof lines.
          path = "scripts/qa/tenant-second-pass-http.mjs"
          base_line = next(line for line in source(BASE, path).splitlines() if "await (await import(" in line and "verifyLegalEmployerTenantMutations(f" in line)
          main_line = next(line for line in source(MAIN, path).splitlines() if "await (await import(" in line and "verifyLegalEmployerTenantMutations(f" in line)
          assert "verifySalaryCorrectionCaseTenantIsolation" in main_line
          write(path, once(source(OURS, path), base_line, main_line))

          # Retain all #641 test assertions and the existing narrow DL-01 evidence allowlist.
          path = "tests/tenant-isolation-coverage-inventory.test.mjs"
          s = source(OURS, path)
          t = source(MAIN, path)
          start = t.index('test("#641 correction cases prove own success, victim denial and unchanged victim rows over real HTTP"')
          anchor = 'test("new dashboard, employee-directory and payroll-list coverage cites executable own/foreign HTTP proof"'
          end = t.index(anchor, start)
          s = once(s, anchor, t[start:end] + anchor)
          anchor = '        "scripts/qa/pr-1302-tenant-proof.mjs",\n'
          s = once(s, anchor, anchor + '        "scripts/qa/salary-correction-case-tenant-proof.mjs",\n')
          start = t.index('      if (proof.file === "scripts/qa/salary-correction-case-tenant-proof.mjs") {')
          anchor = '      if (proof.file === "scripts/qa/payroll-read-sweep-http.mjs") {'
          end = t.index(anchor, start)
          s = once(s, anchor, t[start:end] + anchor)
          write(path, s)

          # Update only pinned inventory-number assertions, never HTTP/status/fixture proofs.
          pins = {"methods": 493, "coveredAfter": 93, "publicByDesign": 10, "gap": 390}
          messages = {
              "methods": "493 actual methods including the three inherited #641 handlers",
              "coveredAfter": "91 covered methods inherited from main plus two DL-01 payment-evidence GETs",
              "publicByDesign": "Eight inherited public dispositions plus two DL-01 fixed templates",
              "gap": "390 unverified methods remain GAP; no new DL-01 runtime credit",
          }
          for path in [
              "tests/remittance-month-close-read.test.ts",
              "tests/tenant-high-risk-batch-01.test.mjs",
              "tests/tenant-isolation-coverage-inventory.test.mjs",
              "tests/tenant-manifest-driven-http.test.mjs",
          ]:
              s = pathlib.Path(path).read_text(encoding="utf-8")
              pattern = r'assert\.equal\(manifest\.metrics\.(methods|coveredAfter|publicByDesign|gap),\s*\d+(?:,\s*"[^"\n]*")?\);'
              s, n = re.subn(pattern, lambda m: 'assert.equal(manifest.metrics.' + m[1] + ', ' + str(pins[m[1]]) + ', ' + json.dumps(messages[m[1]]) + ');', s)
              assert n >= 2, path + ": expected existing inventory pins"
              s = s.replace("ALL 490 methods", "ALL 493 methods").replace("audited 490-route-method", "audited 493-route-method")
              s = s.replace("manifest.metrics.coveredAfter + manifest.metrics.publicByDesign + manifest.metrics.gap, 490", "manifest.metrics.coveredAfter + manifest.metrics.publicByDesign + manifest.metrics.gap, 493")
              if path.endswith("remittance-month-close-read.test.ts"):
                  assert "manifest.metrics.coveredAfter + manifest.metrics.publicByDesign + manifest.metrics.gap" not in s
                  anchor = '  const harnessLines = readFileSync("scripts/qa/tenant-second-pass-http.mjs", "utf8").split("\\n");'
                  s = once(s, anchor, '  assert.equal(manifest.metrics.coveredAfter + manifest.metrics.publicByDesign + manifest.metrics.gap, 493);\n' + anchor)
              write(path, s)
          path = "scripts/qa/tenant-manifest-driven-http.mjs"
          write(path, once(source(OURS, path), "All 490 manifest methods are read", "All 493 manifest methods are read"))

          # Main production/source/migration bytes must be inherited verbatim.
          subprocess.run(["git", "add", "-A"], check=True)
          changed = set(git("diff", "--cached", "--name-only", MAIN).splitlines())
          assert changed <= EXPECTED, sorted(changed - EXPECTED)
          assert not git("diff", "--cached", "--name-only", MAIN, "--", "src", "drizzle")
          assert not any(p.startswith(".github/workflows/") and p != ".github/workflows/qa-dl01-regression-diagnostics.yml" for p in changed)
          for path in ["scripts/qa/tenant-dl01-import-history-http.mjs", "scripts/qa/tenant-dl01-filing-file-http.mjs", "tests/tenant-dl01-import-history-http.test.mjs"]:
              assert pathlib.Path(path).read_text(encoding="utf-8") == source(OURS, path)
          assert not pathlib.Path(".github/workflows/qa-pr1322-reconcile.yml").exists()
          print("SOURCE_RECONCILIATION", json.dumps({"base": BASE, "repairedHead": OURS, "inheritedMain": MAIN, "metrics": merged["metrics"], "newDl01Credit": 0, "productionDiffFromMain": 0, "changedPaths": sorted(changed)}))
          print(git("diff", "--cached", "--stat", MAIN))
          PYRECONCILE
      - run: npm ci
      - name: Execute retained source-proof guards and the new import regression tests
        run: >-
          npx --no-install tsx --test --test-concurrency=1 --test-reporter=spec
          tests/remittance-month-close-read.test.ts
          tests/tenant-isolation-coverage-inventory.test.mjs
          tests/tenant-isolation-closure-plan.test.mjs
          tests/tenant-dl01-evidence-order.test.mjs
          tests/tenant-manifest-driven-http.test.mjs
          tests/tenant-static-import-template.test.mjs
          tests/tenant-dl01-import-history-http.test.mjs
          tests/tenant-dl01-filing-file-http.test.mjs
          tests/tenant-high-risk-batch-01.test.mjs
          tests/tenant-structural-access-guard.test.mjs
      - name: Publish immutable source objects for review; never update refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node --input-type=module <<'JSPUBLISH'
          import assert from "node:assert/strict";
          import { execFileSync } from "node:child_process";
          import { readFileSync } from "node:fs";
          const main = "d1c6c5d785816f1d9a124174d87b6d5d676d8199";
          const ours = "9fc73ee35f111f2d53ea93965a18ee6546c6778b";
          const repo = "erwinmehehe/payrollph";
          assert.equal(process.env.GITHUB_REPOSITORY, repo);
          const git = (...args) => execFileSync("git", args, { encoding: "utf8" }).trim();
          const allowed = new Set(git("diff", "--name-only", "2dc93b1dc65e659c545820d3efd4d25be4a56114", ours).split("\n"));
          const paths = git("diff", "--cached", "--name-only", main).split("\n");
          const request = async (endpoint, body) => {
            // Immutable git objects only; never update a ref, submit a PR or contact an app.
            assert.ok(endpoint === "git/blobs" || endpoint === "git/trees");
            const res = await fetch(`https://api.github.com/repos/${repo}/${endpoint}`, {
              method: "POST",
              headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: "application/vnd.github+json", "Content-Type": "application/json", "X-GitHub-Api-Version": "2022-11-28" },
              body: JSON.stringify(body),
            });
            if (!res.ok) throw new Error(`${endpoint}: ${res.status} ${await res.text()}`);
            return res.json();
          };
          const tree = [];
          for (const path of paths) {
            assert.ok(allowed.has(path), path);
            const [entry] = git("ls-files", "--stage", "--", path).split("\n");
            const [mode, sha, stage] = entry.split(/[\s\t]+/);
            assert.equal(mode, "100644");
            assert.equal(stage, "0");
            assert.equal(git("hash-object", path), sha, "Unstaged edits: " + path);
            const existing = [ours, main].some(ref => {
              try { return git("rev-parse", ref + ":" + path) === sha; } catch { return false; }
            });
            if (!existing) {
              const blob = await request("git/blobs", { content: readFileSync(path, "utf8"), encoding: "utf-8" });
              assert.equal(blob.sha, sha, path);
            }
            tree.push({ path, mode, type: "blob", sha });
          }
          const result = await request("git/trees", { base_tree: git("rev-parse", main + "^{tree}"), tree });
          assert.equal(result.sha, git("write-tree"));
          console.log("REVIEWABLE_TREE " + JSON.stringify({ sha: result.sha, baseMain: main, sourceOnly: true, runtimeProofExecuted: false, entries: tree }));
          JSPUBLISH
