name: Probe live demo launch

on:
  push:
    branches:
      - fix/live-demo-launch-sep29
    paths:
      - ".github/workflows/probe-live-demo.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe live demo API
        run: |
          set -euo pipefail
          curl -sS -i             -X POST             -H 'Content-Type: application/json'             -d '{"role":"owner"}'             https://erwinmehehe-payrollph.vercel.app/api/auth/demo-switch             | tee /tmp/demo-response.txt
          grep -E 'HTTP/|Demo|error|redirectTo|ok' /tmp/demo-response.txt || true
