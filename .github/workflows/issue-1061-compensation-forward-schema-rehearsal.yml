name: Issue 1061 Compensation Forward Schema Rehearsal (Synthetic Only)

on:
  pull_request:
    paths:
      - "drizzle/0126_compensation_governance_forward_repair.sql"
      - "tests/issue-1061-compensation-forward-schema.test.mjs"
      - ".github/workflows/issue-1061-compensation-forward-schema-rehearsal.yml"
  push:
    branches: [main]
    paths:
      - "drizzle/0126_compensation_governance_forward_repair.sql"
      - "tests/issue-1061-compensation-forward-schema.test.mjs"
      - ".github/workflows/issue-1061-compensation-forward-schema-rehearsal.yml"

# Supersede only older PR attempts; main/manual runs retain independent groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  disposable-postgres:
    name: Compensation forward DDL rollback (PG${{ matrix.postgres }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        postgres: ["16", "18"]
    env:
      CI: "true"
      GITHUB_ACTIONS: "true"
      MIGRATION_REHEARSAL_MODE: isolated-ci-only
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout exact source with no retained write credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Verify localhost-only migration guard
        run: node --test tests/isolated-migration-target.test.mjs
      - name: Run exact forward SQL against isolated scratch DB and roll back
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-artifacts/issue-1061
          node --check tests/issue-1061-compensation-forward-schema.test.mjs
          node --test tests/issue-1061-compensation-forward-schema.test.mjs \
            | tee qa-artifacts/issue-1061/pg-${{ matrix.postgres }}.log
          sha256sum drizzle/0126_compensation_governance_forward_repair.sql \
            > qa-artifacts/issue-1061/pg-${{ matrix.postgres }}.sha256
          printf 'scope=disposable-localhost-synthetic\nproduction-schema-modified=false\nrelease-approved=false\n' \
            > qa-artifacts/issue-1061/evidence-boundary.txt
      - name: Upload synthetic-only engineering evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: issue-1061-compensation-pg${{ matrix.postgres }}
          path: qa-artifacts/issue-1061/
          retention-days: 14
          if-no-files-found: warn
