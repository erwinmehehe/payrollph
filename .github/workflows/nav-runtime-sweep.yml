name: Navigation runtime error sweep

on:
  pull_request:
    branches: [main]
    # Keep PR browser coverage for navigation, protected routes, authorization,
    # shared shell/layout and the sweep harness. Unrelated changes still receive
    # the complete navigation sweep after merging to main and on the nightlies.
    paths:
      # Protected destinations and authentication entrypoints.
      - 'src/app/app/**'
      - 'src/app/workspace/**'
      - 'src/app/hcm/**'
      - 'src/app/hris/**'
      - 'src/app/self/**'
      - 'src/app/employee-self-service/**'
      - 'src/app/demo/**'
      - 'src/app/login/**'
      - 'src/app/register/**'
      - 'src/app/signup/**'
      - 'src/app/setup/**'
      - 'src/app/invite/**'
      - 'src/app/reset-password/**'
      - 'src/app/verify-email/**'
      - 'src/app/**/layout.tsx'
      - 'src/app/**/template.tsx'
      - 'src/app/**/error.tsx'
      - 'src/app/**/not-found.tsx'
      - 'src/app/**/loading.tsx'
      - 'src/proxy.ts'
      - 'src/middleware.ts'
      # Routes and shared policy powering role-scoped navigation.
      - 'src/app/api/auth/**'
      - 'src/app/api/tenant-modules/**'
      - 'src/app/api/capabilities/**'
      - 'src/app/api/provisioning/**'
      - 'src/app/api/organizations/**'
      - 'src/app/api/dashboard/**'
      - 'src/app/api/hcm/my-team/**'
      - 'src/app/api/self/**'
      - 'src/lib/*navigation*'
      - 'src/lib/*auth*'
      - 'src/lib/*permission*'
      - 'src/lib/*role*'
      - 'src/lib/*session*'
      - 'src/lib/access.ts'
      - 'src/lib/saas-workspace-access.ts'
      - 'src/lib/tenant-modules.ts'
      - 'src/lib/workspace-drawer-focus.ts'
      - 'src/lib/critical-release-flags.ts'
      - 'src/lib/workflow-ui-flags.ts'
      - 'src/lib/security-request.ts'
      - 'src/lib/multi-entity-selector-boundary.ts'
      - 'src/lib/dashboard-data.ts'
      # Shared workspace shell, navigation UI and focused role destinations.
      - 'src/components/linaw-workspace.tsx'
      - 'src/components/auth-screen.tsx'
      - 'src/components/hcm-context-navigation.tsx'
      - 'src/components/employee-home-dashboard.tsx'
      - 'src/components/linaw-mark.tsx'
      - 'src/components/demo-sandbox-bar.tsx'
      - 'src/components/workspace/nav.ts'
      - 'src/components/workspace/shell.tsx'
      - 'src/components/workspace/workflow-ui-context.tsx'
      - 'src/components/workspace/command-palette.tsx'
      - 'src/components/workspace/ui.tsx'
      - 'src/components/workspace/overview.tsx'
      - 'src/components/workspace/people.tsx'
      - 'src/components/workspace/approvals.tsx'
      - 'src/components/workspace/role-overview*.tsx'
      - 'src/components/workspace/*nav*'
      - 'src/components/workspace/*sidebar*'
      - 'src/components/workspace/*header*'
      - 'src/components/workspace/*menu*'
      - 'src/components/workspace/*layout*'
      - 'src/components/workspace/*drawer*'
      - 'src/app/*.css'
      # Relevant browser fixture/test changes and build-wide dependencies.
      - 'scripts/nav-sweep-*'
      - 'scripts/core-modules-synthetic-fixture.ts'
      - 'scripts/qa/apply-isolated-baseline.mjs'
      - 'tests/e2e/nav-sweep*'
      - 'tests/nav-sweep-*'
      - '.github/workflows/nav-runtime-sweep.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.*'
      - 'tsconfig.json'
  push:
    branches: [main]
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to a pull request supersedes its older run. Runs for main and
  # manual dispatch are keyed by commit and never cancelled, so a quick follow-up
  # merge cannot leave a main commit with a cancelled (or missing) result.
  group: nav-runtime-sweep-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  nav-runtime-sweep:
    name: Browser navigation runtime sweep
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CI: "true"
      TZ: Asia/Manila
      BUILD_BLOCK_ACCEPTANCE_MODE: synthetic-postgres-only
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
      APP_BASE_URL: https://127.0.0.1:3000
      TRUSTED_APP_ORIGINS: http://127.0.0.1:3000
      DEMO_MODE: "false"
      REQUIRE_PRIVILEGED_MFA: "true"
      CORE_MODULE_NAVIGATION_ENABLED: "false"
      OPENAI_API_KEY: ""
      NEXT_TELEMETRY_DISABLED: "1"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Ephemeral test-only encryption keys
        shell: bash
        run: |
          for name in BANK_DATA_ENCRYPTION_KEY PII_ENCRYPTION_KEY TOTP_ENCRYPTION_KEY; do
            key=$(openssl rand -hex 32)
            echo "::add-mask::$key"
            echo "$name=$key" >> "$GITHUB_ENV"
          done
      - name: Apply schema to disposable PostgreSQL
        run: npm run db:push
      - name: Apply the cutover baseline objects (0109 audit chain + reviewed supplement); request code only verifies schema
        run: node scripts/qa/apply-isolated-baseline.mjs
      - name: Derive real navigation inventory and scan error call sites
        run: npx tsx scripts/nav-sweep-manifest.ts
      - name: Reuse existing synthetic tenant fixture
        run: npx tsx scripts/core-modules-synthetic-fixture.ts
      - name: Add missing fictional role accounts
        run: npx tsx scripts/nav-sweep-seed-roles.ts
      - name: Build application with default-off flags untouched
        run: npm run build
      - name: Install isolated Playwright Chromium
        run: |
          npm install --no-save --ignore-scripts --package-lock=false playwright@1.55.0
          timeout 240s npx playwright install --only-shell chromium
      - name: Start local-only application
        shell: bash
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/payrollph-nav-sweep.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:3000/login > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/payrollph-nav-sweep.log
          exit 1
      - name: Focused Settings navigation regression at desktop and 390px
        run: NAV_SWEEP_FOCUS_ROLE=owner NAV_SWEEP_FOCUS_PAGE=Settings node --import tsx --test tests/e2e/nav-sweep.spec.mjs
      - name: Focused 375px role-scoped visual and mobile navigation acceptance
        shell: bash
        run: |
          set -euo pipefail
          NAV_SWEEP_MOBILE_EDGE=true NAV_SWEEP_FOCUS_ROLE=hr NAV_SWEEP_FOCUS_PAGE=People node --import tsx --test tests/e2e/nav-sweep.spec.mjs
          cp qa-artifacts/nav-sweep/report.json qa-artifacts/nav-sweep/mobile-edge-hr-people.json
          NAV_SWEEP_MOBILE_EDGE=true NAV_SWEEP_FOCUS_ROLE=manager NAV_SWEEP_FOCUS_PAGE=Approvals node --import tsx --test tests/e2e/nav-sweep.spec.mjs
          cp qa-artifacts/nav-sweep/report.json qa-artifacts/nav-sweep/mobile-edge-manager-approvals.json
          NAV_SWEEP_MOBILE_EDGE=true NAV_SWEEP_FOCUS_ROLE=employee NAV_SWEEP_FOCUS_PAGE=employee-profile node --import tsx --test tests/e2e/nav-sweep.spec.mjs
          cp qa-artifacts/nav-sweep/report.json qa-artifacts/nav-sweep/mobile-edge-employee-profile.json
      - name: Prove deliberately overflowing 375px mobile layout is caught
        shell: bash
        run: |
          set -euo pipefail
          if NAV_SWEEP_MOBILE_EDGE=true NAV_SWEEP_INJECT_VISUAL_OVERFLOW=true NAV_SWEEP_FOCUS_ROLE=hr NAV_SWEEP_FOCUS_PAGE=People node --import tsx --test tests/e2e/nav-sweep.spec.mjs; then
            echo "ERROR: deliberately overflowing mobile layout escaped detection"
            exit 1
          fi
          node -e 'const r=require("./qa-artifacts/nav-sweep/report.json"); if (!r.failed || !r.results.some(x=>x.findings.some(f=>f.kind==="mobile visual contract" && f.detail.includes("horizontal overflow")))) process.exit(1)'
          cp qa-artifacts/nav-sweep/report.json qa-artifacts/nav-sweep/mobile-edge-negative-proof.json
      - name: Prove deliberately broken Overview route is caught (negative test)
        shell: bash
        run: |
          if NAV_SWEEP_INJECT_BROKEN=true NAV_SWEEP_ONLY_OWNER=true node --import tsx --test tests/e2e/nav-sweep.spec.mjs; then
            echo "ERROR: intentionally broken route escaped detection"
            exit 1
          fi
          node -e 'const r=require("./qa-artifacts/nav-sweep/report.json"); if (!r.injectedFailure || r.failed < 1 || !r.results.some(x=>x.findings.some(f=>f.kind==="navigation" && f.detail.includes("HTTP 500 GET /app")))) process.exit(1)'
          cp qa-artifacts/nav-sweep/report.md qa-artifacts/nav-sweep/negative-proof.md
          cp qa-artifacts/nav-sweep/report.json qa-artifacts/nav-sweep/negative-proof.json
      - name: Run full navigation and runtime error sweep (main, nightly, manual)
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          node --test tests/nav-sweep-role-coverage.test.mjs tests/nav-sweep-visual-contract.test.mjs
          node scripts/nav-sweep-run-all-roles.mjs
      - name: Upload route-role reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nav-sweep-report
          path: qa-artifacts/nav-sweep/
          retention-days: 14
          if-no-files-found: warn
      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nav-sweep-server-log
          path: /tmp/payrollph-nav-sweep.log
          retention-days: 7
          if-no-files-found: ignore
