name: Enterprise administration atomic audit (fictional PG16 HTTP)
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/app/api/enterprise/route.ts'
      - 'src/lib/audit.ts'
      - 'src/lib/access.ts'
      - 'src/lib/auth.ts'
      - 'src/lib/enterprise-*.ts'
      - 'src/lib/security-*.ts'
      - 'src/lib/oidc*.ts'
      - 'src/lib/saml.ts'
      - 'src/lib/scim*.ts'
      - 'src/lib/permissions.ts'
      - 'src/lib/automation.ts'
      - 'src/lib/dynamic-*.ts'
      - 'src/lib/permission-overlay-*.ts'
      - 'src/lib/worker-attribute-*.ts'
      - 'src/lib/crypto.ts'
      - 'src/db/**'
      - 'scripts/qa/tenant-enterprise-admin-*.mjs'
      - 'scripts/qa/tenant-table-http.mjs'
      - 'scripts/qa/tenant-table-rows/read/platform-controls.mjs'
      - 'tests/tenant-enterprise-admin-audit.test.mjs'
      - 'fixtures/qa/enterprise-idp-public.pem'
      - 'scripts/qa/apply-isolated-baseline.mjs'
      - 'scripts/qa/apply-audit-0109-isolated.mjs'
      - 'scripts/qa/apply-source-baseline-supplement.mjs'
      - 'scripts/qa/prepare-hcm-work-item-fixture.mjs'
      - 'drizzle/0109_tamper_evident_audit_chain.sql'
      - 'drizzle/0104_hcm_work_item_sla.sql'
      - 'docs/sql/source-baseline-supplement.sql'
      - '.github/workflows/tenant-enterprise-admin-http.yml'
      - 'package*.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: enterprise-admin-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  enterprise-admin-http:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U postgres -d app_db'
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Source and fictional-target contracts
        run: node --test tests/tenant-enterprise-admin-audit.test.mjs
      - name: Empty disposable schema and reviewed baseline
        run: node scripts/qa/tenant-enterprise-admin-local.mjs db
      - name: Production application build with money/provider flags OFF
        run: node scripts/qa/tenant-enterprise-admin-local.mjs build
      - name: Real HTTP ownership, audit veto and forged-reference proof
        shell: bash
        run: |
          set -euo pipefail
          node scripts/qa/tenant-enterprise-admin-local.mjs start > /tmp/enterprise-fixture-server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=false
          for i in $(seq 1 90); do
            if curl --silent --fail http://127.0.0.1:3000/login >/dev/null; then ready=true; break; fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 2
          done
          if [ "$ready" != true ]; then echo 'Fictional localhost server unavailable'; exit 1; fi
          node scripts/qa/tenant-enterprise-admin-local.mjs proof
      - name: Sanitized proof receipt only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: enterprise-admin-proof-receipt
          path: outputs/tenant-enterprise-admin-receipt.json
          if-no-files-found: error
          retention-days: 14
