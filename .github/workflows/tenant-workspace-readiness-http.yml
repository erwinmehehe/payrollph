name: Tenant Workspace Readiness GET (Fictional PG16 Only)

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/tenant-workspace-readiness-http.yml"
      - "src/app/api/readiness/workspace/route.ts"
      - "src/lib/workspace-readiness-boundary.ts"
      - "scripts/qa/tenant-workspace-readiness-contract.mjs"
      - "scripts/qa/tenant-workspace-readiness-http.mjs"
      - "scripts/qa/workspace-readiness-http.mjs"
      - "tests/tenant-workspace-readiness-contract.test.mjs"
      - "docs/qa/tenant-workspace-readiness-get.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workspace-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: "true"
      GITHUB_ACTIONS: "true"
      TZ: Asia/Manila
      NEXT_TELEMETRY_DISABLED: "1"
      TENANT_WORKSPACE_READINESS_PROOF: fictional-pg16-only
      BUILD_BLOCK_ACCEPTANCE_MODE: synthetic-postgres-only
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
      APP_BASE_URL: http://127.0.0.1:3000
      SECURITY_SMOKE_URL: http://127.0.0.1:3000
      TRUSTED_APP_ORIGINS: http://127.0.0.1:3000
      DEMO_MODE: "false"
      REQUIRE_PRIVILEGED_MFA: "true"
      WORKER_ENABLED: "false"
      CENTRAL_SCHEDULER_ENABLED: "false"
      PAYMONGO_DISBURSEMENTS_ENABLED: "false"
      XENDIT_PAYOUTS_ENABLED: "false"
      XENDIT_BILLING_ENABLED: "false"
      FINAL_PAY_SIGNED_REVIEW_ENABLED: "false"
      PAYROLL_CALCULATION_HISTORY_ENABLED: "false"
      OPENAI_API_KEY: ""
      WORKER_TOKEN: ""
      CRON_SECRET: ""
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Confirm exact reviewed head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Refuse unsafe targets, stale sources and fabricated readiness positives
        run: |
          node --check scripts/qa/tenant-workspace-readiness-contract.mjs
          node --check scripts/qa/tenant-workspace-readiness-http.mjs
          node --check scripts/qa/workspace-readiness-http.mjs
          node --test tests/tenant-workspace-readiness-contract.test.mjs
      - name: Create temporary isolated encryption keys
        shell: bash
        run: |
          for key in BANK_DATA_ENCRYPTION_KEY PII_ENCRYPTION_KEY TOTP_ENCRYPTION_KEY; do
            value=$(openssl rand -hex 32)
            echo "::add-mask::$value"
            echo "$key=$value" >> "$GITHUB_ENV"
          done
      - name: Initialize empty disposable PostgreSQL 16
        run: npm run db:push
      - name: Apply isolated baseline without production migration
        run: node scripts/qa/apply-isolated-baseline.mjs
      - name: Build production-mode localhost app
        run: npm run build
      - name: Start localhost-only server
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/tenant-workspace-readiness.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:3000/login >/dev/null; then exit 0; fi
            sleep 2
          done
          tail -n 80 /tmp/tenant-workspace-readiness.log
          exit 1
      - name: Verify real own 200, foreign 403, high-ID victim and unchanged SQL
        env:
          NODE_ENV: production
        run: node --import tsx scripts/qa/tenant-workspace-readiness-http.mjs
      - name: Show bounded localhost server log on failure
        if: failure()
        run: tail -n 80 /tmp/tenant-workspace-readiness.log || true
