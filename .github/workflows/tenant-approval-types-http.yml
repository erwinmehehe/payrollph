name: Typed approvals tenant proof (fictional PG16, no money)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - '.github/workflows/tenant-approval-types-http.yml'
      - 'scripts/qa/tenant-approval-types-*.mjs'
      - 'scripts/qa/tenant-approval-delegated-proof.mjs'
      - 'tests/tenant-approval-delegated-proof.test.mjs'
      - 'tests/tenant-approval-types-contract.test.mjs'
      - 'tests/approval-source-tenant-boundary.test.ts'
      - 'src/app/api/approvals/**'
      - 'src/lib/approval-source-tenant-boundary.ts'
      - 'src/lib/approval-chains.ts'
      - 'src/lib/hcm-business-process.ts'
      - 'src/lib/hcm-effective-changes.ts'
      - 'src/lib/hcm-position-business-process.ts'
      - 'src/lib/governed-approval-handoffs.ts'
      - 'src/lib/automation.ts'
      - 'src/lib/dynamic-group-authorization.ts'
      - 'src/lib/dynamic-worker-group-conditions.ts'
      - 'src/lib/worker-attribute-context.ts'
      - 'src/lib/audit.ts'
      - 'src/lib/security-request.ts'
      - 'src/lib/critical-release-flags.ts'
      - 'src/lib/approval-human-separation.ts'
      - 'src/lib/access.ts'
      - 'src/lib/delegation.ts'
      - 'src/lib/auth.ts'
      - 'src/db/**'
      - 'scripts/qa/tenant-table-http.mjs'
      - 'scripts/qa/tenant-table-env.mjs'
      - 'scripts/qa/apply-isolated-baseline.mjs'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: tenant-approval-types-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  approval-types-http:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Disposable targets and all money/provider/worker flags OFF
        shell: bash
        run: |
          set -euo pipefail
          node scripts/qa/tenant-table-env.mjs default >> "$GITHUB_ENV"
          echo 'TENANT_APPROVAL_TYPES_MODE=fictional-disposable-pg16' >> "$GITHUB_ENV"
          for flag in FINAL_PAY_SIGNED_REVIEW_ENABLED EXACT_THIRTEENTH_CENTAVOS_ENABLED PAYROLL_CALCULATION_HISTORY_ENABLED NEXT_CSP_ENABLED PAYMONGO_DISBURSEMENTS_ENABLED XENDIT_PAYOUTS_ENABLED XENDIT_BILLING_ENABLED WORKER_ENABLED CENTRAL_SCHEDULER_ENABLED; do
            echo "$flag=false" >> "$GITHUB_ENV"
          done
          for key in PAYMONGO_SECRET_KEY XENDIT_SECRET_KEY XENDIT_PAYOUT_SECRET_KEY RESEND_API_KEY POSTMARK_SERVER_TOKEN SMTP_URL STRIPE_SECRET_KEY; do
            echo "$key=" >> "$GITHUB_ENV"
          done
          for name in PII_ENCRYPTION_KEY BANK_DATA_ENCRYPTION_KEY; do
            key=$(openssl rand -hex 32)
            echo "::add-mask::$key"
            echo "$name=$key" >> "$GITHUB_ENV"
          done
          secret="whsec_$(openssl rand -base64 32 | tr -d '\n')"
          echo "::add-mask::$secret"
          echo "RESEND_WEBHOOK_SECRET=$secret" >> "$GITHUB_ENV"
      - name: Target and negative-oracle contracts
        run: node --import tsx --test tests/tenant-approval-types-contract.test.mjs tests/approval-source-tenant-boundary.test.ts tests/tenant-approval-delegated-proof.test.mjs
      - name: Fresh disposable schema and reviewed test baseline
        run: |
          npm run db:push
          node scripts/qa/apply-isolated-baseline.mjs
      - run: npm run build
      - name: Start production Next on loopback only
        shell: bash
        run: |
          set -euo pipefail
          nohup npm start -- -H 127.0.0.1 > /tmp/approval-types-next.log 2>&1 &
          server=$!
          for attempt in $(seq 1 60); do
            if curl --silent --fail "$SECURITY_SMOKE_URL/login" > /dev/null; then exit 0; fi
            if ! kill -0 "$server" 2>/dev/null; then cat /tmp/approval-types-next.log; exit 1; fi
            sleep 2
          done
          cat /tmp/approval-types-next.log
          exit 1
      - name: Own source writes, two attackers, victim denial, forged links and audit rollback
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx scripts/qa/tenant-approval-types-http.mjs | tee /tmp/approval-types-result.jsonl
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: approval-types-pg16-${{ github.event.pull_request.head.sha }}
          path: /tmp/approval-types-result.jsonl
          if-no-files-found: ignore
      - name: Localhost diagnostics on failure
        if: failure()
        run: cat /tmp/approval-types-next.log || true
