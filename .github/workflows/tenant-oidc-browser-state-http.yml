name: Tenant OIDC initiating-browser isolation (fictional PG16 only)

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/tenant-oidc-browser-state-http.yml"
      - "src/app/api/auth/sso/start/route.ts"
      - "src/app/api/auth/sso/callback/route.ts"
      - "src/lib/oidc-browser-state.ts"
      - "src/lib/oidc-sso-runtime.ts"
      - "scripts/qa/tenant-oidc-browser-state-*.mjs"
      - "tests/tenant-oidc-browser-state*"
      - "docs/qa/tenant-oidc-browser-state-boundary.md"
      - "src/lib/auth.ts"
      - "scripts/qa/tenant-table-http.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  oidc-browser-state:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI: "true"
      GITHUB_ACTIONS: "true"
      TZ: Asia/Manila
      NEXT_TELEMETRY_DISABLED: "1"
      OIDC_SSO_RUNTIME_ENABLED: 'true'
      TENANT_OIDC_BROWSER_PROOF: fictional-pg16-only
      BUILD_BLOCK_ACCEPTANCE_MODE: synthetic-postgres-only
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
      APP_BASE_URL: https://payroll.example.test
      SECURITY_SMOKE_URL: http://127.0.0.1:3000
      TRUSTED_APP_ORIGINS: https://payroll.example.test
      DEMO_MODE: "false"
      WORKER_ENABLED: "false"
      CENTRAL_SCHEDULER_ENABLED: "false"
      XENDIT_BILLING_ENABLED: "false"
      XENDIT_PAYOUTS_ENABLED: "false"
      PAYMONGO_DISBURSEMENTS_ENABLED: "false"
      EMPLOYEE_DOCUMENT_VAULT_ENABLED: "false"
      OPENAI_API_KEY: ""
      PAYMONGO_SECRET_KEY: ""
      XENDIT_SECRET_KEY: ""
      XENDIT_PAYOUT_SECRET_KEY: ""
      SMTP_URL: ""
      SMTP_PASSWORD: ""
      RESEND_API_KEY: ""
      POSTMARK_SERVER_TOKEN: ""
      WORKER_TOKEN: ""
      CRON_SECRET: ""
      S3_ACCESS_KEY_ID: ""
      S3_SECRET_ACCESS_KEY: ""
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Require exact checked-out head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify source, environment contract, browser-state comparisons and negative controls
        run: |
          node --check scripts/qa/tenant-oidc-browser-state-contract.mjs
          node --check scripts/qa/tenant-oidc-browser-state-http.mjs
          node --test tests/tenant-oidc-browser-state-contract.test.mjs
          node --import tsx --test tests/tenant-oidc-browser-state.test.ts
      - name: Create ephemeral fictional encryption keys
        shell: bash
        run: |
          set -euo pipefail
          for key in PII_ENCRYPTION_KEY BANK_DATA_ENCRYPTION_KEY TOTP_ENCRYPTION_KEY ENTERPRISE_IDENTITY_ENCRYPTION_KEY; do
            value=$(openssl rand -hex 32)
            echo "::add-mask::$value"
            echo "$key=$value" >> "$GITHUB_ENV"
          done
      - name: Push fresh disposable PostgreSQL 16 schema
        run: npm run db:push
      - name: Apply reviewed isolated database baseline after schema push
        run: node scripts/qa/apply-isolated-baseline.mjs
      - name: Build local production-mode Next
        run: npm run build
      - name: Start restricted localhost Next
        shell: bash
        run: |
          set -euo pipefail
          npm start -- --hostname 127.0.0.1 --port 3000 > /tmp/tenant-oidc-browser.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:3000/login > /dev/null; then exit 0; fi
            sleep 2
          done
          tail -n 60 /tmp/tenant-oidc-browser.log
          exit 1
      - name: Prove own start and foreign-browser refusal with unchanged PG16 SQL
        env:
          NODE_ENV: production
        run: node --import tsx scripts/qa/tenant-oidc-browser-state-http.mjs
      - name: Show bounded synthetic server log if failure
        if: failure()
        run: tail -n 60 /tmp/tenant-oidc-browser.log || true
