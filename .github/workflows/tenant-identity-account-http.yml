name: Identity and account tenant HTTP (fictional PostgreSQL 16 only)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - '.github/workflows/tenant-identity-account-http.yml'
      - 'scripts/qa/tenant-identity-account-*.mjs'
      - 'tests/tenant-identity-account-*.test.mjs'
      - 'src/app/api/auth/me/**'
      - 'src/app/api/account/**'
      - 'src/lib/auth.ts'
      - 'src/lib/account.ts'
      - 'src/lib/session-select.ts'
      - 'src/lib/enterprise-session.ts'
      - 'src/db/**'
      - 'scripts/qa/tenant-table-http.mjs'
      - 'scripts/qa/tenant-table-env.mjs'
      - 'scripts/qa/apply-isolated-baseline.mjs'

permissions:
  contents: read

# Only supersede earlier attempts for this same PR. Never share a cancellation
# group with main or manual runs if the trigger set expands in the future.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  identity-account:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Export local-only Next and PostgreSQL configuration
        run: node scripts/qa/tenant-table-env.mjs default >> "$GITHUB_ENV"
      - name: Reject unsafe fixture and provider targets before PostgreSQL
        run: node --test tests/tenant-identity-account-contract.test.mjs
      - name: Generate throwaway cryptography and localhost webhook keys
        shell: bash
        run: |
          set -euo pipefail
          for name in PII_ENCRYPTION_KEY BANK_DATA_ENCRYPTION_KEY; do
            key=$(openssl rand -hex 32)
            echo "::add-mask::$key"
            echo "$name=$key" >> "$GITHUB_ENV"
          done
          secret="whsec_$(openssl rand -base64 32 | tr -d '\n')"
          echo "::add-mask::$secret"
          echo "RESEND_WEBHOOK_SECRET=$secret" >> "$GITHUB_ENV"
      - name: Create disposable PostgreSQL schema
        run: npm run db:push
      - name: Apply reviewed isolated schema baseline
        run: node scripts/qa/apply-isolated-baseline.mjs
      - name: Build real Next production-mode source
        run: npm run build
      - name: Two independent owners versus real victim and same-employer peer
        run: node --import tsx scripts/qa/tenant-identity-account-http.mjs
