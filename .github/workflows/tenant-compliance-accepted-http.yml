name: Tenant compliance accepted filing (independent fictional PG16)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - '.github/workflows/tenant-compliance-accepted-http.yml'
      - 'scripts/qa/tenant-compliance-accepted-http.mjs'
      - 'tests/tenant-compliance-accepted-contract.test.mjs'
      - 'docs/qa/tenant-compliance-accepted-batch.md'
      - 'src/app/api/compliance/filing-validations/**'
      - 'src/lib/filing-evidence*'
      - 'src/lib/exporters.ts'
      - 'src/lib/access.ts'
      - 'src/lib/government-id-crypto.ts'
      - 'src/db/**'
      - 'scripts/qa/tenant-table-http.mjs'
      - 'scripts/qa/tenant-filing-outcome-contract.mjs'
      - 'scripts/qa/disposable-insert-veto.mjs'
      - 'scripts/qa/apply-isolated-baseline.mjs'

permissions:
  contents: read

concurrency:
  group: tenant-compliance-accepted-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  accepted-filing-isolation:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact final PR SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install exact pinned dependencies
        run: npm ci --include=dev
      - name: Configure isolated compliance profile, workers OFF, no external providers
        shell: bash
        run: |
          set -euo pipefail
          node scripts/qa/tenant-table-env.mjs compliance-posts >> "$GITHUB_ENV"
          {
            echo 'TENANT_FILING_OUTCOME_MODE=fictional-pg16-filing-outcome'
            echo 'TENANT_COMPLIANCE_ACCEPTED_BATCH=fictional-only'
            echo 'MULTI_ENTITY_ENABLED=false'
            echo 'WORKER_ENABLED=false'
            echo 'CENTRAL_SCHEDULER_ENABLED=false'
            echo 'PAYMONGO_DISBURSEMENTS_ENABLED=false'
            echo 'XENDIT_PAYOUTS_ENABLED=false'
            echo 'XENDIT_BILLING_ENABLED=false'
            echo 'PAYMONGO_SECRET_KEY='
            echo 'PAYMONGO_WEBHOOK_SECRET='
            echo 'XENDIT_SECRET_KEY='
            echo 'XENDIT_PAYOUT_SECRET_KEY='
            echo 'RESEND_API_KEY='
            echo 'POSTMARK_SERVER_TOKEN='
            echo 'SMTP_URL='
            echo 'STRIPE_SECRET_KEY='
            echo 'OPENAI_API_KEY='
          } >> "$GITHUB_ENV"
      - name: Validate independent contract, source guards, and unsafe-target refusals
        run: |
          node --check scripts/qa/tenant-compliance-accepted-http.mjs
          node --test tests/tenant-compliance-accepted-contract.test.mjs
      - name: Generate only disposable application encryption keys
        shell: bash
        run: |
          set -euo pipefail
          for key_name in PII_ENCRYPTION_KEY BANK_DATA_ENCRYPTION_KEY TOTP_ENCRYPTION_KEY; do
            value=$(openssl rand -hex 32)
            echo "::add-mask::$value"
            echo "$key_name=$value" >> "$GITHUB_ENV"
          done
      - name: Create new empty synthetic PostgreSQL 16 schema
        run: npm run db:push
      - name: Apply reviewed synthetic audit-chain and schema baseline
        run: node scripts/qa/apply-isolated-baseline.mjs
      - name: Compile the production-mode Next server with no real providers
        run: npm run build
      - name: Start localhost-only Next production HTTP
        shell: bash
        run: |
          set -euo pipefail
          nohup npm start -- -H 127.0.0.1 -p 3000 > /tmp/tenant-compliance-accepted-next.log 2>&1 &
          server=$!
          for attempt in $(seq 1 60); do
            if curl --silent --fail "$SECURITY_SMOKE_URL/login" > /dev/null; then exit 0; fi
            if ! kill -0 "$server" 2>/dev/null; then break; fi
            sleep 2
          done
          tail -n 100 /tmp/tenant-compliance-accepted-next.log
          exit 1
      - name: Prove two owned accepted filing modes and foreign audit immutability
        run: node --import tsx scripts/qa/tenant-compliance-accepted-http.mjs
      - name: Show sanitized fictional local diagnostics on failure
        if: failure()
        run: tail -n 100 /tmp/tenant-compliance-accepted-next.log || true
