name: WFM Demand-to-Staffing Browser and Pure QA

on:
  pull_request:
    paths:
      - "src/lib/workforce-demand-staffing-*.ts"
      - "src/components/workspace/workforce-demand-staffing-panel.tsx"
      - "src/components/workspace/workforce-coverage-panel.tsx"
      - "tests/workforce-demand-staffing*.test.ts"
      - "tests/fixtures/wfm-demand-staffing-browser.jsx"
      - "scripts/wfm-demand-staffing-browser.mjs"
      - ".github/workflows/wfm-demand-staffing-qa.yml"
  workflow_dispatch:

# Supersede only older PR attempts; main/manual runs retain independent groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  planner-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Pure planner and role-scoped shift evidence
        run: npx tsx --test tests/workforce-demand-staffing-planner.test.ts tests/workforce-demand-staffing-evidence.test.ts
      - run: npm install --no-save --ignore-scripts playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Chromium manager scenario and isolation
        run: node scripts/wfm-demand-staffing-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wfm-demand-staffing-browser
          path: qa-artifacts/
          retention-days: 7
