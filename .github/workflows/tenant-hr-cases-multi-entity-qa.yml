name: HR Cases multi-legal-employer isolation (fictional PG16 HTTP)
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/tenant-hr-cases-multi-entity-qa.yml"
      - "scripts/qa/tenant-hr-cases-multi-entity-*.mjs"
      - "tests/tenant-hr-cases-multi-entity-contract.test.mjs"
      - "src/app/api/hr-cases/route.ts"
      - "src/lib/hr-case-tenant-scope.ts"
      - "src/lib/multi-entity-server.ts"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  legal-employer-case-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: "true"
      GITHUB_ACTIONS: "true"
      TZ: Asia/Manila
      NEXT_TELEMETRY_DISABLED: "1"
      TENANT_HR_LEGAL_EMPLOYER_PROOF: fictional-pg16-multi-entity-only
      BUILD_BLOCK_ACCEPTANCE_MODE: synthetic-postgres-only
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
      APP_BASE_URL: http://127.0.0.1:3000
      SECURITY_SMOKE_URL: http://127.0.0.1:3000
      TRUSTED_APP_ORIGINS: http://127.0.0.1:3000
      EMPLOYEE_HR_CASES_ENABLED: "true"
      MULTI_ENTITY_ENABLED: "true"
      EMPLOYEE_DOCUMENT_VAULT_ENABLED: "false"
      DEMO_MODE: "false"
      REQUIRE_PRIVILEGED_MFA: "true"
      TENANT_SECOND_PASS_MODE: isolated-ci-only
      WORKER_ENABLED: "false"
      CENTRAL_SCHEDULER_ENABLED: "false"
      XENDIT_PAYOUTS_ENABLED: "false"
      XENDIT_BILLING_ENABLED: "false"
      PAYMONGO_DISBURSEMENTS_ENABLED: "false"
      FINAL_PAY_SIGNED_REVIEW_ENABLED: "false"
      PAYROLL_CALCULATION_HISTORY_ENABLED: "false"
      OPENAI_API_KEY: ""
      SMTP_PASSWORD: ""
      RESEND_API_KEY: ""
      CRON_SECRET: ""
      WORKER_TOKEN: ""
      PAYMONGO_SECRET_KEY: ""
      XENDIT_SECRET_KEY: ""
      S3_ACCESS_KEY_ID: ""
      S3_SECRET_ACCESS_KEY: ""
      R2_ACCESS_KEY_ID: ""
      R2_SECRET_ACCESS_KEY: ""
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Require exact checked-out PR head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check source seals, real-HTTP scenario and negative controls
        run: |
          node --check scripts/qa/tenant-hr-cases-multi-entity-contract.mjs
          node --check scripts/qa/tenant-hr-cases-multi-entity-http.mjs
          node --test tests/tenant-hr-cases-multi-entity-contract.test.mjs
      - name: Generate synthetic ephemeral encryption keys
        shell: bash
        run: |
          set -euo pipefail
          for key in BANK_DATA_ENCRYPTION_KEY PII_ENCRYPTION_KEY TOTP_ENCRYPTION_KEY; do
            value=$(openssl rand -hex 32)
            echo "::add-mask::$value"
            echo "$key=$value" >> "$GITHUB_ENV"
          done
      - name: Push fresh disposable PostgreSQL 16 schema
        run: npm run db:push
      - name: Apply reviewed isolated database baseline after schema push
        run: node scripts/qa/apply-isolated-baseline.mjs
      - name: Build production-mode localhost Next
        run: npm run build
      - name: Start localhost Next without external connections
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/tenant-hr-entity.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:3000/login > /dev/null; then exit 0; fi
            sleep 2
          done
          tail -n 50 /tmp/tenant-hr-entity.log
          exit 1
      - name: Real own and foreign legal-employer GET PATCH denial and SQL integrity
        env:
          NODE_ENV: production
        run: node --import tsx scripts/qa/tenant-hr-cases-multi-entity-http.mjs
      - name: Print bounded local-only diagnostics on failure
        if: failure()
        run: tail -n 60 /tmp/tenant-hr-entity.log || true
