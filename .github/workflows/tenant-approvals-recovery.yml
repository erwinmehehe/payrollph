  approval-types-http:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - '5432:5432'
        options: '--health-cmd "pg_isready -U postgres -d app_db" --health-interval 5s --health-timeout 5s --health-retries 10'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Disposable targets and all money/provider/worker flags OFF
        shell: bash
        run: |
          set -euo pipefail
          node scripts/qa/tenant-table-env.mjs default >> "$GITHUB_ENV"
          echo 'TENANT_APPROVAL_TYPES_MODE=fictional-disposable-pg16' >> "$GITHUB_ENV"
          for flag in FINAL_PAY_SIGNED_REVIEW_ENABLED EXACT_THIRTEENTH_CENTAVOS_ENABLED PAYROLL_CALCULATION_HISTORY_ENABLED NEXT_CSP_ENABLED PAYMONGO_DISBURSEMENTS_ENABLED XENDIT_PAYOUTS_ENABLED XENDIT_BILLING_ENABLED WORKER_ENABLED CENTRAL_SCHEDULER_ENABLED; do
            echo "$flag=false" >> "$GITHUB_ENV"
          done
          for key in PAYMONGO_SECRET_KEY XENDIT_SECRET_KEY XENDIT_PAYOUT_SECRET_KEY RESEND_API_KEY POSTMARK_SERVER_TOKEN SMTP_URL STRIPE_SECRET_KEY; do
            echo "$key=" >> "$GITHUB_ENV"
          done
          for name in PII_ENCRYPTION_KEY BANK_DATA_ENCRYPTION_KEY; do
            key=$(openssl rand -hex 32)
            echo "::add-mask::$key"
            echo "$name=$key" >> "$GITHUB_ENV"
          done
          secret="whsec_$(openssl rand -base64 32 | tr -d '\n')"
          echo "::add-mask::$secret"
          echo "RESEND_WEBHOOK_SECRET=$secret" >> "$GITHUB_ENV"
      - name: Target and negative-oracle contracts
        run: node --import tsx --test tests/tenant-approval-types-contract.test.mjs tests/approval-source-tenant-boundary.test.ts tests/tenant-approval-delegated-proof.test.mjs tests/tenant-approval-payroll-decline-proof.test.mjs
      - name: Fresh disposable schema
        run: npm run db:push
      - name: Reviewed isolated test baseline after schema creation
        run: node scripts/qa/apply-isolated-baseline.mjs
      - run: npm run build
      - name: Start production Next on loopback only
        shell: bash
        run: |
          set -euo pipefail
          nohup npm start -- -H 127.0.0.1 > /tmp/approval-types-next.log 2>&1 &
          server=$!
          for attempt in $(seq 1 60); do
            if curl --silent --fail "$SECURITY_SMOKE_URL/login" > /dev/null; then exit 0; fi
            if ! kill -0 "$server" 2>/dev/null; then cat /tmp/approval-types-next.log; exit 1; fi
            sleep 2
          done
          cat /tmp/approval-types-next.log
          exit 1
      - name: Own source writes, two attackers, victim denial, forged links and audit rollback
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx scripts/qa/tenant-approval-types-http.mjs | tee /tmp/approval-types-result.jsonl
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: approval-types-pg16-${{ github.event.pull_request.head.sha }}
          path: /tmp/approval-types-result.jsonl
          if-no-files-found: ignore
      - name: Localhost diagnostics on failure
        if: failure()
        run: cat /tmp/approval-types-next.log || true
    env:
      FINAL_PAY_SIGNED_REVIEW_ENABLED: 'false'
      EXACT_THIRTEENTH_CENTAVOS_ENABLED: 'false'
      PAYROLL_CALCULATION_HISTORY_ENABLED: 'false'
      NEXT_CSP_ENABLED: 'false'
  money-lifecycle-pg16:
    strategy:
      fail-fast: false
      matrix:
        exact-links:
          - 'false'
          - 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - '5432:5432'
        options: '--health-cmd "pg_isready -U postgres -d app_db" --health-interval 5s --health-timeout 5s --health-retries 10'
    env:
      TZ: Asia/Manila
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
      APP_BASE_URL: http://127.0.0.1:3011
      MONEY_PROOF_URL: http://127.0.0.1:3011
      MONEY_PROOF_MODE: disposable-only
      MONEY_PROOF_TRANSPORT: http
      DEMO_MODE: 'false'
      REQUIRE_PRIVILEGED_MFA: 'true'
      TOTP_ENCRYPTION_KEY: '1111111111111111111111111111111111111111111111111111111111111111'
      PII_ENCRYPTION_KEY: '2222222222222222222222222222222222222222222222222222222222222222'
      BANK_DATA_ENCRYPTION_KEY: '3333333333333333333333333333333333333333333333333333333333333333'
      PAYMONGO_DISBURSEMENTS_ENABLED: 'false'
      XENDIT_PAYOUTS_ENABLED: 'false'
      PAYROLL_UNDERPAYMENT_POSTING_ENABLED: 'false'
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      EXACT_PAYROLL_APPROVAL_LINKS_ENABLED: ${{ matrix.exact-links }}
      FINAL_PAY_SIGNED_REVIEW_ENABLED: 'false'
      EXACT_THIRTEENTH_CENTAVOS_ENABLED: 'false'
      PAYROLL_CALCULATION_HISTORY_ENABLED: 'false'
      NEXT_CSP_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/money-proof-target.test.mjs
      - run: npm run db:push
      - name: Apply reviewed 0109 audit chain and supplement to disposable app_db before clone
        run: node scripts/qa/apply-isolated-baseline.mjs
      - name: Clone empty disposable schema into dedicated money-proof database
        run: |
          node --input-type=module <<'NODE'
          import pg from 'pg';
          const c = new pg.Client({connectionString: process.env.DATABASE_URL});
          await c.connect();
          await c.query('CREATE DATABASE payroll_mny01_test TEMPLATE app_db');
          await c.end();
          NODE
          echo 'DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/payroll_mny01_test' >> "$GITHUB_ENV"
      - run: npm run build
      - name: Run real HTTP and PostgreSQL money-path proof
        run: |
          set -euo pipefail
          npm start -- -H 127.0.0.1 -p 3011 > /tmp/money-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in {1..40}; do
            if curl --silent --fail http://127.0.0.1:3011 >/dev/null; then ready=true; break; fi
            sleep 2
          done
          test "$ready" = true
          npx tsx scripts/qa/tenant-money-lifecycle-http.mjs
          npx tsx scripts/qa/final-pay-lifecycle-http.mjs
      - name: Server diagnostics
        if: failure()
        run: cat /tmp/money-server.log || true
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: money-lifecycle-${{ matrix.exact-links }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            qa-artifacts/tenant-money-lifecycle.json
            qa-artifacts/final-pay-lifecycle.json
          if-no-files-found: warn
  complete-method-receipt:
    needs:
      - fictional-approval-http
      - fictional-approval-sources-http
      - fictional-approval-flows-http
      - approval-types-http
      - money-lifecycle-pg16
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Refuse partial approval-method evidence
        env:
          PROOF_RESULTS: ${{ toJSON(needs) }}
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node -e "const results=JSON.parse(process.env.PROOF_RESULTS); if(Object.keys(results).length!==5 || Object.values(results).some(x=>x.result!=='success')) process.exit(1); console.log(JSON.stringify({label:'SOLO_VERIFIED_DEV_RECOVERY',sourceHead:process.env.SOURCE_HEAD,proofResults:results,promotableMethods:1,creditedMethods:0,productionAccepted:false}))"
