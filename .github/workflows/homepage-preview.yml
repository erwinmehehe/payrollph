name: Homepage preview screenshot

on:
  push:
    branches:
      - feat/migration-center-competitors-sep29
    paths:
      - ".github/workflows/homepage-preview.yml"

jobs:
  screenshot:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
      DEMO_MODE: "true"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run db:push
      - name: Start app
        run: |
          npm run dev -- --hostname 127.0.0.1 > /tmp/payrollph-next.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/payrollph-next.log
          exit 1
      - name: Start headless Chrome
        run: |
          google-chrome \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --hide-scrollbars \
            --remote-debugging-address=127.0.0.1 \
            --remote-debugging-port=9222 \
            --user-data-dir=/tmp/payrollph-chrome \
            about:blank > /tmp/payrollph-chrome.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:9222/json/version >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/payrollph-chrome.log
          exit 1
      - name: Capture homepage
        run: |
          cat > /tmp/capture.mjs <<'EOF'
          import fs from "node:fs/promises";
          const targets = await (await fetch("http://127.0.0.1:9222/json")).json();
          const page = targets.find((item) => item.type === "page");
          if (!page) throw new Error("No Chrome target");
          const ws = new WebSocket(page.webSocketDebuggerUrl);
          await new Promise((resolve, reject) => {
            ws.addEventListener("open", resolve, { once: true });
            ws.addEventListener("error", reject, { once: true });
          });
          let id = 1;
          const pending = new Map();
          const listeners = new Map();
          ws.addEventListener("message", (event) => {
            const msg = JSON.parse(String(event.data));
            if (msg.id && pending.has(msg.id)) {
              const p = pending.get(msg.id); pending.delete(msg.id);
              msg.error ? p.reject(new Error(msg.error.message)) : p.resolve(msg.result);
              return;
            }
            if (msg.method && listeners.has(msg.method)) for (const fn of listeners.get(msg.method)) fn(msg.params);
          });
          const send = (method, params={}) => new Promise((resolve,reject) => {
            const callId=id++; pending.set(callId,{resolve,reject});
            ws.send(JSON.stringify({id:callId,method,params}));
          });
          const once = (method) => new Promise((resolve) => {
            const set=listeners.get(method) ?? new Set();
            const fn=(p)=>{set.delete(fn);resolve(p)}; set.add(fn); listeners.set(method,set);
          });
          await send("Page.enable");
          await send("Runtime.enable");
          await send("Emulation.setDeviceMetricsOverride", {width:1440,height:1000,deviceScaleFactor:1,mobile:false});
          const loaded=once("Page.loadEventFired");
          await send("Page.navigate",{url:"http://127.0.0.1:3000/"});
          await loaded;
          await new Promise(r=>setTimeout(r,1200));
          const metrics=await send("Page.getLayoutMetrics");
          const size=metrics.cssContentSize;
          const shot=await send("Page.captureScreenshot",{
            format:"png",
            captureBeyondViewport:true,
            clip:{x:0,y:0,width:Math.min(1600,Math.ceil(size.width)),height:Math.min(12000,Math.ceil(size.height)),scale:1}
          });
          await fs.writeFile("homepage-preview.png",Buffer.from(shot.data,"base64"));
          ws.close();
          EOF
          node /tmp/capture.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: homepage-preview
          path: homepage-preview.png
          retention-days: 3
