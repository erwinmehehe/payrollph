name: HCM Team Leave Calendar Isolation QA

on:
  pull_request:
    paths:
      - "src/lib/hcm-team-leave-calendar-*"
      - "src/app/api/hcm/team-leave-calendar/**"
      - "src/app/hcm/team-leave-calendar/**"
      - "src/components/hcm-team-leave-calendar.tsx"
      - "tests/hcm-team-leave-calendar*.test.ts"
      - ".github/workflows/hcm-team-leave-calendar-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-two-tenant-calendar:
    name: Source isolation and partial-day evidence (synthetic only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
      CI: "true"
      HCM_TEAM_LEAVE_CALENDAR_ENABLED: "false"
      NEXT_PUBLIC_HCM_TEAM_LEAVE_CALENDAR_ENABLED: "false"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout reviewed pull request files
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install lockfile dependencies
        run: npm ci
      - name: Build isolated synthetic schema
        run: npm run db:push
      - name: Run Philippine calendar and two-employer partial-day test suite
        run: npx tsx --test --test-concurrency=1 tests/hcm-team-leave-calendar.test.ts tests/hcm-team-leave-calendar-tenant.test.ts
