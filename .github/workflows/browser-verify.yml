name: Browser verification

on:
  push:
    branches:
      - feat/homepage-payroll-software-outsourcing

jobs:
  browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
      DEMO_MODE: "false"
      APP_BASE_URL: http://127.0.0.1:3000
      PG_POOL_MAX: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Apply baseline schema
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const { Client } = require("pg");
          (async () => {
            const client = new Client({ connectionString: process.env.DATABASE_URL });
            await client.connect();
            await client.query(fs.readFileSync("drizzle/baseline.sql", "utf8"));
            const result = await client.query(
              "select count(*)::int as count from information_schema.tables where table_schema = 'public' and table_type = 'BASE TABLE'"
            );
            if (result.rows[0].count !== 55) throw new Error(`Expected 55 tables, found ${result.rows[0].count}`);
            console.log("Baseline table count:", result.rows[0].count);
            await client.end();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
      - run: npm run build
      - name: Start production server
        run: |
          npm start > /tmp/linaw-next.log 2>&1 &
          echo $! > /tmp/linaw-next.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/linaw-next.log
          exit 1
      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify interactive marketing flows
        run: |
          node <<'NODE'
          const { chromium } = require("playwright");

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });

            await page.goto("http://127.0.0.1:3000/", { waitUntil: "networkidle" });
            const homepageHeading = page.getByRole("heading", { name: /Philippine payroll software without the guesswork/i });
            if (!(await homepageHeading.isVisible())) throw new Error("Software homepage H1 is not visible");

            const payroll = page.locator("#payroll");
            const slider = payroll.locator("#lab-salary");
            const output = payroll.locator('output[for="lab-salary"]');
            const before = await output.textContent();
            await slider.fill("50000");
            await page.waitForTimeout(150);
            const after = await output.textContent();
            if (!before || !after || before === after || !after.includes("50,000")) {
              throw new Error(`Statutory slider did not update: before=${before} after=${after}`);
            }

            await payroll.getByText("Treat as a minimum-wage earner (MWE)", { exact: true }).click();
            if (!(await payroll.getByText("MWE, fully exempt").isVisible())) {
              throw new Error("MWE toggle did not update withholding explanation");
            }

            const preview = page.locator("#preview");
            await preview.getByRole("button", { name: "Payroll", exact: true }).click();
            if (!(await preview.getByText("Register", { exact: true }).isVisible())) {
              throw new Error("Interactive workspace did not switch to Payroll");
            }

            const release = preview.getByRole("button", { name: /Release \(simulated\)/ });
            if (!(await release.isDisabled())) {
              throw new Error("Release should be disabled before exception acknowledgement");
            }
            await preview.getByText(/Acknowledge \d+ exception/, { exact: true }).click();
            if (await release.isDisabled()) {
              throw new Error("Release stayed disabled after exception acknowledgement");
            }
            await release.click();
            if (!(await preview.getByText("Released in this simulation").isVisible())) {
              throw new Error("Simulated payroll release did not complete");
            }

            await page.goto("http://127.0.0.1:3000/payroll-outsourcing", { waitUntil: "networkidle" });
            const serviceHeading = page.getByRole("heading", {
              name: /Payroll outsourcing for Philippine businesses\. We process your payroll\. You stay in control\./i,
            });
            if (!(await serviceHeading.isVisible())) throw new Error("Outsourcing service H1 is not visible");
            if (!(await page.getByRole("link", { name: /Get a payroll quote/i }).first().isVisible())) {
              throw new Error("Payroll quote CTA is not visible");
            }

            await page.goto("http://127.0.0.1:3000/welcome", { waitUntil: "networkidle" });
            const finalUrl = new URL(page.url());
            if (finalUrl.pathname !== "/") throw new Error(`/welcome did not redirect to /, got ${finalUrl.pathname}`);

            console.log(JSON.stringify({
              homepage: "ok",
              statutorySlider: { before, after },
              mweToggle: "ok",
              workspacePreview: "ok",
              simulatedRelease: "ok",
              payrollOutsourcing: "ok",
              welcomeRedirect: finalUrl.pathname,
            }, null, 2));

            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
