name: DL-01 document upload tenant proof (fictional PG16; zero credits)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - '.github/workflows/tenant-document-upload-http.yml'
      - 'scripts/qa/tenant-document-upload-*.mjs'
      - 'scripts/qa/tenant-document-upload-scan-preload.cjs'
      - 'tests/tenant-document-upload-contract.test.mjs'
      - 'docs/qa/tenant-document-upload.md'
      - 'src/app/api/documents/route.ts'
      - 'src/lib/storage.ts'
      - 'src/lib/document-schema-compat.ts'
      - 'src/db/**'

permissions:
  contents: read

concurrency:
  group: tenant-document-upload-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fictional-document-upload:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Configure strictly fictional PG16 profile (no payouts or real providers)
        shell: bash
        run: |
          set -euo pipefail
          node scripts/qa/tenant-table-env.mjs compliance-posts >> "$GITHUB_ENV"
          {
            echo 'TENANT_DOCUMENT_UPLOAD_MODE=fictional-pg16-http'
            echo 'DOCUMENT_UPLOADS_ENABLED=true'
            echo 'EMPLOYEE_DOCUMENT_VAULT_ENABLED=false'
            echo 'WORKER_ENABLED=false'
            echo 'CENTRAL_SCHEDULER_ENABLED=false'
            echo 'MALWARE_SCAN_URL=https://scanner.fixture.invalid/scan'
            echo 'MALWARE_SCAN_TOKEN=ci-fictional-scanner-token'
            echo 'PAYMONGO_SECRET_KEY='
            echo 'XENDIT_SECRET_KEY='
            echo 'RESEND_API_KEY='
            echo 'POSTMARK_SERVER_TOKEN='
            echo 'SMTP_URL='
          } >> "$GITHUB_ENV"
      - name: Fail-closed syntax, exact route pin and negative controls
        run: |
          node --check scripts/qa/tenant-document-upload-contract.mjs
          node --check scripts/qa/tenant-document-upload-http.mjs
          node --check scripts/qa/tenant-document-upload-scan-preload.cjs
          node --test tests/tenant-document-upload-contract.test.mjs tests/tenant-documents-post-legacy-atomic.test.mjs
      - name: Generate disposable encryption evidence only
        shell: bash
        run: |
          set -euo pipefail
          for key in PII_ENCRYPTION_KEY BANK_DATA_ENCRYPTION_KEY; do
            value="$(openssl rand -hex 32)"
            echo "::add-mask::$value"
            printf '%s=%s\n' "$key" "$value" >> "$GITHUB_ENV"
          done
      - name: Prepare empty disposable PostgreSQL 16 with reviewed baseline
        run: |
          npm run db:push
          node scripts/qa/apply-isolated-baseline.mjs
      - name: Build production-mode app against fictional-only database
        run: npm run build
      - name: Start isolated Next.js with egress-refusing fictional scanner
        shell: bash
        run: |
          set -euo pipefail
          NODE_OPTIONS='--require ./scripts/qa/tenant-document-upload-scan-preload.cjs' \
            nohup npm start -- -H 127.0.0.1 > /tmp/tenant-document-upload-next.log 2>&1 &
          server=$!
          for attempt in $(seq 1 60); do
            if curl --silent --fail "$SECURITY_SMOKE_URL/login" > /dev/null; then
              exit 0
            fi
            if ! kill -0 "$server" 2>/dev/null; then
              cat /tmp/tenant-document-upload-next.log
              exit 1
            fi
            sleep 2
          done
          cat /tmp/tenant-document-upload-next.log
          exit 1
      - name: Verify two authenticated employers, high-ID victim and audit veto
        run: node --import tsx scripts/qa/tenant-document-upload-http.mjs
      - name: Show only local fictional diagnostic logs on failure
        if: failure()
        run: tail -n 80 /tmp/tenant-document-upload-next.log || true
