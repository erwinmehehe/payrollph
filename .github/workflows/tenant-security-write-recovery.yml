name: Four-method security write recovery (fictional PG16)
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/tenant-security-write-recovery.yml'
      - 'scripts/qa/tenant-security-write-*.mjs'
      - 'scripts/qa/tenant-account-email-request-*.mjs'
      - 'scripts/qa/tenant-document-upload-*.mjs'
      - 'scripts/qa/tenant-bio01-biometric-*.mjs'
      - 'scripts/qa/tenant-developer-key-*.mjs'
      - 'scripts/qa/tenant-isolation-coverage-manifest.json'
      - 'scripts/qa/local-tenant-proof-db.mjs'
      - 'scripts/qa/tenant-table-*.mjs'
      - 'scripts/qa/tenant-recovery-local-contract.mjs'
      - 'tests/tenant-security-write-*.test.mjs'
      - 'src/app/api/account/email/**'
      - 'src/app/api/documents/**'
      - 'src/app/api/biometrics/sync/**'
      - 'src/app/api/developer/**'
      - 'src/lib/**'
      - 'src/db/**'
      - 'src/proxy.ts'
      - 'src/instrumentation.ts'
      - 'drizzle/**'
      - 'docs/sql/**'
      - 'package*.json'
      - 'next.config.ts'
permissions:
  contents: read
concurrency:
  group: security-write-recovery-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  four-method-security-write:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Guard fixtures and deny non-fixture network destinations
        run: node --test tests/tenant-security-write-local.test.mjs
      - name: Build once, no external providers or credentials
        run: node scripts/qa/tenant-security-write-local.mjs build
      - name: Fresh fictional database per method/profile, real production HTTP
        shell: bash
        run: |
          set -euo pipefail
          server=''
          cleanup() { if [ -n "$server" ]; then kill "$server" 2>/dev/null || true; wait "$server" 2>/dev/null || true; server=''; fi; }
          trap cleanup EXIT
          for item in email:legacy documents:legacy documents:vault biometrics:legacy developer:legacy; do
            family="${item%:*}"
            profile="${item#*:}"
            node scripts/qa/tenant-security-write-local.mjs db "$profile"
            node scripts/qa/tenant-security-write-local.mjs start "$profile" > "/tmp/security-write-$family-$profile.log" 2>&1 &
            server=$!
            ready=false
            for attempt in $(seq 1 90); do
              if curl -fsS http://127.0.0.1:3000/login >/dev/null; then ready=true; break; fi
              if ! kill -0 "$server" 2>/dev/null; then exit 1; fi
              sleep 2
            done
            [ "$ready" = true ]
            node scripts/qa/tenant-security-write-local.mjs "$family" "$profile"
            cleanup
          done
      - name: Upload sanitized result counters only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: security-write-recovery-counters
          path: |
            outputs/security-write-email.json
            outputs/security-write-documents-legacy.json
            outputs/security-write-documents-vault.json
            outputs/security-write-biometrics.json
            outputs/security-write-developer.json
          if-no-files-found: ignore
          retention-days: 7
