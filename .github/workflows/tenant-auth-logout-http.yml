name: Auth logout tenant boundary (fictional PG16 HTTP; no money)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - '.github/workflows/tenant-auth-logout-http.yml'
      - 'scripts/qa/tenant-auth-logout-*.mjs'
      - 'scripts/qa/tenant-approval-task-contract.mjs'
      - 'tests/tenant-auth-logout-contract.test.mjs'
      - 'src/app/api/auth/logout/**'
      - 'src/lib/auth.ts'
      - 'src/lib/security-request.ts'
      - 'src/lib/crypto.ts'
      - 'src/db/**'
      - 'scripts/qa/tenant-table-http.mjs'
      - 'scripts/qa/tenant-table-env.mjs'
      - 'scripts/qa/apply-isolated-baseline.mjs'

permissions:
  contents: read

concurrency:
  group: tenant-auth-logout-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fictional-auth-logout-http:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TENANT_APPROVAL_TASK_MODE: fictional-pg16-http
      PAYMONGO_DISBURSEMENTS_ENABLED: 'false'
      XENDIT_PAYOUTS_ENABLED: 'false'
      XENDIT_BILLING_ENABLED: 'false'
      WORKER_ENABLED: 'false'
      CENTRAL_SCHEDULER_ENABLED: 'false'
      PAYMONGO_SECRET_KEY: ''
      XENDIT_SECRET_KEY: ''
      RESEND_API_KEY: ''
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Export disposable localhost targets and disable all providers and workers
        shell: bash
        run: |
          set -euo pipefail
          node scripts/qa/tenant-table-env.mjs default >> "$GITHUB_ENV"
          {
            echo 'TENANT_APPROVAL_TASK_MODE=fictional-pg16-http'
            echo 'XENDIT_BILLING_ENABLED=false'
            echo 'PAYMONGO_DISBURSEMENTS_ENABLED=false'
            echo 'XENDIT_PAYOUTS_ENABLED=false'
            echo 'WORKER_ENABLED=false'
            echo 'CENTRAL_SCHEDULER_ENABLED=false'
            echo 'PAYMONGO_SECRET_KEY='
            echo 'XENDIT_SECRET_KEY='
            echo 'RESEND_API_KEY='
          } >> "$GITHUB_ENV"
      - name: Fail closed on incorrect proof contracts and synthetic targets
        run: |
          node --check scripts/qa/tenant-auth-logout-contract.mjs
          node --check scripts/qa/tenant-auth-logout-http.mjs
          node --test tests/tenant-auth-logout-contract.test.mjs
      - name: Generate throwaway encryption keys and webhook secret
        shell: bash
        run: |
          set -euo pipefail
          for name in PII_ENCRYPTION_KEY BANK_DATA_ENCRYPTION_KEY; do
            key=$(openssl rand -hex 32)
            echo "::add-mask::$key"
            echo "$name=$key" >> "$GITHUB_ENV"
          done
          secret="whsec_$(openssl rand -base64 32 | tr -d '\n')"
          echo "::add-mask::$secret"
          echo "RESEND_WEBHOOK_SECRET=$secret" >> "$GITHUB_ENV"
      - name: Initialize disposable PostgreSQL 16
        run: npm run db:push
      - name: Apply only reviewed fictional baseline objects
        run: node scripts/qa/apply-isolated-baseline.mjs
      - name: Build production-mode app against the disposable database
        run: npm run build
      - name: Start production-mode Next on localhost only
        shell: bash
        run: |
          set -euo pipefail
          nohup npm start -- -H 127.0.0.1 > /tmp/tenant-auth-logout-next.log 2>&1 &
          server=$!
          for attempt in $(seq 1 60); do
            if curl --silent --fail "$SECURITY_SMOKE_URL/login" > /dev/null; then
              exit 0
            fi
            if ! kill -0 "$server" 2>/dev/null; then
              cat /tmp/tenant-auth-logout-next.log
              exit 1
            fi
            sleep 2
          done
          cat /tmp/tenant-auth-logout-next.log
          exit 1
      - name: Verify own session revocation, forged session IDs, no-op logouts, cross-site refusal and untouched victim
        run: node --import tsx scripts/qa/tenant-auth-logout-http.mjs
      - name: Show localhost-only diagnostic log on failure
        if: failure()
        run: cat /tmp/tenant-auth-logout-next.log || true
