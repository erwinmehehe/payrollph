name: Vercel Git Deploy Policy (No Deploy)

on:
  pull_request:
    paths:
      - 'vercel.json'
      - 'tests/vercel-preview-deployment-guard.test.mjs'
      - '.github/workflows/vercel-git-deploy-policy.yml'
      - 'docs/preview-isolation-guard.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  main-only-auto-deploy-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Ensure staging and preview auto-deploy remain disabled
        run: node --test tests/vercel-preview-deployment-guard.test.mjs
