name: Tenant Hire-to-Payroll Review SSR (Fictional PG16)

on:
  pull_request:
    branches: [main]
    paths:
      - "src/app/hcm/hire-payroll-review/page.tsx"
      - "src/lib/hcm-hire-payroll-review-*.ts"
      - "scripts/qa/tenant-hire-payroll-review-*.mjs"
      - "tests/tenant-hire-payroll-review-contract.test.mjs"
      - "tests/hcm-hire-payroll-review.test.ts"
      - ".github/workflows/tenant-hire-payroll-review-qa.yml"
      - "docs/qa/tenant-hire-payroll-review-ssr-boundary.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hire-review-tenant-ssr:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: "true"
      TZ: Asia/Manila
      BUILD_BLOCK_ACCEPTANCE_MODE: synthetic-postgres-only
      TENANT_HIRE_REVIEW_PROOF: fictional-pg16-only
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
      APP_BASE_URL: http://127.0.0.1:3000
      SECURITY_SMOKE_URL: http://127.0.0.1:3000
      TRUSTED_APP_ORIGINS: http://127.0.0.1:3000
      HCM_HIRE_PAYROLL_REVIEW_ENABLED: "true"
      NEXT_PUBLIC_HCM_HIRE_PAYROLL_REVIEW_ENABLED: "true"
      HCM_HIRE_PAYROLL_REVIEW_ORG_IDS: "1,2,3"
      DEMO_MODE: "false"
      REQUIRE_PRIVILEGED_MFA: "true"
      WORKER_ENABLED: "false"
      CENTRAL_SCHEDULER_ENABLED: "false"
      PAYMONGO_DISBURSEMENTS_ENABLED: "false"
      XENDIT_PAYOUTS_ENABLED: "false"
      XENDIT_BILLING_ENABLED: "false"
      PAYROLL_CALCULATION_HISTORY_ENABLED: "false"
      EXACT_THIRTEENTH_CENTAVOS_ENABLED: "false"
      FINAL_PAY_SIGNED_REVIEW_ENABLED: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact PR head
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Reject non-disposable or false-positive proof source
        run: |
          node --check scripts/qa/tenant-hire-payroll-review-contract.mjs
          node --check scripts/qa/tenant-hire-payroll-review-http.mjs
          node --test tests/tenant-hire-payroll-review-contract.test.mjs
          node --import tsx --test tests/hcm-hire-payroll-review.test.ts
      - name: Generate disposable encryption keys
        shell: bash
        run: |
          for key in BANK_DATA_ENCRYPTION_KEY PII_ENCRYPTION_KEY TOTP_ENCRYPTION_KEY; do
            value=$(openssl rand -hex 32)
            echo "::add-mask::$value"
            echo "$key=$value" >> "$GITHUB_ENV"
          done
      - name: Create empty disposable PostgreSQL 16 schema
        run: npm run db:push
      - name: Apply reviewed fictional baseline only
        run: node scripts/qa/apply-isolated-baseline.mjs
      - name: Build production-mode, feature-ON Next app for disposable proof
        run: npm run build
      - name: Start localhost-only app
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/tenant-hire-review-page.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:3000/login > /dev/null; then exit 0; fi
            sleep 2
          done
          tail -n 80 /tmp/tenant-hire-review-page.log
          exit 1
      - name: Prove two-owner, real-victim, same-employer-worker SSR and SQL
        env:
          NODE_ENV: production
        run: node --import tsx scripts/qa/tenant-hire-payroll-review-http.mjs
      - name: Show bounded localhost logs on failure
        if: failure()
        run: tail -n 80 /tmp/tenant-hire-review-page.log || true
