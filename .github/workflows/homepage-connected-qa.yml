name: Homepage connected visual QA

on:
  push:
    branches:
      - feat/migration-center-competitors-sep29
    paths:
      - ".github/workflows/homepage-connected-qa.yml"
      - "src/components/marketing/workspace-preview.tsx"
      - "src/components/marketing/pricing-table.tsx"
      - "src/components/marketing/software-home.module.css"
      - "src/components/marketing/software-home.tsx"
      - "src/components/marketing/site-chrome.tsx"

jobs:
  visual:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
      DEMO_MODE: "true"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run db:push
      - name: Start app
        run: |
          npm run dev -- --hostname 127.0.0.1 > /tmp/app.log 2>&1 &
          for i in {1..60}; do
            curl -fsS http://127.0.0.1:3000/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/app.log
          exit 1
      - name: Start Chrome
        run: |
          google-chrome --headless=new --no-sandbox --disable-dev-shm-usage --hide-scrollbars             --remote-debugging-address=127.0.0.1 --remote-debugging-port=9222             --user-data-dir=/tmp/chrome about:blank >/tmp/chrome.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:9222/json/version >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/chrome.log
          exit 1
      - name: Capture connected homepage
        run: |
          cat >/tmp/capture.mjs <<'EOF'
          import fs from "node:fs/promises";
          const targets=await (await fetch("http://127.0.0.1:9222/json")).json();
          const page=targets.find(x=>x.type==="page");
          const ws=new WebSocket(page.webSocketDebuggerUrl);
          await new Promise((res,rej)=>{ws.addEventListener("open",res,{once:true});ws.addEventListener("error",rej,{once:true})});
          let id=1; const pending=new Map(); const listeners=new Map();
          ws.addEventListener("message",e=>{
            const m=JSON.parse(String(e.data));
            if(m.id&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.reject(new Error(m.error.message)):p.resolve(m.result);return}
            if(m.method&&listeners.has(m.method)) for(const fn of listeners.get(m.method)) fn(m.params);
          });
          const send=(method,params={})=>new Promise((resolve,reject)=>{const call=id++;pending.set(call,{resolve,reject});ws.send(JSON.stringify({id:call,method,params}))});
          const once=(method)=>new Promise(resolve=>{const set=listeners.get(method)??new Set();const fn=p=>{set.delete(fn);resolve(p)};set.add(fn);listeners.set(method,set)});
          const wait=async(expr,limit=15000)=>{const start=Date.now();while(Date.now()-start<limit){const r=await send("Runtime.evaluate",{expression:expr,returnByValue:true});if(r.result.value)return;await new Promise(r=>setTimeout(r,200))}throw new Error("timeout "+expr)};
          const shot=async(name,clip)=>{
            const r=await send("Page.captureScreenshot",{format:"png",captureBeyondViewport:true,...(clip?{clip}:{})});
            await fs.writeFile(name,Buffer.from(r.data,"base64"));
          };
          await send("Page.enable"); await send("Runtime.enable");
          await send("Emulation.setDeviceMetricsOverride",{width:1440,height:1000,deviceScaleFactor:1,mobile:false});
          const loaded=once("Page.loadEventFired"); await send("Page.navigate",{url:"http://127.0.0.1:3000/"}); await loaded;
          await wait("document.readyState==='complete'");
          await new Promise(r=>setTimeout(r,800));
          const metrics=await send("Page.getLayoutMetrics");
          await shot("homepage-connected.png",{x:0,y:0,width:Math.min(1600,Math.ceil(metrics.cssContentSize.width)),height:Math.min(12000,Math.ceil(metrics.cssContentSize.height)),scale:1});
          await send("Runtime.evaluate",{expression:`document.querySelector('#simulation')?.scrollIntoView({block:'start'})`});
          await new Promise(r=>setTimeout(r,300));
          await send("Runtime.evaluate",{expression:`Array.from(document.querySelectorAll('#simulation button')).find(x=>x.textContent?.trim()==='Migration')?.click()`});
          await wait("document.body.innerText.includes('Bring your existing payroll and HR data with you.')");
          const sim=await send("Runtime.evaluate",{expression:`(()=>{const e=document.querySelector('#simulation');const r=e.getBoundingClientRect();return{x:r.left+scrollX,y:r.top+scrollY,width:r.width,height:Math.min(r.height,1100)}})()`,returnByValue:true});
          await shot("homepage-migration-demo.png",{...sim.result.value,scale:1});
          const price=await send("Runtime.evaluate",{expression:`(()=>{const e=document.querySelector('#pricing');e.scrollIntoView({block:'start'});const r=e.getBoundingClientRect();return{x:r.left+scrollX,y:r.top+scrollY,width:r.width,height:Math.min(r.height,1100)}})()`,returnByValue:true});
          await new Promise(r=>setTimeout(r,250));
          await shot("homepage-pricing.png",{...price.result.value,scale:1});
          ws.close();
          EOF
          node /tmp/capture.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: homepage-connected-visuals
          path: |
            homepage-connected.png
            homepage-migration-demo.png
            homepage-pricing.png
          retention-days: 3
