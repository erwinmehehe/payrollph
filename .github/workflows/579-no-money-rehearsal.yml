name: "Synthetic #579 no-money app-path review (not a production milestone)"

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/qa/579-synthetic-no-money-journey.mjs"
      - ".github/workflows/579-no-money-rehearsal.yml"

permissions:
  contents: read

concurrency:
  group: synthetic-579-app-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  no-money-rehearsal:
    name: "Disposable PG16, two fictional employers, bank DRY RUN only"
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      REHEARSAL_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install pinned project dependencies
        run: npm ci
      - name: Configure strict fictional-only localhost run; all payment and new-pay flags off
        run: |
          node scripts/qa/first-payroll-full-env.mjs >> "$GITHUB_ENV"
          for name in PAYMONGO_DISBURSEMENTS_ENABLED XENDIT_PAYOUTS_ENABLED XENDIT_PAYOUTS_LIVE_APPROVED FINAL_PAY_SIGNED_REVIEW_ENABLED EXACT_THIRTEENTH_CENTAVOS_ENABLED PAYROLL_CALCULATION_HISTORY_ENABLED NEXT_CSP_ENABLED; do
            echo "$name=false" >> "$GITHUB_ENV"
          done
      - name: Ephemeral fictional-only encryption keys, never printed
        shell: bash
        run: |
          set -euo pipefail
          for name in PII_ENCRYPTION_KEY BANK_DATA_ENCRYPTION_KEY TOTP_ENCRYPTION_KEY; do
            key=$(openssl rand -hex 32)
            echo "::add-mask::$key"
            echo "$name=$key" >> "$GITHUB_ENV"
          done
      - name: Provision disposable PG16 app schema
        run: npm run db:push
      - name: Apply reviewed disposable baseline; no production migrations
        run: node scripts/qa/apply-isolated-baseline.mjs
      - name: Build the real application with flags off
        run: npm run build
      - name: Start localhost app (no external provider)
        shell: bash
        run: |
          set -euo pipefail
          nohup npm start -- -H 127.0.0.1 > /tmp/synthetic-579-app.log 2>&1 &
          for attempt in {1..40}; do
            if curl --silent --fail "$SECURITY_SMOKE_URL" >/dev/null; then exit 0; fi
            sleep 2
          done
          echo "::error::Disposable app did not start"
          exit 1
      - name: Execute 2x25 no-money real-app HTTP workflow, audit and financial controls
        run: env -u NODE_ENV node --import tsx scripts/qa/579-synthetic-no-money-journey.mjs
      - name: Archive only sanitized counts, aggregates and hashes, never bank file or raw register
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: synthetic-579-no-money-app-rehearsal
          path: outputs/579-synthetic-no-money-summary.json
          if-no-files-found: warn
          retention-days: 7
