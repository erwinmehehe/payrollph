name: Salary correction cases QA (fictional PostgreSQL, no money)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - '.github/workflows/salary-correction-cases-qa.yml'
      - 'src/lib/hcm-salary-correction-cases.ts'
      - 'src/lib/payroll-underpayment.ts'
      - 'src/app/api/hcm/salary-corrections/**'
      - 'src/app/api/payroll-underpayments/**'
      - 'drizzle/0135_salary_correction_cases.sql'
      - 'tests/hcm-salary-correction-cases*'
      - 'scripts/qa/salary-correction-case-tenant-proof.mjs'
      - 'scripts/qa/tenant-second-pass-http.mjs'
      - 'scripts/qa/tenant-isolation-coverage-manifest.json'

permissions:
  contents: read

concurrency:
  group: salary-correction-cases-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cases:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      TZ: Asia/Manila
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
      APP_BASE_URL: http://127.0.0.1:3000
      SECURITY_SMOKE_URL: http://127.0.0.1:3000
      DEMO_MODE: "false"
      PAYMONGO_DISBURSEMENTS_ENABLED: "false"
      XENDIT_PAYOUTS_ENABLED: "false"
      PAYROLL_UNDERPAYMENT_POSTING_ENABLED: "false"
      PAYMONGO_SECRET_KEY: ""
      XENDIT_SECRET_KEY: ""
      WORKER_TOKEN: ci-worker-token-00000000000000000000000000000000
      READINESS_TOKEN: ci-readiness-token-0000000000000000000000000000
      SETUP_TOKEN: ci-setup-token-0000000000000000000000000000000
      TOTP_ENCRYPTION_KEY: "1111111111111111111111111111111111111111111111111111111111111111"
      MALWARE_SCAN_URL: https://127.0.0.1:8443/scan
      MALWARE_SCAN_TOKEN: ci-malware-token-0000000000000000000000000000
      REQUIRE_PRIVILEGED_MFA: "true"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Guard isolated login-audit prerequisite
        run: node --test tests/hcm-salary-correction-cases-workflow.test.mjs
      - name: Ephemeral encryption key for disposable CI only
        shell: bash
        run: |
          key=$(openssl rand -hex 32)
          echo "::add-mask::$key"
          echo "PII_ENCRYPTION_KEY=$key" >> "$GITHUB_ENV"
      - run: npm run db:push
      - name: Case rules against real PostgreSQL (completeness, reconciliation, maker-checker, tenant, concurrency)
        env:
          SALARY_CORRECTION_CASES_POSTGRES_QA: "true"
        run: npx tsx --test tests/hcm-salary-correction-cases-postgres.test.ts
      - run: npm run build
      # The compliance sweep runs as part of this shared tenant harness. Its
      # successful proof upload must be inspected by a known-file TLS scanner.
      # No external scanner, agency or payment service is contacted.
      - name: Start synthetic known-file TLS scanner (disposable CI only)
        shell: bash
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/tenant-scanner-key.pem"
          crt="$RUNNER_TEMP/tenant-scanner-cert.pem"
          openssl req -x509 -nodes -newkey rsa:2048 -keyout "$key" -out "$crt" -days 1 -subj "/CN=127.0.0.1" -addext "subjectAltName=IP:127.0.0.1" >/dev/null 2>&1
          export TENANT_SCANNER_KEY="$key" TENANT_SCANNER_CERT="$crt" NODE_EXTRA_CA_CERTS="$crt"
          echo "TENANT_SCANNER_KEY=$key" >> "$GITHUB_ENV"
          echo "TENANT_SCANNER_CERT=$crt" >> "$GITHUB_ENV"
          echo "NODE_EXTRA_CA_CERTS=$crt" >> "$GITHUB_ENV"
          nohup node scripts/qa/tenant-read-sweep-scanner.mjs > /tmp/tenant-read-scanner.log 2>&1 &
          for attempt in {1..20}; do
            if curl -fsSk https://127.0.0.1:8443/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/tenant-read-scanner.log
          exit 1
      - name: Start isolated production-mode localhost server
        shell: bash
        env:
          # Required by the shared login-audit probe; this localhost server only.
          LOCAL_LOGIN_AUDIT_ENABLED: "true"
          HCM_SALARY_CORRECTION_CASES_ENABLED: "true"
          BIR_1604C_DAT_CANDIDATE_ENABLED: "true"
          PUBLIC_API_V1_EXTENDED_ENABLED: "true"
          API_V1_EXTENDED_READS_ENABLED: "true"
          EMPLOYEE_HR_CASES_ENABLED: "true"
          OWNER_PRACTICE_PAYROLL_ENABLED: "true"
          HCM_GOVERNANCE_READINESS_ENABLED: "true"
          PAYMONGO_WEBHOOK_SECRET: ci-fake-paymongo-webhook-signing-secret
          XENDIT_PAYOUT_CALLBACK_TOKEN: ci-fake-xendit-payout-callback
          XENDIT_CALLBACK_TOKEN: ci-fake-xendit-subscription-callback
          XENDIT_BUSINESS_ID: ci-fictional-merchant
          XENDIT_BILLING_ENABLED: "true"
        run: |
          set -euo pipefail
          resend_webhook_secret="whsec_$(openssl rand -base64 32 | tr -d '\n')"
          echo "::add-mask::$resend_webhook_secret"
          export RESEND_WEBHOOK_SECRET="$resend_webhook_secret"
          nohup npm start -- -H 127.0.0.1 > /tmp/salary-correction-cases-server.log 2>&1 &
          for attempt in {1..40}; do
            if curl --silent --fail "$SECURITY_SMOKE_URL" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/salary-correction-cases-server.log
          exit 1
      - name: Signed-in own-employer success and victim-employer denial over HTTP
        env:
          TENANT_SECOND_PASS_MODE: isolated-ci-only
          TENANT_641_SALARY_CORRECTION_CASE_PROOF: isolated-ci-only
        run: npx tsx scripts/qa/tenant-second-pass-http.mjs
      - name: Show isolated server log on failure
        if: failure()
        run: cat /tmp/salary-correction-cases-server.log || true
