name: Demo sandbox QA

on:
  push:
    branches:
      - feat/migration-center-competitors-sep29
    paths:
      - ".github/workflows/demo-sandbox-qa.yml"

jobs:
  sandbox:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
      DEMO_MODE: "true"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run db:push

      - name: Start app
        run: |
          npm run dev -- --hostname 127.0.0.1 > /tmp/app.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/demo >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/app.log
          exit 1

      - name: Exercise all five personas
        run: |
          set -euo pipefail

          launch_role() {
            role="$1"
            jar="/tmp/$role.cookies"
            payload="/tmp/$role-payload.json"

            printf '{"role":"%s"}' "$role" > "$payload"

            curl -fsS               -c "$jar"               -H 'Content-Type: application/json'               --data-binary "@$payload"               http://127.0.0.1:3000/api/auth/demo-switch               > "/tmp/$role.json"

            node - "$role" <<'NODE'
          const fs = require("fs");
          const role = process.argv[2];
          const payload = JSON.parse(fs.readFileSync("/tmp/" + role + ".json", "utf8"));
          if (!payload.ok || payload.user?.role !== role) {
            throw new Error("Bad " + role + " launch: " + JSON.stringify(payload));
          }
          if (payload.redirectTo !== "/?demoRole=" + role) {
            throw new Error("Bad " + role + " redirect: " + payload.redirectTo);
          }
          NODE
          }

          for role in owner hr payroll checker employee; do
            launch_role "$role"
          done

          ORG_ID="$(psql "$DATABASE_URL" -Atc "select id from organizations where name='Loom & Local' limit 1")"
          test -n "$ORG_ID"
          echo "Loom & Local organization: $ORG_ID"

          curl -fsS             -b /tmp/owner.cookies             "http://127.0.0.1:3000/api/dashboard?organizationId=$ORG_ID"             > /tmp/owner-dashboard.json

          node <<'NODE'
          const p = require("/tmp/owner-dashboard.json");
          if (p.user?.role !== "owner") throw new Error("Owner role missing");
          if (!p.employees?.length || !p.payrollRuns?.length) {
            throw new Error("Owner workspace is not populated");
          }
          NODE

          curl -fsS             -b /tmp/hr.cookies             "http://127.0.0.1:3000/api/dashboard?organizationId=$ORG_ID"             > /tmp/hr-dashboard.json

          node <<'NODE'
          const p = require("/tmp/hr-dashboard.json");
          if (p.user?.role !== "hr") throw new Error("HR role missing");
          if (!p.employees?.length || !p.leaveRequests?.length) {
            throw new Error("HR workspace is not populated");
          }
          NODE

          curl -fsS             -b /tmp/payroll.cookies             "http://127.0.0.1:3000/api/organizations/$ORG_ID/payroll-approvers"             > /tmp/checkers.json

          node <<'NODE'
          const p = require("/tmp/checkers.json");
          if (!p.approvers?.some((x) => x.role === "checker" && x.email === "checker.demo@linaw.ph")) {
            throw new Error("Payroll Officer cannot discover Checker: " + JSON.stringify(p));
          }
          NODE

          curl -fsS             -b /tmp/checker.cookies             "http://127.0.0.1:3000/api/dashboard?organizationId=$ORG_ID"             > /tmp/checker-dashboard.json

          TASK_ID="$(node <<'NODE'
          const p = require("/tmp/checker-dashboard.json");
          if (p.user?.role !== "checker") throw new Error("Checker role missing");
          const task = (p.tasks || []).find((x) => x.status === "Pending" && x.approver === "Mariel Santos");
          if (!task) throw new Error("Checker has no assigned pending task");
          process.stdout.write(String(task.id));
          NODE
          )"

          printf '{"status":"Approved"}' > /tmp/checker-decision-payload.json
          curl -fsS             -b /tmp/checker.cookies             -X PATCH             -H 'Content-Type: application/json'             --data-binary @/tmp/checker-decision-payload.json             "http://127.0.0.1:3000/api/approvals/$TASK_ID"             > /tmp/checker-decision.json

          node <<'NODE'
          const p = require("/tmp/checker-decision.json");
          if (p.status !== "Approved" || p.decidedBy !== "Mariel Santos") {
            throw new Error("Checker decision failed: " + JSON.stringify(p));
          }
          NODE

          curl -fsS             -b /tmp/employee.cookies             http://127.0.0.1:3000/api/self/payslips             > /tmp/employee.json

          node - "$ORG_ID" <<'NODE'
          const p = require("/tmp/employee.json");
          const orgId = Number(process.argv[2]);
          if (p.employee?.firstName !== "Jonas") throw new Error("Employee is not Jonas");
          if (Number(p.employer?.id) !== orgId) throw new Error("Employee organization mismatch");
          if (!p.payslips?.length) throw new Error("Employee sandbox has no released payslips");
          NODE

          printf '{"organizationId":%s,"actionType":"clock_in","location":"Demo sandbox QA"}' "$ORG_ID"             > /tmp/clock-payload.json

          code="$(curl -sS             -o /tmp/clock.json             -w '%{http_code}'             -b /tmp/employee.cookies             -H 'Content-Type: application/json'             --data-binary @/tmp/clock-payload.json             http://127.0.0.1:3000/api/web-bundy)"

          test "$code" = "200" -o "$code" = "201" -o "$code" = "409"

          node <<'NODE'
          const p = require("/tmp/clock.json");
          if (!(p.ok || /Already clocked in/.test(p.error || ""))) {
            throw new Error("Employee clock-in failed: " + JSON.stringify(p));
          }
          NODE

          echo "All five sandbox personas passed."
