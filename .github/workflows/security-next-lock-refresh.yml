name: Refresh Next.js security lockfile

on:
  push:
    branches:
      - security/next-16.3.6-2026-09-29

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/next-16.3.6-2026-09-29
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Upgrade patched Next.js release and regenerate lockfile
        run: npm install --save-exact next@16.3.6 eslint-config-next@16.3.6 --package-lock-only
      - name: Remove one-shot workflow and commit lockfile
        run: |
          rm .github/workflows/security-next-lock-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/security-next-lock-refresh.yml
          git commit -m "security: upgrade Next.js to 16.3.6"
          git push origin HEAD:security/next-16.3.6-2026-09-29
