name: "Signup #1898 findings (fictional PG16 HTTP; loopback only; no money)"

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - '.github/workflows/tenant-signup-findings-http.yml'
      - 'scripts/qa/tenant-signup-findings-http.mjs'
      - 'scripts/qa/tenant-prelogin-*.mjs'
      - 'tests/tenant-prelogin-contract.test.mjs'
      - 'src/app/api/setup/**'
      - 'src/app/api/intake-challenge/**'
      - 'src/app/api/signup/**'
      - 'src/app/api/auth/login/**'
      - 'src/app/api/auth/me/**'
      - 'src/app/api/employees/route.ts'
      - 'src/lib/auth.ts'
      - 'src/lib/access.ts'
      - 'src/lib/crypto.ts'
      - 'src/lib/tokens.ts'
      - 'src/lib/validation.ts'
      - 'src/lib/mailer.ts'
      - 'src/lib/mail-provider.ts'
      - 'src/lib/rate-limit*.ts'
      - 'src/lib/saas-launch-config.ts'
      - 'src/lib/saas-billing-schema.ts'
      - 'src/lib/public-intake-proof*.ts'
      - 'src/lib/private-pilot-invite.ts'
      - 'src/lib/security-request.ts'
      - 'src/lib/security-secret.ts'
      - 'src/lib/critical-release-flags.ts'
      - 'src/db/**'
      - 'scripts/qa/tenant-table-http.mjs'
      - 'scripts/qa/tenant-table-env.mjs'
      - 'scripts/qa/apply-isolated-baseline.mjs'

permissions:
  contents: read

concurrency:
  group: tenant-signup-findings-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  signup-finding-proof:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mode: [normal, invited]
        revision: [baseline, current]
    env:
      SIGNUP_FINDINGS_MODE: ${{ matrix.mode }}
      GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      GITHUB_HEAD_REVISION: ${{ matrix.revision }}
      FINAL_PAY_SIGNED_REVIEW_ENABLED: 'false'
      EXACT_THIRTEENTH_CENTAVOS_ENABLED: 'false'
      PAYROLL_CALCULATION_HISTORY_ENABLED: 'false'
      NEXT_CSP_ENABLED: 'false'
      TENANT_PRELOGIN_MODE: fictional-pg16-http
      PAYMONGO_DISBURSEMENTS_ENABLED: 'false'
      XENDIT_PAYOUTS_ENABLED: 'false'
      XENDIT_BILLING_ENABLED: 'false'
      WORKER_ENABLED: 'false'
      CENTRAL_SCHEDULER_ENABLED: 'false'
      PAYMONGO_SECRET_KEY: ''
      XENDIT_SECRET_KEY: ''
      RESEND_API_KEY: ''
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Run RED phase against the exact original origin/main using the same new proof
        if: matrix.revision == 'baseline'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_HEAD_SHA"
          cp scripts/qa/tenant-signup-findings-http.mjs /tmp/signup-finding-pr-proof.mjs
          git checkout --detach 50187b5067a3542155cb3d61798fbbb23a2e1dd5
          cp /tmp/signup-finding-pr-proof.mjs scripts/qa/tenant-signup-findings-http.mjs
          echo 'RED baseline: exact origin/main SHA 50187b5067a3542155cb3d61798fbbb23a2e1dd5'
      - name: Install locked dependencies
        run: npm ci
      - name: Focused signup / rate-fallback regression and source guard
        if: matrix.revision == 'current'
        run: |
          npx tsx --test tests/signup-pending-recovery.test.ts tests/registration-entry.test.ts
          npm run tenant:repin:check
      - name: Export disposable localhost targets, loopback mail address and throwaway secrets; disable all providers and workers
        shell: bash
        run: |
          set -euo pipefail
          # The shared base environment, read from the module rather than copied, so it cannot drift.
          node -e 'import("./scripts/qa/tenant-table-env.mjs").then((m) => { for (const [k, v] of Object.entries(m.TENANT_TABLE_BASE_ENV)) console.log(k + "=" + v); })' >> "$GITHUB_ENV"
          proof_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$proof_secret"
          {
            echo 'TENANT_PRELOGIN_MODE=fictional-pg16-http'
            echo 'XENDIT_BILLING_ENABLED=false'
            echo 'PAYMONGO_DISBURSEMENTS_ENABLED=false'
            echo 'XENDIT_PAYOUTS_ENABLED=false'
            echo 'WORKER_ENABLED=false'
            echo 'CENTRAL_SCHEDULER_ENABLED=false'
            echo 'PAYMONGO_SECRET_KEY='
            echo 'XENDIT_SECRET_KEY='
            echo 'RESEND_API_KEY='
            echo 'SMTP_URL=smtp://127.0.0.1:2525'
            echo 'PUBLIC_SIGNUP_MODE=pilot'
            echo 'PUBLIC_INTAKE_PROOF_ENABLED=true'
            echo "PUBLIC_INTAKE_PROOF_SECRET=$proof_secret"
            echo 'TRUSTED_PROXY_HOPS=1'
            echo 'FINAL_PAY_SIGNED_REVIEW_ENABLED=false'
            echo 'EXACT_THIRTEENTH_CENTAVOS_ENABLED=false'
            echo 'PAYROLL_CALCULATION_HISTORY_ENABLED=false'
            echo 'NEXT_CSP_ENABLED=false'
          } >> "$GITHUB_ENV"
          if [ "$SIGNUP_FINDINGS_MODE" = 'invited' ]; then
            echo 'PRIVATE_PILOT_INVITE_ENABLED=true' >> "$GITHUB_ENV"
            node -e 'const sha=v=>require("node:crypto").createHash("sha256").update(v).digest("hex"); console.log("PRIVATE_PILOT_INVITE_EMAIL_SHA256="+sha("signup-invited-recovery@example.invalid")); console.log("PRIVATE_PILOT_INVITE_CODE_SHA256="+sha("fictional-loopback-invite-for-signup-findings-2026-only"))' >> "$GITHUB_ENV"
            echo 'PRIVATE_PILOT_INVITE_EXPIRES_AT=2099-01-01T00:00:00.000Z' >> "$GITHUB_ENV"
          else
            echo 'PRIVATE_PILOT_INVITE_ENABLED=false' >> "$GITHUB_ENV"
          fi
      - name: Fail closed on incorrect proof contracts and synthetic targets
        run: |
          node --check scripts/qa/tenant-prelogin-smtp-sink.mjs
          node --check scripts/qa/tenant-prelogin-contract.mjs
          node --check scripts/qa/tenant-signup-findings-http.mjs
          node --test tests/tenant-prelogin-contract.test.mjs
      - name: Generate throwaway encryption keys and webhook secret
        shell: bash
        run: |
          set -euo pipefail
          for name in PII_ENCRYPTION_KEY BANK_DATA_ENCRYPTION_KEY; do
            key=$(openssl rand -hex 32)
            echo "::add-mask::$key"
            echo "$name=$key" >> "$GITHUB_ENV"
          done
          secret="whsec_$(openssl rand -base64 32 | tr -d '\n')"
          echo "::add-mask::$secret"
          echo "RESEND_WEBHOOK_SECRET=$secret" >> "$GITHUB_ENV"
      - name: Initialize disposable PostgreSQL 16
        run: npm run db:push
      - name: Apply only reviewed fictional baseline objects
        run: node scripts/qa/apply-isolated-baseline.mjs
      - name: Build production-mode app against the disposable database
        run: npm run build
      - name: Start production-mode Next on localhost only
        shell: bash
        run: |
          set -euo pipefail
          nohup npm start -- -H 127.0.0.1 > /tmp/tenant-signup-next.log 2>&1 &
          server=$!
          for attempt in $(seq 1 60); do
            if curl --silent --fail "$SECURITY_SMOKE_URL/login" > /dev/null; then
              exit 0
            fi
            if ! kill -0 "$server" 2>/dev/null; then
              cat /tmp/tenant-prelogin-next.log
              exit 1
            fi
            sleep 2
          done
          cat /tmp/tenant-prelogin-next.log
          exit 1
      - name: Prove RED on main and GREEN on this pull request against localhost PG16
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_HEAD_REVISION" = 'baseline' ]; then
            if node --import tsx scripts/qa/tenant-signup-findings-http.mjs; then
              echo 'ERROR: pre-fix main unexpectedly passed both #1898 findings'
              exit 1
            else
              echo 'EXPECTED RED: main failed the synthetic #1898 findings assertions'
            fi
          else
            node --import tsx scripts/qa/tenant-signup-findings-http.mjs
            echo 'GREEN: current PR head passed the synthetic #1898 findings assertions'
          fi
      - name: Show localhost-only diagnostic log on failure
        if: failure()
        run: |
          cat /tmp/tenant-prelogin-next.log || true
