          for (const name of ['FINAL_PAY_SIGNED_REVIEW_ENABLED','EXACT_THIRTEENTH_CENTAVOS_ENABLED',
            'PAYROLL_CALCULATION_HISTORY_ENABLED','NEXT_CSP_ENABLED','PAYMONGO_DISBURSEMENTS_ENABLED',
            'XENDIT_PAYOUTS_ENABLED','XENDIT_BILLING_ENABLED','WORKER_ENABLED','CENTRAL_SCHEDULER_ENABLED']) env[name]='false';
          for (const name of ['PAYMONGO_SECRET_KEY','XENDIT_SECRET_KEY','XENDIT_PAYOUT_SECRET_KEY',
            'RESEND_API_KEY','POSTMARK_SERVER_TOKEN','STRIPE_SECRET_KEY']) env[name]='';
          for (const name of ['PUBLIC_INTAKE_PROOF_SECRET','PII_ENCRYPTION_KEY','BANK_DATA_ENCRYPTION_KEY',
