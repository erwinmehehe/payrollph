          if-no-files-found: ignore
          retention-days: 7

  source-guards:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Run tenant guards without a production database or provider
        shell: bash
        run: |
          set +e
          node --test --test-concurrency=1 tests/tenant-*.test.mjs > /tmp/signup-tenant-guards.tap 2>&1
          result=$?
          set -e
          grep -E '^not ok|^# (tests|pass|fail|skipped|duration_ms)' /tmp/signup-tenant-guards.tap || true
          exit "$result"
      - name: Run the repository repin tool and check (no category changes)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node scripts/qa/tenant-manifest-repin.mjs --base efd875a246bb38345ef805ea64363472af72414f --write
          node scripts/qa/tenant-manifest-repin.mjs --base efd875a246bb38345ef805ea64363472af72414f
          git diff --stat
