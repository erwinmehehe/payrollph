name: Wage-order transitive importer source inventory (NO CREDITS)
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/lib/wage-orders.ts'
      - 'src/lib/statutory-rule-watch.ts'
      - 'scripts/qa/tenant-isolation-coverage-manifest.json'
      - 'scripts/qa/wage-registry-source-hold.mjs'
      - 'tests/wage-order-transitive-import-inventory.test.mjs'
      - 'tests/wage-registry-transitive-source-hold.test.mjs'
      - '.github/workflows/wage-order-transitive-inventory.yml'
permissions:
  contents: read
concurrency:
  group: wage-order-imports-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  source-only-import-closure:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Confirm exact PR branch head
        env:
          EXACT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXACT_HEAD_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Source-only closure and immutable zero-credit holds
        run: node --test tests/wage-order-transitive-import-inventory.test.mjs tests/wage-registry-transitive-source-hold.test.mjs
