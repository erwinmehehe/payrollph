name: Private receipt tenant boundary (fictional HTTPS and PG16)
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/tenant-receipt-boundary-http.yml'
      - 'scripts/qa/receipt-http-*.mjs'
      - 'scripts/qa/tenant-receipt-boundary-http.mjs'
      - 'tests/tenant-receipt-boundary-http.test.mjs'
      - 'src/app/api/expenses/receipts/**'
      - 'src/lib/spend-*.ts'
      - 'src/lib/document-object-storage.ts'
      - 'src/lib/storage.ts'
      - 'src/lib/access.ts'
      - 'src/lib/auth.ts'
      - 'src/lib/security-request.ts'
      - 'src/db/**'
      - 'drizzle/**'
      - 'next.config.ts'
      - 'package*.json'
permissions:
  contents: read
concurrency:
  group: receipt-boundary-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  receipt-http:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres -d app_db" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Provision disposable targets and fixture-only switches
        shell: bash
        run: |
          set -euo pipefail
          node scripts/qa/tenant-table-env.mjs default >> "$GITHUB_ENV"
          cat >> "$GITHUB_ENV" <<'ENV'
          RECEIPT_HTTP_PROOF_MODE=fictional-ci-only
          DOCUMENT_OBJECT_STORAGE_ENDPOINT=https://127.0.0.1:9443/
          DOCUMENT_OBJECT_STORAGE_BUCKET=fictional-receipts
          DOCUMENT_OBJECT_STORAGE_REGION=us-east-1
          DOCUMENT_OBJECT_STORAGE_ACCESS_KEY_ID=fictional-receipt-key
          DOCUMENT_OBJECT_STORAGE_SECRET_ACCESS_KEY=fictional-receipt-secret
          MALWARE_SCAN_URL=https://127.0.0.1:9443/scan
          MALWARE_SCAN_TOKEN=fictional-receipt-scanner
          SPEND_PAYROLL_REIMBURSEMENTS_ENABLED=true
          EMPLOYEE_DOCUMENT_VAULT_ENABLED=true
          DOCUMENT_UPLOADS_ENABLED=true
          MULTI_ENTITY_ENABLED=false
          WORKER_ENABLED=false
          CENTRAL_SCHEDULER_ENABLED=false
          XENDIT_BILLING_ENABLED=false
          XENDIT_PAYOUTS_ENABLED=false
          PAYMONGO_DISBURSEMENTS_ENABLED=false
          ENV
          for name in PII_ENCRYPTION_KEY BANK_DATA_ENCRYPTION_KEY; do
            value=$(openssl rand -hex 32)
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj '/CN=Fictional receipt fixture' \
            -addext 'subjectAltName=IP:127.0.0.1' -keyout "$RUNNER_TEMP/receipt.key" -out "$RUNNER_TEMP/receipt.crt"
          echo "NODE_EXTRA_CA_CERTS=$RUNNER_TEMP/receipt.crt" >> "$GITHUB_ENV"
          echo "RECEIPT_TLS_KEY=$RUNNER_TEMP/receipt.key" >> "$GITHUB_ENV"
      - name: Check disposable-only contract
        run: node --test tests/tenant-receipt-boundary-http.test.mjs
      - run: npm run db:push
      - run: node scripts/qa/apply-isolated-baseline.mjs
      - run: npm run build
      - name: Start verified HTTPS fixture and production Next on localhost
        shell: bash
        run: |
          set -euo pipefail
          nohup node scripts/qa/receipt-http-emulator.mjs > /tmp/receipt-emulator.log 2>&1 &
          nohup npm start -- -H 127.0.0.1 > /tmp/receipt-next.log 2>&1 &
          for i in $(seq 1 90); do
            if curl --silent --fail http://127.0.0.1:3000/login > /dev/null && \
              curl --silent --fail --cacert "$NODE_EXTRA_CA_CERTS" -H 'Authorization: Bearer fictional-receipt-scanner' https://127.0.0.1:9443/control > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/receipt-emulator.log /tmp/receipt-next.log
          exit 1
      - name: Real own uploads and downloads, two attackers, victim denial and remote-read races
        run: node --import tsx scripts/qa/tenant-receipt-boundary-http.mjs
      - name: Local diagnostics on failure
        if: failure()
        run: cat /tmp/receipt-emulator.log /tmp/receipt-next.log || true
