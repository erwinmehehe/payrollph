name: Golden Phase 4 refund and collection PDF rendering (fictional)

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/golden-phase4-refund-pdf.yml"
      - "tests/golden-phase4-refund-pdf.test.ts"
      - "src/lib/payslip-pdf.ts"
      - "src/lib/payslip-line-buckets.ts"
      - "src/app/api/self/payslips/[id]/route.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fictional-pdf:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NEON_DATABASE_URL: ""
      PAYMONGO_SECRET_KEY: ""
      XENDIT_SECRET_KEY: ""
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact PR head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Execute actual Phase 4 refund and collection PDF rendering tests
        run: node --import tsx --test tests/golden-phase4-refund-pdf.test.ts
      - name: Retain fictional PDFs for visual inspection
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: golden-phase4-rendered-refund-collection-pdfs
          path: qa-artifacts/golden-phase4-*-payslip.pdf
          if-no-files-found: warn
          retention-days: 14
