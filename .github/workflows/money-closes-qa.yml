name: Final-pay and 13th-month money closes (Synthetic Only)
on:
  pull_request:
    paths:
      - 'src/lib/final-pay*'
      - 'src/lib/payroll-engine.ts'
      - 'src/lib/payroll-money.ts'
      - 'src/lib/payroll-mandatory-shortfall.ts'
      - 'src/lib/payroll-assurance*.ts'
      - 'src/lib/payroll-retro-statutory-source-period.ts'
      - 'src/lib/payroll-m10-*.ts'
      - 'src/lib/payroll-rules.ts'
      - 'src/lib/ph-statutory-rule-packs.ts'
      - 'src/lib/pay-basis.ts'
      - 'src/lib/payroll-release-checklist.ts'
      - 'src/lib/payroll-release-segregation.ts'
      - 'tests/final-pay-shortfall-evidence.test.ts'
      - 'tests/payroll-mandatory-shortfall*.test.ts'
      - 'tests/payroll-assurance.test.ts'
      - 'tests/payroll-retro-statutory-source-period.test.ts'
      - 'tests/payroll-m10-*.test.ts'
      - 'tests/payroll-release-checklist.test.ts'
      - 'tests/payroll-release-segregation.test.ts'
      - 'src/lib/thirteenth-month-centavos.ts'
      - 'src/lib/ph-compliance.ts'
      - 'src/lib/year-end.ts'
      - 'src/components/final-pay-signed-review.tsx'
      - 'src/components/separation-panel.tsx'
      - 'src/app/api/separation/**'
      - 'tests/money-closes*'
      - 'tests/prior-evidence-migration-rehearsal.test.ts'
      - 'scripts/qa/money-closes-component-browser.mjs'
      - '.github/workflows/money-closes-qa.yml'
permissions:
  contents: read
concurrency:
  group: money-closes-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  flag-on-money:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: Asia/Manila
      CI: 'true'
      MONEY_CLOSES_POSTGRES_QA: 'true'
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Provision masked ephemeral CI encryption keys
        run: |
          for name in PII_ENCRYPTION_KEY BANK_DATA_ENCRYPTION_KEY; do
            value=$(openssl rand -hex 32)
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
      - run: npm run db:push
      - name: Apply the cutover baseline objects (0109 audit chain + reviewed supplement); request code only verifies schema
        run: node scripts/qa/apply-isolated-baseline.mjs
      - name: Execute real migration rollback, rounding and financial-source behavior
        run: |
          npx tsx --test \
            tests/prior-evidence-migration-rehearsal.test.ts \
            tests/money-closes.test.ts \
            tests/a3-money-path-centavos.test.ts \
            tests/hcm-final-pay-source-transaction.test.ts \
            tests/final-pay-shortfall-evidence.test.ts \
            tests/payroll-mandatory-shortfall.test.ts \
            tests/payroll-mandatory-shortfall-integration.test.ts \
            tests/payroll-assurance.test.ts \
            tests/payroll-retro-statutory-source-period.test.ts \
            tests/payroll-m10-readonly-review.test.ts \
            tests/payroll-m10-centavo-evidence.test.ts \
            tests/payroll-release-checklist.test.ts \
            tests/payroll-release-segregation.test.ts
      - name: Golden payroll with both new flags ON (normal CI proves OFF)
        env:
          EXACT_THIRTEENTH_CENTAVOS_ENABLED: 'true'
          FINAL_PAY_SIGNED_REVIEW_ENABLED: 'true'
        run: |
          npm run payroll:golden
          npm run payroll:golden:phase2a
          npm run payroll:golden:phase2b
          npm run payroll:golden:pay-rules
      - run: npm install --no-save --package-lock=false playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Desktop and 390px signed review, unknown evidence and flag-OFF rendering
        run: node --import tsx scripts/qa/money-closes-component-browser.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: money-closes-synthetic-evidence
          path: qa-artifacts
          retention-days: 14
