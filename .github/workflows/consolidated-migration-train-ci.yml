name: P0-4 Proposed 0115-0123 Integrated Dependency Train (Disposable PostgreSQL)

on:
  pull_request:
    paths:
      - "drizzle/0115_*.sql"
      - "drizzle/0116_*.sql"
      - "drizzle/0117_*.sql"
      - "drizzle/0118_*.sql"
      - "drizzle/0119_*.sql"
      - "drizzle/0120_*.sql"
      - "drizzle/0121_*.sql"
      - "drizzle/0122_*.sql"
      - "drizzle/0123_*.sql"
      - "drizzle/0124_*.sql"
      - "drizzle/0125_*.sql"
      - "drizzle/0126_*.sql"
      - "docs/engineering/migration-proposals/employee-entity-interval-guard.sql"
      - "tests/pending-migration-release-train.test.mjs"
      - "tests/pending-train-preflight.test.mjs"
      - "scripts/lib/pending-train-preflight.mjs"
      - "docs/engineering/0115-0121-neon-preflight.md"
      - "tests/consolidated-migration-dependency-postgres.test.mjs"
      - "tests/complete-pending-train-postgres.test.mjs"
      - "tests/issue-1061-integrated-forward-train-postgres.test.mjs"
      - "drizzle/0128_recovery_foreign_key_names_forward.sql"
      - "drizzle/0129_*.sql"
      - "scripts/lib/issue-1031-schema-manifest.ts"
      - "src/lib/issue-1031-full-schema-diff.ts"
      - "tests/issue-1031-full-schema-diff.test.ts"
      - "tests/issue-1031-manifest-identifiers.test.ts"
      - "docs/engineering/issue-1061-integrated-forward-train-qa.md"
      - "docs/engineering/pending-migration-release-train.md"
      - ".github/workflows/consolidated-migration-train-ci.yml"
  push:
    branches: [main]
    paths:
      - "drizzle/0115_*.sql"
      - "drizzle/0116_*.sql"
      - "drizzle/0117_*.sql"
      - "drizzle/0118_*.sql"
      - "drizzle/0119_*.sql"
      - "drizzle/0120_*.sql"
      - "drizzle/0121_*.sql"
      - "drizzle/0122_*.sql"
      - "drizzle/0123_*.sql"
      - "drizzle/0124_*.sql"
      - "drizzle/0125_*.sql"
      - "drizzle/0126_*.sql"
      - "tests/pending-migration-release-train.test.mjs"
      - "tests/pending-train-preflight.test.mjs"
      - "scripts/lib/pending-train-preflight.mjs"
      - "docs/engineering/0115-0121-neon-preflight.md"
      - "tests/consolidated-migration-dependency-postgres.test.mjs"
      - "tests/complete-pending-train-postgres.test.mjs"
      - "tests/issue-1061-integrated-forward-train-postgres.test.mjs"
      - "drizzle/0128_recovery_foreign_key_names_forward.sql"
      - "drizzle/0129_*.sql"
      - "scripts/lib/issue-1031-schema-manifest.ts"
      - "src/lib/issue-1031-full-schema-diff.ts"
      - "tests/issue-1031-full-schema-diff.test.ts"
      - "tests/issue-1031-manifest-identifiers.test.ts"
      - "docs/engineering/issue-1061-integrated-forward-train-qa.md"
      - ".github/workflows/consolidated-migration-train-ci.yml"

# Supersede only older PR attempts; main/manual runs retain independent groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  synthetic-train:
    name: Synthetic dependency train and SQL constraint checks (PG${{ matrix.postgres }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["16", "18"]
    timeout-minutes: 15
    env:
      CI: "true"
      GITHUB_ACTIONS: "true"
      PAYOUT_TRAIN_REHEARSAL: isolated-localhost-pg-only
      PAYOUT_REHEARSAL_PG_MAJOR: "${{ matrix.postgres }}"
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout source (no persisted credentials)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Syntax and source lineage tests
        run: |
          node --check tests/pending-migration-release-train.test.mjs
          node --check tests/pending-train-preflight.test.mjs
          node --check scripts/lib/pending-train-preflight.mjs
          node --check tests/consolidated-migration-dependency-postgres.test.mjs
          node --test tests/pending-migration-release-train.test.mjs tests/pending-train-preflight.test.mjs
      - name: Apply exact source SQL on disposable PostgreSQL; verify guards and rollback
        run: node --test tests/consolidated-migration-dependency-postgres.test.mjs

  full-train-rollback:
    name: Entire proposed 0115-0123 source train (disposable PG${{ matrix.postgres }} rollback)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["16", "18"]
    timeout-minutes: 15
    env:
      CI: "true"
      GITHUB_ACTIONS: "true"
      PENDING_TRAIN_REHEARSAL_MODE: isolated-ci-only
      PAYMONGO_DISBURSEMENTS_ENABLED: "false"
      XENDIT_PAYOUTS_ENABLED: "false"
      MULTI_ENTITY_ENABLED: "false"
      MULTI_ENTITY_TRANSFERS_ENABLED: "false"
      WFM_PUNCH_EVIDENCE_ENABLED: "false"
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out exact PR source without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Initialize ONLY disposable Postgres 16/18 fixture from Drizzle
        run: npm run db:push
      - name: Source syntax and full migration train rollback, no external DB
        run: |
          set -euo pipefail
          node --check tests/complete-pending-train-postgres.test.mjs
          node --test tests/complete-pending-train-postgres.test.mjs
          node --import tsx --test tests/issue-1031-full-schema-diff.test.ts tests/issue-1031-manifest-identifiers.test.ts
          node --check tests/issue-1061-integrated-forward-train-postgres.test.mjs
          node --import tsx --test tests/issue-1061-integrated-forward-train-postgres.test.mjs
