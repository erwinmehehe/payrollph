name: Requested migration POST tenant proof (fictional PG16)
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - '.github/workflows/tenant-requested-migrations-http.yml'
      - 'scripts/qa/tenant-requested-migrations-http.mjs'
      - 'scripts/qa/migration-method-proof.mjs'
      - 'tests/tenant-requested-migrations-contract.test.mjs'
      - 'src/app/api/migrations/**'
      - 'src/lib/migration-*.ts'
      - 'src/lib/hcm-migration-safety.ts'
      - 'src/lib/access.ts'
      - 'src/lib/auth.ts'
      - 'src/db/**'
permissions:
  contents: read
concurrency:
  group: requested-migrations-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  migration-post:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Configure disposable localhost fixture
        run: node scripts/qa/tenant-table-env.mjs default >> "$GITHUB_ENV"
      - name: Validate real CSV parser and proof discrimination contracts
        run: node --import tsx --test tests/tenant-requested-migrations-contract.test.mjs
      - name: Generate disposable encryption keys
        shell: bash
        run: |
          set -euo pipefail
          for name in PII_ENCRYPTION_KEY BANK_DATA_ENCRYPTION_KEY; do
            key=$(openssl rand -hex 32)
            echo "::add-mask::$key"
            echo "$name=$key" >> "$GITHUB_ENV"
          done
      - name: Create disposable PG16 schema
        run: npm run db:push
      - name: Apply reviewed isolated baseline
        run: node scripts/qa/apply-isolated-baseline.mjs
      - name: Build exact-head production-mode localhost app
        run: npm run build
      - name: Execute eight own commits, real foreign/forged denials and immutable victim SQL
        run: node --import tsx scripts/qa/tenant-requested-migrations-http.mjs
