name: PR Change Risk (Advisory)

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]

# Supersede only older PR attempts; main/manual runs retain independent groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Unit-test risk rules
        run: node --test tests/pr-risk-classification.test.mjs
      - name: Unit-test PR queue rules
        run: node --test tests/pr-queue-policy.test.mjs
      - name: Classify changed files against current main merge-base
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/classify-pr-risk.mjs
