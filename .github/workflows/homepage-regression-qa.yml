name: Homepage regression visual QA

on:
  push:
    branches:
      - fix/homepage-layout-regressions

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
      DEMO_MODE: "false"
      APP_BASE_URL: http://127.0.0.1:3000
      PG_POOL_MAX: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Apply baseline schema
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const { Client } = require("pg");
          (async () => {
            const client = new Client({ connectionString: process.env.DATABASE_URL });
            await client.connect();
            await client.query(fs.readFileSync("drizzle/baseline.sql", "utf8"));
            await client.end();
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
      - name: Seed repo-owned data
        env:
          DEMO_MODE: "true"
        run: npx tsx -e 'import("./src/db/seed").then(async (m) => { await m.ensureSeedData(); process.exit(0); }).catch((e) => { console.error(e); process.exit(1); })'
      - run: npx tsc --noEmit
      - run: npx eslint src tests
      - run: npx tsx --test tests/marketing.test.ts
      - run: npm run build
      - name: Start server
        run: |
          npm start > /tmp/linaw-next.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/linaw-next.log
          exit 1
      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Visual regression checks
        run: |
          mkdir -p regression-artifacts
          node <<'NODE'
          const { chromium } = require("playwright");
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1450, height: 900 } });
            await page.goto("http://127.0.0.1:3000/", { waitUntil: "networkidle" });

            await page.addStyleTag({content: `
              @supports (animation-timeline: view()) {
                .software-home * { animation: none !important; opacity: 1 !important; transform: none !important; }
              }
              .software-home .site-nav { position: static !important; }
            `});

            const bodyWidth = await page.evaluate(() => Math.max(document.body.scrollWidth, document.documentElement.scrollWidth));
            if (bodyWidth > 1452) throw new Error(`Desktop overflow: ${bodyWidth}`);

            const heroFrame = await page.locator(".home-hero-visual .frame").boundingBox();
            const heroBody = await page.locator(".home-hero-visual .pv-body").boundingBox();
            if (!heroFrame || !heroBody || heroBody.height < 420) {
              throw new Error(`Hero preview too cropped: frame=${JSON.stringify(heroFrame)} body=${JSON.stringify(heroBody)}`);
            }

            const payroll = page.locator("#payroll");
            const payrollEditorial = await payroll.locator(".payroll-editorial").boundingBox();
            const payrollLab = await payroll.locator(".payroll-lab-surface").boundingBox();
            if (!payrollEditorial || !payrollLab || payrollEditorial.width < 360 || payrollLab.width < 570) {
              throw new Error(`Payroll proportions regressed: editorial=${JSON.stringify(payrollEditorial)} lab=${JSON.stringify(payrollLab)}`);
            }

            const workspace = page.locator("#workspace");
            const cards = workspace.locator(".bento > .feature-card");
            const bentoBox = await workspace.locator(".bento").boundingBox();
            const fifth = await cards.nth(4).boundingBox();
            const sixth = await cards.nth(5).boundingBox();
            if (!bentoBox || !fifth || !sixth) throw new Error("Workspace cards missing");
            if (fifth.width < bentoBox.width * .43 || sixth.width < bentoBox.width * .43) {
              throw new Error(`Final workspace cards too narrow: bento=${bentoBox.width}, fifth=${fifth.width}, sixth=${sixth.width}`);
            }

            await page.locator(".home-hero").screenshot({ path: "regression-artifacts/hero.png" });
            await payroll.screenshot({ path: "regression-artifacts/payroll.png" });
            await workspace.screenshot({ path: "regression-artifacts/workspace.png" });

            const mobile = await browser.newPage({ viewport: { width: 390, height: 844 } });
            await mobile.goto("http://127.0.0.1:3000/", { waitUntil: "networkidle" });
            const mobileWidth = await mobile.evaluate(() => Math.max(document.body.scrollWidth, document.documentElement.scrollWidth));
            if (mobileWidth > 392) throw new Error(`Mobile overflow: ${mobileWidth}`);
            await mobile.locator("#workspace").screenshot({ path: "regression-artifacts/workspace-mobile.png" });

            console.log(JSON.stringify({heroFrame,heroBody,payrollEditorial,payrollLab,bentoWidth:bentoBox.width,fifthWidth:fifth.width,sixthWidth:sixth.width,bodyWidth,mobileWidth}, null, 2));
            await browser.close();
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homepage-regression-visuals
          path: regression-artifacts/
          retention-days: 1
