name: Tenant write discovery (no coverage credits)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tenant-write-discovery.yml'
      - 'scripts/qa/tenant-write-*.mjs'
      - 'tests/tenant-write-discovery.test.mjs'
      - 'src/db/schema.ts'
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: tenant-write-discovery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/tenant-write-discovery.test.mjs
      - name: Offline proposals, no database or HTTP requests
        run: node --import tsx scripts/qa/tenant-write-discovery.mjs --plan
      - uses: actions/upload-artifact@v7
        with:
          name: tenant-write-offline-plan
          path: outputs/tenant-write-discovery/plan.json
          retention-days: 7
  probe:
    # User requested execution after #1382 lands. Never execute PR-supplied writes.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Confirm the prerequisite actually merged into main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          const response = await fetch('https://api.github.com/repos/' + process.env.GITHUB_REPOSITORY + '/pulls/1382', {
            headers: { authorization: 'Bearer ' + process.env.GH_TOKEN, accept: 'application/vnd.github+json' }
          });
          if (!response.ok) throw new Error('Cannot verify #1382 prerequisite');
          const pr = await response.json();
          if (!pr.merged || pr.base.ref !== 'main' || !/^[a-f0-9]{40}$/.test(pr.merge_commit_sha)) throw new Error('#1382 must merge into main first');
          execFileSync('git', ['merge-base', '--is-ancestor', pr.merge_commit_sha, 'HEAD']);
          NODE
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Export fictional localhost configuration
        run: |
          node scripts/qa/tenant-table-env.mjs default >> "$GITHUB_ENV"
          echo 'TENANT_WRITE_PROBE_MODE=fictional-disposable-only' >> "$GITHUB_ENV"
          echo 'WORKER_ENABLED=false' >> "$GITHUB_ENV"
          echo 'CENTRAL_SCHEDULER_ENABLED=false' >> "$GITHUB_ENV"
          echo 'MALWARE_SCAN_URL=' >> "$GITHUB_ENV"
          echo 'FINAL_PAY_MANUAL_RELEASE_ENABLED=false' >> "$GITHUB_ENV"
          for name in PII_ENCRYPTION_KEY BANK_DATA_ENCRYPTION_KEY; do
            value=$(openssl rand -hex 32)
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
      - run: npm run db:push
      - run: node scripts/qa/apply-isolated-baseline.mjs
      - run: npm run build
      - name: Start the single isolated server
        run: |
          nohup npm start -- -H 127.0.0.1 > /tmp/tenant-write-probe.log 2>&1 &
          for attempt in {1..60}; do
            if curl --silent --fail "$SECURITY_SMOKE_URL/api/health" >/dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Triage remaining writes without changing the coverage inventory
        run: node --import tsx scripts/qa/tenant-write-discovery.mjs --probe
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tenant-write-probe-results
          path: outputs/tenant-write-discovery/*.json
          if-no-files-found: ignore
          retention-days: 7
