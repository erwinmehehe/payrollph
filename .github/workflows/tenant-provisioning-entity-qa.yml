name: Tenant provisioning legal employer (fictional PG16 HTTP)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - "src/app/api/provisioning/route.ts"
      - "src/lib/provisioning.ts"
      - "scripts/qa/tenant-provisioning-entity-http.mjs"
      - "tests/tenant-provisioning-entity-boundary.test.mjs"
      - ".github/workflows/tenant-provisioning-entity-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tenant-provisioning-entity-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  provisioning-entity:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: "true"
      TZ: Asia/Manila
      NEXT_TELEMETRY_DISABLED: "1"
      TENANT_SECOND_PASS_MODE: isolated-ci-only
      TENANT_PROVISIONING_ENTITY_PROOF: fictional-pg16-only
      BUILD_BLOCK_ACCEPTANCE_MODE: synthetic-postgres-only
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
      SECURITY_SMOKE_URL: http://127.0.0.1:3000
      APP_BASE_URL: http://127.0.0.1:3000
      TRUSTED_APP_ORIGINS: http://127.0.0.1:3000
      MULTI_ENTITY_ENABLED: "true"
      REQUIRE_PRIVILEGED_MFA: "true"
      DEMO_MODE: "false"
      WORKER_ENABLED: "false"
      CENTRAL_SCHEDULER_ENABLED: "false"
      XENDIT_BILLING_ENABLED: "false"
      XENDIT_PAYOUTS_ENABLED: "false"
      PAYMONGO_DISBURSEMENTS_ENABLED: "false"
      OPENAI_API_KEY: ""
      CRON_SECRET: ""
      WORKER_TOKEN: ""
      NEXT_CSP_ENABLED: "false"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check exact PR-head checkout before building
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Negative fixture-contract tests without a database
        run: |
          node --check scripts/qa/tenant-provisioning-entity-http.mjs
          node --test tests/tenant-provisioning-entity-boundary.test.mjs
          node --import tsx --test tests/provisioning-employer-scope.test.ts
      - name: Fiction-only ephemeral encryption keys
        shell: bash
        run: |
          for key in BANK_DATA_ENCRYPTION_KEY PII_ENCRYPTION_KEY TOTP_ENCRYPTION_KEY; do
            value=$(openssl rand -hex 32)
            echo "::add-mask::$value"
            echo "$key=$value" >> "$GITHUB_ENV"
          done
      - name: Create disposable PostgreSQL 16 schema
        run: npm run db:push
      - name: Install reviewed synthetic baseline
        run: node scripts/qa/apply-isolated-baseline.mjs
      - name: Build production-mode Next on empty isolated database
        run: npm run build
      - name: Start loopback-only production-mode Next server
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/tenant-provisioning-entity.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:3000/login >/dev/null; then exit 0; fi
            sleep 2
          done
          tail -n 90 /tmp/tenant-provisioning-entity.log
          exit 1
      - name: Two legal employers, independent victim and unchanged SQL over localhost HTTP
        env:
          NODE_ENV: production
        run: node --import tsx scripts/qa/tenant-provisioning-entity-http.mjs
      - name: Show bounded localhost log on failed checks
        if: failure()
        run: tail -n 90 /tmp/tenant-provisioning-entity.log || true
