name: Homepage mockup verification

on:
  push:
    branches:
      - design/mockup-faithful-homepage

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
      DEMO_MODE: "false"
      APP_BASE_URL: http://127.0.0.1:3000
      PG_POOL_MAX: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Apply baseline schema
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const { Client } = require("pg");
          (async () => {
            const client = new Client({ connectionString: process.env.DATABASE_URL });
            await client.connect();
            await client.query(fs.readFileSync("drizzle/baseline.sql", "utf8"));
            const count = await client.query(
              "select count(*)::int as count from information_schema.tables where table_schema = 'public' and table_type = 'BASE TABLE'"
            );
            console.log("Baseline tables:", count.rows[0].count);
            if (count.rows[0].count !== 55) throw new Error("Unexpected baseline table count");
            await client.end();
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
      - run: npx tsc --noEmit
      - run: npx eslint src tests
      - run: npx tsx --test tests/marketing.test.ts
      - run: npm run build
      - name: Start production server
        run: |
          npm start > /tmp/linaw-next.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/linaw-next.log
          exit 1
      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Browser verification and screenshots
        run: |
          mkdir -p homepage-artifacts
          node <<'NODE'
          const { chromium } = require("playwright");

          async function assertNoPageOverflow(page, width) {
            const dims = await page.evaluate(() => ({
              body: document.body.scrollWidth,
              html: document.documentElement.scrollWidth,
              viewport: window.innerWidth,
            }));
            if (Math.max(dims.body, dims.html) > dims.viewport + 2) {
              throw new Error(`Page overflow at ${width}px: ${JSON.stringify(dims)}`);
            }
            return dims;
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const desktop = await browser.newPage({ viewport: { width: 1440, height: 1000 }, deviceScaleFactor: 1 });

            await desktop.goto("http://127.0.0.1:3000/", { waitUntil: "networkidle" });
            if (!(await desktop.getByRole("heading", { name: /Philippine payroll software without the guesswork/i }).isVisible())) {
              throw new Error("Homepage H1 is not visible");
            }
            const desktopDims = await assertNoPageOverflow(desktop, 1440);

            const preview = desktop.locator("#preview");
            await preview.getByRole("button", { name: "Payroll", exact: true }).click();
            if (!(await preview.getByText("Register", { exact: true }).isVisible())) {
              throw new Error("WorkspacePreview did not switch to Payroll");
            }

            const firstPayslip = preview.locator(".register-row").first();
            await firstPayslip.click();
            if (!(await preview.locator(".payslip-panel").first().isVisible())) {
              throw new Error("Payslip did not open");
            }

            const release = preview.getByRole("button", { name: /Release \(simulated\)/ });
            if (!(await release.isDisabled())) {
              throw new Error("Release should be disabled before acknowledging exceptions");
            }
            await preview.getByText(/Acknowledge \d+ exception/, { exact: true }).click();
            if (await release.isDisabled()) {
              throw new Error("Release stayed disabled after acknowledgement");
            }
            await release.click();
            if (!(await preview.getByText("Released in this simulation").isVisible())) {
              throw new Error("Simulated release failed");
            }

            await preview.getByRole("button", { name: "Dashboard", exact: true }).first().click();
            const switcher = preview.locator(".company-switcher");
            await switcher.click();
            const clientOptions = preview.locator(".company-popover button");
            if (await clientOptions.count() < 2) throw new Error("Client switcher has fewer than two options");
            await clientOptions.nth(1).click();
            if (!(await preview.getByText(/is not part of this simulation/).isVisible())) {
              throw new Error("Client switching did not rescope the simulated workspace");
            }
            await preview.getByRole("button", { name: /Back to Masigla Foods/i }).click();

            const payroll = desktop.locator("#payroll");
            const salary = payroll.locator("#lab-salary");
            const salaryOutput = payroll.locator('output[for="lab-salary"]');
            const initialSalary = await salaryOutput.textContent();
            if (!initialSalary || !initialSalary.includes("38,500")) {
              throw new Error(`Unexpected StatutoryLab initial salary: ${initialSalary}`);
            }
            const netBefore = await payroll.getByText("Net take-home", { exact: true }).locator("..").locator("strong").textContent();
            await salary.fill("50000");
            const changedSalary = await salaryOutput.textContent();
            const netAfter = await payroll.getByText("Net take-home", { exact: true }).locator("..").locator("strong").textContent();
            if (!changedSalary || !changedSalary.includes("50,000") || netBefore === netAfter) {
              throw new Error(`Statutory slider failed: salary=${changedSalary}, netBefore=${netBefore}, netAfter=${netAfter}`);
            }
            const withholdingBefore = await payroll.getByText("Withholding tax", { exact: true }).locator("..").locator("strong").textContent();
            await payroll.getByText("Treat as a minimum-wage earner (MWE)", { exact: true }).click();
            if (!(await payroll.getByText("MWE, fully exempt").isVisible())) {
              throw new Error("MWE state did not update");
            }
            const withholdingAfter = await payroll.getByText("Withholding tax", { exact: true }).locator("..").locator("strong").textContent();
            if (withholdingBefore === withholdingAfter) {
              throw new Error("MWE switch did not change withholding");
            }

            await desktop.screenshot({ path: "homepage-artifacts/home-1440.png", fullPage: true });

            for (const width of [1280, 1024, 768]) {
              const page = await browser.newPage({ viewport: { width, height: 900 }, deviceScaleFactor: 1 });
              await page.goto("http://127.0.0.1:3000/", { waitUntil: "networkidle" });
              await assertNoPageOverflow(page, width);
              await page.close();
            }

            const mobile = await browser.newPage({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 1 });
            await mobile.goto("http://127.0.0.1:3000/", { waitUntil: "networkidle" });
            const mobileDims = await assertNoPageOverflow(mobile, 390);
            if (!(await mobile.getByRole("heading", { name: /Philippine payroll software without the guesswork/i }).isVisible())) {
              throw new Error("Mobile homepage H1 is not visible");
            }
            await mobile.screenshot({ path: "homepage-artifacts/home-390.png", fullPage: true });

            const welcome = await browser.newPage({ viewport: { width: 1280, height: 800 } });
            await welcome.goto("http://127.0.0.1:3000/welcome", { waitUntil: "networkidle" });
            if (new URL(welcome.url()).pathname !== "/") {
              throw new Error(`/welcome did not redirect to /: ${welcome.url()}`);
            }

            console.log(JSON.stringify({
              desktopDims,
              mobileDims,
              initialSalary,
              changedSalary,
              netBefore,
              netAfter,
              withholdingBefore,
              withholdingAfter,
              welcomePath: new URL(welcome.url()).pathname,
            }, null, 2));

            await browser.close();
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linaw-homepage-reference-check
          path: homepage-artifacts/
          retention-days: 1
