name: Homepage storytelling QA

on:
  push:
    branches:
      - design/homepage-storytelling-pass

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
      DEMO_MODE: "false"
      APP_BASE_URL: http://127.0.0.1:3000
      PG_POOL_MAX: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Apply production-like schema
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const { Client } = require("pg");
          (async () => {
            const client = new Client({ connectionString: process.env.DATABASE_URL });
            await client.connect();
            await client.query(fs.readFileSync("drizzle/baseline.sql", "utf8"));
            const rows = await client.query("select count(*)::int as count from pricing_plans");
            if (rows.rows[0].count !== 0) throw new Error("Expected empty pricing table before homepage bootstrap");
            await client.end();
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
      - run: npx tsc --noEmit
      - run: npx eslint src tests
      - run: npx tsx --test tests/marketing.test.ts
      - run: npm run build
      - name: Start app
        run: |
          npm start > /tmp/linaw-next.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/linaw-next.log
          exit 1
      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Browser QA and screenshots
        run: |
          mkdir -p homepage-story
          node <<'NODE'
          const { chromium } = require("playwright");
          const { Client } = require("pg");

          async function assertNoOverflow(page, width) {
            const dims = await page.evaluate(() => ({
              body: document.body.scrollWidth,
              html: document.documentElement.scrollWidth,
              viewport: innerWidth,
            }));
            if (Math.max(dims.body, dims.html) > dims.viewport + 2) {
              throw new Error(`Overflow at ${width}: ${JSON.stringify(dims)}`);
            }
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });

            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 }, deviceScaleFactor: 1 });
            await page.goto("http://127.0.0.1:3000/", { waitUntil: "networkidle" });
            await assertNoOverflow(page, 1440);

            const hero = page.locator(".home-hero");
            const heroBox = await hero.boundingBox();
            const productBox = await page.locator(".home-hero-visual .frame").boundingBox();
            if (!heroBox || !productBox) throw new Error("Hero geometry missing");
            if (heroBox.height > 820) throw new Error(`Hero too tall: ${heroBox.height}`);
            if (productBox.width < 580 || productBox.height < 430) {
              throw new Error(`Product preview too small: ${JSON.stringify(productBox)}`);
            }

            const preview = page.locator("#preview");
            await preview.getByRole("button", { name: "Payroll", exact: true }).click();
            if (!(await preview.getByText("Register", { exact: true }).isVisible())) throw new Error("Interactive demo tab failed");

            const payroll = page.locator("#payroll");
            const salary = payroll.locator("#lab-salary");
            const salaryOutput = payroll.locator('output[for="lab-salary"]');
            const initialSalary = await salaryOutput.textContent();
            await salary.fill("50000");
            const changedSalary = await salaryOutput.textContent();
            if (!initialSalary?.includes("38,500") || !changedSalary?.includes("50,000")) throw new Error("StatutoryLab changed unexpectedly");

            const pricing = page.locator("#pricing");
            const cards = pricing.locator(".price-card");
            if ((await cards.count()) !== 4) throw new Error(`Expected 4 pricing cards, got ${await cards.count()}`);
            if (await page.getByText("Most chosen", { exact: true }).count()) throw new Error("Unsupported Most chosen label still visible");
            const input = pricing.getByLabel("Employee headcount");
            const before = await pricing.locator(".price strong").allTextContents();
            await input.fill("50");
            const after = await pricing.locator(".price strong").allTextContents();
            if (JSON.stringify(before) === JSON.stringify(after)) throw new Error("Pricing did not recalculate");

            const proof = page.locator("#proof");
            if (!(await proof.getByText("Verified", { exact: true }).first().isVisible())) throw new Error("Proof summary missing");
            const details = proof.locator("details").first();
            await details.locator("summary").click();
            if (!(await details.locator(".proof-details-body").isVisible())) throw new Error("Capability evidence did not open");

            const client = new Client({ connectionString: process.env.DATABASE_URL });
            await client.connect();
            const dbRows = await client.query("select count(*)::int as count from pricing_plans");
            await client.end();
            if (dbRows.rows[0].count !== 4) throw new Error(`Pricing bootstrap failed: ${dbRows.rows[0].count}`);

            await page.addStyleTag({ content: `
              @supports (animation-timeline: view()) {
                .software-home * { animation: none !important; opacity: 1 !important; transform: none !important; }
              }
              .software-home .site-nav { position: static !important; }
            `});
            await page.evaluate(() => window.scrollTo(0, 0));
            await page.screenshot({ path: "homepage-story/home-1440.png", fullPage: true });
            await hero.screenshot({ path: "homepage-story/hero-1440.png" });
            await proof.screenshot({ path: "homepage-story/proof-1440.png" });
            await pricing.screenshot({ path: "homepage-story/pricing-1440.png" });

            for (const width of [1280, 1024, 768]) {
              const p = await browser.newPage({ viewport: { width, height: 900 } });
              await p.goto("http://127.0.0.1:3000/", { waitUntil: "networkidle" });
              await assertNoOverflow(p, width);
              await p.close();
            }

            const mobile = await browser.newPage({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 1 });
            await mobile.goto("http://127.0.0.1:3000/", { waitUntil: "networkidle" });
            await assertNoOverflow(mobile, 390);
            if ((await mobile.locator("#pricing .price-card").count()) !== 4) throw new Error("Mobile pricing cards missing");
            await mobile.addStyleTag({ content: `
              @supports (animation-timeline: view()) {
                .software-home * { animation: none !important; opacity: 1 !important; transform: none !important; }
              }
              .software-home .site-nav { position: static !important; }
            `});
            await mobile.screenshot({ path: "homepage-story/home-390.png", fullPage: true });
            await mobile.locator(".home-hero").screenshot({ path: "homepage-story/hero-390.png" });
            await mobile.locator("#pricing").screenshot({ path: "homepage-story/pricing-390.png" });

            console.log(JSON.stringify({
              heroBox,
              productBox,
              initialSalary,
              changedSalary,
              pricingBefore: before,
              pricingAfter: after,
              pricingRows: dbRows.rows[0].count
            }, null, 2));

            await browser.close();
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homepage-storytelling-preview
          path: homepage-story/
          retention-days: 1
