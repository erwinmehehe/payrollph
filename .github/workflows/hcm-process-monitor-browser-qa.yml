name: HCM Process Monitor Browser QA (Synthetic Only)

on:
  # Post-merge acceptance uses a disposable PostgreSQL database and fictional workers.
  # No live endpoints, remote staging or production credentials are involved.
  push:
    branches: [main]
    paths:
      - 'src/app/api/hcm/process-monitor/**'
      - 'src/app/hcm/process-monitor/**'
      - 'src/app/api/hcm/org-explorer/**'
      - 'src/app/api/hcm/position-history/**'
      - 'src/app/hcm/org-explorer/**'
      - 'src/lib/hcm-enterprise-plan-*.ts'
      - 'tests/hcm-enterprise-plan-policy.test.ts'
      - 'scripts/hcm-enterprise-plan-synthetic-browser.mjs'
      - 'scripts/hcm-process-monitor-synthetic-fixture.ts'
      - 'src/app/api/workforce-planning/**'
      - 'src/app/api/compensation/**'
      - 'src/lib/enterprise-advanced-plan-*.ts'
      - 'src/lib/access.ts'
      - 'src/lib/dashboard-data.ts'
      - 'src/components/compensation-panel.tsx'
      - 'tests/enterprise-advanced-*.test.ts'
      - 'src/lib/hcm-process-monitor*.ts'
      - 'src/lib/hcm-context-navigation.ts'
      - 'src/lib/hcm-action-center.ts'
      - 'src/app/hcm/action-center/**'
      - 'src/app/api/hcm/business-processes/definitions/**'
      - 'src/components/hcm-business-process-admin.tsx'
      - 'src/components/workspace/people.tsx'
      - 'tests/hcm-enterprise-workflow-definition-gate.test.ts'
      - 'src/app/api/hcm/business-processes/inbox/**'
      - 'tests/hcm-action-center-v2.test.ts'
      - 'src/components/hcm-context-navigation.tsx'
      - 'src/app/hcm/command-center/**'
      - 'src/app/hcm/worker-360/**'
      - 'src/components/hcm-worker-360.tsx'
      - 'src/components/linaw-workspace.tsx'
      - 'src/lib/workspace-role-ui.ts'
      - 'tests/hcm-context-navigation.test.ts'
      - 'src/components/hcm-business-process-inbox.tsx'
      - 'scripts/hcm-process-monitor-synthetic-*.ts'
      - 'scripts/hcm-process-monitor-synthetic-*.mjs'
      - 'tests/hcm-process-monitor*.test.ts'
      - '.github/workflows/hcm-process-monitor-browser-qa.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/app/api/hcm/process-monitor/**'
      - 'src/app/hcm/process-monitor/**'
      - 'src/app/api/hcm/org-explorer/**'
      - 'src/app/api/hcm/position-history/**'
      - 'src/app/hcm/org-explorer/**'
      - 'src/lib/hcm-enterprise-plan-*.ts'
      - 'tests/hcm-enterprise-plan-policy.test.ts'
      - 'scripts/hcm-enterprise-plan-synthetic-browser.mjs'
      - 'scripts/hcm-process-monitor-synthetic-fixture.ts'
      - 'src/app/api/workforce-planning/**'
      - 'src/app/api/compensation/**'
      - 'src/lib/enterprise-advanced-plan-*.ts'
      - 'src/lib/access.ts'
      - 'src/lib/dashboard-data.ts'
      - 'src/components/compensation-panel.tsx'
      - 'tests/enterprise-advanced-*.test.ts'
      - 'src/lib/hcm-process-monitor*.ts'
      - 'src/lib/hcm-context-navigation.ts'
      - 'src/lib/hcm-action-center.ts'
      - 'src/app/hcm/action-center/**'
      - 'src/app/api/hcm/business-processes/definitions/**'
      - 'src/components/hcm-business-process-admin.tsx'
      - 'src/components/workspace/people.tsx'
      - 'tests/hcm-enterprise-workflow-definition-gate.test.ts'
      - 'src/app/api/hcm/business-processes/inbox/**'
      - 'tests/hcm-action-center-v2.test.ts'
      - 'src/components/hcm-context-navigation.tsx'
      - 'src/app/hcm/command-center/**'
      - 'src/app/hcm/worker-360/**'
      - 'src/components/hcm-worker-360.tsx'
      - 'src/components/linaw-workspace.tsx'
      - 'src/lib/workspace-role-ui.ts'
      - 'tests/hcm-context-navigation.test.ts'
      - 'src/components/hcm-business-process-inbox.tsx'
      - 'scripts/hcm-process-monitor-synthetic-*.ts'
      - 'scripts/hcm-process-monitor-synthetic-*.mjs'
      - 'tests/hcm-process-monitor*.test.ts'
      - '.github/workflows/hcm-process-monitor-browser-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      HCM_MONITOR_ACCEPTANCE_MODE: synthetic-postgres-only
      HCM_PROCESS_MONITOR_ENABLED: 'true'
      HCM_PROCESS_MONITOR_ORG_IDS: '1,2'
      HCM_PEOPLE_HOME_ENABLED: 'true'
      NEXT_PUBLIC_HCM_PEOPLE_HOME_ENABLED: 'true'
      HCM_PEOPLE_HOME_ORG_IDS: '1,2'
      HCM_WORKER_360_ENABLED: 'true'
      NEXT_PUBLIC_HCM_WORKER_360_ENABLED: 'true'
      NEXT_PUBLIC_HCM_PROCESS_MONITOR_ENABLED: 'true'
      NEXT_PUBLIC_HCM_PROCESS_MONITOR_ORG_IDS: '1,2'
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
      APP_BASE_URL: http://127.0.0.1:3000
      TRUSTED_APP_ORIGINS: http://127.0.0.1:3000
      DEMO_MODE: 'false'
      REQUIRE_PRIVILEGED_MFA: 'false'
      OPENAI_API_KEY: ''
      NEXT_TELEMETRY_DISABLED: '1'
      TOTP_ENCRYPTION_KEY: '4444444444444444444444444444444444444444444444444444444444444444'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Ephemeral bank encryption key only
        shell: bash
        run: |
          bank_key=$(openssl rand -hex 32)
          pii_key=$(openssl rand -hex 32)
          echo "::add-mask::$bank_key"
          echo "::add-mask::$pii_key"
          echo "BANK_DATA_ENCRYPTION_KEY=$bank_key" >> "$GITHUB_ENV"
          echo "PII_ENCRYPTION_KEY=$pii_key" >> "$GITHUB_ENV"
      - run: npm run db:push
      - name: Seed two fictional employers in local PostgreSQL
        run: npx tsx scripts/hcm-process-monitor-synthetic-fixture.ts
      # These isolated tests complete before the full repository's serialized
      # suite, so HCM regressions have an actionable, exact-commit signal.
      # Run after fixture creation: the browser fixture assumes employer IDs 1/2.
      - name: Verify monitor contract and two-employer PostgreSQL integration
        run: npx tsx --test --test-concurrency=1 tests/hcm-process-monitor.test.ts tests/hcm-process-monitor-tenant-integration.test.ts tests/hcm-context-navigation.test.ts tests/hcm-action-center-v2.test.ts
      - name: Verify paid HCM workflow designer GET/POST policy and scope
        run: npx tsx --test --test-concurrency=1 tests/hcm-enterprise-workflow-definition-gate.test.ts
      - name: Verify #850 Planning/Compensation policy, direct routes and PostgreSQL tenant boundaries
        run: npx tsx --test --test-concurrency=1 tests/enterprise-advanced-plan-policy.test.ts tests/enterprise-advanced-route-scope.test.ts tests/enterprise-advanced-http-pg.test.ts
      - name: Build local Next.js without external deployment
        run: npm run build
      - name: Install pinned local Chromium and automated accessibility rules
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0 axe-core@4.10.3
          npx playwright install --with-deps chromium
      - name: Start local app
        shell: bash
        run: |
          nohup npm start -- -H 127.0.0.1 > /tmp/hcm-monitor-app.log 2>&1 &
          for attempt in {1..40}; do
            if curl -fsS 'http://127.0.0.1:3000/login' >/dev/null; then exit 0; fi
            sleep 2
          done
          echo 'Isolated app unavailable'
          exit 1
      - name: Start local disabled monitor instance
        shell: bash
        env:
          HCM_PROCESS_MONITOR_ENABLED: 'false'
          HCM_WORKER_360_ENABLED: 'false'
          APP_BASE_URL: http://127.0.0.1:3001
          TRUSTED_APP_ORIGINS: http://127.0.0.1:3001
        run: |
          nohup npm start -- -p 3001 -H 127.0.0.1 > /tmp/hcm-monitor-off.log 2>&1 &
          for attempt in {1..40}; do
            if curl -fsS 'http://127.0.0.1:3001/login' >/dev/null; then exit 0; fi
            sleep 2
          done
          echo 'Local disabled monitor unavailable'
          exit 1
      # Separate app instance: do not change the default-off pilot experience.
      # Only fictional employers 1/2 in disposable localhost PostgreSQL.
      - name: Start local opt-in Enterprise HCM gate instance
        shell: bash
        env:
          HCM_ENTERPRISE_PLAN_GATE_ENABLED: 'true'
          HCM_ENTERPRISE_PLAN_GATE_ORG_IDS: '1,2'
          HCM_ORG_EXPLORER_ENABLED: 'true'
          HCM_ORG_EXPLORER_ORG_IDS: '1,2'
          APP_BASE_URL: http://127.0.0.1:3002
          TRUSTED_APP_ORIGINS: http://127.0.0.1:3002
        run: |
          nohup npm start -- -p 3002 -H 127.0.0.1 > /tmp/hcm-enterprise-gate.log 2>&1 &
          for attempt in {1..40}; do
            if curl -fsS 'http://127.0.0.1:3002/login' >/dev/null; then exit 0; fi
            sleep 2
          done
          echo 'Local opt-in HCM gate instance unavailable'
          exit 1
      - name: Browser QA — active Enterprise vs Core direct HCM pages and APIs
        env:
          HCM_ENTERPRISE_PLAN_GATE_ENABLED: 'true'
          HCM_ENTERPRISE_PLAN_GATE_ORG_IDS: '1,2'
        run: node scripts/hcm-enterprise-plan-synthetic-browser.mjs

      # Both browser journeys use separate local app instances but the same
      # disposable PostgreSQL rate-limit store. Preserve the real production
      # 10-login/minute limit by resetting only the synthetic IP bucket after
      # the first suite, never by changing authentication or bypassing checks.
      - name: Reset synthetic-only shared login bucket between browser suites
        run: npx tsx scripts/hcm-monitor-reset-login-bucket.ts
      - name: Browser QA — HCM navigation/role/tenant/a11y/reflow/default-off
        run: node scripts/hcm-process-monitor-synthetic-browser.mjs
