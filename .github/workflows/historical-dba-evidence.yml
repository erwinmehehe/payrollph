name: P0-4 Historical DBA Evidence (Read Only)

on:
  pull_request:
    paths:
      - "docs/engineering/issue-1198-migration-forensics-20261017.md"
      - "docs/engineering/issue-1198-catalog-only-inspection.sql"
      - "tests/issue-1198-migration-forensics.test.mjs"
      - "scripts/lib/historical-dba-evidence.mjs"
      - "scripts/audit-historical-dba-evidence.mjs"
      - "tests/historical-dba-evidence.test.mjs"
      - "tests/historical-dba-evidence-pg18.test.mjs"
      - ".github/workflows/historical-dba-evidence.yml"
  push:
    branches: [main]
    paths:
      - "docs/engineering/issue-1198-migration-forensics-20261017.md"
      - "docs/engineering/issue-1198-catalog-only-inspection.sql"
      - "tests/issue-1198-migration-forensics.test.mjs"
      - "scripts/lib/historical-dba-evidence.mjs"
      - "scripts/audit-historical-dba-evidence.mjs"
      - "tests/historical-dba-evidence.test.mjs"
      - "tests/historical-dba-evidence-pg18.test.mjs"
      - ".github/workflows/historical-dba-evidence.yml"
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: Exact reviewed main SHA (40 lowercase hex characters)
        required: true
        type: string
      change_ref:
        description: Independent P0-4 evidence inspection change ticket
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: historical-dba-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  source-contract:
    if: github.event_name != 'workflow_dispatch'
    name: SQL source hash and catalog evidence contract (NO Neon credentials)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch exact commit, no credential persistence
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Verify source, bad catalog and role denial
        run: |
          node --check scripts/lib/historical-dba-evidence.mjs
          node --check scripts/audit-historical-dba-evidence.mjs
          node --test tests/historical-dba-evidence.test.mjs
          node --test tests/issue-1198-migration-forensics.test.mjs
          node scripts/audit-historical-dba-evidence.mjs --inventory

  synthetic-postgres-18:
    if: github.event_name != 'workflow_dispatch'
    name: Catalog query actual syntax and rollback (disposable PostgreSQL 18)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_ACTIONS: "true"
      CI: "true"
      P0_4_HISTORICAL_EVIDENCE_MODE: isolated-pg18-only
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout exact PR source with no saved credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Initialize local fixture only (NEVER Neon db:push)
        run: npm run db:push
      - name: Test real pg_catalog SQL syntax + fail closed rollback
        run: |
          node --check tests/historical-dba-evidence-pg18.test.mjs
          node --test tests/historical-dba-evidence-pg18.test.mjs

  protected-live-catalog:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    name: Independently approved metadata-only Neon DBA evidence (NO writes)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      P0_4_AUDIT_ENVIRONMENT: production
      P0_4_AUDIT_ALLOWED_ACTORS: ${{ vars.P0_4_AUDIT_ALLOWED_ACTORS }}
      P0_4_AUDIT_CHANGE_REF: ${{ inputs.change_ref }}
      REVIEWED_SHA: ${{ inputs.reviewed_sha }}
      EXPECTED_PRODUCTION_NEON_PROJECT_ID: ${{ vars.PRODUCTION_NEON_PROJECT_ID }}
      EXPECTED_PRODUCTION_NEON_BRANCH_ID: ${{ vars.PRODUCTION_NEON_BRANCH_ID }}
      EXPECTED_PRODUCTION_NEON_ENDPOINT_ID: ${{ vars.PRODUCTION_NEON_ENDPOINT_ID }}
      EXPECTED_PRODUCTION_DATABASE_NAME: neondb
    steps:
      - name: Reject unreviewed SHA and source before loading credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$REVIEWED_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$REVIEWED_SHA" == "$GITHUB_SHA" ]]
          [[ "$P0_4_AUDIT_CHANGE_REF" =~ ^P0-4-[A-Za-z0-9-]{8,100}$ ]]
      - name: Checkout exact reviewed source without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install locked read-only pg dependency (without database secret)
        run: npm ci
      - name: Source manifest (no database connection)
        run: node scripts/audit-historical-dba-evidence.mjs --inventory
      - name: Metadata-only, rollback-only Neon catalog inspection
        env:
          PRODUCTION_MIGRATION_AUDIT_DATABASE_URL: ${{ secrets.PRODUCTION_MIGRATION_AUDIT_DATABASE_URL }}
        run: node scripts/audit-historical-dba-evidence.mjs --verify

# There is no apply, migration, receipt INSERT, payroll row query,
# database restore or automatic production run in this workflow.
