name: Tenant WRK-01 POS Demand Four Methods (Fictional PG16 HTTP)

on:
  pull_request:
    branches: [main]
    paths:
      - "src/app/api/workforce/demand-observations/loyverse/**"
      - "src/app/api/workforce/demand-observations/square-sandbox/**"
      - "src/lib/workforce-loyverse-pos.ts"
      - "src/lib/workforce-square-sandbox.ts"
      - "src/lib/workforce-operational-demand-*"
      - "scripts/qa/tenant-pos-demand-*"
      - "tests/tenant-pos-demand-contract.test.mjs"
      - ".github/workflows/tenant-pos-demand-http.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tenant-pos-demand-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  pos-demand-four-methods:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WORKER_ENABLED: "false"
      CENTRAL_SCHEDULER_ENABLED: "false"
      XENDIT_BILLING_ENABLED: "false"
      XENDIT_PAYOUTS_ENABLED: "false"
      PAYMONGO_DISBURSEMENTS_ENABLED: "false"
      HCM_OVERPAYMENT_PREVIEW_ENABLED: "false"
      PAYROLL_OVERPAYMENT_REVIEW_ENABLED: "false"
      PAYROLL_LOAN_DEDUCTION_ACTIVATION_ENABLED: "false"
      NEXT_CSP_ENABLED: "false"
      TRUSTED_APP_ORIGINS: "http://127.0.0.1:3000"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Exact reviewed commit must be checked out
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Configure exact local-PG16 only, no merchant keys or outbound provider
        shell: bash
        run: |
          set -euo pipefail
          node scripts/qa/tenant-table-env.mjs allowlisted-reads >> "$GITHUB_ENV"
          {
            echo "TENANT_POS_DEMAND_PROOF=fictional-provider-only"
            echo "WORKER_ENABLED=false"
            echo "CENTRAL_SCHEDULER_ENABLED=false"
            echo "XENDIT_BILLING_ENABLED=false"
            echo "XENDIT_PAYOUTS_ENABLED=false"
            echo "PAYMONGO_DISBURSEMENTS_ENABLED=false"
            echo "HCM_OVERPAYMENT_PREVIEW_ENABLED=false"
            echo "PAYROLL_OVERPAYMENT_REVIEW_ENABLED=false"
            echo "PAYROLL_LOAN_DEDUCTION_ACTIVATION_ENABLED=false"
            echo "NEXT_CSP_ENABLED=false"
            echo "TRUSTED_APP_ORIGINS=http://127.0.0.1:3000"
            echo "WFM_LOYVERSE_POS_ENABLED=true"
            echo "WFM_SQUARE_SANDBOX_ENABLED=true"
            echo "WFM_LOYVERSE_ACCESS_TOKEN="
            echo "WFM_SQUARE_SANDBOX_ACCESS_TOKEN="
            echo "PAYMONGO_SECRET_KEY="
            echo "XENDIT_SECRET_KEY="
            echo "XENDIT_PAYOUT_SECRET_KEY="
            echo "RESEND_API_KEY="
            echo "POSTMARK_SERVER_TOKEN="
            echo "SMTP_URL="
            echo "STRIPE_SECRET_KEY="
          } >> "$GITHUB_ENV"
      - name: Test guard, source contract, count ratchet and offline provider interception
        run: |
          node --check scripts/qa/tenant-pos-demand-contract.mjs
          node --check scripts/qa/tenant-pos-demand-provider-mock.cjs
          node --check scripts/qa/tenant-pos-demand-http.mjs
          node --check tests/tenant-pos-demand-contract.test.mjs
          node --test tests/tenant-pos-demand-contract.test.mjs
      - name: Generate disposable local signing and encryption inputs only
        shell: bash
        run: |
          set -euo pipefail
          for key_name in PII_ENCRYPTION_KEY BANK_DATA_ENCRYPTION_KEY; do
            value=$(openssl rand -hex 32)
            echo "::add-mask::$value"
            echo "$key_name=$value" >> "$GITHUB_ENV"
          done
          webhook="whsec_$(openssl rand -base64 32 | tr -d '\n')"
          echo "::add-mask::$webhook"
          echo "RESEND_WEBHOOK_SECRET=$webhook" >> "$GITHUB_ENV"
      - name: Create empty ephemeral PostgreSQL 16 application schema
        run: npm run db:push
      - name: Apply existing reviewed disposable baseline
        run: node scripts/qa/apply-isolated-baseline.mjs
      - name: Prepare existing fictional HCM schema fixture
        run: node scripts/qa/prepare-hcm-work-item-fixture.mjs
      - name: Bootstrap two actual owner sessions, higher-ID victim and excluded employer
        run: node --import tsx scripts/qa/tenant-table-allowlist-bootstrap.mjs
      - name: Allowlist three actual fictional employers for both POS source flags
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WFM_OPERATIONAL_DEMAND_ALLOWED_ORGANIZATION_IDS"
          echo "WFM_LOYVERSE_POS_ALLOWED_ORGANIZATION_IDS=$WFM_OPERATIONAL_DEMAND_ALLOWED_ORGANIZATION_IDS" >> "$GITHUB_ENV"
          echo "WFM_SQUARE_SANDBOX_ALLOWED_ORGANIZATION_IDS=$WFM_OPERATIONAL_DEMAND_ALLOWED_ORGANIZATION_IDS" >> "$GITHUB_ENV"
      - name: Build production-mode Next handlers against disposable app_db
        run: npm run build
      - name: Prove GET/POST for Loyverse and Square with per-employer local mock-only server
        run: node --import tsx scripts/qa/tenant-pos-demand-http.mjs
      - name: Show only bounded synthetic Next server logs on failure
        if: failure()
        shell: bash
        run: |
          for f in /tmp/tenant-pos-demand-next-*.log; do
            if [ -f "$f" ]; then
              echo "Local proof server: $f"
              tail -n 60 "$f"
            fi
          done
