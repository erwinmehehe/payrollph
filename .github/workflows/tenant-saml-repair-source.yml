name: SAML repair source snapshot (read only)
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths: ['.github/workflows/tenant-saml-repair-source.yml']
permissions:
  contents: read
jobs:
  source:
    if: >-
      github.repository == 'erwinmehehe/payrollph' &&
      github.event.pull_request.number == 1934 &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/tenant-saml-metadata-privacy-recovery-20261111'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Archive tracked source only, without credentials or execution
        run: |
          set -eu
          git rev-parse HEAD > SOURCE_SHA.txt
          git archive --format=tar.gz --output=source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: saml-repair-source-${{ github.event.pull_request.head.sha }}
          path: |
            source.tar.gz
            SOURCE_SHA.txt
          retention-days: 1
          if-no-files-found: error
