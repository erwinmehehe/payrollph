name: Homepage redesign visual QA

on:
  push:
    branches:
      - redesign/homepage-product-story-sep29
    paths:
      - ".github/workflows/homepage-redesign-qa.yml"

jobs:
  visual:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
      DEMO_MODE: "true"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run db:push
      - name: Start app
        run: |
          npm run dev -- --hostname 127.0.0.1 >/tmp/app.log 2>&1 &
          for i in {1..60}; do
            curl -fsS http://127.0.0.1:3000/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/app.log
          exit 1
      - name: Start Chrome
        run: |
          google-chrome --headless=new --no-sandbox --disable-dev-shm-usage --hide-scrollbars             --remote-debugging-address=127.0.0.1 --remote-debugging-port=9222             --user-data-dir=/tmp/chrome about:blank >/tmp/chrome.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:9222/json/version >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/chrome.log
          exit 1
      - name: Capture redesign
        run: |
          cat >/tmp/capture.mjs <<'EOF'
          import fs from "node:fs/promises";
          const targets=await (await fetch("http://127.0.0.1:9222/json")).json();
          const page=targets.find(x=>x.type==="page");
          if(!page) throw new Error("No Chrome target");
          const ws=new WebSocket(page.webSocketDebuggerUrl);
          await new Promise((resolve,reject)=>{ws.addEventListener("open",resolve,{once:true});ws.addEventListener("error",reject,{once:true})});
          let id=1; const pending=new Map(); const listeners=new Map();
          ws.addEventListener("message",event=>{
            const m=JSON.parse(String(event.data));
            if(m.id&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.reject(new Error(m.error.message)):p.resolve(m.result);return;}
            if(m.method&&listeners.has(m.method)) for(const fn of listeners.get(m.method)) fn(m.params);
          });
          const send=(method,params={})=>new Promise((resolve,reject)=>{const call=id++;pending.set(call,{resolve,reject});ws.send(JSON.stringify({id:call,method,params}))});
          const once=(method)=>new Promise(resolve=>{const set=listeners.get(method)??new Set();const fn=p=>{set.delete(fn);resolve(p)};set.add(fn);listeners.set(method,set)});
          const wait=async(expr,timeout=15000)=>{const start=Date.now();while(Date.now()-start<timeout){const r=await send("Runtime.evaluate",{expression:expr,returnByValue:true});if(r.result.value)return;await new Promise(r=>setTimeout(r,200))}throw new Error("timeout "+expr)};
          const shot=async(name,width,height,full=false)=>{
            await send("Emulation.setDeviceMetricsOverride",{width,height,deviceScaleFactor:1,mobile:width<700});
            await new Promise(r=>setTimeout(r,350));
            if(full){
              const metrics=await send("Page.getLayoutMetrics");
              const size=metrics.cssContentSize;
              const r=await send("Page.captureScreenshot",{format:"png",captureBeyondViewport:true,clip:{x:0,y:0,width:Math.min(1600,Math.ceil(size.width)),height:Math.min(15000,Math.ceil(size.height)),scale:1}});
              await fs.writeFile(name,Buffer.from(r.data,"base64"));
            }else{
              const r=await send("Page.captureScreenshot",{format:"png"});
              await fs.writeFile(name,Buffer.from(r.data,"base64"));
            }
          };
          await send("Page.enable"); await send("Runtime.enable");
          await send("Emulation.setDeviceMetricsOverride",{width:1440,height:1000,deviceScaleFactor:1,mobile:false});
          const loaded=once("Page.loadEventFired");
          await send("Page.navigate",{url:"http://127.0.0.1:3000/"});
          await loaded;
          await wait("document.readyState==='complete'");
          await wait("document.body.innerText.includes('Run Philippine payroll with a clear path from draft to release.')");
          await new Promise(r=>setTimeout(r,900));
          await shot("homepage-redesign-full.png",1440,1000,true);
          await send("Runtime.evaluate",{expression:"document.querySelector('#workflow')?.scrollIntoView({block:'start'})"});
          await new Promise(r=>setTimeout(r,300));
          await shot("homepage-redesign-workflow.png",1440,1000,false);
          await send("Runtime.evaluate",{expression:"document.querySelector('#pricing')?.scrollIntoView({block:'start'})"});
          await new Promise(r=>setTimeout(r,300));
          await shot("homepage-redesign-pricing.png",1440,1000,false);
          await send("Runtime.evaluate",{expression:"window.scrollTo(0,0)"});
          await shot("homepage-redesign-mobile.png",390,844,true);
          ws.close();
          EOF
          node /tmp/capture.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: homepage-redesign-visuals
          path: |
            homepage-redesign-full.png
            homepage-redesign-workflow.png
            homepage-redesign-pricing.png
            homepage-redesign-mobile.png
          retention-days: 3
