name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Initialize test database
        run: npx drizzle-kit push
      - run: npx tsc --noEmit
      - run: npx tsx --test tests/ph-payroll.test.ts tests/public-homepage-runtime.test.ts tests/db-build-safety.test.ts tests/local-bootstrap.test.ts tests/final-pay.test.ts tests/payroll-rules.test.ts tests/security.test.ts tests/integrations.test.ts tests/annualization.test.ts tests/wage-orders.test.ts tests/launch-gates.test.ts tests/auth-surface.test.ts tests/self-service.test.ts tests/payslip-pdf.test.ts tests/csv-import.test.ts tests/billing.test.ts tests/benefits.test.ts tests/benefits-wiring.test.ts tests/tenancy.test.ts tests/marketing.test.ts tests/mailer-smtp.test.ts tests/manual-launch-readiness.test.ts tests/paymongo-disbursements.test.ts tests/government-draft-tin.test.ts tests/sss-r3-draft.test.ts
      - name: Verify production build without DATABASE_URL
        run: env -u DATABASE_URL npx next build
