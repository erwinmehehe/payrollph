name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # Keep each PR head in its own group: an older head's queued "check" job
  # must not block this head's fail-closed matrix and required check.
  # Duplicate attempts on the SAME head still cancel one another. Older heads
  # may continue running but can never satisfy the latest-head merge gate.
  # Pushes to main are still isolated by SHA and are never cancelled.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Each regression shard uses its OWN disposable PG16 service, so financial
  # integration tests remain serial within a shard without racing other shards.
  # The existing required "check" job depends on the complete matrix.
  test-shard:
    name: Regression shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      TZ: Asia/Manila
      CI: "true"
      FAIL_CLOSED_GUARD_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
      SCHEDULER_REHEARSAL_MODE: isolated-ci-only
      # Offline claims must have real temporary PostgreSQL FK/CHECK acceptance.
      OFFLINE_CLAIM_PG_ACCEPTANCE_REQUIRED: "true"
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
      # The suite runs exactly like production after the clean-baseline cutover:
      # no request-time DDL or backfills; schema comes only from the offline baseline.
      REQUEST_SCHEMA_READONLY_ENABLED: "true"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Fetch exact comparison base for fail-closed client-read scanner
        run: git fetch --no-tags --depth=1 origin "$FAIL_CLOSED_GUARD_BASE_REF"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Provision isolated test-only encryption keys
        shell: bash
        run: |
          bank_key=$(openssl rand -hex 32)
          pii_key=$(openssl rand -hex 32)
          echo "::add-mask::$bank_key"
          echo "::add-mask::$pii_key"
          echo "BANK_DATA_ENCRYPTION_KEY=$bank_key" >> "$GITHUB_ENV"
          echo "PII_ENCRYPTION_KEY=$pii_key" >> "$GITHUB_ENV"
      - name: Apply disposable PostgreSQL schema
        run: npm run db:push
      - name: Apply 0109 audit protection in disposable regression shard
        env:
          PAYMONGO_DISBURSEMENTS_ENABLED: "false"
          XENDIT_PAYOUTS_ENABLED: "false"
        run: node scripts/qa/apply-audit-0109-isolated.mjs
      - name: Apply the reviewed source baseline supplement (same objects as the cutover)
        run: node scripts/qa/apply-source-baseline-supplement.mjs
      - name: Execute complete regression inventory shard
        run: node scripts/run-sharded-tests.mjs ${{ matrix.shard }} 4

  # Real LOGIN credentials on disposable PostgreSQL ONLY, never production.
  audit-chain-real-logins:
    name: audit-chain-real-logins (PG${{ matrix.postgres }}, ${{ matrix.foundation }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        postgres: [16, 18]
        foundation: [legacy-0109, forward-candidate]
    env:
      CI: "true"
      TZ: Asia/Manila
      ISSUE908_ACCEPTANCE_MODE: isolated-ci-only
      ISSUE908_FOUNDATION_CANDIDATE: ${{ matrix.foundation == 'forward-candidate' && 'true' || 'false' }}
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/neondb
      PAYMONGO_DISBURSEMENTS_ENABLED: "false"
      XENDIT_PAYOUTS_ENABLED: "false"
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: neondb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d neondb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Test restricted logins, GUC spoofing, ownership and audit tamper denial
        run: node --import tsx --test tests/audit-role-isolation-postgres.test.mjs

  # A matrix failure, skip or cancellation is never a passing gate.
  audit-chain-protection:
    name: audit-chain-protection
    if: ${{ always() }}
    needs: audit-chain-real-logins
    runs-on: ubuntu-latest
    steps:
      - name: Require all four disposable real-login acceptance cases
        env:
          MATRIX_RESULT: ${{ needs.audit-chain-real-logins.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$MATRIX_RESULT" != "success" ]; then
            echo "::error::PG16/PG18 restricted-login acceptance failed, skipped or cancelled."
            exit 1
          fi
          echo "PASS: PG16 and PG18, legacy 0109 and forward candidate, synthetic only."
          echo "Production roles, grants and DBA cutover remain separately BLOCKED."

  check:
    # A skipped required check is treated as acceptable by GitHub rulesets.
    # Always materialize this required job, even when a matrix shard fails,
    # and make the outcome explicitly red before running any later checks.
    if: ${{ always() }}
    needs: [test-shard, audit-chain-protection]
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Manila
      FAIL_CLOSED_GUARD_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      # A dependency failure makes GitHub implicitly add success() to step ifs
      # unless this guard explicitly includes a status-check function.
      - name: Required CI needs both regression shards and audit-chain-protection
        if: ${{ always() && (needs.test-shard.result != 'success' || needs.audit-chain-protection.result != 'success') }}
        run: |
          echo "::error::Regression shards or audit-chain-protection failed, were cancelled, or were skipped."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Fetch exact comparison base for fail-closed client-read scanner
        run: git fetch --no-tags --depth=1 origin "$FAIL_CLOSED_GUARD_BASE_REF"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Guard client read fail-closed regressions (no database)
        run: npx tsx --test tests/fail-closed-client-read-guard.test.ts
      - name: Lint with the pinned compatible ESLint toolchain
        run: npm run lint
      # The app now fails closed on every nonempty bank write without a key.
      # Isolated synthetic CI uses a fresh random key that is never persisted.
      - name: Provision separate ephemeral bank and PII keys for isolated CI only
        shell: bash
        run: |
          echo "BANK_DATA_ENCRYPTION_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          pii_key=$(openssl rand -hex 32)
          echo "::add-mask::$pii_key"
          echo "PII_ENCRYPTION_KEY=$pii_key" >> "$GITHUB_ENV"
      - name: Block high and critical runtime dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - name: Report high and critical development dependency vulnerabilities
        continue-on-error: true
        run: npm audit --include=dev --audit-level=high
      - run: npm run db:push
      - name: Apply reviewed audit and supplement schema on disposable app_db
        # Offline test-only provisioning: never permit request-time schema DDL.
        run: node scripts/qa/apply-isolated-baseline.mjs
      - name: Verify critical payroll tables after schema push
        run: |
          node -e 'const { Client } = require("pg"); (async () => { const c = new Client({ connectionString: process.env.DATABASE_URL }); await c.connect(); try { const { rows } = await c.query("select to_regclass($1) as users, to_regclass($2) as employees, to_regclass($3) as payroll_runs", ["public.users", "public.employees", "public.payroll_runs"]); if (!rows[0]?.users || !rows[0]?.employees || !rows[0]?.payroll_runs) throw new Error("Required payroll tables missing after db:push"); } finally { await c.end(); } })().catch((e) => { console.error(e); process.exitCode = 1; })'
      - name: Check compensation outbox PostgreSQL schema compatibility (read-only)
        run: npm run compensation:release:schema:check
      - name: Rehearse compensation outbox migration in rollback-only CI schema
        env:
          CI: "true"
          COMPENSATION_MIGRATION_REHEARSAL_MODE: isolated-ci-only
        run: npm run compensation:release:migration:rehearse
      - name: Rehearse isolated PostgreSQL backup and restore
        env:
          CI: "true"
          DR_REHEARSAL_MODE: isolated-ci-only
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: bash scripts/verify-backup-restore.sh
      - name: Upload sanitized DR engineering evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: payrollph-ci-dr-rehearsal
          path: qa-artifacts/dr-rehearsal.json
          retention-days: 14
          if-no-files-found: warn
      - name: Guard against new oversized source modules
        run: npm run source:size:check
      - run: npx tsc --noEmit
      # npm test remains the complete local regression entrypoint. CI runs
      # the same inventory on independent disposable databases in test-shard.
      - name: Run statutory golden payroll certification
        run: npm run payroll:golden
      - name: Upload golden payroll certification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: payrollph-golden-payroll-certification
          path: qa-artifacts/golden-payroll-certification.json
          retention-days: 14
      - name: Run employee-level golden payroll reconciliation
        run: npm run payroll:golden:phase2a
      - name: Upload Phase 2A payroll reconciliation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: payrollph-golden-payroll-phase2a
          path: qa-artifacts/golden-payroll-phase2a-reconciliation.json
          retention-days: 14
      - name: Run complex lifecycle golden payroll reconciliation
        run: npm run payroll:golden:phase2b
      - name: Upload Phase 2B payroll reconciliation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: payrollph-golden-payroll-phase2b
          path: qa-artifacts/golden-payroll-phase2b-reconciliation.json
          retention-days: 14
      - name: Run configurable Pay Rules golden reconciliation
        run: npm run payroll:golden:pay-rules
      - name: Upload Pay Rules golden reconciliation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: payrollph-golden-pay-rules-phase3
          path: qa-artifacts/golden-pay-rules-phase3-reconciliation.json
          retention-days: 14
      - run: npm run seo:audit
      - run: npm run seo:routes
      - run: npm run seo:links
      # Source candidate A-4: the throw route exists in CI only.
      - name: Stage synthetic sanitized-telemetry Next.js route (CI only)
        env:
          CI: "true"
        run: node scripts/verify-safe-otel-next-runtime.mjs stage
      - run: npx next build
      - name: Production-mode Next.js and synthetic PostgreSQL cron telemetry acceptance
        env:
          CI: "true"
        run: node scripts/verify-safe-otel-next-runtime.mjs verify
