name: Pre-login tenant boundary (fictional PG16 HTTP; loopback mail only; no money)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - '.github/workflows/tenant-prelogin-http.yml'
      - 'scripts/qa/tenant-prelogin-*.mjs'
      - 'tests/tenant-prelogin-contract.test.mjs'
      - 'src/app/api/setup/**'
      - 'src/app/api/intake-challenge/**'
      - 'src/app/api/signup/**'
      - 'src/app/api/auth/login/**'
      - 'src/app/api/auth/me/**'
      - 'src/app/api/employees/route.ts'
      - 'src/lib/auth.ts'
      - 'src/lib/access.ts'
      - 'src/lib/crypto.ts'
      - 'src/lib/tokens.ts'
      - 'src/lib/validation.ts'
      - 'src/lib/mailer.ts'
      - 'src/lib/mail-provider.ts'
      - 'src/lib/rate-limit*.ts'
      - 'src/lib/saas-launch-config.ts'
      - 'src/lib/saas-billing-schema.ts'
      - 'src/lib/public-intake-proof*.ts'
      - 'src/lib/private-pilot-invite.ts'
      - 'src/lib/security-request.ts'
      - 'src/lib/security-secret.ts'
      - 'src/lib/critical-release-flags.ts'
      - 'src/db/**'
      - 'scripts/qa/tenant-table-http.mjs'
      - 'scripts/qa/tenant-table-env.mjs'
      - 'scripts/qa/apply-isolated-baseline.mjs'

permissions:
  contents: read

concurrency:
  group: tenant-prelogin-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fictional-prelogin-http:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TENANT_PRELOGIN_MODE: fictional-pg16-http
      PAYMONGO_DISBURSEMENTS_ENABLED: 'false'
      XENDIT_PAYOUTS_ENABLED: 'false'
      XENDIT_BILLING_ENABLED: 'false'
      WORKER_ENABLED: 'false'
      CENTRAL_SCHEDULER_ENABLED: 'false'
      PAYMONGO_SECRET_KEY: ''
      XENDIT_SECRET_KEY: ''
      RESEND_API_KEY: ''
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Export disposable localhost targets, loopback mail and throwaway secrets; disable all providers and workers
        shell: bash
        run: |
          set -euo pipefail
          # The shared base environment, read from the module rather than copied, so it cannot drift.
          node -e 'import("./scripts/qa/tenant-table-env.mjs").then((m) => { for (const [k, v] of Object.entries(m.TENANT_TABLE_BASE_ENV)) console.log(k + "=" + v); })' >> "$GITHUB_ENV"
          proof_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$proof_secret"
          {
            echo 'TENANT_PRELOGIN_MODE=fictional-pg16-http'
            echo 'XENDIT_BILLING_ENABLED=false'
            echo 'PAYMONGO_DISBURSEMENTS_ENABLED=false'
            echo 'XENDIT_PAYOUTS_ENABLED=false'
            echo 'WORKER_ENABLED=false'
            echo 'CENTRAL_SCHEDULER_ENABLED=false'
            echo 'PAYMONGO_SECRET_KEY='
            echo 'XENDIT_SECRET_KEY='
            echo 'RESEND_API_KEY='
            echo 'SMTP_URL=smtp://127.0.0.1:2525'
            echo 'TENANT_PRELOGIN_MAIL_FILE=/tmp/tenant-prelogin-mailbox.jsonl'
            echo 'PUBLIC_SIGNUP_MODE=pilot'
            echo 'PUBLIC_INTAKE_PROOF_ENABLED=true'
            echo "PUBLIC_INTAKE_PROOF_SECRET=$proof_secret"
            echo 'TRUSTED_PROXY_HOPS=1'
          } >> "$GITHUB_ENV"
      - name: Fail closed on incorrect proof contracts and synthetic targets
        run: |
          node --check scripts/qa/tenant-prelogin-smtp-sink.mjs
          node --check scripts/qa/tenant-prelogin-contract.mjs
          node --check scripts/qa/tenant-prelogin-http.mjs
          node --test tests/tenant-prelogin-contract.test.mjs
      - name: Generate throwaway encryption keys and webhook secret
        shell: bash
        run: |
          set -euo pipefail
          for name in PII_ENCRYPTION_KEY BANK_DATA_ENCRYPTION_KEY; do
            key=$(openssl rand -hex 32)
            echo "::add-mask::$key"
            echo "$name=$key" >> "$GITHUB_ENV"
          done
          secret="whsec_$(openssl rand -base64 32 | tr -d '\n')"
          echo "::add-mask::$secret"
          echo "RESEND_WEBHOOK_SECRET=$secret" >> "$GITHUB_ENV"
      - name: Initialize disposable PostgreSQL 16
        run: npm run db:push
      - name: Apply only reviewed fictional baseline objects
        run: node scripts/qa/apply-isolated-baseline.mjs
      - name: Build production-mode app against the disposable database
        run: npm run build
      - name: Start the loopback-only mail sink
        shell: bash
        run: |
          set -euo pipefail
          nohup node scripts/qa/tenant-prelogin-smtp-sink.mjs > /tmp/tenant-prelogin-sink.log 2>&1 &
          for attempt in $(seq 1 30); do
            if grep -q listening /tmp/tenant-prelogin-sink.log; then exit 0; fi
            sleep 1
          done
          cat /tmp/tenant-prelogin-sink.log
          exit 1
      - name: Start production-mode Next on localhost only
        shell: bash
        run: |
          set -euo pipefail
          nohup npm start -- -H 127.0.0.1 > /tmp/tenant-prelogin-next.log 2>&1 &
          server=$!
          for attempt in $(seq 1 60); do
            if curl --silent --fail "$SECURITY_SMOKE_URL/login" > /dev/null; then
              exit 0
            fi
            if ! kill -0 "$server" 2>/dev/null; then
              cat /tmp/tenant-prelogin-next.log
              exit 1
            fi
            sleep 2
          done
          cat /tmp/tenant-prelogin-next.log
          exit 1
      - name: Verify first-run setup, registration, resend and verification as two independent applicants beside a higher-ID victim
        run: node --import tsx scripts/qa/tenant-prelogin-http.mjs
      - name: Show localhost-only diagnostic logs on failure
        if: failure()
        run: |
          cat /tmp/tenant-prelogin-next.log || true
          cat /tmp/tenant-prelogin-sink.log || true
