name: Pre-login tenant boundary (fictional PG16 HTTP; loopback mail only; no money)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - '.github/workflows/tenant-prelogin-http.yml'
      - 'scripts/qa/tenant-prelogin-*.mjs'
      - 'tests/tenant-prelogin-contract.test.mjs'
      - 'src/lib/signup-pending-recovery.ts'
      - 'src/app/api/setup/**'
      - 'src/app/api/intake-challenge/**'
      - 'src/app/api/signup/**'
      - 'src/app/api/auth/login/**'
      - 'src/app/api/auth/me/**'
      - 'src/app/api/employees/route.ts'
      - 'src/lib/auth.ts'
      - 'src/lib/access.ts'
      - 'src/lib/crypto.ts'
      - 'src/lib/tokens.ts'
      - 'src/lib/validation.ts'
      - 'src/lib/mailer.ts'
      - 'src/lib/mail-provider.ts'
      - 'src/lib/rate-limit*.ts'
      - 'src/lib/saas-launch-config.ts'
      - 'src/lib/saas-billing-schema.ts'
      - 'src/lib/public-intake-proof*.ts'
      - 'src/lib/private-pilot-invite.ts'
      - 'src/lib/security-request.ts'
      - 'src/lib/security-secret.ts'
      - 'src/lib/critical-release-flags.ts'
      - 'src/db/**'
      - 'scripts/qa/tenant-table-http.mjs'
      - 'scripts/qa/tenant-table-env.mjs'
      - 'scripts/qa/apply-isolated-baseline.mjs'

permissions:
  contents: read

concurrency:
  group: tenant-prelogin-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fictional-prelogin-http:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TENANT_PRELOGIN_MODE: fictional-pg16-http
      PAYMONGO_DISBURSEMENTS_ENABLED: 'false'
      XENDIT_PAYOUTS_ENABLED: 'false'
      XENDIT_BILLING_ENABLED: 'false'
      WORKER_ENABLED: 'false'
      CENTRAL_SCHEDULER_ENABLED: 'false'
      FINAL_PAY_SIGNED_REVIEW_ENABLED: 'false'
      EXACT_THIRTEENTH_CENTAVOS_ENABLED: 'false'
      PAYROLL_CALCULATION_HISTORY_ENABLED: 'false'
      NEXT_CSP_ENABLED: 'false'
      PAYMONGO_SECRET_KEY: ''
      XENDIT_SECRET_KEY: ''
      RESEND_API_KEY: ''
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact PR head
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Export disposable localhost targets, loopback mail address and throwaway secrets; disable all providers and workers
        shell: bash
        run: |
          set -euo pipefail
          # Read the shared synthetic base; mask even fictional credentials before exporting.
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { TENANT_TABLE_BASE_ENV } from './scripts/qa/tenant-table-env.mjs';
          for (const [key, value] of Object.entries(TENANT_TABLE_BASE_ENV)) {
            if (value && /SECRET|TOKEN|KEY|DATABASE_URL/.test(key)) console.log('::add-mask::' + value);
            appendFileSync(process.env.GITHUB_ENV, key + '=' + value + '\n');
          }
          NODE
          proof_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$proof_secret"
          {
            echo 'TENANT_PRELOGIN_MODE=fictional-pg16-http'
            echo 'XENDIT_BILLING_ENABLED=false'
            echo 'PAYMONGO_DISBURSEMENTS_ENABLED=false'
            echo 'XENDIT_PAYOUTS_ENABLED=false'
            echo 'WORKER_ENABLED=false'
            echo 'CENTRAL_SCHEDULER_ENABLED=false'
            echo 'FINAL_PAY_SIGNED_REVIEW_ENABLED=false'
            echo 'EXACT_THIRTEENTH_CENTAVOS_ENABLED=false'
            echo 'PAYROLL_CALCULATION_HISTORY_ENABLED=false'
            echo 'NEXT_CSP_ENABLED=false'
            echo 'PRIVATE_PILOT_INVITE_ENABLED=false'
            echo 'PAYMONGO_SECRET_KEY='
            echo 'XENDIT_SECRET_KEY='
            echo 'RESEND_API_KEY='
            echo 'SMTP_URL=smtp://127.0.0.1:2525'
            echo 'PUBLIC_SIGNUP_MODE=pilot'
            echo 'PUBLIC_INTAKE_PROOF_ENABLED=true'
            echo "PUBLIC_INTAKE_PROOF_SECRET=$proof_secret"
            echo 'TRUSTED_PROXY_HOPS=1'
          } >> "$GITHUB_ENV"
      - name: Fail closed on incorrect proof contracts and synthetic targets
        run: |
          node --check scripts/qa/tenant-prelogin-smtp-sink.mjs
          node --check scripts/qa/tenant-prelogin-contract.mjs
          node --check scripts/qa/tenant-prelogin-http.mjs
          node --test tests/tenant-prelogin-contract.test.mjs
      - name: Generate throwaway encryption keys and webhook secret
        shell: bash
        run: |
          set -euo pipefail
          for name in PII_ENCRYPTION_KEY BANK_DATA_ENCRYPTION_KEY; do
            key=$(openssl rand -hex 32)
            echo "::add-mask::$key"
            echo "$name=$key" >> "$GITHUB_ENV"
          done
          secret="whsec_$(openssl rand -base64 32 | tr -d '\n')"
          echo "::add-mask::$secret"
          echo "RESEND_WEBHOOK_SECRET=$secret" >> "$GITHUB_ENV"
      - name: Initialize disposable PostgreSQL 16
        run: npm run db:push
      - name: Apply only reviewed fictional baseline objects
        run: node scripts/qa/apply-isolated-baseline.mjs
      - name: Build production-mode app against the disposable database
        run: npm run build
      - name: Start production-mode Next on localhost only
        shell: bash
        run: |
          set -euo pipefail
          nohup npm start -- -H 127.0.0.1 > /tmp/tenant-prelogin-next.log 2>&1 &
          server=$!
          for attempt in $(seq 1 60); do
            if curl --silent --fail "$SECURITY_SMOKE_URL/login" > /dev/null; then exit 0; fi
            if ! kill -0 "$server" 2>/dev/null; then echo 'PRELOGIN_LOOPBACK_START_FAILED'; exit 1; fi
            sleep 2
          done
          echo 'PRELOGIN_LOOPBACK_START_TIMED_OUT'
          exit 1
      - name: Verify first-run setup, registration, resend and verification as two independent applicants beside a higher-ID victim (the proof hosts the loopback mail sink)
        run: node --import tsx scripts/qa/tenant-prelogin-http.mjs
      - name: Keep request, mailbox and database diagnostics out of public logs
        if: failure()
        run: echo 'Pre-login check failed; raw application log intentionally not published.'
