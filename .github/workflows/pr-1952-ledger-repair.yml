name: PR 1952 ledger regeneration (temporary, no production)
on:
  push:
    branches: [fix/tenant-oidc-linked-identity-employer-scope-20261112]
    paths: [.github/workflows/pr-1952-ledger-repair.yml]
permissions: {}
concurrency:
  group: pr-1952-ledger-repair
  cancel-in-progress: false
jobs:
  regenerate-and-test:
    if: github.repository == 'erwinmehehe/payrollph' && github.ref == 'refs/heads/fix/tenant-oidc-linked-identity-employer-scope-20261112'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Regenerate only reviewed tracking documents and remove this temporary workflow
        run: |
          set -euo pipefail
          git rm -- .github/workflows/pr-1952-ledger-repair.yml
          node scripts/qa/tenant-studio-post-credit.mjs --write
          node scripts/qa/tenant-studio-post-credit.mjs --check
          node scripts/qa/tenant-oidc-full-credit.mjs --check
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const path = 'scripts/qa/tenant-isolation-coverage-manifest.json';
          const before = JSON.parse(execFileSync('git', ['show', 'HEAD:' + path], {maxBuffer: 16 * 1024 * 1024}));
          const after = JSON.parse(readFileSync(path, 'utf8'));
          assert.equal(after.metrics.coveredAfter, 458);
          assert.equal(after.metrics.gap, 5);
          assert.equal(after.scopedPages.filter(row => row.status === 'GAP').length, 16);
          delete before.acceptanceStatus;
          delete after.acceptanceStatus;
          assert.deepEqual(after, before, 'Regeneration must not alter any method, page, proof receipt, source pin, count or security gate');
          const allowed = new Set(['.github/workflows/pr-1952-ledger-repair.yml', path,
            'docs/engineering/tenant-isolation-coverage-inventory.md',
            'docs/engineering/tenant-isolation-closure-plan.md']);
          const changed = execFileSync('git', ['diff', '--name-only', 'HEAD'], {encoding: 'utf8'}).trim().split('\n');
          assert.equal(changed.length, 4);
          for (const file of changed) assert.ok(allowed.has(file), 'Unexpected changed file: ' + file);
          console.log('Verified: documentation-only reconciliation; every method, receipt and security gate unchanged.');
          NODE
      - name: Run the entire MJS guard suite without skipping failures
        run: |
          set +e
          node --test --test-concurrency=1 tests/*.test.mjs > /tmp/pr1952-unit.tap 2>&1
          result=$?
          set -e
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const lines = readFileSync('/tmp/pr1952-unit.tap', 'utf8').split('\n');
          for (let i = 0; i < lines.length; i++) {
            if (/^not ok /.test(lines[i])) console.log(lines.slice(Math.max(0, i - 1), i + 100).join('\n'));
          }
          console.log(lines.filter(line => /^# (tests|pass|fail|cancelled|skipped|duration_ms)/.test(line)).join('\n'));
          NODE
          exit "$result"
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Package the validated three-file repair
        env:
          SOURCE_HEAD: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync, mkdirSync, writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const paths = ['scripts/qa/tenant-isolation-coverage-manifest.json',
            'docs/engineering/tenant-isolation-coverage-inventory.md',
            'docs/engineering/tenant-isolation-closure-plan.md'];
          mkdirSync('/tmp/pr1952-validated', {recursive: true});
          const files = paths.map(path => ({path, content: readFileSync(path, 'utf8')}));
          const report = readFileSync('/tmp/pr1952-unit.tap', 'utf8').split('\n').filter(line => /^# (tests|pass|fail|cancelled|skipped|duration_ms)/.test(line));
          writeFileSync('/tmp/pr1952-validated/repair.json', JSON.stringify({sourceHead: process.env.SOURCE_HEAD, report, files}));
          console.log('Validated repair bundle SHA256: ' + createHash('sha256').update(readFileSync('/tmp/pr1952-validated/repair.json')).digest('hex'));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: pr1952-validated-ledger-repair
          path: /tmp/pr1952-validated/repair.json
          retention-days: 2
          if-no-files-found: error
  stage-unreferenced-commit:
    needs: regenerate-and-test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pr1952-validated-ledger-repair
          path: /tmp/pr1952-validated
      - name: Stage validated Git objects only; never update a ref or merge
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_HEAD: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const repo = 'erwinmehehe/payrollph';
          const bundle = JSON.parse(readFileSync('/tmp/pr1952-validated/repair.json', 'utf8'));
          assert.equal(bundle.sourceHead, process.env.SOURCE_HEAD);
          assert.ok(bundle.report.includes('# fail 0'));
          assert.ok(bundle.report.includes('# cancelled 0'));
          const paths = ['docs/engineering/tenant-isolation-closure-plan.md',
            'docs/engineering/tenant-isolation-coverage-inventory.md',
            'scripts/qa/tenant-isolation-coverage-manifest.json'];
          assert.deepEqual(bundle.files.map(file => file.path).sort(), paths);
          const api = async (path, data) => {
            assert.ok(path.startsWith('/git/'));
            const response = await fetch('https://api.github.com/repos/' + repo + path, {
              method: data ? 'POST' : 'GET',
              headers: {'Accept': 'application/vnd.github+json', 'Authorization': 'Bearer ' + process.env.GH_TOKEN,
                'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json'},
              ...(data ? {body: JSON.stringify(data)} : {})
            });
            if (!response.ok) throw new Error('Git object staging failed: ' + response.status + ' ' + await response.text());
            return response.json();
          };
          const parent = await api('/git/commits/' + bundle.sourceHead);
          const tree = [];
          for (const file of bundle.files) {
            assert.equal(typeof file.content, 'string');
            assert.ok(file.content.length > 100);
            const blob = await api('/git/blobs', {encoding: 'utf-8', content: file.content});
            tree.push({path: file.path, mode: '100644', type: 'blob', sha: blob.sha});
          }
          tree.push({path: '.github/workflows/pr-1952-ledger-repair.yml', mode: '100644', type: 'blob', sha: null});
          const staged = await api('/git/trees', {base_tree: parent.tree.sha, tree});
          const commit = await api('/git/commits', {
            message: 'fix(qa): regenerate reconciled OIDC and Worker 360 tracking ledger\n\nPreserve all method receipts, source pins, counts and security gates.\nRemove the temporary validation workflow; no deployment or production actions.\n\n' + bundle.report.join('\n'),
            tree: staged.sha, parents: [bundle.sourceHead]
          });
          console.log(JSON.stringify({stagedCommit: commit.sha, tree: staged.sha, parent: bundle.sourceHead,
            report: bundle.report, files: tree, branchUpdated: false}));
          NODE
