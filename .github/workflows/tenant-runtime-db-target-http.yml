name: Runtime database target privacy (fictional PG16 HTTP)
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - '.github/workflows/tenant-runtime-db-target-http.yml'
      - 'scripts/qa/tenant-runtime-db-target-*.mjs'
      - 'tests/tenant-runtime-db-target.test.mjs'
      - 'docs/qa/tenant-runtime-db-target.md'
      - 'src/app/api/readiness/database-target/**'
      - 'src/lib/runtime-database-identity.ts'
      - 'src/lib/operational-secret.ts'
      - 'src/lib/security-secret.ts'
      - 'src/db/**'
      - 'scripts/qa/tenant-table-http.mjs'
      - 'scripts/qa/tenant-table-env.mjs'
      - 'scripts/qa/apply-isolated-baseline.mjs'
      - 'docs/sql/source-baseline-supplement.sql'
      - 'drizzle/**'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: runtime-db-target-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  runtime-db-target:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Strict fictional-only PG16 session metadata and no-money profile
        shell: bash
        run: |
          set -euo pipefail
          node scripts/qa/tenant-table-env.mjs compliance-posts >> "$GITHUB_ENV"
          echo 'TENANT_RUNTIME_DB_TARGET_MODE=fictional-disposable-only' >> "$GITHUB_ENV"
          echo 'PGOPTIONS=-c neon.project_id=ci-fictional-project -c neon.branch_id=br-fictional-branch -c neon.endpoint_id=ep-fictional-endpoint' >> "$GITHUB_ENV"
      - name: Negative controls and source-pinned contract (no HTTP)
        run: |
          node --check scripts/qa/tenant-runtime-db-target-contract.mjs
          node --check scripts/qa/tenant-runtime-db-target-http.mjs
          node --test tests/tenant-runtime-db-target.test.mjs
      - name: Ephemeral fictional secrets (never production or external)
        shell: bash
        run: |
          set -euo pipefail
          for name in READINESS_TOKEN PII_ENCRYPTION_KEY BANK_DATA_ENCRYPTION_KEY; do
            token=$(openssl rand -hex 32)
            echo "::add-mask::$token"
            echo "$name=$token" >> "$GITHUB_ENV"
          done
          webhook_secret="whsec_$(openssl rand -base64 32 | tr -d '\n')"
          echo "::add-mask::$webhook_secret"
          echo "RESEND_WEBHOOK_SECRET=$webhook_secret" >> "$GITHUB_ENV"
      - run: npm run db:push
      - run: node scripts/qa/apply-isolated-baseline.mjs
      - run: npm run build
      - name: Start production-mode local Next instance
        shell: bash
        run: |
          set -euo pipefail
          nohup npm start -- -H 127.0.0.1 > /tmp/runtime-db-target-server.log 2>&1 &
          for attempt in {1..40}; do
            if curl --silent --fail "$SECURITY_SMOKE_URL" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/runtime-db-target-server.log
          exit 1
      - name: Protected real HTTP/PG16 database session identity and immutable tenants
        run: env -u NODE_ENV node --import tsx scripts/qa/tenant-runtime-db-target-http.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tenant-runtime-db-target-fictional-pg16
          path: outputs/tenant-runtime-db-target.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Display localhost log only on failed test
        if: failure()
        run: cat /tmp/runtime-db-target-server.log || true
