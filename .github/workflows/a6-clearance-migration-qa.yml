name: A-6 Offboarding Waiver DBA Proposal Rehearsal
on:
  pull_request:
    branches: [main]
    paths:
      - "docs/engineering/migration-proposals/offboarding-clearance-a6.sql"
      - "scripts/rehearse-a6-clearance-postgres.mjs"
      - ".github/workflows/a6-clearance-migration-qa.yml"
  workflow_dispatch:
# Supersede only older PR attempts; main/manual runs retain independent groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  rollback-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
      DEMO_MODE: "false"
      PAYMONGO_DISBURSEMENTS_ENABLED: "false"
      XENDIT_PAYOUTS_ENABLED: "false"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Create disposable schema only, not Neon
        run: npm run db:push
      - name: Rehearse tenant-safe immutable waiver proposal, roll back everything
        run: node scripts/rehearse-a6-clearance-postgres.mjs
      - name: Existing behavioral integration of rollback and revocation
        run: npx tsx --test tests/offboarding-clearance-integration.test.ts tests/offboarding-clearance-behavior.test.ts
