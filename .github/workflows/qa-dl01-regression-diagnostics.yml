name: DL-01 targeted regression acceptance

on:
  push:
    branches: [qa/tenant-isolation-dl01-evidence-20261021]
    paths:
      - .github/workflows/qa-dl01-regression-diagnostics.yml
      - tests/remittance-month-close-read.test.ts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-regression:
    name: Original failure reproduction and repaired proof guards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      TZ: Asia/Manila
      BASELINE_SHA: 9528cc44dfe521158d49a7682041dcf2737b9591
      PAYMONGO_DISBURSEMENTS_ENABLED: "false"
      XENDIT_PAYOUTS_ENABLED: "false"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Reproduce the original stale-count failure on the same source tree
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASELINE_SHA"
          target=tests/remittance-month-close-read.test.ts
          cp "$target" "$RUNNER_TEMP/remittance-month-close-read.fixed.ts"
          trap 'cp "$RUNNER_TEMP/remittance-month-close-read.fixed.ts" "$target"' EXIT
          git show "$BASELINE_SHA:$target" > "$target"
          set +e
          npx --no-install tsx --test --test-concurrency=1 --test-reporter=spec "$target" > "$RUNNER_TEMP/original-regression.log" 2>&1
          baseline_status=$?
          set -e
          cat "$RUNNER_TEMP/original-regression.log"
          if [ "$baseline_status" -eq 0 ]; then
            echo "::error::Original regression did not reproduce."
            exit 1
          fi
          grep -F "Retain five attendance and add four HCM proof methods" "$RUNNER_TEMP/original-regression.log"
          grep -F "78 !== 76" "$RUNNER_TEMP/original-regression.log"
          cp "$RUNNER_TEMP/remittance-month-close-read.fixed.ts" "$target"
          trap - EXIT
          git diff --exit-code -- "$target"
      - name: Run all repaired remittance read tests
        run: npx --no-install tsx --test --test-concurrency=1 --test-reporter=spec tests/remittance-month-close-read.test.ts
      - name: Verify count reconciliation and all DL-01 source-proof guards
        run: >-
          node --test --test-concurrency=1 --test-reporter=spec
          tests/tenant-isolation-coverage-inventory.test.mjs
          tests/tenant-isolation-closure-plan.test.mjs
          tests/tenant-dl01-evidence-order.test.mjs
          tests/tenant-manifest-driven-http.test.mjs
          tests/tenant-static-import-template.test.mjs
