name: DL-01 regression failure diagnostics

on:
  push:
    branches: [qa/tenant-isolation-dl01-evidence-20261021]
    paths:
      - .github/workflows/qa-dl01-regression-diagnostics.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  original-failure:
    name: Extract original shard 1 failure (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read the existing disposable-CI log without rerunning tests
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/119064864504/logs" \
            -o "$RUNNER_TEMP/pr1322-shard1.log"
      - name: Print bounded assertion diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          lines = (Path(os.environ['RUNNER_TEMP']) / 'pr1322-shard1.log').read_text().splitlines()
          matches = [i for i, line in enumerate(lines) if re.search(r'\bnot ok\b|AssertionError|ERR_ASSERTION|error:|Error:', line)]
          print(f'Original job: 119064864504; log lines: {len(lines)}; diagnostic matches: {len(matches)}')
          selected = set()
          for index in matches:
              selected.update(range(max(0, index - 3), min(len(lines), index + 45)))
          selected.update(range(max(0, len(lines) - 25), len(lines)))
          for index in sorted(selected)[:240]:
              print(f'{index + 1}: {lines[index]}')
          if not matches:
              raise SystemExit('No assertion diagnostics found; inspect the original job directly.')
          PY
