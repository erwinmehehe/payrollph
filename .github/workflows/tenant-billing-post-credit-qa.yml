name: Tenant legacy Billing POST credit reproof (fictional PG16; zero money)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - ".github/workflows/tenant-billing-paymongo-http.yml"
      - "scripts/qa/tenant-billing-paymongo-preload.mjs"
      - "scripts/qa/tenant-billing-paymongo-http.mjs"
      - "tests/tenant-billing-paymongo-contract.test.mjs"
      - "docs/qa/tenant-billing-paymongo-http.md"
      - ".github/workflows/tenant-billing-post-credit-qa.yml"
      - "scripts/qa/tenant-billing-post-credit-receipt.json"
      - "scripts/qa/tenant-billing-post-credit.mjs"
      - "tests/tenant-billing-post-credit.test.mjs"
      - "scripts/qa/tenant-isolation-coverage-manifest.json"
      - "docs/engineering/tenant-isolation-coverage-inventory.md"
      - "docs/engineering/tenant-isolation-closure-plan.md"
      - "src/app/api/billing/route.ts"
      - "src/lib/paymongo.ts"
      - "src/lib/security-request.ts"
      - "src/lib/access.ts"
      - "src/lib/saas-billing-schema.ts"
      - "src/db/**"

permissions:
  contents: read

concurrency:
  group: tenant-billing-post-credit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  isolated-legacy-checkout:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GITHUB_ACTIONS: "true"
      CI: "true"
      TZ: Asia/Manila
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      TENANT_PAYMONGO_PROOF: fiction-only
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
      SECURITY_SMOKE_URL: http://127.0.0.1:3000
      APP_BASE_URL: https://payroll.example.test
      TRUSTED_APP_ORIGINS: http://127.0.0.1:3000
      DEMO_MODE: "false"
      REQUIRE_PRIVILEGED_MFA: "true"
      WORKER_ENABLED: "false"
      CENTRAL_SCHEDULER_ENABLED: "false"
      XENDIT_BILLING_ENABLED: "false"
      XENDIT_PAYOUTS_ENABLED: "false"
      PAYMONGO_DISBURSEMENTS_ENABLED: "false"
      PAYMONGO_SECRET_KEY: ci-fictional-paymongo-checkout-no-provider-access
      PAYMONGO_WEBHOOK_SECRET: ""
      XENDIT_SECRET_KEY: ""
      XENDIT_PAYOUT_SECRET_KEY: ""
      RESEND_API_KEY: ""
      SMTP_URL: ""
      STRIPE_SECRET_KEY: ""
      MAYA_SECRET_KEY: ""
      OPENAI_API_KEY: ""
      NEXT_CSP_ENABLED: "false"

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Confirm exact pull request head
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install pinned application and test dependencies
        run: npm ci --include=dev
      - name: Refuse unsafe environment and validate contract before database work
        run: |
          node --check scripts/qa/tenant-billing-paymongo-preload.mjs
          node --check scripts/qa/tenant-billing-paymongo-http.mjs
          node --test tests/tenant-billing-paymongo-contract.test.mjs
      - name: Refuse status-only credits; verify original source pins and exact receipt
        run: |
          node --check scripts/qa/tenant-billing-post-credit.mjs
          node --test tests/tenant-billing-post-credit.test.mjs
      - name: Generate fictional test-only signing and encryption keys
        shell: bash
        run: |
          set -euo pipefail
          for key in BANK_DATA_ENCRYPTION_KEY PII_ENCRYPTION_KEY TOTP_ENCRYPTION_KEY; do
            value=$(openssl rand -hex 32)
            echo "::add-mask::$value"
            echo "$key=$value" >> "$GITHUB_ENV"
          done
      - name: Create empty disposable PostgreSQL 16 schema
        run: npm run db:push
      - name: Apply reviewed disposable schema baseline
        run: node scripts/qa/apply-isolated-baseline.mjs
      - name: Compile production-mode Next without live provider credentials
        run: npm run build
      - name: Start localhost server with egress-blocking fictional PayMongo transport
        shell: bash
        run: |
          set -euo pipefail
          test ! -e /tmp/payrollph-tenant-paymongo-checkout.ndjson
          nohup env TENANT_PAYMONGO_PRELOAD=enabled NODE_OPTIONS="--import=$(pwd)/scripts/qa/tenant-billing-paymongo-preload.mjs" npm start -- -H 127.0.0.1 -p 3000 > /tmp/tenant-billing-paymongo-next.log 2>&1 &
          server=$!
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:3000/login > /dev/null; then exit 0; fi
            if ! kill -0 "$server" 2>/dev/null; then break; fi
            sleep 2
          done
          tail -n 120 /tmp/tenant-billing-paymongo-next.log
          exit 1
      - name: Prove 2 own billing POSTs, real foreign denials and immutable victim SQL
        run: node --import tsx scripts/qa/tenant-billing-paymongo-http.mjs
      - name: Server diagnostics on failure
        if: failure()
        run: tail -n 120 /tmp/tenant-billing-paymongo-next.log || true
