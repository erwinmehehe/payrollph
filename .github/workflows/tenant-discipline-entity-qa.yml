name: Tenant discipline legal employer (fictional PG16 real HTTP)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - ".github/workflows/tenant-discipline-entity-qa.yml"
      - "src/app/api/discipline/route.ts"
      - "scripts/qa/tenant-discipline-entity-http.mjs"
      - "tests/tenant-discipline-case-boundary.test.mjs"
      - "scripts/qa/tenant-isolation-coverage-manifest.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: discipline-entity-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  discipline-entity:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: "true"
      GITHUB_ACTIONS: "true"
      TZ: Asia/Manila
      NEXT_TELEMETRY_DISABLED: "1"
      BUILD_BLOCK_ACCEPTANCE_MODE: synthetic-postgres-only
      TENANT_DISCIPLINE_ENTITY_PROOF: fictional-pg16-only
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
      SECURITY_SMOKE_URL: http://127.0.0.1:3000
      APP_BASE_URL: http://127.0.0.1:3000
      TRUSTED_APP_ORIGINS: http://127.0.0.1:3000
      MULTI_ENTITY_ENABLED: "true"
      REQUIRE_PRIVILEGED_MFA: "true"
      DEMO_MODE: "false"
      WORKER_ENABLED: "false"
      CENTRAL_SCHEDULER_ENABLED: "false"
      XENDIT_BILLING_ENABLED: "false"
      XENDIT_PAYOUTS_ENABLED: "false"
      PAYMONGO_DISBURSEMENTS_ENABLED: "false"
      NEXT_CSP_ENABLED: "false"
      OPENAI_API_KEY: ""
      CRON_SECRET: ""
      WORKER_TOKEN: ""
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact PR-head checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Verify strict source and negative controls without DB
        run: |
          node --check scripts/qa/tenant-discipline-entity-http.mjs
          node --test tests/tenant-discipline-case-boundary.test.mjs
      - name: Generate fictional-only ephemeral encryption keys
        shell: bash
        run: |
          for name in BANK_DATA_ENCRYPTION_KEY PII_ENCRYPTION_KEY TOTP_ENCRYPTION_KEY; do
            key=$(openssl rand -hex 32)
            echo "::add-mask::$key"
            echo "$name=$key" >> "$GITHUB_ENV"
          done
      - name: Install isolated PostgreSQL schema
        run: npm run db:push
      - name: Apply reviewed isolated baseline
        run: node scripts/qa/apply-isolated-baseline.mjs
      - name: Build localhost-only production-mode app
        run: npm run build
      - name: Start Next on loopback only
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/tenant-discipline-entity.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:3000/login >/dev/null; then exit 0; fi
            sleep 2
          done
          tail -n 90 /tmp/tenant-discipline-entity.log
          exit 1
      - name: Prove A and B legal employers under one company plus higher-ID victim
        env:
          NODE_ENV: production
        run: node --import tsx scripts/qa/tenant-discipline-entity-http.mjs
      - name: Show bounded server log on failure
        if: failure()
        run: tail -n 90 /tmp/tenant-discipline-entity.log || true
