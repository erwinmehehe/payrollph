name: SAML public metadata (fictional PG16 HTTP, zero method credit)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - 'src/app/api/auth/saml/metadata/**'
      - 'src/lib/saml.ts'
      - 'src/lib/security-request.ts'
      - 'scripts/qa/tenant-saml-metadata-public-*.mjs'
      - 'tests/tenant-saml-metadata-public.test.mjs'
      - 'scripts/qa/tenant-table-env.mjs'
      - '.github/workflows/tenant-saml-metadata-public-http.yml'

permissions:
  contents: read

concurrency:
  group: tenant-saml-public-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  public-saml-metadata:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TENANT_SAML_METADATA_MODE: isolated-ci-only
      PAYMONGO_SECRET_KEY: ''
      XENDIT_SECRET_KEY: ''
      RESEND_API_KEY: ''
      OPENAI_API_KEY: ''
      WORKER_ENABLED: 'false'
      CENTRAL_SCHEDULER_ENABLED: 'false'
      XENDIT_BILLING_ENABLED: 'false'
      XENDIT_PAYOUTS_ENABLED: 'false'
      PAYMONGO_DISBURSEMENTS_ENABLED: 'false'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Export isolated disposable PostgreSQL environment
        shell: bash
        run: |
          set -euo pipefail
          node scripts/qa/tenant-table-env.mjs compliance-posts >> "$GITHUB_ENV"
          echo 'TENANT_SAML_METADATA_MODE=isolated-ci-only' >> "$GITHUB_ENV"
      - name: Source pin, negative controls, and proof syntax
        run: |
          node --check scripts/qa/tenant-saml-metadata-public-contract.mjs
          node --check scripts/qa/tenant-saml-metadata-public-http.mjs
          node --test tests/tenant-saml-metadata-public.test.mjs
      - name: Ephemeral encryption keys only
        shell: bash
        run: |
          set -euo pipefail
          for name in PII_ENCRYPTION_KEY BANK_DATA_ENCRYPTION_KEY; do
            key=$(openssl rand -hex 32)
            echo "::add-mask::$key"
            echo "$name=$key" >> "$GITHUB_ENV"
          done
          secret="whsec_$(openssl rand -base64 32 | tr -d '\n')"
          echo "::add-mask::$secret"
          echo "RESEND_WEBHOOK_SECRET=$secret" >> "$GITHUB_ENV"
      - name: Create disposable PG16 schema and test-only baseline
        run: |
          npm run db:push
          node scripts/qa/apply-isolated-baseline.mjs
      - name: Build production Next against disposable DB
        run: npm run build
      - name: Start localhost-only Next server
        shell: bash
        run: |
          set -euo pipefail
          nohup npm start -- -H 127.0.0.1 > /tmp/tenant-saml-public.log 2>&1 &
          server=$!
          for attempt in $(seq 1 60); do
            if curl -fsS "$SECURITY_SMOKE_URL/login" >/dev/null; then exit 0; fi
            if ! kill -0 "$server" 2>/dev/null; then break; fi
            sleep 2
          done
          tail -n 40 /tmp/tenant-saml-public.log || true
          exit 1
      - name: Three-employer SAML XML, forged selectors, unchanged SQL
        run: node --import tsx scripts/qa/tenant-saml-metadata-public-http.mjs
      - name: Print bounded localhost failures only
        if: failure()
        run: |
          if test -f /tmp/tenant-saml-public.log; then
            grep -Ei 'Error:|cause:|failed|code:' /tmp/tenant-saml-public.log | tail -n 20 | cut -c 1-160 || true
          fi
