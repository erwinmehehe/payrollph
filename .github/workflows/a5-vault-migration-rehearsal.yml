name: A-5 201 File Database Migration Rehearsal

on:
  pull_request:
    paths:
      - "src/db/schema.ts"
      - "src/lib/document-schema-compat.ts"
      - "scripts/check-a5-legacy-document-schema.ts"
      - "src/lib/employee-document-vault.ts"
      - "src/lib/hcm-documents.ts"
      - "src/app/api/documents/**"
      - "src/app/api/hcm/documents/**"
      - "docs/engineering/migration-proposals/employee-document-vault-a5.sql"
      - "scripts/rehearse-employee-document-vault-migration.cjs"
      - ".github/workflows/a5-vault-migration-rehearsal.yml"

# Supersede only older PR attempts; main/manual runs retain independent groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  a5-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      TZ: Asia/Manila
      A5_DISPOSABLE_SCHEMA_ONLY: "true"
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Create isolated fresh Drizzle schema
        run: npm run db:push
      - name: Test legacy document schema reads, writes and flag rollback (disposable PG)
        run: npx tsx scripts/check-a5-legacy-document-schema.ts
      - name: Reapply proposed A-5 SQL in rollback-only transaction
        run: node scripts/rehearse-employee-document-vault-migration.cjs
