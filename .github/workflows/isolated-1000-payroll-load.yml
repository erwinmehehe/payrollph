name: Isolated 1,000-Worker Payroll Stress and Reconciliation (Synthetic, No Money)

on:
  push:
    branches:
      - qa/1000-employee-disposable-benchmark-20261106
    paths:
      - "scripts/qa/isolated-1000-payroll-load.ts"
      - ".github/workflows/isolated-1000-payroll-load.yml"

permissions:
  contents: read

concurrency:
  group: qa1000-single-branch
  cancel-in-progress: true

jobs:
  isolated-1000-workers:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: "true"
      TZ: Asia/Manila
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
      QA_URL: http://127.0.0.1:3000
      APP_BASE_URL: http://127.0.0.1:3000
      TRUSTED_APP_ORIGINS: http://127.0.0.1:3000
      DEMO_MODE: "false"
      PAYMONGO_DISBURSEMENTS_ENABLED: "false"
      XENDIT_PAYOUTS_ENABLED: "false"
      XENDIT_PAYOUTS_LIVE_APPROVED: "false"
      AUTOMATION_LANGUAGE_STUDIO_ENABLED: "false"
      OPENAI_AUTOMATION_DRAFT_ENABLED: "false"
      OPENAI_API_KEY: ""
      PAYMONGO_SECRET_KEY: ""
      XENDIT_SECRET_KEY: ""
      RESEND_API_KEY: ""
      POSTMARK_SERVER_TOKEN: ""
      WORKER_ENABLED: "false"
      CENTRAL_SCHEDULER_ENABLED: "false"
      WFM_PUNCH_EVIDENCE_ENABLED: "false"
      WFM_GEOFENCE_PILOT_ENABLED: "false"
      REQUIRE_PRIVILEGED_MFA: "false"
      SETUP_TOKEN: qa1000-only-fixture-setup-token-0000000000000000000
      READINESS_TOKEN: qa1000-only-readiness-token-000000000000000000
      WORKER_TOKEN: qa1000-only-worker-token-0000000000000000000000
      TOTP_ENCRYPTION_KEY: "1111111111111111111111111111111111111111111111111111111111111111"

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
          POSTGRES_INITDB_ARGS: "--encoding=UTF8"
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Create temporary fictional-fixture-only encryption secrets
        shell: bash
        run: |
          bank_key=$(openssl rand -hex 32)
          pii_key=$(openssl rand -hex 32)
          echo "::add-mask::$bank_key"
          echo "::add-mask::$pii_key"
          echo "BANK_DATA_ENCRYPTION_KEY=$bank_key" >> "$GITHUB_ENV"
          echo "PII_ENCRYPTION_KEY=$pii_key" >> "$GITHUB_ENV"
      - name: Apply guarded schema to disposable PG16 only
        run: npm run db:push
      - name: Apply isolated audit guard
        run: node scripts/qa/apply-audit-0109-isolated.mjs
      - name: Apply existing isolated cutover baseline
        run: node scripts/qa/apply-isolated-baseline.mjs
      - name: Check source types
        run: npm run typecheck
      - name: Build localhost application
        run: npm run build
      - name: Start localhost application
        shell: bash
        run: |
          nohup npm start -- -H 127.0.0.1 > /tmp/qa1000-app.log 2>&1 &
          echo $! > /tmp/qa1000-app.pid
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 5 http://127.0.0.1:3000/login > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Isolated localhost app failed to start"
          exit 1
      - name: Execute mixed-pay one-cutoff 1,000-worker test
        run: npx tsx scripts/qa/isolated-1000-payroll-load.ts
      - name: Show truncated localhost error log on failure
        if: failure()
        run: tail -n 100 /tmp/qa1000-app.log || true
      - name: Upload synthetic performance and centavo reconciliation results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: isolated-1000-payroll-performance
          path: qa-artifacts/isolated-1000-payroll-report.json
          if-no-files-found: warn
          retention-days: 14
