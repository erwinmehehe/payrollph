name: Contractor quarterly EWT source schedule (fictional PG16 HTTP)
on:
  push:
    branches: [feat/contractor-ewt-quarter-api-tenant-proof-20261121]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/tenant-contractor-ewt-quarter-http.yml'
      - 'src/app/api/contractors/ewt-quarter/**'
      - 'src/lib/contractor-ewt-quarter.ts'
      - 'src/app/api/contractors/payments/route.ts'
      - 'scripts/qa/tenant-contractor-ewt-quarter-http.mjs'
      - 'scripts/qa/tenant-isolation-coverage-manifest.json'
      - 'scripts/qa/tenant-contractor-ewt-quarter-credit.mjs'
      - 'tests/contractor-ewt-quarter*'
      - 'src/lib/access.ts'
      - 'src/lib/multi-entity*.ts'
      - 'src/lib/government-id-crypto.ts'
      - 'src/db/**'
      - 'drizzle/**'
      - 'package*.json'
permissions:
  contents: read
concurrency:
  group: contractor-ewt-quarter-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  ewt-quarter-pg16:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres -d app_db" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: "Disposable environment - all money, provider, CSP and history flags OFF"
        shell: bash
        run: |
          set -euo pipefail
          node scripts/qa/tenant-table-env.mjs compliance-posts >> "$GITHUB_ENV"
          echo 'PAYROLL_CALCULATION_HISTORY_ENABLED=false' >> "$GITHUB_ENV"
          echo 'PAYROLL_LOAN_DEDUCTION_ACTIVATION_ENABLED=false' >> "$GITHUB_ENV"
          for name in PII_ENCRYPTION_KEY BANK_DATA_ENCRYPTION_KEY TOTP_ENCRYPTION_KEY; do
            key=$(openssl rand -hex 32)
            echo "::add-mask::$key"
            echo "$name=$key" >> "$GITHUB_ENV"
          done
      - name: Source guard and mutation checks (not a substitute for HTTP)
        run: node --test tests/contractor-ewt-quarter-api-contract.test.mjs
      - name: Hand-derived quarterly schedule unit tests
        run: npx tsx --test tests/contractor-ewt-quarter.test.ts
      - name: TypeScript compilation
        run: npm run typecheck
      - name: Prepare empty disposable PostgreSQL 16
        run: npm run db:push
      - name: Apply reviewed disposable PG16 baseline after schema push
        run: node scripts/qa/apply-isolated-baseline.mjs
      - name: Build production-mode localhost application
        run: npm run build
      - name: Four-part real HTTP employer and payee boundary proof
        shell: bash
        run: |
          set -euo pipefail
          npm start -- -H 127.0.0.1 > /tmp/ewt-quarter-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3000/login > /dev/null; then ready=true; break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then break; fi
            sleep 2
          done
          if [ "$ready" != true ]; then tail -n 50 /tmp/ewt-quarter-next.log; exit 1; fi
          node --import tsx scripts/qa/tenant-contractor-ewt-quarter-http.mjs
      - name: Source-pinned credit and repin reconciliation
        run: |
          node scripts/qa/tenant-contractor-ewt-quarter-credit.mjs
          node scripts/qa/tenant-manifest-repin.mjs --base "origin/main"
      - name: Bounded fictional-only diagnostics
        if: failure()
        run: tail -n 40 /tmp/ewt-quarter-next.log || true
