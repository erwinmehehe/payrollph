name: Live RBAC Sandbox Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BASE_URL: https://erwinmehehe-payrollph.vercel.app
      EXPECTED_COMMIT_SHA: ${{ github.sha }}
    steps:
      - name: Wait for exact production deployment
        run: |
          set -euo pipefail
          for attempt in {1..24}; do
            body=$(curl -fsS "$BASE_URL/api/readiness/deployment" || true)
            deployed_sha=$(printf '%s' "$body" | jq -r '.deploymentSha // empty')
            echo "deployment attempt=$attempt deployed_sha=${deployed_sha:-missing} expected=$EXPECTED_COMMIT_SHA"
            if [ "$deployed_sha" = "$EXPECTED_COMMIT_SHA" ]; then
              echo "Exact production commit is live."
              exit 0
            fi
            sleep 10
          done
          echo "Production never reported the expected commit SHA."
          exit 1

      - name: Wait for production demo page
        run: |
          set -euo pipefail
          for attempt in {1..24}; do
            if curl -fsS "$BASE_URL/demo" -o /tmp/demo.html &&
               grep -q "See Linaw from the seat you actually use" /tmp/demo.html; then
              echo "Production demo page is live."
              exit 0
            fi
            echo "Waiting for production deployment ($attempt/24)..."
            sleep 10
          done
          exit 1

      - name: Verify all six RBAC personas on production
        run: |
          set -euo pipefail
          roles=(owner hr payroll checker bookkeeper employee)

          for role in "${roles[@]}"; do
            success=false
            for attempt in {1..24}; do
              status=$(curl -sS                 -D /tmp/demo-switch-headers.txt                 -c /tmp/demo-cookies.txt                 -o /tmp/demo-switch-body.txt                 -w "%{http_code}"                 -X POST "$BASE_URL/api/auth/demo-switch"                 -H "Origin: $BASE_URL"                 -H "Sec-Fetch-Site: same-origin"                 -H "Content-Type: application/json"                 --data "{\"role\":\"${role}\"}")

              echo "role=${role} attempt=${attempt} status=${status}"

              if [ "$status" -ge 200 ] && [ "$status" -lt 300 ] &&
                 grep -q '"ok":true' /tmp/demo-switch-body.txt &&
                 grep -q '"demoDataMode":"synthetic-redacted"' /tmp/demo-switch-body.txt &&
                 grep -q '"sensitiveFieldsPersisted":false' /tmp/demo-switch-body.txt &&
                 grep -q "\"redirectTo\":\"/app?demoRole=${role}\"" /tmp/demo-switch-body.txt; then
                success=true
                break
              fi

              echo "--- response headers ---"
              sed -E 's/^(set-cookie:).*/\1 [redacted]/I' /tmp/demo-switch-headers.txt || true
              echo "--- response body ---"
              cat /tmp/demo-switch-body.txt || true
              echo
              sleep 10
            done

            if [ "$success" != "true" ]; then
              echo "RBAC sandbox failed for role: ${role}"
              exit 1
            fi

            organization_id=$(jq -r '.organizationId // empty' /tmp/demo-switch-body.txt)
            if [ -z "$organization_id" ]; then
              echo "Demo switch did not return an organization id for role: ${role}"
              cat /tmp/demo-switch-body.txt
              exit 1
            fi

            # The workspace shell is client-rendered, so raw HTML is not a valid
            # assertion for the ROLE SANDBOX text. Prove the session instead by
            # loading the app route and an authenticated role-scoped API.
            app_status=$(curl -sS -b /tmp/demo-cookies.txt               -w "%{http_code}" -o "/tmp/${role}.html" "$BASE_URL/app?demoRole=${role}")
            echo "role=${role} endpoint=/app status=${app_status}"
            if [ "$app_status" != "200" ]; then
              echo "The demo workspace shell did not load. Response body is intentionally omitted."
              exit 1
            fi

            if [ "$role" = "employee" ]; then
              endpoint="/api/self/payslips"
              api_status=$(curl -sS -b /tmp/demo-cookies.txt -w "%{http_code}"                 -o "/tmp/${role}-api.json" "$BASE_URL${endpoint}")
              echo "role=${role} endpoint=${endpoint} status=${api_status}"
              if [ "$api_status" != "200" ]; then
                echo "Self-service API failed; response body omitted to protect employee data."
                exit 1
              fi
              jq -e '.employee.employeeNo and .employer.id' "/tmp/${role}-api.json" >/dev/null
            else
              endpoint="/api/dashboard"
              api_status=$(curl -sS -b /tmp/demo-cookies.txt -w "%{http_code}"                 -o "/tmp/${role}-api.json" "$BASE_URL${endpoint}?organizationId=${organization_id}")
              echo "role=${role} endpoint=${endpoint} status=${api_status}"
              if [ "$api_status" != "200" ]; then
                # Do not print error bodies, identity values, cookies or organization IDs.
                api_code=$(jq -r 'if type == "object" then (.code // "unavailable") else "unavailable" end'                   "/tmp/${role}-api.json" 2>/dev/null || echo unavailable)
                echo "Dashboard API failed (sanitized code=${api_code:0:100})."
                exit 1
              fi
              jq -e '.selectedOrganization.id' "/tmp/${role}-api.json" >/dev/null
            fi
          done
