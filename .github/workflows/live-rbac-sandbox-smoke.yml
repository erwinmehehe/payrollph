name: Live RBAC Sandbox Smoke

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-sandbox:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BASE_URL: https://erwinmehehe-payrollph.vercel.app
      EXPECTED_COMMIT_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact GitHub Actions commit (read-only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Wait for exact production deployment
        env:
          PRODUCTION_READINESS_TOKEN: ${{ secrets.PRODUCTION_READINESS_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          if [ "${#PRODUCTION_READINESS_TOKEN}" -lt 32 ]; then
            echo "::error title=Production RBAC verification blocked::PRODUCTION_READINESS_TOKEN is missing or shorter than 32 bytes; confirm protected secret configuration."
            exit 1
          fi
          response_file=$(mktemp)
          trap 'rm -f -- "$response_file"' EXIT
          for attempt in {1..24}; do
            : > "$response_file"
            http_status=$(curl -sS --max-time 15 --proto '=https' \
              -H "x-readiness-token: $PRODUCTION_READINESS_TOKEN" \
              -o "$response_file" -w '%{http_code}' \
              "$BASE_URL/api/readiness/deployment" || true)
            deployed_sha=$(jq -r '
              if type == "object"
                 and (.deploymentSha | type) == "string"
                 and (.deploymentSha | test("^[0-9a-f]{40}$"))
              then .deploymentSha else empty end
            ' "$response_file" 2>/dev/null || true)
            echo "deployment attempt=$attempt http_status=$http_status"
            if [ "$http_status" = "200" ] && [ "$deployed_sha" = "$EXPECTED_COMMIT_SHA" ]; then
              echo "Exact production commit is live."
              exit 0
            fi
            sleep 10
          done
          echo "Production never reported the expected commit SHA; no response bodies were logged."
          exit 1

      # Never invoke token-gated HR fixture writes until the actual deployed
      # PostgreSQL session is the expected Neon target with named relations.
      # Missing tables cause a visible FAIL; never skip or green the privacy test.
      - name: Verify private compensation database readiness (#1015/#1061)
        env:
          PRODUCTION_READINESS_TOKEN: ${{ secrets.PRODUCTION_READINESS_TOKEN }}
          # Source-of-truth: docs/engineering/clean-baseline-cutover-runbook.md.
          # Retain the private exact-session identity/schema guard; the legacy
          # main/neondb target is the fallback, not the post-cutover app DB.
          EXPECTED_NEON_PROJECT_ID: calm-wave-70219564
          EXPECTED_NEON_BRANCH_ID: br-young-leaf-b7ae1g8v
          EXPECTED_NEON_ENDPOINT_ID: ep-aged-surf-b7ru90rs
          EXPECTED_NEON_DATABASE_NAME: payrollph_clean_baseline
        run: |
          set -euo pipefail
          umask 077
          if [ "${#PRODUCTION_READINESS_TOKEN}" -lt 32 ]; then
            echo '::error::Private database readiness token is unavailable.'
            exit 1
          fi
          response_file=$(mktemp)
          trap 'rm -f -- "$response_file"' EXIT
          http_status=$(curl -sS --max-time 20 --proto '=https' \
            -H "x-readiness-token: $PRODUCTION_READINESS_TOKEN" \
            -o "$response_file" -w '%{http_code}' \
            "$BASE_URL/api/readiness/database-target" || true)
          echo "private database readiness http_status=$http_status"
          if [ "$http_status" != 200 ]; then
            echo '::error::Private deployment-to-Neon identity is unavailable; no HR fixture attempted.'
            exit 1
          fi
          node scripts/qa/verify-production-compensation-preflight.mjs "$response_file"
      - name: Read protected demo provisioning boundary (no user provisioning)
        id: demo_boundary
        env:
          PRODUCTION_READINESS_TOKEN: ${{ secrets.PRODUCTION_READINESS_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          response_file=$(mktemp)
          trap 'rm -f -- "$response_file"' EXIT
          status=$(curl -sS --max-time 20 --proto '=https' \
            -H "x-readiness-token: $PRODUCTION_READINESS_TOKEN" \
            -o "$response_file" -w '%{http_code}' \
            "$BASE_URL/api/readiness/demo-provisioning" || true)
          if [ "$status" != 200 ]; then
            echo "::error::Private demo boundary unavailable; HTTP status=$status. Six-role production verification not permitted."
            exit 1
          fi
          mode=$(jq -r --arg sha "$EXPECTED_COMMIT_SHA" '
            if type == "object" and
               .deploymentSha == $sha and
               .evidenceScope == "PRIVATE_DEMO_GUARD_ONLY_NOT_PERSONA_ACCEPTANCE" and
               (.demoProvisioning == "demo_only" or
                .demoProvisioning == "blocked_non_demo_employer")
            then .demoProvisioning else empty end
          ' "$response_file" 2>/dev/null || true)
          case "$mode" in
            demo_only|blocked_non_demo_employer)
              echo "mode=$mode" >> "$GITHUB_OUTPUT"
              echo "Authenticated deployment demo boundary=$mode; no employer metadata logged."
              ;;
            *)
              echo "::error::Demo boundary could not be verified on the expected deployment; fail closed."
              exit 1
              ;;
          esac

      - name: Wait for production demo page
        run: |
          set -euo pipefail
          umask 077
          page_file=$(mktemp)
          trap 'rm -f -- "$page_file"' EXIT
          for attempt in {1..24}; do
            if curl -fsS --max-time 15 --proto '=https' \
                "$BASE_URL/demo" -o "$page_file" &&
               grep -Fq "See Linaw from the seat you actually use" "$page_file"; then
              echo "Production demo page is live."
              exit 0
            fi
            echo "Waiting for production deployment ($attempt/24); HTML omitted."
            sleep 10
          done
          exit 1

      - name: Verify anonymous Workforce/BI reads deny access
        run: bash scripts/live-workforce-bi-rbac-smoke.sh --anonymous

      - name: Verify guarded demo login 404 (production role acceptance NOT_RUN)
        if: steps.demo_boundary.outputs.mode == 'blocked_non_demo_employer'
        run: |
          set -euo pipefail
          umask 077
          response_file=$(mktemp)
          trap 'rm -f -- "$response_file"' EXIT
          # The same guard now says this deployment contains a non-demo employer.
          # The POST must stop at the production guard before any demo provisioning.
          status=$(curl -sS --max-time 20 --proto '=https' \
            -o "$response_file" -w '%{http_code}' -X POST \
            "$BASE_URL/api/auth/demo-switch" \
            -H "Origin: $BASE_URL" -H "Sec-Fetch-Site: same-origin" \
            -H "Content-Type: application/json" --data '{"role":"owner"}' || true)
          echo "Production protected demo role=owner http_status=$status expected=404"
          if [ "$status" != 404 ]; then
            echo "::error::Production demo block was not verified; no role access certified."
            exit 1
          fi
          echo "::notice::Demo access intentionally blocked on a customer-scope production database. Production six-role RBAC NOT_RUN; the separate disposable-PG16 job must pass."

      - name: Verify all six RBAC personas on production
        if: steps.demo_boundary.outputs.mode == 'demo_only'
        run: |
          set -euo pipefail
          # GitHub runner files can contain session cookies and response data.
          # Keep them private, unique per run, and delete them even on failure.
          umask 077
          work_dir=$(mktemp -d)
          trap 'rm -rf -- "$work_dir"' EXIT
          roles=(owner hr payroll checker bookkeeper employee)

          for role in "${roles[@]}"; do
            success=false
            rm -f -- "$work_dir/demo-cookies.txt"
            for attempt in {1..24}; do
              login_status=$(curl -sS --max-time 15 --proto '=https' \
                -c "$work_dir/demo-cookies.txt" \
                -o "$work_dir/demo-switch.json" -w '%{http_code}' \
                -X POST "$BASE_URL/api/auth/demo-switch" \
                -H "Origin: $BASE_URL" -H "Sec-Fetch-Site: same-origin" \
                -H "Content-Type: application/json" \
                --data "{\"role\":\"$role\"}" || true)
              echo "role=$role attempt=$attempt login_http=$login_status"
              if [ "$login_status" = 404 ]; then
                echo "::error::Unexpected demo auth 404 while the protected boundary declares demo_only; do not retry or treat this as intentional."
                exit 1
              fi

              # Check exact typed fields; never grep or log untrusted JSON.
              if [[ "$login_status" =~ ^2[0-9][0-9]$ ]] &&
                 jq -e --arg role "$role" '
                   type == "object" and
                   .ok == true and
                   .demoDataMode == "synthetic-redacted" and
                   .sensitiveFieldsPersisted == false and
                   .redirectTo == ("/app?demoRole=" + $role) and
                   (.organizationId | type == "number" and . > 0 and . == floor)
                 ' "$work_dir/demo-switch.json" >/dev/null 2>&1; then
                success=true
                break
              fi

              # No headers, cookie values, free-form codes or response bodies in CI logs.
              echo "Demo authorization response did not match expected contract (body withheld)."
              sleep 10
            done

            if [ "$success" != "true" ]; then
              echo "::error::Demo RBAC authentication failed for role=$role; HTTP status only."
              exit 1
            fi

            organization_id=$(jq -r '.organizationId | tostring' "$work_dir/demo-switch.json")
            app_status=$(curl -sS --max-time 15 --proto '=https' \
              -b "$work_dir/demo-cookies.txt" -w '%{http_code}' \
              -o "$work_dir/app.html" "$BASE_URL/app?demoRole=$role" || true)
            echo "role=$role endpoint=/app http_status=$app_status"
            if [ "$app_status" != "200" ]; then
              echo "Workspace shell failed; body withheld."
              exit 1
            fi

            if [ "$role" = "employee" ]; then
              endpoint="/api/self/payslips"
              api_status=$(curl -sS --max-time 15 --proto '=https' \
                -b "$work_dir/demo-cookies.txt" -w '%{http_code}' \
                -o "$work_dir/api.json" "$BASE_URL$endpoint" || true)
              echo "role=$role endpoint=$endpoint http_status=$api_status"
              if [ "$api_status" != "200" ]; then
                echo "Employee API failed; response withheld."
                exit 1
              fi
              if ! jq -e '
                type == "object" and
                (.employee.employeeNo | type == "string" and length > 0) and
                (.employer.id | type == "number" and . > 0)
              ' "$work_dir/api.json" >/dev/null 2>&1; then
                echo "Employee API response shape invalid; response withheld."
                exit 1
              fi
            else
              endpoint="/api/dashboard"
              api_status=$(curl -sS --max-time 15 --proto '=https' \
                -b "$work_dir/demo-cookies.txt" -w '%{http_code}' \
                -o "$work_dir/api.json" "$BASE_URL$endpoint?organizationId=$organization_id" || true)
              echo "role=$role endpoint=$endpoint http_status=$api_status"
              if [ "$api_status" != "200" ]; then
                echo "Dashboard API failed; response withheld."
                exit 1
              fi
              if ! jq -e '
                type == "object" and
                (.selectedOrganization.id | type == "number" and . > 0)
              ' "$work_dir/api.json" >/dev/null 2>&1; then
                echo "Dashboard API response shape invalid; response withheld."
                exit 1
              fi
            fi

            # Read-only HTTP assertions use THIS role's validated demo session,
            # with response bodies/cookies held only in the private runner dir.
            bash scripts/live-workforce-bi-rbac-smoke.sh \
              "$role" "$organization_id" "$work_dir/demo-cookies.txt" "$work_dir"
          done

      - name: Verify deployed fictional HR compensation privacy (#1046)
        if: steps.demo_boundary.outputs.mode == 'demo_only'
        env:
          PRODUCTION_READINESS_TOKEN: ${{ secrets.PRODUCTION_READINESS_TOKEN }}
        run: bash scripts/live-compensation-scope-smoke.sh

  isolated-fictional-rbac:
    name: Six-persona RBAC (disposable PG16, no production)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: "true"
      TZ: Asia/Manila
      ISOLATED_SIX_ROLE_RBAC: disposable-pg16-only
      RBAC_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
      QA_URL: http://127.0.0.1:3000
      APP_BASE_URL: http://127.0.0.1:3000
      TRUSTED_APP_ORIGINS: http://127.0.0.1:3000
      DEMO_MODE: "true"
      REQUIRE_PRIVILEGED_MFA: "false"
      PAYMONGO_DISBURSEMENTS_ENABLED: "false"
      XENDIT_PAYOUTS_ENABLED: "false"
      XENDIT_PAYOUTS_LIVE_APPROVED: "false"
      WFM_GEOFENCE_PILOT_ENABLED: "false"
      WFM_PUNCH_EVIDENCE_ENABLED: "false"
      OPENAI_API_KEY: ""
      PAYMONGO_SECRET_KEY: ""
      XENDIT_SECRET_KEY: ""
      NEXT_TELEMETRY_DISABLED: "1"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
          POSTGRES_INITDB_ARGS: "--encoding=UTF8"
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Provision ephemeral fictional-only encryption keys
        run: |
          for name in BANK_DATA_ENCRYPTION_KEY PII_ENCRYPTION_KEY TOTP_ENCRYPTION_KEY; do
            value=$(openssl rand -hex 32)
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
      - name: Prove isolated source and script contracts
        run: |
          node --check scripts/qa/isolated-six-role-rbac.mjs
          node --test tests/isolated-six-role-rbac-contract.test.mjs tests/live-rbac-ci-log-privacy.test.mjs
      - name: Apply schema only on disposable PostgreSQL 16
        run: npm run db:push
      - name: Apply append-only 0109 audit guard only to ephemeral test database
        run: node scripts/qa/apply-audit-0109-isolated.mjs
      - name: Prove customer with identical demo employer names cannot be provisioned (disposable PG16)
        run: npx tsx scripts/qa/adversarial-production-demo-name-guard.mjs
      - name: Start fictional localhost app (no public listener)
        run: |
          set -euo pipefail
          npm run dev -- --hostname 127.0.0.1 --port 3000 > /tmp/payrollph-isolated-rbac-next.log 2>&1 &
          ready=false
          for attempt in $(seq 1 90); do
            if curl --silent --fail --max-time 5 --proto '=http' \
                http://127.0.0.1:3000/demo > /dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            echo "::error::Disposable localhost app did not start; no production fallback."
            exit 1
          fi
      - name: Run all six real authenticated API roles with isolated fictional records
        run: npx tsx scripts/qa/isolated-six-role-rbac.mjs
      - name: Publish status-only fictional evidence, never cookies or employee rows
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: isolated-six-role-rbac-pg16
          path: qa-artifacts/isolated-six-role-rbac.json
          if-no-files-found: ignore
          retention-days: 7
