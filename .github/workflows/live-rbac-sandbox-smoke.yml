name: Live RBAC Sandbox Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BASE_URL: https://erwinmehehe-payrollph.vercel.app
      EXPECTED_COMMIT_SHA: ${{ github.sha }}
    steps:
      - name: Wait for exact production deployment
        run: |
          set -euo pipefail
          for attempt in {1..24}; do
            body=$(curl -fsS "$BASE_URL/api/readiness/deployment" || true)
            deployed_sha=$(printf '%s' "$body" | jq -r '.deploymentSha // empty')
            echo "deployment attempt=$attempt deployed_sha=${deployed_sha:-missing} expected=$EXPECTED_COMMIT_SHA"
            if [ "$deployed_sha" = "$EXPECTED_COMMIT_SHA" ]; then
              echo "Exact production commit is live."
              exit 0
            fi
            sleep 10
          done
          echo "Production never reported the expected commit SHA."
          exit 1

      - name: Wait for production demo page
        run: |
          set -euo pipefail
          for attempt in {1..24}; do
            if curl -fsS "$BASE_URL/demo" -o /tmp/demo.html &&
               grep -q "See Linaw from the seat you actually use" /tmp/demo.html; then
              echo "Production demo page is live."
              exit 0
            fi
            echo "Waiting for production deployment ($attempt/24)..."
            sleep 10
          done
          exit 1

      - name: Verify all five RBAC personas on production
        run: |
          set -euo pipefail
          roles=(owner hr payroll checker employee)

          for role in "${roles[@]}"; do
            success=false
            for attempt in {1..24}; do
              status=$(curl -sS                 -D /tmp/demo-switch-headers.txt                 -c /tmp/demo-cookies.txt                 -o /tmp/demo-switch-body.txt                 -w "%{http_code}"                 -X POST "$BASE_URL/api/auth/demo-switch"                 -H "Origin: $BASE_URL"                 -H "Sec-Fetch-Site: same-origin"                 -H "Content-Type: application/json"                 --data "{\"role\":\"${role}\"}")

              echo "role=${role} attempt=${attempt} status=${status}"

              if [ "$status" -ge 200 ] && [ "$status" -lt 300 ] &&
                 grep -q '"ok":true' /tmp/demo-switch-body.txt &&
                 grep -q '"bankDataEncryptionReady":true' /tmp/demo-switch-body.txt &&
                 grep -q "\"redirectTo\":\"/app?demoRole=${role}\"" /tmp/demo-switch-body.txt; then
                success=true
                break
              fi

              echo "--- response headers ---"
              sed -E 's/^(set-cookie:).*/\1 [redacted]/I' /tmp/demo-switch-headers.txt || true
              echo "--- response body ---"
              cat /tmp/demo-switch-body.txt || true
              echo
              if grep -Eq '"code":"BANK_DATA_ENCRYPTION_(REQUIRED|NOT_READY)"' /tmp/demo-switch-body.txt; then
                echo "Production bank-data encryption is a hard prerequisite for the RBAC sandbox."
                exit 1
              fi
              sleep 10
            done

            if [ "$success" != "true" ]; then
              echo "RBAC sandbox failed for role: ${role}"
              exit 1
            fi

            page_status=$(curl -sS -b /tmp/demo-cookies.txt -o "/tmp/${role}.html" -w "%{http_code}" "$BASE_URL/app?demoRole=${role}")
            echo "role=${role} workspace_status=${page_status}"

            if [ "$page_status" -lt 200 ] || [ "$page_status" -ge 300 ]; then
              echo "Workspace failed to render for role: ${role}"
              cat "/tmp/${role}.html" || true
              exit 1
            fi

            # The sandbox UI copy is allowed to evolve. The role-switch API above
            # already proves the requested RBAC persona; here we only assert the
            # authenticated workspace rendered Linaw rather than a framework/error page.
            grep -qi "Linaw" "/tmp/${role}.html"
            if grep -qiE "Internal Server Error|Application error" "/tmp/${role}.html"; then
              echo "Workspace rendered an error page for role: ${role}"
              exit 1
            fi
          done
