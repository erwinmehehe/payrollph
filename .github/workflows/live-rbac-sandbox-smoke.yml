name: Live RBAC Sandbox Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BASE_URL: https://erwinmehehe-payrollph.vercel.app
      EXPECTED_COMMIT_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact GitHub Actions commit (read-only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Wait for exact production deployment
        env:
          PRODUCTION_READINESS_TOKEN: ${{ secrets.PRODUCTION_READINESS_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          if [ "${#PRODUCTION_READINESS_TOKEN}" -lt 32 ]; then
            echo "::error title=Production RBAC verification blocked::PRODUCTION_READINESS_TOKEN is missing or shorter than 32 bytes; confirm protected secret configuration."
            exit 1
          fi
          response_file=$(mktemp)
          trap 'rm -f -- "$response_file"' EXIT
          for attempt in {1..24}; do
            : > "$response_file"
            http_status=$(curl -sS --max-time 15 --proto '=https' \
              -H "x-readiness-token: $PRODUCTION_READINESS_TOKEN" \
              -o "$response_file" -w '%{http_code}' \
              "$BASE_URL/api/readiness/deployment" || true)
            deployed_sha=$(jq -r '
              if type == "object"
                 and (.deploymentSha | type) == "string"
                 and (.deploymentSha | test("^[0-9a-f]{40}$"))
              then .deploymentSha else empty end
            ' "$response_file" 2>/dev/null || true)
            echo "deployment attempt=$attempt http_status=$http_status"
            if [ "$http_status" = "200" ] && [ "$deployed_sha" = "$EXPECTED_COMMIT_SHA" ]; then
              echo "Exact production commit is live."
              exit 0
            fi
            sleep 10
          done
          echo "Production never reported the expected commit SHA; no response bodies were logged."
          exit 1

      - name: Wait for production demo page
        run: |
          set -euo pipefail
          umask 077
          page_file=$(mktemp)
          trap 'rm -f -- "$page_file"' EXIT
          for attempt in {1..24}; do
            if curl -fsS --max-time 15 --proto '=https' \
                "$BASE_URL/demo" -o "$page_file" &&
               grep -Fq "See Linaw from the seat you actually use" "$page_file"; then
              echo "Production demo page is live."
              exit 0
            fi
            echo "Waiting for production deployment ($attempt/24); HTML omitted."
            sleep 10
          done
          exit 1

      - name: Verify anonymous Workforce/BI reads deny access
        run: bash scripts/live-workforce-bi-rbac-smoke.sh --anonymous

      - name: Verify all six RBAC personas on production
        run: |
          set -euo pipefail
          # GitHub runner files can contain session cookies and response data.
          # Keep them private, unique per run, and delete them even on failure.
          umask 077
          work_dir=$(mktemp -d)
          trap 'rm -rf -- "$work_dir"' EXIT
          roles=(owner hr payroll checker bookkeeper employee)

          for role in "${roles[@]}"; do
            success=false
            rm -f -- "$work_dir/demo-cookies.txt"
            for attempt in {1..24}; do
              login_status=$(curl -sS --max-time 15 --proto '=https' \
                -c "$work_dir/demo-cookies.txt" \
                -o "$work_dir/demo-switch.json" -w '%{http_code}' \
                -X POST "$BASE_URL/api/auth/demo-switch" \
                -H "Origin: $BASE_URL" -H "Sec-Fetch-Site: same-origin" \
                -H "Content-Type: application/json" \
                --data "{\"role\":\"$role\"}" || true)
              echo "role=$role attempt=$attempt login_http=$login_status"

              # Check exact typed fields; never grep or log untrusted JSON.
              if [[ "$login_status" =~ ^2[0-9][0-9]$ ]] &&
                 jq -e --arg role "$role" '
                   type == "object" and
                   .ok == true and
                   .demoDataMode == "synthetic-redacted" and
                   .sensitiveFieldsPersisted == false and
                   .redirectTo == ("/app?demoRole=" + $role) and
                   (.organizationId | type == "number" and . > 0 and . == floor)
                 ' "$work_dir/demo-switch.json" >/dev/null 2>&1; then
                success=true
                break
              fi

              # No headers, cookie values, free-form codes or response bodies in CI logs.
              echo "Demo authorization response did not match expected contract (body withheld)."
              sleep 10
            done

            if [ "$success" != "true" ]; then
              echo "::error::Demo RBAC authentication failed for role=$role; HTTP status only."
              exit 1
            fi

            organization_id=$(jq -r '.organizationId | tostring' "$work_dir/demo-switch.json")
            app_status=$(curl -sS --max-time 15 --proto '=https' \
              -b "$work_dir/demo-cookies.txt" -w '%{http_code}' \
              -o "$work_dir/app.html" "$BASE_URL/app?demoRole=$role" || true)
            echo "role=$role endpoint=/app http_status=$app_status"
            if [ "$app_status" != "200" ]; then
              echo "Workspace shell failed; body withheld."
              exit 1
            fi

            if [ "$role" = "employee" ]; then
              endpoint="/api/self/payslips"
              api_status=$(curl -sS --max-time 15 --proto '=https' \
                -b "$work_dir/demo-cookies.txt" -w '%{http_code}' \
                -o "$work_dir/api.json" "$BASE_URL$endpoint" || true)
              echo "role=$role endpoint=$endpoint http_status=$api_status"
              if [ "$api_status" != "200" ]; then
                echo "Employee API failed; response withheld."
                exit 1
              fi
              if ! jq -e '
                type == "object" and
                (.employee.employeeNo | type == "string" and length > 0) and
                (.employer.id | type == "number" and . > 0)
              ' "$work_dir/api.json" >/dev/null 2>&1; then
                echo "Employee API response shape invalid; response withheld."
                exit 1
              fi
            else
              endpoint="/api/dashboard"
              api_status=$(curl -sS --max-time 15 --proto '=https' \
                -b "$work_dir/demo-cookies.txt" -w '%{http_code}' \
                -o "$work_dir/api.json" "$BASE_URL$endpoint?organizationId=$organization_id" || true)
              echo "role=$role endpoint=$endpoint http_status=$api_status"
              if [ "$api_status" != "200" ]; then
                echo "Dashboard API failed; response withheld."
                exit 1
              fi
              if ! jq -e '
                type == "object" and
                (.selectedOrganization.id | type == "number" and . > 0)
              ' "$work_dir/api.json" >/dev/null 2>&1; then
                echo "Dashboard API response shape invalid; response withheld."
                exit 1
              fi
            fi

            # Read-only HTTP assertions use THIS role's validated demo session,
            # with response bodies/cookies held only in the private runner dir.
            bash scripts/live-workforce-bi-rbac-smoke.sh \
              "$role" "$organization_id" "$work_dir/demo-cookies.txt" "$work_dir"
          done

      # Never invoke token-gated HR fixture writes until the actual deployed
      # PostgreSQL session is the expected Neon target with named relations.
      # Missing tables cause a visible FAIL; never skip or green the privacy test.
      - name: Verify private compensation database readiness (#1015/#1061)
        env:
          PRODUCTION_READINESS_TOKEN: ${{ secrets.PRODUCTION_READINESS_TOKEN }}
          EXPECTED_NEON_PROJECT_ID: calm-wave-70219564
          EXPECTED_NEON_BRANCH_ID: br-lucky-sound-b79i56jw
          EXPECTED_NEON_ENDPOINT_ID: ep-cool-hat-b7e7gpoo
          EXPECTED_NEON_DATABASE_NAME: neondb
        run: |
          set -euo pipefail
          umask 077
          if [ "${#PRODUCTION_READINESS_TOKEN}" -lt 32 ]; then
            echo '::error::Private database readiness token is unavailable.'
            exit 1
          fi
          response_file=$(mktemp)
          trap 'rm -f -- "$response_file"' EXIT
          http_status=$(curl -sS --max-time 20 --proto '=https' \
            -H "x-readiness-token: $PRODUCTION_READINESS_TOKEN" \
            -o "$response_file" -w '%{http_code}' \
            "$BASE_URL/api/readiness/database-target" || true)
          echo "private database readiness http_status=$http_status"
          if [ "$http_status" != 200 ]; then
            echo '::error::Private deployment-to-Neon identity is unavailable; no HR fixture attempted.'
            exit 1
          fi
          node scripts/qa/verify-production-compensation-preflight.mjs "$response_file"
      - name: Verify deployed fictional HR compensation privacy (#1046)
        env:
          PRODUCTION_READINESS_TOKEN: ${{ secrets.PRODUCTION_READINESS_TOKEN }}
        run: bash scripts/live-compensation-scope-smoke.sh
