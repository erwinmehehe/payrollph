name: CodeQL Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feat/payroll-connected-impact-review-20261009]
  schedule:
    - cron: "23 4 * * 2"

concurrency:
  # A newer push to a pull request supersedes its older run. Runs for main and
  # manual dispatch are keyed by commit and never cancelled, so a quick follow-up
  # merge cannot leave a main commit with a cancelled (or missing) result.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  change-scope:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.detect.outputs.docs_only }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Classify exact PR changes (fail closed)
        id: detect
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci/change-scope.mjs

  analyze:
    needs: change-scope
    if: ${{ always() }}
    name: Analyze JavaScript and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require valid scope classification
        env:
          SCOPE_RESULT: ${{ needs.change-scope.result }}
        run: test "$SCOPE_RESULT" = "success"
      - name: Explain Markdown-only CI bypass
        if: ${{ github.event_name == 'pull_request' && needs.change-scope.outputs.docs_only == 'true' }}
        run: echo "Markdown-only PR, no JS/TS executable changes; full CodeQL still runs on main and schedule."
      - name: Checkout repository
        if: ${{ needs.change-scope.outputs.docs_only != 'true' }}
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        if: ${{ needs.change-scope.outputs.docs_only != 'true' }}
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Perform CodeQL analysis
        if: ${{ needs.change-scope.outputs.docs_only != 'true' }}
        uses: github/codeql-action/analyze@v4
