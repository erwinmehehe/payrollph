name: HRIS Integrated Journey Browser QA (Synthetic Only)

on:
  # Verify mobile/role synthetic acceptance again on the exact mainline commit.
  push:
    branches: [main]
    paths:
      - "src/components/hris-home-shortcuts.tsx"
      - "src/components/employee-360-overview.tsx"
      - "src/components/hris-onboarding-checklist.tsx"
      - "src/components/workspace/first-payroll-readiness.tsx"
      - "src/components/workspace/first-payroll-inline-panel.tsx"
      - "src/components/new-hire-modal.tsx"
      - "src/lib/first-payroll-*.ts"
      - "src/app/app/page.tsx"
      - "src/components/workspace/shell.tsx"
      - "src/lib/saas-workspace-access.ts"
      - "src/lib/dashboard-data.ts"
      - "src/components/hcm-my-team*.tsx"
      - "src/components/linaw-workspace.tsx"
      - "src/components/workspace/people.tsx"
      - "src/components/workspace/approvals.tsx"
      - "src/components/workspace/panels.tsx"
      - "src/app/api/provisioning/**"
      - "src/app/api/first-payroll/**"
      - "src/app/api/legal-entities/**"
      - "src/app/api/payroll-runs/**"
      - "src/app/api/approvals/**"
      - "src/app/api/hr-cases/**"
      - "src/app/hcm/hr-cases/**"
      - "src/components/employee-hr-case*"
      - "src/lib/hr-case-*"
      - "src/app/api/hcm/my-team/**"
      - "src/app/api/hcm/people-operations-inbox/**"
      - "src/app/hcm/my-team/**"
      - "src/lib/access.ts"
      - "src/lib/hcm-my-team*.ts"
      - "src/lib/hris-*.ts"
      - "src/lib/payroll-period-ui.ts"
      - "tests/leave-precision-ui.test.ts"
      - "scripts/hris-journey-synthetic-*"
      - "scripts/first-payroll-mobile-synthetic-*"
      - "scripts/first-payroll-zero-tenant-browser.mjs"
      - ".github/workflows/hris-journey-browser-qa.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/components/hris-home-shortcuts.tsx"
      - "src/components/employee-360-overview.tsx"
      - "src/components/hris-onboarding-checklist.tsx"
      - "src/components/workspace/first-payroll-readiness.tsx"
      - "src/components/workspace/first-payroll-inline-panel.tsx"
      - "src/components/new-hire-modal.tsx"
      - "src/lib/first-payroll-*.ts"
      - "src/app/app/page.tsx"
      - "src/components/workspace/shell.tsx"
      - "src/lib/saas-workspace-access.ts"
      - "src/lib/dashboard-data.ts"
      - "src/components/hcm-my-team*.tsx"
      - "src/components/linaw-workspace.tsx"
      - "src/components/workspace/people.tsx"
      - "src/components/workspace/approvals.tsx"
      - "src/components/workspace/panels.tsx"
      - "src/app/api/provisioning/**"
      - "src/app/api/first-payroll/**"
      - "src/app/api/legal-entities/**"
      - "src/app/api/payroll-runs/**"
      - "src/app/api/approvals/**"
      - "src/app/api/hr-cases/**"
      - "src/app/hcm/hr-cases/**"
      - "src/components/employee-hr-case*"
      - "src/lib/hr-case-*"
      - "src/app/api/hcm/my-team/**"
      - "src/app/api/hcm/people-operations-inbox/**"
      - "src/app/hcm/my-team/**"
      - "src/lib/access.ts"
      - "src/lib/hcm-my-team*.ts"
      - "src/lib/hris-*.ts"
      - "src/lib/payroll-period-ui.ts"
      - "tests/leave-precision-ui.test.ts"
      - "scripts/hris-journey-synthetic-*"
      - "scripts/first-payroll-mobile-synthetic-*"
      - "scripts/first-payroll-zero-tenant-browser.mjs"
      - ".github/workflows/hris-journey-browser-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to a pull request supersedes its older run. Runs for main and
  # manual dispatch are keyed by commit and never cancelled, so a quick follow-up
  # merge cannot leave a main commit with a cancelled (or missing) result.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  synthetic-journey:
    name: isolated-hris-journey
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: "true"
      HRIS_JOURNEY_ACCEPTANCE_MODE: synthetic-postgres-only
      EVERYDAY_HR_HIRE_ENABLED: "true" # isolated fictional acceptance only
      FIRST_PAYROLL_INLINE_ENABLED: "true" # disposable PostgreSQL acceptance only
      HRIS_JOURNEY_ACCEPTANCE_URL: http://127.0.0.1:3000
      HCM_PEOPLE_HOME_ACCEPTANCE_MODE: synthetic-postgres-only
      HCM_PEOPLE_HOME_ENABLED: "true"
      NEXT_PUBLIC_HCM_PEOPLE_HOME_ENABLED: "true"
      HCM_PEOPLE_HOME_ORG_IDS: "1,2"
      HCM_MY_TEAM_ENABLED: "true"
      EMPLOYEE_HR_CASES_ENABLED: "true"
      EMPLOYEE_DOCUMENT_VAULT_ENABLED: "false"
      NEXT_PUBLIC_HCM_MY_TEAM_ENABLED: "true"
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
      APP_BASE_URL: http://127.0.0.1:3000
      TRUSTED_APP_ORIGINS: http://127.0.0.1:3000
      DEMO_MODE: "false"
      PAYMONGO_DISBURSEMENTS_ENABLED: "false"
      XENDIT_PAYOUTS_ENABLED: "false"
      REQUIRE_PRIVILEGED_MFA: "false"
      OPENAI_API_KEY: ""
      NEXT_TELEMETRY_DISABLED: "1"
      TOTP_ENCRYPTION_KEY: "4444444444444444444444444444444444444444444444444444444444444444"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
          POSTGRES_INITDB_ARGS: "--encoding=UTF8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Ephemeral independent bank and PII keys for synthetic database only
        shell: bash
        run: |
          bank_key=$(openssl rand -hex 32)
          pii_key=$(openssl rand -hex 32)
          echo "::add-mask::$bank_key"
          echo "::add-mask::$pii_key"
          echo "BANK_DATA_ENCRYPTION_KEY=$bank_key" >> "$GITHUB_ENV"
          echo "PII_ENCRYPTION_KEY=$pii_key" >> "$GITHUB_ENV"
      - run: npm run db:push
      - name: Apply audit 0109 on isolated real PG16 before acceptance
        run: node scripts/qa/apply-audit-0109-isolated.mjs
      - name: Seed disposable HCM baseline
        run: npx tsx scripts/hcm-people-home-synthetic-fixture.ts
      - name: Add unit managers, approval and onboarding acceptance records
        run: npx tsx scripts/hris-journey-synthetic-fixture.ts
      - name: Link fictional ESS identity for A-3 HR-case acceptance (disposable DB)
        run: npx tsx scripts/hr-cases-synthetic-employee-link.ts
      - name: Prove first payroll owner-to-HR-to-payroll resume and read-only PG16 preview
        run: npx tsx --test tests/first-payroll-tenant-resume-postgres.test.ts
      - name: Build local app with tenant-scoped synthetic flags
        run: npm run build
      - name: Install pinned Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Launch app bound to localhost only
        shell: bash
        run: |
          nohup npm start -- -H 127.0.0.1 > /tmp/hris-journey-local.log 2>&1 &
          for attempt in {1..45}; do
            if curl -fsS "http://127.0.0.1:3000/login" >/dev/null; then exit 0; fi
            sleep 2
          done
          echo "Synthetic HRIS app failed to start"
          exit 1
      - name: Diagnose synthetic app startup (redacted, failures only)
        if: failure()
        shell: bash
        run: |
          echo "Synthetic isolated environment; no live database or worker tokens."
          printf "App readiness HTTP status: "
          curl --max-time 5 -sS -o /dev/null -w '%{http_code}\\n' "http://127.0.0.1:3000/api/health" || true
          printf "Login page HTTP status: "
          curl --max-time 5 -sS -o /dev/null -w '%{http_code}\\n' "http://127.0.0.1:3000/login" || true
          if [ -f /tmp/hris-journey-local.log ]; then
            echo "Redacted matching application error lines:"
            grep -Ei 'error|failed|digest|GET /login|relation|column|code:|query:' /tmp/hris-journey-local.log |
              sed -E 's#postgres(ql)?://[^[:space:]]+#postgresql://[redacted]#g; s/[A-Za-z0-9_-]{40,}/[redacted]/g' |
              tail -n 80 || true
          fi
      - name: Test HR Home, Employee 360, My Team, onboarding and approvals
        run: node scripts/hris-journey-synthetic-browser.mjs
      - name: Add fictional self-serve owner after HRIS acceptance
        run: npx tsx scripts/first-payroll-mobile-synthetic-fixture.ts
      - name: Test first-payroll guide on mobile with owner and payroll roles
        run: node scripts/first-payroll-mobile-synthetic-browser.mjs
      - name: Test zero-employee tenant through inline owner, HR and payroll journeys
        run: node scripts/first-payroll-zero-tenant-browser.mjs
      - name: Upload sanitized mobile engineering receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: first-payroll-mobile-synthetic
          path: |
            qa-artifacts/first-payroll-mobile-synthetic.json
            qa-artifacts/first-payroll-mobile-failed.png
            qa-artifacts/first-payroll-zero-tenant-browser.json
            qa-artifacts/first-payroll-screens/*.png
            qa-artifacts/first-payroll-zero-tenant-failed.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload synthetic-only failure screenshot
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: hris-synthetic-journey-failure
          path: qa-artifacts/hris-journey-failed.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload My Team fictional mobile browser screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hcm-my-team-mobile-synthetic
          path: qa-artifacts/hcm-my-team-mobile-*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: "Upload fictional HR-case and #1114 reviewer phone screenshots"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hr-case-role-screenshots
          path: |
            qa-artifacts/hris-hire-*.png
            qa-artifacts/hr-cases-*.png
            qa-artifacts/hris-reviewer-375px.png
            qa-artifacts/hris-reviewer-390px.png
          if-no-files-found: ignore
          retention-days: 7
