name: ESS development plan tenant isolation (fictional PG16 HTTP)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - '.github/workflows/tenant-ess-development-http.yml'
      - 'scripts/qa/tenant-batches/ess-development-*.mjs'
      - 'tests/tenant-batches/ess-development.test.mjs'
      - 'scripts/qa/tenant-self-development-*.mjs'
      - 'tests/tenant-self-development.test.mjs'
      - 'docs/qa/tenant-self-development-*.json'
      - 'docs/qa/tenant-ess-development-http.md'
      - 'src/app/api/self/performance/development-plans/**'
      - 'src/lib/auth.ts'
      - 'src/lib/access.ts'
      - 'src/lib/organization-auth-policy.ts'
      - 'src/lib/security-request.ts'
      - 'src/db/**'
      - 'scripts/qa/tenant-table-http.mjs'
      - 'scripts/qa/tenant-table-invariants.mjs'
      - 'scripts/qa/tenant-table-env.mjs'
      - 'scripts/qa/apply-isolated-baseline.mjs'

permissions:
  contents: read

concurrency:
  group: tenant-ess-development-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ess-development:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WORKER_ENABLED: 'false'
      CENTRAL_SCHEDULER_ENABLED: 'false'
      TENANT_SELF_DEVELOPMENT_MODE: 'fictional-disposable-only'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Load disposable localhost-only environment
        run: |
          node scripts/qa/tenant-table-env.mjs default >> "$GITHUB_ENV"
          echo 'XENDIT_BILLING_ENABLED=false' >> "$GITHUB_ENV"
      - name: Prove fail-closed guard and non-vacuous source contracts
        run: node --test tests/tenant-batches/ess-development.test.mjs tests/tenant-self-development.test.mjs
      - name: Generate throwaway encryption material
        shell: bash
        run: |
          set -euo pipefail
          for name in PII_ENCRYPTION_KEY BANK_DATA_ENCRYPTION_KEY; do
            key=$(openssl rand -hex 32)
            echo "::add-mask::$key"
            echo "$name=$key" >> "$GITHUB_ENV"
          done
          secret="whsec_$(openssl rand -base64 32 | tr -d '\n')"
          echo "::add-mask::$secret"
          echo "RESEND_WEBHOOK_SECRET=$secret" >> "$GITHUB_ENV"
      - name: Build disposable PostgreSQL 16 schema
        run: npm run db:push
      - name: Apply reviewed isolated schema baseline
        run: node scripts/qa/apply-isolated-baseline.mjs
      - name: Prepare reviewed SQL-only HCM fixture in empty disposable database
        run: node scripts/qa/prepare-hcm-work-item-fixture.mjs
      - name: Build production-mode app against fictional database
        run: npm run build
      - name: Launch production-mode server exclusively on localhost
        shell: bash
        run: |
          set -euo pipefail
          nohup node node_modules/next/dist/bin/next start -H 127.0.0.1 -p 3000 > /tmp/tenant-ess-development-server.log 2>&1 &
          server=$!
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:3000/login > /dev/null; then exit 0; fi
            if ! kill -0 "$server" 2>/dev/null; then
              cat /tmp/tenant-ess-development-server.log
              exit 1
            fi
            sleep 2
          done
          cat /tmp/tenant-ess-development-server.log
          exit 1
      - name: Prove own GET POST PATCH, foreign IDs, peer IDs and unchanged victim
        run: node --import tsx scripts/qa/tenant-self-development-http.mjs
      - name: Isolated server diagnostics on failure
        if: failure()
        run: cat /tmp/tenant-ess-development-server.log || true
