name: Performance Governance tenant isolation (fictional PG16 HTTP)
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - '.github/workflows/tenant-performance-governance-http.yml'
      - 'scripts/qa/tenant-performance-governance-*.mjs'
      - 'tests/tenant-performance-governance-*.test.mjs'
      - 'docs/qa/tenant-performance-governance-policy.md'
      - 'src/app/api/performance/follow-through-governance/**'
      - 'src/lib/hcm-performance-action-reminders.ts'
      - 'src/lib/hcm-performance-evidence-sealing.ts'
      - 'src/lib/auth.ts'
      - 'src/lib/access.ts'
      - 'src/lib/security-request.ts'
      - 'src/db/**'
permissions:
  contents: read
jobs:
  performance-governance:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WORKER_ENABLED: 'false'
      CENTRAL_SCHEDULER_ENABLED: 'false'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/qa/tenant-table-env.mjs default >> "$GITHUB_ENV"
      - name: Adversarial contracts and syntax
        run: |
          node --check scripts/qa/tenant-performance-governance-contract.mjs
          node --check scripts/qa/tenant-performance-governance-http.mjs
          node --test tests/tenant-performance-governance-contract.test.mjs
      - name: Generate fictional per-run encryption keys
        shell: bash
        run: |
          set -euo pipefail
          for name in PII_ENCRYPTION_KEY BANK_DATA_ENCRYPTION_KEY; do
            key=$(openssl rand -hex 32)
            echo "::add-mask::$key"
            echo "$name=$key" >> "$GITHUB_ENV"
          done
          secret="whsec_$(openssl rand -base64 32 | tr -d '\n')"
          echo "::add-mask::$secret"
          echo "RESEND_WEBHOOK_SECRET=$secret" >> "$GITHUB_ENV"
      - run: npm run db:push
      - run: node scripts/qa/apply-isolated-baseline.mjs
      - run: npm run build
      - name: Real signed-in PostgreSQL and localhost HTTP proof
        run: node --import tsx scripts/qa/tenant-performance-governance-http.mjs
