name: Production Secret Presence

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/production-secret-presence.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      HAS_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
      HAS_PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL != '' || secrets.DATABASE_URL != '' }}
      HAS_PRODUCTION_TOTP_KEY: ${{ secrets.PRODUCTION_TOTP_ENCRYPTION_KEY != '' || secrets.TOTP_ENCRYPTION_KEY != '' }}
      HAS_PRODUCTION_BANK_KEY: ${{ secrets.PRODUCTION_BANK_DATA_ENCRYPTION_KEY != '' || secrets.BANK_DATA_ENCRYPTION_KEY != '' }}
      HAS_RESEND_API_KEY: ${{ secrets.RESEND_API_KEY != '' }}
      HAS_RESEND_WEBHOOK_SECRET: ${{ secrets.RESEND_WEBHOOK_SECRET != '' }}
      HAS_PRODUCTION_READINESS_TOKEN: ${{ secrets.PRODUCTION_READINESS_TOKEN != '' }}
    steps:
      - name: Report secret presence only
        shell: bash
        run: |
          printf 'VERCEL_TOKEN=%s\n' "$HAS_VERCEL_TOKEN"
          printf 'PRODUCTION_DATABASE_URL=%s\n' "$HAS_PRODUCTION_DATABASE_URL"
          printf 'PRODUCTION_TOTP_KEY=%s\n' "$HAS_PRODUCTION_TOTP_KEY"
          printf 'PRODUCTION_BANK_KEY=%s\n' "$HAS_PRODUCTION_BANK_KEY"
          printf 'RESEND_API_KEY=%s\n' "$HAS_RESEND_API_KEY"
          printf 'RESEND_WEBHOOK_SECRET=%s\n' "$HAS_RESEND_WEBHOOK_SECRET"
          printf 'PRODUCTION_READINESS_TOKEN=%s\n' "$HAS_PRODUCTION_READINESS_TOKEN"
