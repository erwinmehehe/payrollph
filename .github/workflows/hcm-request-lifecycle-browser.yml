name: HCM Request Lifecycle Browser QA
on:
  pull_request:
    paths:
      - "src/app/hcm/work-items/page.tsx"
      - "src/components/hcm-my-team.tsx"
      - "src/components/hcm-worker-360.tsx"
      - "src/components/hcm-people-operations-inbox.tsx"
      - "scripts/hcm-request-lifecycle-browser.mjs"
      - "tests/fixtures/hcm-request-lifecycle.jsx"
      - ".github/workflows/hcm-request-lifecycle-browser.yml"
  workflow_dispatch:
# Supersede only older PR attempts; main/manual runs retain independent groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm install --no-save --ignore-scripts playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: node scripts/hcm-request-lifecycle-browser.mjs
