name: Focused homepage demo QA

on:
  push:
    branches:
      - fix/homepage-focused-demo-sep29
    paths:
      - ".github/workflows/focused-homepage-demo-qa.yml"

jobs:
  qa:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
      DEMO_MODE: "true"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run db:push
      - name: Start app
        run: |
          npm run dev -- --hostname 127.0.0.1 >/tmp/app.log 2>&1 &
          for i in {1..60}; do
            curl -fsS http://127.0.0.1:3000/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/app.log
          exit 1
      - name: Start Chrome
        run: |
          google-chrome --headless=new --no-sandbox --disable-dev-shm-usage --hide-scrollbars             --remote-debugging-address=127.0.0.1 --remote-debugging-port=9222             --user-data-dir=/tmp/chrome about:blank >/tmp/chrome.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:9222/json/version >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/chrome.log
          exit 1
      - name: Exercise focused preview
        run: |
          cat >/tmp/check.mjs <<'EOF'
          import fs from "node:fs/promises";
          const targets=await (await fetch("http://127.0.0.1:9222/json")).json();
          const page=targets.find(x=>x.type==="page");
          const ws=new WebSocket(page.webSocketDebuggerUrl);
          await new Promise((res,rej)=>{ws.addEventListener("open",res,{once:true});ws.addEventListener("error",rej,{once:true})});
          let id=1; const pending=new Map(); const listeners=new Map();
          ws.addEventListener("message",e=>{
            const m=JSON.parse(String(e.data));
            if(m.id&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.reject(new Error(m.error.message)):p.resolve(m.result);return;}
            if(m.method&&listeners.has(m.method)) for(const fn of listeners.get(m.method)) fn(m.params);
          });
          const send=(method,params={})=>new Promise((resolve,reject)=>{const call=id++;pending.set(call,{resolve,reject});ws.send(JSON.stringify({id:call,method,params}))});
          const once=(method)=>new Promise(resolve=>{const set=listeners.get(method)??new Set();const fn=p=>{set.delete(fn);resolve(p)};set.add(fn);listeners.set(method,set)});
          const wait=async(expr,timeout=15000)=>{const start=Date.now();while(Date.now()-start<timeout){const r=await send("Runtime.evaluate",{expression:expr,returnByValue:true});if(r.result.value)return r.result.value;await new Promise(r=>setTimeout(r,200))}throw new Error("timeout "+expr)};
          const click=async(text)=>{const r=await send("Runtime.evaluate",{expression:`(()=>{const root=document.querySelector('[aria-label="Linaw payroll workspace"]');const el=Array.from(root?.querySelectorAll('button')||[]).find(x=>x.textContent?.trim()===${JSON.stringify(text)});if(!el)return false;el.click();return true})()`,returnByValue:true});if(!r.result.value)throw new Error("missing "+text)};
          await send("Page.enable"); await send("Runtime.enable");
          await send("Emulation.setDeviceMetricsOverride",{width:1440,height:1000,deviceScaleFactor:1,mobile:false});
          const loaded=once("Page.loadEventFired"); await send("Page.navigate",{url:"http://127.0.0.1:3000/"}); await loaded;
          await wait("document.body.innerText.includes('Run Philippine payroll with a clear path from draft to release.')");
          const heroVisible=await send("Runtime.evaluate",{expression:`(()=>{const h=document.querySelector('h1');const r=h.getBoundingClientRect();return r.top>=0 && r.bottom<=window.innerHeight && getComputedStyle(h).visibility!=='hidden' && getComputedStyle(h).opacity!=='0'})()`,returnByValue:true});
          if(!heroVisible.result.value) throw new Error("Hero is not visible in initial viewport");
          await send("Runtime.evaluate",{expression:"document.querySelector('[aria-label="Linaw payroll workspace"]').scrollIntoView({block:'center'})"});
          await new Promise(r=>setTimeout(r,300));
          await click("People");
          await wait("document.body.innerText.includes('Employee directory')");
          await click("Migration");
          await wait("document.body.innerText.includes('Switch payroll software without rebuilding your data.')");
          await click("Payroll");
          await wait("document.body.innerText.includes('NEEDS REVIEW')");
          const shot=await send("Page.captureScreenshot",{format:"png"});
          await fs.writeFile("focused-homepage-demo.png",Buffer.from(shot.data,"base64"));
          ws.close();
          EOF
          node /tmp/check.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: focused-homepage-demo
          path: focused-homepage-demo.png
          retention-days: 3
