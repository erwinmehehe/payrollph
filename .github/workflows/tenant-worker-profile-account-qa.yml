name: Tenant worker profile login ownership (fictional PG16 real HTTP)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - "src/app/api/hcm/worker-profile/route.ts"
      - "scripts/qa/tenant-worker-profile-account-http.mjs"
      - "tests/tenant-worker-profile-account-contract.test.mjs"
      - ".github/workflows/tenant-worker-profile-account-qa.yml"
      - "scripts/qa/tenant-isolation-coverage-manifest.json"
      - "tests/tenant-isolation-coverage-inventory.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tenant-worker-profile-account-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  worker-profile-account-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      GITHUB_ACTIONS: "true"
      NODE_ENV: production
      TZ: Asia/Manila
      NEXT_TELEMETRY_DISABLED: "1"
      HCM_WORKER_PROFILE_IDENTITY_PROOF: fictional-pg16-only
      BUILD_BLOCK_ACCEPTANCE_MODE: synthetic-postgres-only
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
      APP_BASE_URL: http://127.0.0.1:3000
      SECURITY_SMOKE_URL: http://127.0.0.1:3000
      TRUSTED_APP_ORIGINS: http://127.0.0.1:3000
      DEMO_MODE: "false"
      REQUIRE_PRIVILEGED_MFA: "true"
      WORKER_ENABLED: "false"
      CENTRAL_SCHEDULER_ENABLED: "false"
      PAYMONGO_DISBURSEMENTS_ENABLED: "false"
      XENDIT_PAYOUTS_ENABLED: "false"
      XENDIT_BILLING_ENABLED: "false"
      OPENAI_AUTOMATION_DRAFT_ENABLED: "false"
      PAYMONGO_SECRET_KEY: ""
      XENDIT_SECRET_KEY: ""
      RESEND_API_KEY: ""
      OPENAI_API_KEY: ""
      STRIPE_SECRET_KEY: ""
      SMTP_URL: ""
      SMTP_PASSWORD: ""
      NEON_DATABASE_URL: ""

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact submitted source head
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --include=dev
      - name: Fail-closed fixture and source contract
        run: |
          node --check scripts/qa/tenant-worker-profile-account-http.mjs
          node --test tests/tenant-worker-profile-account-contract.test.mjs
      - name: Generate disposable fictional-only encryption keys
        shell: bash
        run: |
          for key in BANK_DATA_ENCRYPTION_KEY PII_ENCRYPTION_KEY TOTP_ENCRYPTION_KEY; do
            value=$(openssl rand -hex 32)
            echo "::add-mask::$value"
            echo "$key=$value" >> "$GITHUB_ENV"
          done
      - name: Create empty disposable PostgreSQL 16 schema
        run: npm run db:push
      - name: Apply reviewed isolated baseline after schema push
        run: node scripts/qa/apply-isolated-baseline.mjs
      - name: Build exact-head production-mode Next application
        run: npm run build
      - name: Start localhost Next application
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/tenant-worker-profile-account.log 2>&1 &
          server=$!
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:3000/login > /dev/null; then exit 0; fi
            if ! kill -0 "$server" 2>/dev/null; then break; fi
            sleep 2
          done
          tail -n 80 /tmp/tenant-worker-profile-account.log
          exit 1
      - name: Prove own, archived, shared and foreign employee login identities
        run: node --import tsx scripts/qa/tenant-worker-profile-account-http.mjs
      - name: Print bounded localhost diagnostics on failure
        if: failure()
        run: tail -n 100 /tmp/tenant-worker-profile-account.log || true
