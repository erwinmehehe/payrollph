name: Account email request tenant isolation (fictional PG16 and local SMTP; zero credits)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - '.github/workflows/tenant-account-email-request-http.yml'
      - 'scripts/qa/tenant-account-email-request-*.mjs'
      - 'tests/tenant-account-email-request-contract.test.mjs'
      - 'src/app/api/account/email/route.ts'
      - 'src/lib/account.ts'
      - 'src/lib/auth.ts'
      - 'src/lib/crypto.ts'
      - 'src/lib/mailer.ts'
      - 'src/lib/mail-provider.ts'
      - 'src/lib/access.ts'
      - 'src/lib/rate-limit.ts'
      - 'src/lib/security-request.ts'
      - 'src/db/**'
      - 'scripts/qa/tenant-table-http.mjs'
      - 'scripts/qa/tenant-table-env.mjs'
      - 'scripts/qa/apply-isolated-baseline.mjs'

permissions:
  contents: read

concurrency:
  group: tenant-account-email-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fictional-account-email-request-http:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TENANT_ACCOUNT_EMAIL_REQUEST_MODE: fictional-pg16-smtp
      PAYMONGO_DISBURSEMENTS_ENABLED: 'false'
      XENDIT_PAYOUTS_ENABLED: 'false'
      XENDIT_BILLING_ENABLED: 'false'
      WORKER_ENABLED: 'false'
      CENTRAL_SCHEDULER_ENABLED: 'false'
      PAYMONGO_SECRET_KEY: ''
      XENDIT_SECRET_KEY: ''
      XENDIT_PAYOUT_SECRET_KEY: ''
      RESEND_API_KEY: ''
      POSTMARK_SERVER_TOKEN: ''
      STRIPE_SECRET_KEY: ''
      # Not an external provider. The test owns a non-relaying localhost receiver.
      SMTP_URL: smtp://127.0.0.1:2525
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Export throwaway PG16, localhost-only SMTP, and disable external providers and workers
        shell: bash
        run: |
          set -euo pipefail
          node scripts/qa/tenant-table-env.mjs compliance-posts >> "$GITHUB_ENV"
          {
            echo 'TENANT_ACCOUNT_EMAIL_REQUEST_MODE=fictional-pg16-smtp'
            echo 'PAYMONGO_DISBURSEMENTS_ENABLED=false'
            echo 'XENDIT_PAYOUTS_ENABLED=false'
            echo 'XENDIT_BILLING_ENABLED=false'
            echo 'WORKER_ENABLED=false'
            echo 'CENTRAL_SCHEDULER_ENABLED=false'
            echo 'PAYMONGO_SECRET_KEY='
            echo 'XENDIT_SECRET_KEY='
            echo 'XENDIT_PAYOUT_SECRET_KEY='
            echo 'RESEND_API_KEY='
            echo 'POSTMARK_SERVER_TOKEN='
            echo 'STRIPE_SECRET_KEY='
            echo 'SMTP_URL=smtp://127.0.0.1:2525'
          } >> "$GITHUB_ENV"
      - name: Syntax, negative-control contracts and exact route pin
        run: |
          node --check scripts/qa/tenant-account-email-request-contract.mjs
          node --check scripts/qa/tenant-account-email-request-http.mjs
          node --check tests/tenant-account-email-request-contract.test.mjs
          node --test tests/tenant-account-email-request-contract.test.mjs
      - name: Generate ephemeral encryption keys
        shell: bash
        run: |
          set -euo pipefail
          for name in PII_ENCRYPTION_KEY BANK_DATA_ENCRYPTION_KEY; do
            key=$(openssl rand -hex 32)
            echo "::add-mask::$key"
            echo "$name=$key" >> "$GITHUB_ENV"
          done
          secret="whsec_$(openssl rand -base64 32 | tr -d '\n')"
          echo "::add-mask::$secret"
          echo "RESEND_WEBHOOK_SECRET=$secret" >> "$GITHUB_ENV"
      - name: Initialize disposable PostgreSQL 16
        run: npm run db:push
      - name: Apply only reviewed fictional baseline objects
        run: node scripts/qa/apply-isolated-baseline.mjs
      - name: Build production-mode Next.js against disposable database
        run: npm run build
      - name: Start production-mode HTTP server on loopback only
        shell: bash
        run: |
          set -euo pipefail
          nohup npm start -- -H 127.0.0.1 > /tmp/tenant-account-email-request-next.log 2>&1 &
          server=$!
          for attempt in $(seq 1 60); do
            if curl --silent --fail "$SECURITY_SMOKE_URL/login" > /dev/null; then
              exit 0
            fi
            if ! kill -0 "$server" 2>/dev/null; then
              cat /tmp/tenant-account-email-request-next.log
              exit 1
            fi
            sleep 2
          done
          cat /tmp/tenant-account-email-request-next.log
          exit 1
      - name: Prove caller-bound tokens, SMTP recipients, own audit and foreign state unchanged over HTTP
        run: node --import tsx scripts/qa/tenant-account-email-request-http.mjs
      - name: Show localhost-only diagnostics on failure
        if: failure()
        run: cat /tmp/tenant-account-email-request-next.log || true
