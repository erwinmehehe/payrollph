name: PR Integration Queue Gate

# Trusted DEFAULT-BRANCH code only. Never check out PR head in
# pull_request_target: that would expose the base-context token.
# This check never merges, changes labels, applies SQL or activates features.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review, converted_to_draft]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-queue-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  queue:
    name: Verify review WIP and SQL prefix reservations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted default branch only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify queue rules with synthetic cases
        run: node --test tests/pr-queue-policy.test.mjs
      - name: Inspect open PR queue (read-only)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/pr-queue-policy.mjs
