name: Issue 1031 Offline Production Parity Fixtures (No Database)

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/issue-1031-offline-production-parity.yml"
      - "scripts/issue-1031-offline-export-sql.ts"
      - "scripts/lib/issue-1031-offline-parity.mjs"
      - "scripts/qa/issue-1031-compare-offline.mjs"
      - "tests/issue-1031-offline-parity.test.mjs"
      - "tests/fixtures/issue-1031-offline/**"
      - "docs/engineering/issue-1031-offline-production-parity.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: Fictional catalog snapshots; no database or credentials
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Run fixture-only offline comparer and SQL printer tests
        run: node --test tests/issue-1031-offline-parity.test.mjs
        env:
          DATABASE_URL: ""
          PRODUCTION_DATABASE_URL: ""
          MIGRATION_TARGET_DATABASE_URL: ""
          NEON_DATABASE_URL: ""
      - name: Confirm only fixture tests ran
        run: echo "OFFLINE_ONLY_NO_DB_NO_SECRETS_NO_PRODUCTION_CERTIFICATION"
