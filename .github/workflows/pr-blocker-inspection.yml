name: Read-only PR blocker inspection
on:
  push:
    branches: [qa/pr-blocker-inspect-20261112a]
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'erwinmehehe/payrollph' && github.ref == 'refs/heads/qa/pr-blocker-inspect-20261112a'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fetch exact public test dependency archives
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr-blocker-deps
          cd /tmp/pr-blocker-deps
          npm pack --ignore-scripts js-yaml@4.3.2 argparse@2.0.1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr-blocker-yaml-dependencies
          path: /tmp/pr-blocker-deps/*.tgz
          retention-days: 1
          if-no-files-found: error
