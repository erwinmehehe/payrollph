name: Critical Release Schema Migration Rehearsal (Synthetic CI)

on:
  pull_request:
    paths:
      - "drizzle/0100_compensation_automation_intents.sql"
      - "drizzle/0106_saas_selfserve_recurring_billing.sql"
      - "drizzle/0109_tamper_evident_audit_chain.sql"
      - "drizzle/0110_provider_events_inbox.sql"
      - "src/lib/production-schema-inventory.ts"
      - "scripts/rehearse-critical-release-migrations.mjs"
      - "scripts/lib/isolated-migration-target.mjs"
      - "tests/isolated-migration-target.test.mjs"
      - ".github/workflows/isolated-release-schema-rehearsal.yml"
  push:
    branches: [main]
    paths:
      - "drizzle/0100_compensation_automation_intents.sql"
      - "drizzle/0106_saas_selfserve_recurring_billing.sql"
      - "drizzle/0109_tamper_evident_audit_chain.sql"
      - "drizzle/0110_provider_events_inbox.sql"
      - "src/lib/production-schema-inventory.ts"
      - "scripts/rehearse-critical-release-migrations.mjs"
      - "scripts/lib/isolated-migration-target.mjs"
      - "tests/isolated-migration-target.test.mjs"
      - ".github/workflows/isolated-release-schema-rehearsal.yml"

# Supersede only older PR attempts; main/manual runs retain independent groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  disposable-pg16:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CI: "true"
      MIGRATION_REHEARSAL_MODE: isolated-ci-only
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout reviewed PR source (no retained Git credentials)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Fail-closed disposable database boundary tests
        run: node --test tests/isolated-migration-target.test.mjs
      - name: Apply critical migration bundle twice to synthetic schema, then roll back
        run: npx tsx scripts/rehearse-critical-release-migrations.mjs
      - name: Inject SQL failure after DDL and verify zero persistence
        run: npx tsx scripts/rehearse-critical-release-migrations.mjs --inject-failure
      - name: Print sanitized synthetic evidence (no employer, bank or database credentials)
        run: |
          cat qa-artifacts/release-schema-rehearsal.json
          cat qa-artifacts/release-schema-failure-rehearsal.json
