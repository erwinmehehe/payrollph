name: Public Intake PostgreSQL HTTP Acceptance
on:
  pull_request:
    branches: [main]
    # Optional module-level acceptance; retain cross-cutting auth/schema/build triggers.
    # Full main/manual coverage remains unchanged.
    paths:
      - 'src/db/**'
      - 'drizzle/**'
      - 'drizzle.config.ts'
      - 'src/proxy.ts'
      - 'src/middleware.ts'
      - 'src/lib/auth.ts'
      - 'src/lib/api-auth.ts'
      - 'src/lib/access.ts'
      - 'src/lib/permissions.ts'
      - 'src/lib/roles.ts'
      - 'src/lib/security-*.ts'
      - 'src/lib/crypto.ts'
      - 'src/lib/organization-auth-policy.ts'
      - 'src/lib/enterprise-session.ts'
      - 'src/lib/session-select.ts'
      - 'src/lib/tenant-*.ts'
      - 'src/lib/*-tenant-*.ts'
      - 'src/lib/*-scope*.ts'
      - 'src/lib/scoped-*.ts'
      - 'src/lib/multi-entity-*.ts'
      - 'src/lib/critical-release-flags.ts'
      - 'src/lib/capabilities.ts'
      - 'src/app/api/auth/**'
      - 'src/app/api/organizations/**'
      - 'src/app/api/legal-entities/**'
      - 'src/app/api/capabilities/**'
      - 'src/app/api/tenant-modules/**'
      - 'scripts/qa/apply-isolated-baseline.mjs'
      - 'scripts/qa/apply-source-baseline-supplement.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.*'
      - 'tsconfig.json'
      - 'src/app/api/demo-requests/**'
      - 'src/app/api/intake-challenge/**'
      - 'src/app/api/payroll-outsourcing/**'
      - 'src/app/api/careers/**'
      - 'src/app/api/recruitment/**'
      - 'src/app/api/signup/**'
      - 'src/app/api/marketing/**'
      - 'src/app/book-demo/**'
      - 'src/app/payroll-outsourcing/**'
      - 'src/app/careers/**'
      - 'src/app/contact/**'
      - 'src/app/signup/**'
      - 'src/app/register/**'
      - 'src/components/marketing/book-demo-form.tsx'
      - 'src/components/marketing/payroll-quote-form.tsx'
      - 'src/components/marketing/privacy-consent-fields.tsx'
      - 'src/components/marketing/self-serve-signup-form.tsx'
      - 'src/components/marketing/access-request-form.tsx'
      - 'src/components/marketing/marketing-attribution-capture.tsx'
      - 'src/components/careers-board.tsx'
      - 'src/components/recruitment-panel.tsx'
      - 'src/lib/public-intake-*.ts'
      - 'src/lib/marketing-*.ts'
      - 'src/lib/careers-*.ts'
      - 'src/lib/recruitment-*.ts'
      - 'src/lib/rate-limit*.ts'
      - 'src/lib/lead-retention-policy.ts'
      - 'src/lib/nonce-csp.ts'
      - 'src/lib/registration-entry.ts'
      - 'src/lib/saas-billing-schema.ts'
      - 'src/lib/saas-workspace-access.ts'
      - 'src/lib/provisioning.ts'
      - 'scripts/public-intake-db-acceptance.ts'
      - 'docs/engineering/migration-proposals/careers-published.sql'
      - 'tests/public-intake-*.test.*'
      - 'tests/careers-*.test.*'
      - 'tests/recruitment-*.test.*'
      - 'tests/marketing-*.test.*'
      - 'tests/rate-limit*.test.*'
      - 'tests/lead-retention*.test.*'
      - 'tests/registration-entry.test.*'
      - '.github/workflows/public-intake-db-acceptance.yml'
  workflow_dispatch:
# Supersede only older PR attempts; main/manual runs retain independent groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  build-intake:
    name: Build intake application once
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
      APP_BASE_URL: http://127.0.0.1:3000
      PUBLIC_INTAKE_PROOF_ENABLED: "true"
      NEXT_PUBLIC_PUBLIC_INTAKE_PROOF_ENABLED: "true"
      DEMO_MODE: "false"
      WORKER_TOKEN: ci-worker-token-00000000000000000000000000000000
      READINESS_TOKEN: ci-readiness-token-0000000000000000000000000000
      SETUP_TOKEN: ci-setup-token-0000000000000000000000000000000
      TOTP_ENCRYPTION_KEY: "1111111111111111111111111111111111111111111111111111111111111111"
      MALWARE_SCAN_URL: https://scanner.invalid/scan
      MALWARE_SCAN_TOKEN: ci-malware-token-0000000000000000000000000000
      REQUIRE_PRIVILEGED_MFA: "true"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Create independent fictional build-only keys
        run: |
          for name in PII_ENCRYPTION_KEY PUBLIC_INTAKE_PROOF_SECRET; do
            value=$(openssl rand -hex 32)
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
      - run: npm run db:push
      - run: node scripts/qa/apply-isolated-baseline.mjs
      - run: npm run build
      - name: Package only this run's Next build (no npm or Next caches)
        run: tar --exclude='.next/cache' -cf public-intake-next.tar .next
      - uses: actions/upload-artifact@v7
        with:
          name: public-intake-next-${{ github.sha }}
          path: public-intake-next.tar
          retention-days: 1
          if-no-files-found: error

  intake-postgres:
    needs: build-intake
    name: intake-postgres (PG${{ matrix.postgres }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        postgres: ["16", "18"]
    env:
      CI: "true"
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
      APP_BASE_URL: http://127.0.0.1:3000
      PUBLIC_INTAKE_PROOF_ENABLED: "true"
      NEXT_PUBLIC_PUBLIC_INTAKE_PROOF_ENABLED: "true"
      DEMO_MODE: "false"
      WORKER_TOKEN: ci-worker-token-00000000000000000000000000000000
      READINESS_TOKEN: ci-readiness-token-0000000000000000000000000000
      SETUP_TOKEN: ci-setup-token-0000000000000000000000000000000
      TOTP_ENCRYPTION_KEY: "1111111111111111111111111111111111111111111111111111111111111111"
      MALWARE_SCAN_URL: https://scanner.invalid/scan
      MALWARE_SCAN_TOKEN: ci-malware-token-0000000000000000000000000000
      REQUIRE_PRIVILEGED_MFA: "true"
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Create disposable test-only independent secrets
        run: |
          pii=$(openssl rand -hex 32)
          proof=$(openssl rand -hex 32)
          echo "::add-mask::$pii"
          echo "::add-mask::$proof"
          echo "PII_ENCRYPTION_KEY=$pii" >> "$GITHUB_ENV"
          echo "PUBLIC_INTAKE_PROOF_SECRET=$proof" >> "$GITHUB_ENV"
      - run: npm run db:push
      - name: Apply the cutover baseline objects (0109 audit chain + reviewed supplement); request code only verifies schema
        run: node scripts/qa/apply-isolated-baseline.mjs
      - name: Rehearse careers consent, isolated DDL rollback and two-employer HTTP (PG${{ matrix.postgres }})
        run: npx tsx --test --test-concurrency=1 tests/careers-http-postgres.test.ts
      - uses: actions/download-artifact@v7
        with:
          name: public-intake-next-${{ github.sha }}
          path: .ci-artifacts
      - name: Restore the exact-source build shared by both PostgreSQL versions
        run: tar -xf .ci-artifacts/public-intake-next.tar
      - name: Start production build with isolated PostgreSQL
        run: |
          nohup npm start -- -H 127.0.0.1 -p 3000 > /tmp/intake-main.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000 >/dev/null; then exit 0; fi
            sleep 2
          done
          echo "Failed to start primary acceptance server"
          exit 1
      - name: Start server with intentionally unavailable database
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:6543/app_db
          APP_BASE_URL: http://127.0.0.1:3001
          PG_CONNECTION_TIMEOUT_MS: "1000"
        run: |
          nohup npm start -- -H 127.0.0.1 -p 3001 > /tmp/intake-outage.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -s -o /dev/null http://127.0.0.1:3001; then exit 0; fi
            sleep 2
          done
          echo "Failed to start outage acceptance server"
          exit 1
      - name: Run synthetic database-backed HTTP acceptance
        run: npx tsx scripts/public-intake-db-acceptance.ts
      - name: Report sanitized logs on failure
        if: failure()
        run: |
          grep -E 'Error:|error:|Failed|ECONNREFUSED|UNAVAILABLE' /tmp/intake-main.log | tail -n 30 || true
          grep -E 'Error:|error:|Failed|ECONNREFUSED|UNAVAILABLE' /tmp/intake-outage.log | tail -n 30 || true
