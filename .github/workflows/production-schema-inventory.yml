name: Production Schema Inventory (Read Only)

# Intentionally manual. Never applies DDL or backfills.
on:
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: Exact reviewed 40-character main commit SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: payrollph-production-schema-read-only
  cancel-in-progress: false

jobs:
  schema-inventory:
    # Do not expose production secrets to feature branches or PR heads.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      REVIEWED_SHA: ${{ inputs.reviewed_sha }}
      PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
    steps:
      - name: Enforce reviewed exact main SHA before touching credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$REVIEWED_SHA" =~ ^[0-9a-f]{40}$ ]] || [ "$REVIEWED_SHA" != "$GITHUB_SHA" ]; then
            echo "Reviewed SHA must exactly match the main workflow commit."
            exit 1
          fi
          if [ -z "$PRODUCTION_DATABASE_URL" ]; then
            echo "Missing protected production database credential. Nothing was queried."
            exit 1
          fi

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Check catalog without reading employee records or writing DDL
        run: npx tsx scripts/check-production-schema-preflight.ts

      - name: Clarify evidence boundary
        if: always()
        run: |
          echo "Structural checks only; no DBA migration history evidence or rollout authorization."
          echo "This workflow does not approve any payroll, external government filing or bank disbursement."
