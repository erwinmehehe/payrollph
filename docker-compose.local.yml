services:
  postgres:
    image: postgres:16
    container_name: payrollph-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: payrollph
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payrollph"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - payrollph_pgdata:/var/lib/postgresql/data

volumes:
  payrollph_pgdata:
