openapi: 3.0.3
info:
  title: Linaw PayrollPH API v1 — governed read extensions
  version: 1.1.0
  description: >
    New read endpoints are disabled unless API_V1_EXTENDED_READS_ENABLED=true.
    Release authorization and API token scopes are separate controls. Journal CSV
    is a proposed accounting export, never an actual transfer or statutory filing.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /employees:
    get:
      summary: List tenant employees using the existing API v1
      description: Requires employees:read and a scoped token. Includes pagination and existing rate limits.
      responses:
        '200': { description: Tenant-scoped employee list }
    post:
      summary: Create employee using the existing idempotent API v1
      description: Requires employees:write plus existing validation and creation governance.
      parameters:
        - { name: Idempotency-Key, in: header, schema: { type: string } }
      responses:
        '201': { description: Employee created }
        '403': { description: Scope denied }
  /payroll-runs:
    get:
      summary: Read existing tenant-scoped payroll run summaries
      description: Requires payroll:read. Does not authorize payroll release.
      responses:
        '200': { description: Paginated payroll run summaries }
  /provider-events:
    get:
      summary: Read durable provider inbox event metadata from migration 0110
      description: Requires payroll:read. Tenant scope enforced, no raw provider payload.
      responses:
        '200': { description: Paginated provider event metadata }
  /org-units:
    get:
      summary: Read tenant-scoped organization units
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Paginated org units; employees:read scope required }
        '403': { description: Insufficient token scope }
  /payslips:
    get:
      summary: Read released payslip amounts (no bank or tax identifiers)
      parameters:
        - { name: employeeId, in: query, schema: { type: integer, minimum: 1 } }
        - { name: payrollRunId, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200': { description: Released payroll entries; payroll:read scope required }
  /journal-entries:
    get:
      summary: Download a balanced, draft chart-of-accounts payroll journal
      parameters:
        - { name: startDate, in: query, required: true, schema: { type: string, format: date } }
        - { name: endDate, in: query, required: true, schema: { type: string, format: date } }
        - { name: legalEntityId, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Balanced per-legal-entity journal CSV; payroll:read scope required
          content:
            text/csv:
              schema: { type: string }
        '409': { description: Unattributed or inconsistent payroll totals }
  /events:
    get:
      summary: Read webhook delivery metadata without payload or secrets
      responses:
        '200': { description: Tenant-only delivery status; payroll:read scope required }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
